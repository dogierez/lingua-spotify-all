s/PlaylistHeader.tsx",lineNumber:123,columnNumber:13},void 0)]},void 0,!0,{fileName:"/app/applet/src/components/PlaylistHeader.tsx",lineNumber:114,columnNumber:11},void 0)]},void 0,!0,{fileName:"/app/applet/src/components/PlaylistHeader.tsx",lineNumber:90,columnNumber:9},void 0),s.jsxDEV("div",{className:"flex items-center gap-2",children:s.jsxDEV("button",{onClick:E,className:"flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold text-zinc-400 hover:text-white border border-zinc-800 hover:border-zinc-700 hover:bg-zinc-800/50 transition-all",title:"Share & Export Playlist JSON",children:[s.jsxDEV(rS,{className:"w-3.5 h-3.5"},void 0,!1,{fileName:"/app/applet/src/components/PlaylistHeader.tsx",lineNumber:134,columnNumber:13},void 0),s.jsxDEV("span",{children:"Share & Export"},void 0,!1,{fileName:"/app/applet/src/components/PlaylistHeader.tsx",lineNumber:135,columnNumber:13},void 0)]},void 0,!0,{fileName:"/app/applet/src/components/PlaylistHeader.tsx",lineNumber:129,columnNumber:11},void 0)},void 0,!1,{fileName:"/app/applet/src/components/PlaylistHeader.tsx",lineNumber:128,columnNumber:9},void 0)]},void 0,!0,{fileName:"/app/applet/src/components/PlaylistHeader.tsx",lineNumber:89,columnNumber:7},void 0)]},void 0,!0,{fileName:"/app/applet/src/components/PlaylistHeader.tsx",lineNumber:35,columnNumber:5},void 0),SS={id:"concepts",title:"Concepts",cover:"🧠",color:"#2980b9",description:"A complete collection of 42 listening lessons exploring fascinating psychological concepts and theories.",baseUrl:"https://raw.githubusercontent.com/dogierez/concepts/main/",githubRepoUrl:"https://github.com/dogierez/concepts",tracks:[{icon:"🔗",title:"1. Attachment Theory",src:"1.Attachment Theory.m4a",text:`The name of this theory was coined by the British psychologist John Bowlby, and literally means one thing holding tightly onto another. Bowlby named it "Attachment" because he believed there was an invisible, almost magical rope or halyard between a newborn baby and the mother or father who cares for it. Just like a giant ship is tied to a safe harbor with thick ropes to protect it from storms, a human infant also attaches to its family to survive. This concept in psychology became a fundamental name explaining how securely that first rope is cast during infancy affects our entire lives.<br><br>If our family lovingly hugs us when we cry as babies, our mind learns the rule "The world is a safe place, I can trust people." Because of this, we form friendships much easier and stronger at school when we grow up. However, children who are left very alone or whose needs are not met when they are babies develop the belief "I can't trust anyone" in their minds. When they grow up, they have a hard time trusting people and are always afraid of forming friendships. It's just like if the first team you joined in a game let you down, you would always be suspicious about joining another team. Fortunately, as people grow up, they can realize and overcome this insecurity.`,dictionary:{coined:"yaratıldı",psychologist:"psikolog",invisible:"görünmez",halyard:"halat",harbor:"liman",infant:"bebek",suspicious:"şüpheci",overcome:"aşmak",insecurity:"güvensizlik"}},{icon:"🚗",title:"2. Baader-Meinhof Phenomenon",src:"2.Baader-Meinhof Phenomenon.m4a",text:`A completely funny coincidence lies behind this weird name. In the 1990s, an American man read the name of an old group called "Baader-Meinhof" in a newspaper. The next day on the radio, and the following day on television, he kept hearing this word, thought he was going crazy, and wrote a letter to the newspaper. The reason for this event was his own brain taking that word onto its new radar, but the letter became so famous that people gave this mind perception the name of the word in the letter.<br><br>Your family bought a very cool, new red car. You are sure you had never seen that car on the streets before, but after the car is bought, you suddenly start seeing that red vehicle on every corner. Actually, those cars are always there, and no one just bought them. It's just that because your brain has newly learned that brand and included it in your life, it has now started to find it like a detective everywhere and show it to you.`,dictionary:{coincidence:"tesadüf",weird:"tuhaf",perception:"algı",vehicle:"araç",detective:"dedektif",radar:"radar"}},{icon:"🛡️",title:"3. Backfire Effect",src:"3.Backfire Effect.m4a",text:`This name is borrowed from firearms or the working logic of battle cannons in ancient times. When you ignite a cannon's fuse to shoot a cannonball at a target, you expect all the energy to go forward. However, sometimes the weapon malfunctions and explodes backward, hitting the person who fired it. Scientists used this term when they saw that trying to persuade people with definitive evidence, instead of moving them forward, caused them to defend their opinions even more harshly (backfiring).<br><br>When definitive information and scientific facts proving that you are completely wrong about a subject are placed in front of you, instead of your mind admitting its mistake and changing its opinion, it gives the exact opposite reaction. You cling to your old wrong opinion much more stubbornly than before. This is because your brain perceives this new correction as a direct "attack" made against you, and it raises its mental shields to protect its pride. This shield is the biggest reason why people can never convince each other in arguments.`,dictionary:{firearms:"ateşli silahlar",ignite:"ateşlemek",fuse:"fitil",malfunctions:"arızalanır",persuade:"ikna etmek",definitive:"kesin",cling:"tutunmak",stubbornly:"inatla",shields:"kalkanlar"}},{icon:"🚂",title:"4. Bandwagon Effect",src:"4.Bandwagon Effect.m4a",text:`The origin of this name comes from political election campaigns in America in the 19th century and an interesting tradition based on circuses. "Bandwagon" was the name given to the giant, ornate, and showy horse-drawn carriages on which the circus's band played music. Politicians would jump onto these musical carriages and tour the city like that to grab the public's attention. People would get caught up in that enthusiastic music and crowd, and start walking behind the carriage. In psychology, this name was given to people blindly joining an idea, "like jumping on a bandwagon," simply because that idea is very popular, and following that crazy crowd.<br><br>Imagine a newly released computer game or a cool pair of shoes. At first, that item might not have caught your attention at all. But when you see that first your three closest friends, and then almost everyone in the class is playing that game, you suddenly feel an irresistible desire to play it. You want that game not because it's the best game in the world, but just to be included in the group and not be left out. Since ancient times, the human brain has been programmed to follow crowds to feel safe. The main reason why trends on the internet or in schools spread so fast like a virus is our mind's desire to conform to the crowd.`,dictionary:{campaigns:"kampanyalar",ornate:"süslü",carriages:"arabalar",enthusiastic:"hevesli/coşkulu",blindly:"körü körüne",irresistible:"karşı konulmaz",desire:"arzu",conform:"uymak"}},{icon:"🪃",title:"5. Boomerang Effect",src:"5.Boomerang Effect.m4a",text:'This name was taken from the boomerang, a curved wooden throwing tool used by indigenous people in Australia for hunting or playing games. The faster and harder you throw a boomerang forward into the air, the more it draws a curve in the air and returns at the same speed to hit the person who threw it. This name was born from the fact that trying to force people to do something, instead of moving forward, misses its target and bounces back, just like this tool.<br><br>You were just about to clean your room when someone came in and yelled harshly, "Clean up this room right now!" Even though you were going to do that task seconds ago, simply because you heard that command and felt your freedom was restricted, you rebel by saying, "Now I will never clean it!" When the human brain feels forced, it automatically opens a defense shield and wants to do the exact opposite of what is requested. Giving orders is the worst way to convince a person.',dictionary:{curved:"kavisli",indigenous:"yerli",bounces:"seker",harshly:"sertçe",restricted:"kısıtlanmış",rebel:"isyan etmek",automatically:"otomatik olarak",convince:"ikna etmek"}},{icon:"🪟",title:"6. Broken Windows Theory",src:"6.Broken Windows Theory.m4a",text:`This theory takes its name from a very simple observation made by two researchers working on criminal psychology while examining American cities. They realized that crimes in neighborhoods never started with big robberies, but always with a single "broken window" of an empty building on the street being left unrepaired. As the window remained broken, other windows were broken too, and then the neighborhood turned into a dump. The theory explaining the collapse of social order through small negligences was symbolically dedicated to that first broken window.<br><br>If a single window is broken in a very beautiful neighborhood and it is not repaired, passersby subconsciously receive the message "There are no rules here," and they start throwing trash everywhere. If you throw just one dirty sock on the floor in your own room and don't pick it up, your brain says "The room is already messy" and throws all your belongings on the floor. If a small deterioration or bad deed is not corrected immediately, it leads to much greater disasters. The easiest way to stop the course of events is to fix that first mistake immediately.`,dictionary:{observation:"gözlem",robberies:"soygunlar",unrepaired:"tamir edilmemiş",dump:"çöplük",collapse:"çöküş",negligences:"ihmaller",subconsciously:"bilinçaltında",deterioration:"bozulma",disasters:"felaketler"}},{icon:"🦋",title:"7. Butterfly Effect",src:"7.Butterfly Effect.m4a",text:'This poetic name is derived from that famous question asked at a scientific meeting by Edward Lorenz, a renowned mathematician and weather expert: "Can the tiny ripple of wind created by a tiny butterfly flapping its wings in the Amazon forests travel the world, gain strength, and cause a massive hurricane in America?" This extraordinary theory, explaining that everything in the universe is connected by invisible bonds, took its name from the wing flap of that delicate insect.<br><br>In time travel movies, if someone who goes to the past accidentally steps on a tiny bug, they see that the whole world has completely changed when they return to the future. In your life as well, a tiny decision today, like taking a different route to school, might cause you to make a very good friend or choose a completely different profession in the future. Tiny decisions we make in life that seem very insignificant have the power to give birth to massive consequences and wonderful adventures over the years.',dictionary:{poetic:"şiirsel",ripple:"dalgalanma",hurricane:"kasırga",extraordinary:"olağanüstü",delicate:"narin",accidentally:"kazara",insignificant:"önemsiz",consequences:"sonuçlar"}},{icon:"👁️",title:"8. Bystander Effect",src:"8.Bystander Effect.m4a",text:'The name of this psychological concept is derived from that weird reaction people give when they are in a massive crowd in the face of an urgent or dangerous situation. Scientists specifically gave it the name "Bystander" because that large crowd not getting involved in the incident simply stands and "watches" as if they were watching a movie at the cinema or a play on stage. Because the responsibility is divided equally among all the bystanders present at that moment, no one wants to take action and be the lead actor of the event. Thus, the name of the event was chosen from the most perfect word describing people preferring to remain purely passive viewers instead of intervening, and it sums up that dangerous inaction created by the crowd very well.<br><br>Imagine someone falling in the school hallway and all their books scattering. If there are fifty people around, everyone just watches from afar, saying to themselves, "Someone else will go and help anyway." The responsibility is distributed to so many people that no one takes a step. But if it were just the two of you in that hallway, you would immediately run and help without thinking because all the responsibility would be entirely on you. As the crowd increases, the rate at which people take action and help each other drops just as rapidly. This is why if you need help in a crowd, you should ask for help from a single person you point out, not from everyone.',dictionary:{urgent:"acil",bystander:"seyirci",equally:"eşit olarak",intervening:"müdahale etmek",inaction:"eylemsizlik",scattering:"dağılan",distributed:"dağıtılmış",rapidly:"hızla"}},{icon:"👤",title:"9. Carl Jung's Shadow Self",src:"9.Carl Jung's Shadow Self.m4a",text:`The famous psychiatrist Carl Jung, the creator of this name, deliberately chose the word "Shadow" to describe the hidden dark sides of the human mind. Because just like having a dark and shapeless shadow that silently follows you from behind wherever you go on a sunny day, there are dark emotions in your mind that never leave you. The shadow belongs to you, but unless you turn and look at it or accept it, it continues to grow in an unseen place behind you and scare you. The name comes from this physical reflection.<br><br>Inside every person lie emotions they are ashamed of and don't want others to see, such as jealousy, sudden flares of anger, or selfishness. Since society always tells us to be good, we lock these bad emotions in the basement of our minds. However, denying these emotions is dangerous because they confront you as a massive outburst of anger when you least expect it. To be a truly strong person, you must befriend that hidden shadow. If you accept it when you feel jealousy, you can tame and control that dark power inside you.`,dictionary:{psychiatrist:"psikiyatrist",deliberately:"kasten",shapeless:"şekilsiz",reflection:"yansıma",ashamed:"utanmış",selfishness:"bencillik",basement:"bodrum",confront:"yüzleşmek",outburst:"patlama",tame:"evcilleştirmek"}},{icon:"💻",title:"10. Cognitive Behavioral Therapy",src:"10.Cognitive Behavioral Therapy.m4a",text:`The name of this concept consists of the combination of two very important words in psychology. The word "Cognitive" means the thoughts, beliefs, and the way we perceive events inside our minds. The word "Behavioral" refers to our physical movements and reactions visible from the outside. This therapy method aims to heal people's wrong actions and habits (behavior) by repairing faulty thoughts (cognition). The name is literally a very clear scientific definition explaining how the software inside the mind and the movement on the outside are connected to each other, and how these two are treated at the same time.<br><br>Think of your mind just like a computer you use every day, and your thoughts as the software running inside that device. Sometimes virus-infected software like "I will never pass the math exam, I am a failure" enters our brains. This therapy is the method of finding those infected thoughts and rewriting them as "If I study, I can do it." It teaches us this: Events do not upset us directly; what upsets us is our own faulty thoughts that we produce about the events. If you manage to notice that small error in your thoughts and change the codes, you can completely fix the emotions you feel and your subsequent behaviors, and become a happier person.`,dictionary:{cognitive:"bilişsel",perceive:"algılamak",behavioral:"davranışsal",faulty:"hatalı",cognition:"biliş",software:"yazılım",infected:"enfekte olmuş",subsequent:"sonraki"}},{icon:"⚖️",title:"11. Cognitive Dissonance",src:"11.Cognitive Dissonance.m4a",text:'The word "Cognitive" in this refers to the beliefs and ideas inside our minds. The word "Dissonance" means contrast, incompatibility, and conflict. This name was first coined by psychologist Leon Festinger, inspired by the disturbing, ear-grating sound (dissonance) produced in music when two completely incompatible keys on a piano are pressed at the same time. It describes the feeling of internal itchiness and discomfort that occurs when a truth and a falsehood clash at the same time in our minds.<br><br>You know you have to get up very early tomorrow (Logic: I should sleep), but you keep playing the game (Behavior). When the truth you believe in and the action you take contradict each other in your brain, you feel distressed. The mind does not like this discomfort at all and immediately makes up excuses: "I worked hard all week, I deserve this," it says, trying to cover up that contrast by telling itself lies. It is our process of constantly deceiving ourselves while making mistakes, even though we know we are wrong.',dictionary:{dissonance:"uyumsuzluk",incompatibility:"uyuşmazlık",disturbing:"rahatsız edici",incompatible:"uyumsuz",falsehood:"yalan",contradict:"çelişmek",distressed:"sıkıntılı",excuses:"bahaneler",deceiving:"kandırmak"}},{icon:"✈️",title:"12. Concorde Fallacy",src:"12.Concorde Fallacy.m4a",text:`This name comes from the famous "Concorde" project, the world's fastest passenger plane jointly produced by England and France years ago. While the two countries were building this supersonic plane, they realized at a very early stage that the plane would incur massive losses and that the project actually made no sense at all. However, because they had already invested so many millions of dollars into the engineering right from the start, they stubbornly continued to pour money into the project knowingly, simply saying, "We have spent so much, we can't quit halfway and turn back now." Ultimately, they sank with a much bigger and historic loss. The scientific world engraved this famous psychological stubbornness, which describes people's inability to accept a loss and insisting on a mistake, into history by naming it after that legendary plane.<br><br>Let's say you started building a giant castle out of Legos. You worked for hours, but realized that the tower was crooked from the foundation and wasn't as beautiful as you planned. The logical thing to do is to immediately break that castle and switch to a brand new model with a solid foundation. But your mind plays a trick on you, and by saying, "I worked for so many hours, if I break it now, my effort will go to waste," it makes you waste your whole day trying to fix that bad castle. Sometimes, simply because they have spent a lot of time or effort in the past, people continue walking on a path they know is completely wrong. In order not to pity past effort and throw your precious future time in the trash, sometimes admitting you were wrong and starting over is the smartest thing you can do.`,dictionary:{jointly:"ortaklaşa",supersonic:"sesten hızlı",incur:"maruz kalmak",stubbornly:"inatla",engraved:"kazınmış",stubbornness:"inatçılık",crooked:"çarpık",foundation:"temel",precious:"değerli"}},{icon:"🔎",title:"13. Confirmation Bias",src:"13.Confirmation Bias.m4a",text:`The name of this concept comes from our brain acting as its own lawyer instead of being a completely impartial detective investigating both sides. A person only gathers clues to prove, that is, to "confirm," what they previously believed. Because they ignore the facts that contradict them and display an attitude entirely tilted towards their own side, that is, "biased," psychology gave this situation this name that describes the brain bending and twisting facts.<br><br>If you believe that your favorite gaming console is the best in the world, you only watch and like videos on the internet that agree with you. You instantly shut down those who criticize your opinion by saying, "They don't know anything." Our brains love it when their own opinion turns out to be correct. Therefore, it only sees the evidence that supports its own belief, and becomes practically blind to opposing facts. If you only listen to those who agree with you on the internet, you become someone who refuses to learn new things.`,dictionary:{impartial:"tarafsız",detective:"dedektif",confirm:"doğrulamak",contradict:"çelişmek",attitude:"tutum",biased:"önyargılı",criticize:"eleştirmek",evidence:"kanıt",opposing:"karşıt"}},{icon:"🦀",title:"14. Crab Mentality",src:"14.Crab Mentality.m4a",text:`This name was found inspired by the buckets or baskets into which fishermen put the live crabs they take out of the sea. There is no need at all to close the lid of that basket. Because just as one of the crabs is about to climb out of the bucket and reach freedom, the other crabs below grab it by the leg and forcefully pull it down back to their side! People's habit of pulling each other down out of jealousy for their success, just like these sea creatures, has been immortalized with this metaphorical name in psychology.<br><br>When you want to do something good in your life, for example, when you decide to eat healthy or read a book, some jealous people around you want to stop you. By saying, "Never mind that, why bother, play games with us," they don't want you to improve and reach a better position than them. You must ignore these people with this mentality trying to pull you to the bottom of the bucket, and you must continue climbing upwards toward your own goals.`,dictionary:{buckets:"kovalar",baskets:"sepetler",freedom:"özgürlük",forcefully:"zorla",jealousy:"kıskançlık",immortalized:"ölümsüzleştirilmiş",metaphorical:"metaforik",ignore:"görmezden gelmek",goals:"hedefler"}},{icon:"👘",title:"15. Diderot Effect",src:"15.Diderot Effect.m4a",text:`This concept comes from a very interesting and true event that happened to the 18th-century French philosopher Denis Diderot himself. Diderot, an impoverished writer, was gifted a very stylish, red, remarkably beautiful new dressing gown (house robe). However, when he sat down at his desk in this flashy outfit, he realized that his old desk did not match this wonderful outfit at all and looked very ugly. First he changed his desk, then the rug in the room started looking old and he threw it away; then he renewed the chairs, and finally the paintings on the walls. This consumption chain, which explains how a single new item creates an obsession in a person's mind to match everything around them to that new quality and drags the person into debt, took its name directly from the philosopher who experienced this event himself.<br><br>Let's say you bought a brand new gaming keyboard with cool, colorful lights for your computer. You are very happy on the first day, but the next day, your old, faded mouse starts looking very dull and ugly next to that wonderful keyboard. You go and buy a new mouse. Then you think your old small monitor doesn't suit this wonderful duo and you want a giant screen; eventually, you even change your desk and chair! Initially, when you only needed a keyboard, your mind made you buy a bunch of things you didn't need at all just to adapt to that "new and perfect" item. To avoid falling into this endless trap that causes people to constantly buy more in shopping malls or on the internet, you must recognize the urge to want another new thing after every new item and know how to be content with what you have.`,dictionary:{impoverished:"yoksul",stylish:"şık",flashy:"gösterişli",consumption:"tüketim",obsession:"takıntı",debt:"borç",faded:"solmuş",dull:"mat/sıkıcı",adapt:"uyum sağlamak",urge:"dürtü",content:"hoşnut/yetinen"}},{icon:"🎮",title:"16. Dunning-Kruger Effect",src:"16.Dunning-Kruger Effect.m4a",text:'This bizarre name comes from two psychologists named David Dunning and Justin Kruger, who researched this topic in 1999. It all started when they read the news of a not-so-smart man who rubbed lemon juice on his face to become invisible and tried to rob a bank. These two scientists discovered that some people are so ignorant that they cannot realize their own ignorance, and therefore they think they are geniuses. Because they scientifically proved the tendency of people to exaggerate their own abilities, they gave this mental fallacy their own surnames directly. Today, the most famous rule explaining ignorant courage in the world of psychology is known by the names of these two men.<br><br>When you start a new strategy game, learning just two buttons and thinking you are the best player in the world is exactly this. However, real professional players or successful scientists always say, "There are still so many tactics and so much information I need to learn." People who know nothing about a subject cannot see how ignorant they are, so they are overly and comically confident in themselves. But as you start to truly learn a subject in-depth, you notice your shortcomings and become much more humble. In short, someone who talks very loudly about something and claims to know everything might actually know nothing about that subject.',dictionary:{bizarre:"tuhaf",invisible:"görünmez",ignorant:"cahil",ignorance:"cehalet",geniuses:"dahiler",tendency:"eğilim",exaggerate:"abartmak",fallacy:"yanılgı",shortcomings:"eksiklikler",humble:"mütevazı"}},{icon:"🦠",title:"17. Emotional Contagion",src:"17.Emotional Contagion.m4a",text:`The origin of this name is taken from the logic of how viruses spread in the medical world to explain how emotions follow a path among people. The word "Contagion" is usually used for illnesses that spread rapidly in schools during the winter months, like colds, the flu, or the sniffles. Because scientists realized that a person's joy, anger, or fear also passes from person to person through the air, sneezing, or contact, just like these viruses, they directly gave this psychological condition this name where illnesses spread.<br><br>When everything is very quiet in class, if someone randomly starts giggling, even if you don't know what the joke is, you suddenly start laughing too. Or, even though you woke up very joyful in the morning, when you sit down for breakfast with someone who is very angry and grumpy, your energy is suddenly drained as well. Because we are social creatures, our brains are programmed to quickly adapt to the emotional state of the people around us. Therefore, if you surround yourself with people who constantly complain, that negativity will infect you too. For your own happiness, you should choose cheerful friends.`,dictionary:{contagion:"bulaşma",rapidly:"hızla",sniffles:"burun çekme/nezle",sneezing:"hapşırma",randomly:"rastgele",giggling:"kıkırdama",grumpy:"huysuz",drained:"tükenmiş",complain:"şikayet etmek"}},{icon:"🎯",title:"18. Fundamental Attribution Error",src:"18.Fundamental Attribution Error.m4a",text:`The word "Attribution" in this name means assigning the cause of an event or behavior to something, pointing to a target in psychology. The human brain is very lazy when judging others. Instead of investigating why the other person made a mistake, it instantly attributes the problem to the person's character. Thus, this most classic, fundamental, and common faulty judgment process that people fall into in seconds every single day has been given this heavy but explanatory name with all its details in the scientific world.<br><br>If someone takes your spot in line at the canteen, you immediately think, "What a disrespectful, rude, and bad person!" However, if you rush and cut in front of someone else with just one second left before the class bell rings, you say, "I'm in a big hurry today, otherwise I am a very polite person." While we ruthlessly attribute the mistakes people make to their bad character, we always tend to attribute our own mistakes to bad luck or a difficult situation. Realizing that the other person might also be in a hurry makes us much more understanding.`,dictionary:{attribution:"atıf",assigning:"atamak",judging:"yargılamak",fundamental:"temel",explanatory:"açıklayıcı",disrespectful:"saygısız",ruthlessly:"acımasızca",tend:"eğiliminde olmak",understanding:"anlayışlı"}},{icon:"😇",title:"19. Halo Effect",src:"19.Halo Effect.m4a",text:`This word comes from "Halo," the English name given to that bright ring of light drawn right above the heads of angels or saints in pictures. Psychologist Edward Thorndike discovered that people become blinded by a single good trait of a person when evaluating them. Just as if that person had a shining angelic halo on their head, this mind trick that causes us to ignore all other negative traits in a person by looking only at that glowing feature was named after that dazzling ring above the head.<br><br>When we see a new kid at school playing soccer very well or dressing very coolly, our mind gets lazy. It automatically assumes that they are very smart, very fun, and a wonderful person. Looking at only a single positive ability of a person and thinking they are perfect in everything is a big mistake. However, in real life, someone being good at sports never guarantees that they will not lie or that they will be a loyal friend. We shouldn't be fooled by a single good trait when getting to know people.`,dictionary:{halo:"hale",saints:"azizler",trait:"özellik",evaluating:"değerlendirmek",glowing:"parlayan",dazzling:"göz kamaştırıcı",assumes:"varsayar",guarantees:"garanti eder",fooled:"kandırılmış"}},{icon:"🏭",title:"20. Hawthorne Effect",src:"20.Hawthorne Effect.m4a",text:`The source of this name is based on the very famous experiments conducted in the 1920s at a massive electrical factory in America called "Hawthorne Works." Scientists wanted to find out how turning the factory lights on and off or changing break times would affect the workers' production. Something very strange happened: Whether they increased or dimmed the lights, the workers started working much better every single time! Finally, the scientists realized the truth: The workers weren't reacting to the lights, they were just working much harder than normal because they knew they were being "watched" by the scientists. The rule that being watched changes human behavior takes its name from that factory.<br><br>Think about how you behave when the teacher is in the classroom versus when they are not. If the school principal came in during the lesson, sat in the back row, and just watched the class, even the most mischievous student would suddenly sit up straight, become very quiet, and look like they were focused on the lesson. Because the human brain completely changes all of its behaviors the moment it realizes it is being watched or observed by someone authoritative or important. When we feel that a spotlight or a camera is on us, we automatically want to turn into our most perfect and hardworking version that follows the rules.`,dictionary:{conducted:"yürütülen",dimmed:"karartılmış",reacting:"tepki veren",mischievous:"yaramaz",observed:"gözlemlenmiş",authoritative:"yetkili",spotlight:"sahne ışığı",hardworking:"çalışkan"}},{icon:"🦍",title:"21. Invisible Gorilla Test",src:"21.Invisible Gorilla Test.m4a",text:`The very funny name of this experiment comes from the video test prepared by psychologists Christopher Chabris and Daniel Simons. In the video, viewers trying to count people passing a ball to each other claimed they "never saw" a man in a giant gorilla suit walking onto the stage right in the middle of the video and looking at the camera. This experiment, which proved how a giant gorilla instantly becomes invisible in the face of human brain focus, got its fame directly from that massive and unnoticed gorilla.<br><br>When you are trying to pass a very difficult and attention-demanding level on the computer, you don't even hear someone calling you from the back room because you are hyper-focused. When our brain focuses on a specific task or thought with all its energy, it temporarily turns off the cameras and microphones around it. You can't even see very obvious and huge things standing right in front of your eyes. This condition, also called inattentional blindness, perfectly shows how our brain uses energy efficiently.`,dictionary:{claimed:"iddia etti",instantly:"anında",unnoticed:"fark edilmeyen",temporarily:"geçici olarak",obvious:"apaçık/belli",inattentional:"dikkatsizlikten kaynaklanan",blindness:"körlük",efficiently:"verimli bir şekilde"}},{icon:"⚔️",title:"22. J.Campbell's Hero's Journey",src:"22.J.Campbell's Hero's Journey.m4a",text:"The source of this name is the author Joseph Campbell, who dedicated his life to researching ancient myths and fairy tales around the world. When Campbell examined thousands of epics from different cultures, he found that they all actually followed the same basic map. In every story, the main character leaves their safe home, embarks on a dangerous adventure (Journey), and finally defeats the great evil and returns as a changed person (Hero). Because he proved that all great stories in history have the same skeleton, this theory was given his name.<br><br>Think of your favorite movies: Harry Potter, Star Wars, or Lord of the Rings. Their stories are all exactly the same! An ordinary character is called to adventure, meets a wise teacher, passes difficult tests, makes friends, fights the main villain, and returns home as a completely empowered, knowledgeable person. We humans love these stories a lot because this template is actually our own growth story. Dealing with difficulties at school and facing our fears are the steps of our own heroic journey.",dictionary:{dedicated:"adadı",myths:"mitler",epics:"destanlar",embarks:"atılır",defeats:"yener",skeleton:"iskelet",ordinary:"sıradan",villain:"kötü adam",empowered:"güçlenmiş",template:"şablon"}},{icon:"⛓️",title:"23. Learned Helplessness",src:"23.Learned Helplessness.m4a",text:`The name of this concept emerged during an experiment conducted on animals by American psychologist Martin Seligman. Seligman discovered that helplessness is not an innate trait, but a "learning" process that gets engraved into the mind later on due to bad experiences in the past. Even in situations where they could escape whenever they wanted, the animals in the experiment chose not to escape because of their past failures, meaning they had memorized helplessness. Therefore, the situation was called "Learned" because the mind accepted giving up as a rule, and "Helplessness" because it did not try even though it had the power.<br><br>If you die ten times in the same level in a difficult game, after a while you might give up completely, saying, "No matter what I do, I will never be able to finish this level." Even if things get easier, you stop trying. When people experience consecutive failures, they bow down to failure even if they have the power to overcome it. However, just because you couldn't do something in the past doesn't mean you won't find the right tactic today. You must never stop trying by falling into this "I can't do it" trap that your mind plays on you.`,dictionary:{emerged:"ortaya çıktı",innate:"doğuştan",engraved:"kazınmış",failures:"başarısızlıklar",memorized:"ezberlemiş",consecutive:"üst üste",bow:"boyun eğmek",overcome:"aşmak",tactic:"taktik"}},{icon:"🧠",title:"24. Mandela Effect",src:"24.Mandela Effect.m4a",text:`The source of this name is a very bizarre claim made by a writer named Fiona Broome in 2009. The writer said she very clearly remembered that Nelson Mandela, the leader of South Africa, died in prison in the 1980s. However, Mandela was still alive at that time (he died in 2013). But what was shocking was that tens of thousands of people on the internet supported the writer, saying, "Yes, we watched his funeral on television!" This famous leader's name was given to the phenomenon of large masses sharing a false memory as if it were completely real.<br><br>You remember the tip of Pikachu's tail being black from the cartoon you've watched since childhood, right? Or that the Monopoly man had a monocle on his eye? Actually, Pikachu's tail is completely yellow, and that man never had glasses. People's brains sometimes create made-up memories to fill in the blanks. As these memories are talked about with each other, they spread like a virus, and a giant group of people starts believing in a lie that never actually happened as if it were absolute truth.`,dictionary:{bizarre:"tuhaf",claim:"iddia",funeral:"cenaze",phenomenon:"olgu/fenomen",masses:"kitleler",monocle:"tek camlı gözlük","made-up":"uydurma",spread:"yayılır",absolute:"mutlak"}},{icon:"🍬",title:"25. Marshmallow Experiment",src:"25.Marshmallow Experiment.m4a",text:'The name of this famous psychology experiment comes from the candy used as the main material of the test at Stanford University in the 1960s. Psychologist Walter Mischel takes children into an empty room and puts a "Marshmallow," a spongy sweet very popular among children in America, on the table. This very important scientific research, which measures how willpower and patience are connected to success in life, despite its seriousness, has been charmingly engraved in history with the name of that innocent and tempting soft candy.<br><br>If they put a chocolate you really love in front of you and said, "If you wait fifteen minutes without eating it, I will give you another one," could you hold out? Being able to give up instant entertainment and be patient for bigger rewards is just like not spending your gold immediately in a game but saving it to buy the strongest sword. Scientists have proven that these children who managed to be patient when they were little became much more successful at school and at work when they grew up. Patience is the secret superpower in life.',dictionary:{spongy:"süngerimsi",willpower:"irade",patience:"sabır",charmingly:"çekici bir şekilde",innocent:"masum",tempting:"cezbedici",instant:"anlık",rewards:"ödüller"}},{icon:"🧗",title:"26. Maslow's Hierarchy of Needs",src:"26.Maslow's Hierarchy of Needs.m4a",text:`The name of this theory comes from the world-famous American psychologist Abraham Maslow, who put it forward. When Maslow examined people's goals and needs in life, he realized that they were not random. He named this system a "Hierarchy" because he drew all these needs in the form of a pyramid, that is, steps that are climbed step by step from bottom to top. Because he argued that one cannot go up to higher steps without satisfying the basic needs at the very bottom of the pyramid, this term permanently settled in the world of psychology as "Maslow's Hierarchy of Needs." The name is literally the scientific name of the upward-narrowing stepped system drawn by this scientist, and it represents the strict rules of the system that progress step by step.<br><br>You can think of this like a tough survival game you are playing. If your character has very low health, is sleepless, or is very hungry, they cannot go and focus on the mission to save the world. Humans are just like these game characters. First, we must feed our stomachs and survive physically, which is the first level. At the second level, we need to feel safe and warm. At the third level, we want to make friends and belong to a group. The fourth level is being appreciated by others and being proud of our achievements. The final level, the boss level, is using all our talents to reach the peak of our potential, that is, self-actualization. We can never reach the upper levels without completely passing the lower levels.`,dictionary:{hierarchy:"hiyerarşi",pyramid:"piramit",satisfying:"tatmin etmek",permanently:"kalıcı olarak","upward-narrowing":"yukarı doğru daralan",stepped:"kademeli",sleepless:"uykusuz",appreciated:"takdir edilen",achievements:"başarılar",potential:"potansiyel","self-actualization":"kendini gerçekleştirme"}},{icon:"🪞",title:"27. Mirror Neurons",src:"27.Mirror Neurons.m4a",text:`The name of this concept comes from a fact that scientists coincidentally discovered while examining the brains of monkeys in a laboratory in Italy in the 1990s. Researchers saw that certain cells in a monkey's brain fired up when it ate a peanut. However, the real surprise was that the same cells in the monkey's brain fired up even when it merely "watched" another monkey eating a peanut! Biologists gave them this perfect name because these special brain cells copy and reflect the action or the emotion of the other person just like a "mirror."<br><br>When a friend's finger accidentally gets jammed in a door, you also wince and say "Ouch!", don't you? You didn't get hurt, but these special cells in your brain instantly copy the pain the other person feels and create a simulation in your brain. They make you feel as if you are experiencing that event yourself. This is entirely our biological superpower that allows humans to empathize, that is, to understand the sorrow or joy of others and help them. If we didn't have this copying ability, we would never be able to cry at sad movies.`,dictionary:{coincidentally:"tesadüfen",peanut:"yer fıstığı",merely:"sadece",biologists:"biyologlar",reflect:"yansıtmak",jammed:"sıkışmış",wince:"yüzünü buruşturmak/irkilmek",simulation:"simülasyon",empathize:"empati kurmak",sorrow:"üzüntü"}},{icon:"📖",title:"28. Need for Narrative",src:"28.Need for Narrative.m4a",text:`The origin of this psychological concept comes from the tradition of humans passing on information by "telling" each other tales and epics while sitting in caves or around campfires for thousands of years. Because our brain's hardware does not work with disconnected lists or boring formulas, but rather with a "narrative" (story) that progresses with an introduction, development, and conclusion, this name was given to literally summarize the fact that humans cannot live without stories.<br><br>If I were to read twenty different historical events or names to your mind one after another, you would probably forget all of them five minutes later. However, if I added a hero, a great war, and an exciting ending into those events, you would never forget them. The human brain shoots a movie in its head by putting pieces together to make sense of the world. We learn what is good and what is bad not from rules, but from heroic stories. We recognize and understand life and ourselves solely through these stories in our minds.`,dictionary:{tradition:"gelenek",tales:"masallar",epics:"destanlar",hardware:"donanım",disconnected:"kopuk/bağlantısız",narrative:"anlatı",conclusion:"sonuç",summarize:"özetlemek",solely:"yalnızca"}},{icon:"🪒",title:"29. Occam's Razor",src:"29.Occam's Razor.m4a",text:`This theory takes its name from William of Ockham, a logician and philosopher who lived in England in the 14th century. There is a very sharp reason why his theory is named a "Razor": When solving events, it means cutting off and shaving away all the unnecessary, complex, and epic thoughts in our minds. This theory, which aims to reach the smoothest and most basic logic by getting rid of excess details while solving a problem, has literally gone down in history as a philosophical razor blade.<br><br>Imagine the chocolate sitting on the table in the kitchen has been eaten. It is a possibility that aliens came and did it, and it's also a possibility that your waking little sibling ate it. Which option do you think is more logical? Your sibling, of course! This rule tells us: If you have more than one option to explain an event, the option that is the simplest and requires the least fantastic assumption is usually the correct one. Before thinking that secret agents hacked you when your computer doesn't work, you should check if the plug is plugged into the socket.`,dictionary:{logician:"mantıkçı",razor:"ustura/jilet",shaving:"tıraş etmek",unnecessary:"gereksiz",complex:"karmaşık",smoothest:"en pürüzsüz",possibility:"olasılık",assumption:"varsayım",socket:"priz"}},{icon:"💔",title:"30. Physical Effects of Loneliness",src:"30.Physical Effects of Loneliness.m4a",text:`The reason this name emerged is that for years loneliness was thought to be just a "psychological," meaning emotional, sadness. However, when scientists scanned the brain with MRI machines, they found something shocking. The brain of an excluded or lonely person was suffering just as if their arm was broken or they were physically beaten. Because it was proven that the effects are experienced entirely in the body, meaning physically, this "physical" emphasis was specifically added to the title.<br><br>Feeling very lonely for a long time doesn't just sadden your soul, it also seriously damages your body. The brain perceives being socially kicked out of a group as a massive stress alarm. When this stress continues for days, your immune system collapses, and you start getting sick much more easily. In short, making real friends, chatting and laughing with them is not just a fun activity; it is mandatory for us to survive, just like drinking water and eating food.`,dictionary:{loneliness:"yalnızlık",scanned:"tarandı",excluded:"dışlanmış",suffering:"acı çeken",emphasis:"vurgu",sadden:"üzmek",perceives:"algılar",immune:"bağışıklık",collapses:"çöker",mandatory:"zorunlu"}},{icon:"💊",title:"31. Placebo Effect",src:"31.Placebo Effect.m4a",text:'The origin of this word dates back to Latin and means "I shall please" or "I shall be acceptable." Since ancient times, doctors would sometimes give their patients fake pills made only of sugar, containing no medicinal substance, just to relax them. The patient would recover from the illness because they believed that the medicine would cure them. These fake belief pills, which please by tricking the mind and defeat the illness, have fully settled in the world of medicine and psychology under the name "Placebo."<br><br>You scraped your knee, and your family applied a regular bandage saying, "This magical bandage will stop your pain in a second." Even though there was no special feature in the bandage, your pain actually went away! If our brain fully believes that something will cure us, our body starts producing its own natural painkillers. What heals you is not the medicine given to you or that bandage, it is entirely the incredible power of your own brain and your belief in getting well.',dictionary:{acceptable:"kabul edilebilir",medicinal:"tıbbi",substance:"madde",recover:"iyileşmek",cure:"tedavi etmek",defeat:"yenmek",scraped:"kazıdın/sıyrıldı",bandage:"bandaj",painkillers:"ağrı kesiciler"}},{icon:"🏕️",title:"32. Psychology of Tribalism",src:"32.Psychology of Tribalism.mp3",text:`This name comes from the fact that in prehistoric times, humans had to live in small "tribes" or clans of 30-40 people in order to survive and protect themselves from wild animals in the forests. If you were kicked out of the tribe, it meant certain death. Today, we no longer live in forests, but our minds still operate with the fears of that era. The brain's need to feel obliged to be a member of a tribe gave this strong psychological belonging its name.<br><br>The soccer team we support, the clan of the game we play, or our school is our new tribe. Feeling like you belong to a group is wonderful, but it has a dangerous dark side: feeling unprovoked hostility towards those who are not one of us. We start seeing people who are not from our own tribe as a threat, as if they were rival cavemen in the wild. Loving our own group is nice, but not acting hostile and unfairly toward other groups is the biggest rule of being a modern and smart human.`,dictionary:{prehistoric:"tarih öncesi",tribes:"kabileler",operate:"çalışmak/işlemek",obliged:"zorunlu/mecbur",belonging:"aidiyet",unprovoked:"kışkırtılmamış/sebepsiz",hostility:"düşmanlık",threat:"tehdit",rival:"rakip",hostile:"düşmanca"}},{icon:"🗿",title:"33. Pygmalion Effect",src:"33.Pygmalion Effect.m4a",text:"The highly interesting name of this effect comes from the legend of Pygmalion, a very talented sculptor living in Ancient Greek mythology. According to the legend, Pygmalion creates a statue of a woman out of ivory that is so flawless and beautiful that he falls deeply in love with his own creation. He wants her to be a real, living human so much and believes in this so deeply that the gods bring the statue to life in the face of this high expectation and belief. Scientists used the name of this miraculous legend to describe how the unshakable belief that others have in us changes and improves us.<br><br>Let's say you are on the school team, and your coach wholeheartedly believes that you are a great talent and that you will turn into a star player in the future. Because you feel this high trust and expectation your coach has for you, without even realizing it, you work much harder than everyone else in practice so as not to betray that trust. Ultimately, you truly become an excellent player. The expectations others have of us instill a magical self-confidence in our minds and force us to reach that high level. This is also called the self-fulfilling prophecy through the power of beliefs.",dictionary:{sculptor:"heykeltıraş",mythology:"mitoloji",statue:"heykel",ivory:"fildişi",flawless:"kusursuz",expectation:"beklenti",miraculous:"mucizevi",unshakable:"sarsılmaz",wholeheartedly:"tüm kalbiyle",betray:"ihanet etmek",instill:"aşılamak",prophecy:"kehanet"}},{icon:"🏆",title:"34. Pyrrhic Victory",src:"34.Pyrrhic Victory.m4a",text:`The name of this term comes from King Pyrrhus, who lived in Antiquity and fought against the Romans. King Pyrrhus won a massive pitched battle against the Romans, but to achieve this victory, he sacrificed such a large part of his army that he was devastated at the end of the war. According to historians, after the battle, he said, "God, do not give me another victory like this, or I will be completely ruined!" and his name went down in history this way.<br><br>Imagine you defeated the boss monster in a difficult game. It says "You won" on the screen, but you have spent your rarest items and lost your entire team. You don't even have the strength left to pass the next easy level. In real life too, when arguing with your friend, you might act very stubbornly and prove them wrong. You have won the argument, but because you hurt them for this sake, you completely lose your best friend. This is what we call fake victories that come at a very heavy price and actually harm you.`,dictionary:{antiquity:"ilkçağ",pitched:"meydan (savaşı)",sacrificed:"feda etti",devastated:"mahvolmuş",historians:"tarihçiler",ruined:"mahvolmuş",rarest:"en nadir",stubbornly:"inatla",sake:"uğruna",fake:"sahte"}},{icon:"🍕",title:"35. Scarcity and Abundance Mindsets",src:"35.Scarcity and Abundance Mindsets.m4a",text:`The names of these two opposing mindsets are a legacy from human history thousands of years ago. In ancient times, there was a food "scarcity," and people fought with each other for a piece of bread. In the modern world, however, there is an "abundance" (limitlessness) of food and resources. But our minds still act with the panic that everything will run out, just like in ancient times. The name comes from people thinking that success in life is limited, just like the insufficient food in those eras.<br><br>The scarcity mindset is seeing success in the world as a single pizza. If someone else takes a big slice, you think there won't be any pizza left for you and you envy them. The abundance mindset, on the other hand, knows that the universe is a magical kitchen. When your friend succeeds, you are happy, because their success doesn't take anything away from you; new pizzas can come out of the oven. Doing teamwork with others and celebrating their success is the most important mindset that saves a person from the poison of jealousy and allows them to reach their own goals peacefully.`,dictionary:{opposing:"zıt",mindsets:"zihniyetler",legacy:"miras",scarcity:"kıtlık",abundance:"bolluk",insufficient:"yetersiz",eras:"çağlar",envy:"kıskanmak/imrenmek",teamwork:"takım çalışması",peacefully:"huzurla"}},{icon:"📏",title:"36. Social Comparison Theory",src:"36.Social Comparison Theory.m4a",text:'The name of this theory was coined by psychologist Leon Festinger while thinking about how people measure themselves. We use a meter to measure our height and a scale to measure our weight. However, there is no physical tool to measure our intelligence, our beauty, or our success in life. Therefore, people use other people, that is, "sociology," as a tool for measurement and "comparison." The name comes from our constant need to look at the person next to us to find our place in society.<br><br>You might think you are very fast at running in school, until you see someone who runs much faster than you. Comparing ourselves sometimes pushes us to work harder. However, if you constantly look at people living the most luxurious lives or always looking perfect on social media and compare them with your own life, you will feel inadequate and unhappy. You should use comparison not to envy others or to put yourself down, but simply as a source of inspiration to say, "I can do better too.”',dictionary:{measure:"ölçmek",scale:"terazi/tartı",intelligence:"zeka",sociology:"sosyoloji",comparison:"karşılaştırma",constant:"sürekli",luxurious:"lüks",inadequate:"yetersiz",inspiration:"ilham"}},{icon:"🏦",title:"37. Stockholm Syndrome",src:"37.Stockholm Syndrome.m4a",text:"The name of this syndrome comes from a very famous and real bank robbery incident that took place in Stockholm, the capital of Sweden, in 1973. The robbers held the people inside the bank hostage for days, but occasionally treated them a bit nicely by giving them food. At the end of the incident, the hostages began to hate the police and started protecting, and even befriending, the robbers who had kidnapped them. The scientific world went down in history by giving this very bizarre and incomprehensible psychological condition, where the victim feels affection for their tormentor, the name of that famous city where the event took place.<br><br>In action movies, sometimes bad guys kidnap someone, but after a while, the hostage starts helping the bad guy. Although this seems very absurd, it is actually the brain's incredible survival trick. When a person is extremely scared and feels completely helpless, they realize that to survive, they are dependent on that dangerous person who holds the power. When the dangerous person does a small favor, the mind perceives this as heroism. By feeling sympathy for that person and establishing a fake friendship with them, the victim hopes to escape being harmed and tries to ease that massive fear inside them in this way.",dictionary:{robbery:"soygun",hostage:"rehine",kidnapped:"kaçırdı",bizarre:"tuhaf",incomprehensible:"anlaşılmaz",affection:"şefkat/sevgi",tormentor:"eziyet eden",absurd:"saçma",dependent:"bağımlı",heroism:"kahramanlık",sympathy:"sempati/duygudaşlık",ease:"hafifletmek"}},{icon:"📸",title:"38. Streisand Effect",src:"38.Streisand Effect.m4a",text:`This interesting name comes from the world-famous American singer Barbra Streisand. In 2003, Streisand got very angry when she saw an aerial photo of her house on a website on the internet. She applied to court to get the photo deleted and created a huge scene. Before the lawsuit, only 6 people had downloaded that photo, but millions of people who heard about this lawsuit on the news went to the site and downloaded the photo, saying, "What is she hiding, I wonder?" The effort to hide something making it more famous was given her name.<br><br>When a friend takes a funny photo of you, if you panic and say, "Delete that immediately, don't show anyone!", everyone in the class gets curious and gathers around. The more you try to hide or ban a secret, a mistake, or a photo on the internet or at school, the more you shine a massive spotlight on that topic. Banned or hidden things arouse great curiosity in people's brains and spread thousands of times faster than normal.`,dictionary:{aerial:"havadan",lawsuit:"dava",downloaded:"indirdi",hiding:"saklamak",curious:"meraklı",ban:"yasaklamak",spotlight:"sahne ışığı",arouse:"uyandırmak/kışkırtmak"}},{icon:"⚓",title:"39. Sunk Cost Fallacy",src:"39.Sunk Cost Fallacy.mp3",text:`The name of this concept comes from the world of economics and trade. "Sunk cost" means money or time that has already been spent and is impossible to get back, like a ship that has sunk to the bottom of the ocean. "Fallacy" (faulty thinking) is the situation where people cannot let go of a bad endeavor despite it harming them, simply because they have spent too much time or money on it. It received this name because instead of accepting the loss and abandoning the ship, they stubbornly try to load more cargo onto a sinking ship, making the situation much worse.<br><br>Let's say you went to the cinema, bought a very expensive ticket, and started watching the movie. After the first half hour passed, you realized that this was the most boring, worst movie you have ever watched in your life. Would you leave the cinema at that moment, or would you sit in that seat for two more hours suffering by saying, "I paid that much for the ticket"? Most people continue to suffer simply because they spent money or time. Or, continuing to play with a character in a game that you no longer enjoy, just because you played for months and leveled it up, is the same thing. Sometimes the smartest thing you can do in life is to accept the loss and spend your remaining precious time on things you truly love.`,dictionary:{economics:"ekonomi",trade:"ticaret",impossible:"imkansız",fallacy:"yanılgı",endeavor:"çaba/girişim",abandoning:"terk etmek",stubbornly:"inatla",cargo:"kargo/yük",suffering:"acı çekmek",precious:"değerli"}},{icon:"🚫",title:"40. Toxic Positivity",src:"40.Toxic Positivity.m4a",text:`This name contains two completely opposite words. Being "positive" is normally a good thing, like taking vitamins or eating healthy. However, the word "Toxic" represents a beneficial thing turning into an acid that harms a person when the dose is taken way too far. Because scientists realized that the pressure of constantly appearing happy literally poisons and rots a person's mental health, they brought words together in such a striking contrast to describe this situation.<br><br>You scraped your knee badly and it hurts a lot. Right at that moment, someone comes up to you and says, "Smile! It could have been worse, we must always be positive!" This is extremely dangerous. We don't have to look happy all the time, every single second. Feeling sad, angry, or tired is perfectly normal. Trying to forcefully sweep bad feelings under the rug delays the healing of the wound inside us. A truly good friend is not the person who orders you to laugh, but the one who can say, "I understand that you are sad, you are right" while you are crying.`,dictionary:{opposite:"zıt",beneficial:"faydalı",dose:"doz",pressure:"baskı",poisons:"zehirler",rots:"çürütür",striking:"çarpıcı",contrast:"zıtlık",forcefully:"zorla",delays:"geciktirir",wound:"yara"}},{icon:"🐴",title:"41. Trojan Horse",src:"41.Trojan Horse.m4a",text:'The origin of this name comes from the massive Trojan War epic in Ancient Greece. The Greek army cannot breach the high walls of the city of Troy for years. Finally, they play a clever trick and build a giant wooden horse. They pretend to leave it as a "gift to the Gods" and depart. When the Trojans joyfully take the gift inside, the hidden Greek soldiers coming out of the horse at night conquer the city. Cybersecurity viruses on the internet are entirely named after this legendary hiding logic.<br><br>Imagine while playing a game on the internet, an ad pops up saying, "You won unlimited free gold, download the file!" You get very happy and download it, but not only do you not get the gold, but a virus enters your computer and all your accounts get stolen. This clever trap that looks like a wonderful and harmless gift from the outside but harbors a hidden disaster inside is what they call this. If something looks free, very easy, and flawless, it might contain an invisible danger; you should always be cautious.',dictionary:{epic:"destan",breach:"yarmak/aşmak",pretend:"gibi yapmak",depart:"ayrılmak",conquer:"fethetmek",cybersecurity:"siber güvenlik",legendary:"efsanevi",unlimited:"sınırsız",harmless:"zararsız",harbors:"barındırır",flawless:"kusursuz",cautious:"temkinli"}},{icon:"🧩",title:"42. Zeigarnik Effect",src:"42.Zeigarnik Effect.m4a",text:'This name was born from an interesting event experienced by Russian psychologist Bluma Zeigarnik during a meal she had at a restaurant in Berlin in the 1920s. Zeigarnik notices that the waiter perfectly keeps the orders of the crowded table in his mind without taking any notes. However, five minutes after paying the bill, when they ask the waiter what they ate, the waiter has completely forgotten! Having discovered that the brain stays on alert when a job is "half-finished" and throws everything in the trash when the job is done, Zeigarnik gave her own surname to this mind rule.<br><br>If you have to close the game just as you are about to defeat the monster in a difficult game, you obsessively think about that half-finished level all day. But you immediately forget the levels you passed easily. The human brain remembers half-finished jobs and uncompleted tasks much more clearly compared to finished ones. If you get very bored while studying, get up from the table leaving at least a part of it half-finished. Your brain will constantly bother you and call you back to the table to finish that homework.',dictionary:{waiter:"garson",alert:"tetikte",obsessively:"takıntılı bir şekilde",uncompleted:"tamamlanmamış",compared:"kıyasla",constantly:"sürekli",bother:"rahatsız etmek"}}]},ES={id:"history",title:"History of Things",cover:"🕰️",color:"#8e44ad",description:"A complete collection of 25 listening lessons exploring the fascinating history of everyday objects.",baseUrl:"https://raw.githubusercontent.com/dogierez/history-of--things-listen/main/",githubRepoUrl:"https://github.com/dogierez/history-of--things-listen",tracks:[{icon:"❄️",title:"1. Air Conditioner",src:"01_air_conditioner.mp3",text:"On a hot summer day, nothing feels better than walking into a cool room. We can thank the air conditioner for that! But did you know it was not actually invented to keep humans cool?<br><br>In the year 1902, a young engineer named Willis Carrier worked at a printing company in New York. The hot, wet summer air was causing a big problem. It made the printing paper swell and twist, which ruined the colors of the books.<br><br>Willis Carrier built a clever machine to control the moisture in the air. To his surprise, the machine also made the room feel beautifully cold! Soon, movie theaters bought these machines so people could watch films comfortably during hot summers.<br><br>Before this invention, schools and businesses often closed during the summer because it was just too hot to work. The air conditioner changed how we build houses and allowed cities to grow in very hot places around the world.",dictionary:{invented:"icat edildi",engineer:"mühendis",swell:"şişmek",twist:"kıvrılmak/bükülmek",ruined:"mahvetti",clever:"zeki",moisture:"nem",comfortably:"rahatça",businesses:"işletmeler",allowed:"izin verdi"}},{icon:"👖",title:"2. Blue Jeans",src:"02_blue_jeans.mp3",text:"Blue jeans are probably the most popular pants in the world. They are strong, comfortable, and look great. But their story began in the dirt of the American Wild West.<br><br>In the 1870s, thousands of miners went to California to dig for gold. Their work was very rough, and their regular trousers ripped open constantly. A tailor named Jacob Davis wanted to help them. He had an idea to add small copper rivets—metal pieces—to the corners of the pockets so they would not tear.<br><br>Jacob Davis did not have enough money to patent his invention, so he wrote a letter to Levi Strauss, a businessman who sold heavy denim fabric. Together, they created the very first pair of Levi’s jeans in 1873.<br><br>At first, only laborers and cowboys wore jeans. But in the 1950s, cool movie stars started wearing them, and teenagers everywhere wanted a pair. Today, people of all ages wear jeans every single day.",dictionary:{comfortable:"rahat",miners:"madenciler",rough:"zorlu/kaba",trousers:"pantolon",ripped:"yırtıldı",constantly:"sürekli olarak",tailor:"terzi",copper:"bakır",rivets:"perçinler",tear:"yırtılmak",patent:"patent almak",fabric:"kumaş",laborers:"işçiler"}},{icon:"👓",title:"3. Eyeglasses",src:"03_eyeglasses.mp3",text:"Think about how hard it would be to read a book or look at a computer screen if everything looked blurry. Hundreds of years ago, if your eyes became weak, you could not work or read anymore.<br><br>That changed in Italy during the late 13th century. Glassmakers discovered that looking through specially shaped pieces of glass could make tiny letters look big and sharp. They connected two pieces of glass together to make the first eyeglasses.<br><br>At first, people had to hold these glasses with their hands or balance them carefully on their noses. They did not have the side arms that sit over your ears today! Side arms were not invented until the 1700s.<br><br>Eyeglasses completely changed the world. Suddenly, older teachers, doctors, and craftsmen could keep working, reading, and inventing for many more years. Today, glasses are both a helpful medical tool and a cool fashion accessory.",dictionary:{blurry:"bulanık",weak:"zayıf",discovered:"keşfetti",shaped:"şekillendirilmiş",tiny:"minik",sharp:"keskin",connected:"bağladı",balance:"dengelemek",craftsmen:"zanaatkarlar",inventing:"icat etmek",medical:"tıbbi",tool:"araç",accessory:"aksesuar"}},{icon:"🍟",title:"4. Fried Potatoes",src:"04_fried_potatoes.mp3",text:"Whether you call them french fries, chips, or fried potatoes, crispy golden potato strips are loved everywhere. But who actually invented them?<br><br>The French and the Belgians have had a friendly argument about this for over a hundred years! The citizens of Belgium say they invented fries in the late 1600s. According to local stories, poor villagers living near a river used to catch tiny fish and fry them for dinner. One winter, the river froze completely, so they could not fish. They cut potatoes into tiny fish shapes instead and fried them!<br><br>During World War I, American soldiers arrived in Belgium and tasted these delicious hot potatoes. Because the Belgian army spoke French, the soldiers named the snack 'French fries.'<br><br>No matter who invented them, today they are cooked in hot oil and served with salt and ketchup in almost every country on earth.",dictionary:{crispy:"çıtır",strips:"şeritler",invented:"icat etti",argument:"tartışma",citizens:"vatandaşlar",villagers:"köylüler",catch:"yakalamak",froze:"dondu",completely:"tamamen",delicious:"lezzetli",served:"servis edildi"}},{icon:"💨",title:"5. Hair Dryer",src:"05_hair_dryer.mp3",text:"Getting out of the shower with wet hair can be annoying, especially in the winter. Today, we use a handy electric hair dryer. But the very first hair dryers were actually giant living room machines!<br><br>In 1890, a French stylist named Alexandre Godefroy invented a large machine for his hair salon. It used a gas stove to blow hot air through a giant pipe into a hood that sat on top of a person's head. You could not move at all while using it!<br><br>Later, in the early 1900s, vacuum cleaner companies noticed something funny. The exhaust end of their vacuums blew out warm air. Their advertisements actually told women to connect a hose to the back of the vacuum to dry their hair!<br><br>Finally, in the 1920s, engineers invented the first handheld, portable hair dryers. They were made of heavy metal and were quite dangerous if they got wet, but they paved the way for the safe plastic hair dryers we use today.",dictionary:{annoying:"sinir bozucu",handy:"kullanışlı",giant:"dev",stylist:"stilist",stove:"soba/ocak",pipe:"boru",hood:"başlık",vacuum:"elektrikli süpürge",exhaust:"egzoz/çıkış",advertisements:"reklamlar",hose:"hortum",handheld:"elde taşınır",portable:"taşınabilir",paved:"yolunu açtı"}},{icon:"🍔",title:"6. Hamburger",src:"06_hamburger.mp3",text:"When you visit a fast-food restaurant, you might order a delicious hamburger with lettuce and cheese. While the name sounds German, the modern hamburger is an American classic.<br><br>The word hamburger comes from the city of Hamburg, Germany. In the 1800s, German immigrants traveling to America brought a popular dish called 'Hamburg steak'—which was just a seasoned piece of minced beef served on a plate.<br><br>At large American fairs, workers needed a way to eat their lunch while walking around the crowded grounds. Sometime around 1900, creative cooks decided to squash the hot beef steak between two soft slices of bread.<br><br>Suddenly, customers could hold their meat meal with one hand without needing a plate or a fork! This simple change turned the hamburger into the ultimate fast food, changing the way millions of people eat on the go.",dictionary:{delicious:"lezzetli",lettuce:"marul",immigrants:"göçmenler",seasoned:"baharatlı/çeşnili",minced:"kıyılmış",crowded:"kalabalık",creative:"yaratıcı",squash:"ezmek",slices:"dilimler",ultimate:"nihai"}},{icon:"🚁",title:"7. Helicopter",src:"07_helicopter.mp3",text:"An airplane flies fast across the sky, but it needs a long runway to land. A helicopter is special because it can take off straight up into the air and hover in one spot like an insect.<br><br>For hundreds of years, inventors tried to build flying machines with spinning blades. Even the great artist Leonardo da Vinci drew a design for an 'aerial screw' five hundred years ago! However, early helicopters had a dangerous problem: when the top blades spun around, the cabin would spin rapidly in the opposite direction, causing it to crash.<br><br>In 1939, an engineer named Igor Sikorsky solved this big puzzle. He added a tiny vertical rotor to the very back of the tail. This small tail rotor pushed against the air to keep the main cabin perfectly straight and steady.<br><br>Thanks to his design, helicopters can land on mountain peaks, hospital roofs, and boats to save lives during emergencies.",dictionary:{runway:"pist",hover:"havada asılı kalmak",insect:"böcek",inventors:"mucitler",spinning:"dönen",blades:"pervaneler/kanatlar",aerial:"havaya ait",rapidly:"hızla",opposite:"zıt",direction:"yön",vertical:"dikey",rotor:"döner parça",steady:"sabit",peaks:"zirveler",emergencies:"acil durumlar"}},{icon:"🔥",title:"8. Lighter",src:"08_lighter.mp3",text:"You might think that matches were invented first and lighters came later, but the truth is the exact opposite! The mechanical lighter was actually invented before the friction match.<br><br>In 1823, a German chemist named Johann Wolfgang Döbereiner invented a device called 'Döbereiner's Lamp.' It was a large glass jar that used a chemical reaction to create a flammable gas. When you turned a valve, the gas hit a piece of platinum metal and created a flame. It was very dangerous and looked like a piece of laboratory equipment, but it worked!<br><br>In the 1930s, a man named George Blaisdell invented the famous Zippo lighter. He wanted a small lighter that would not blow out in the wind. He added a little metal chimney around the flame to protect it.<br><br>Today, plastic lighters are small, cheap, and can fit easily inside a pocket. They show how a big, complex chemistry experiment became a simple daily tool.",dictionary:{matches:"kibritler",opposite:"zıt",mechanical:"mekanik",friction:"sürtünme",chemist:"kimyager",device:"cihaz",reaction:"tepkime",flammable:"yanıcı",valve:"vana",flame:"alev",laboratory:"laboratuvar",equipment:"ekipman",chimney:"baca",protect:"korumak",cheap:"ucuz",complex:"karmaşık"}},{icon:"💡",title:"9. Light Bulb",src:"09_light_bulb.mp3",text:"When the sun goes down, you just flip a switch to turn on the lights. It seems so simple! But the story of the light bulb is full of hard work and thousands of mistakes.<br><br>Many people think Thomas Edison invented the light bulb in 1879. The truth is, other scientists had already built bulbs, but they burned out after just a few minutes. Edison wanted to make a bulb that could stay bright for days.<br><br>To do this, he needed the perfect material for the tiny wire inside the bulb, called the filament. Edison and his team tested over six thousand different materials! They tested plants, thread, and even hair from a man’s beard.<br><br>Finally, they discovered that a piece of carbonized bamboo worked perfectly. It burned for more than twelve hours without breaking! Edison showed the world that failures are just steps to success. He famously said he did not fail six thousand times; he just found six thousand ways that did not work.",dictionary:{switch:"düğme",mistakes:"hatalar",scientists:"bilim insanları",burned:"yandı",bright:"parlak",material:"malzeme",wire:"tel",filament:"flaman",tested:"test etti",thread:"iplik",beard:"sakal",discovered:"keşfetti",carbonized:"karbonize edilmiş",failures:"başarısızlıklar",success:"başarı"}},{icon:"🪵",title:"10. Matches",src:"10_matches.mp3",text:"Fire is one of the most important tools in human history, but making a fire used to take a long time. People had to rub sticks together or strike rocks to create a tiny spark.<br><br>In 1826, a British chemist named John Walker was working in his laboratory. He was mixing chemicals with a wooden stick. When he pulled the stick out, he noticed a dried lump of chemicals on the tip.<br><br>He wanted to clean the stick, so he scraped the tip across his stone floor. Suddenly—whoosh! The friction created a bright flame right on the end of the wood. John Walker had accidentally invented the match.<br><br>At first, these early matches were dangerous because they could explode or ignite randomly in your pocket. Later, scientists created 'safety matches' that only light up when you strike them against a special strip on the side of the box.",dictionary:{rub:"sürtmek",strike:"çarpmak/vurmak",spark:"kıvılcım",chemist:"kimyager",laboratory:"laboratuvar",chemicals:"kimyasallar",noticed:"fark etti",dried:"kurumuş",lump:"topak",tip:"uç",scraped:"kazıdı",friction:"sürtünme",flame:"alev",accidentally:"kazara",explode:"patlamak",ignite:"tutuşmak",randomly:"rastgele",strip:"şerit"}},{icon:"🍱",title:"11. Microwave",src:"11_microwave.mp3",text:"The microwave is a magical kitchen machine. It can heat up your dinner or pop popcorn in just one minute! Like many great inventions, it was discovered completely by accident.<br><br>In 1945, an engineer named Percy Spencer was working at a company that built radar equipment for the military. One day, he stood in front of a working radar tube, which produces invisible energy waves.<br><br>Suddenly, he felt a strange, warm sensation in his pocket. He reached inside and discovered that his chocolate bar had completely melted into a sticky mess!<br><br>Percy Spencer was curious, not angry. He placed some corn kernels in front of the machine, and they instantly popped into popcorn all over the room! He realized these radar waves could cook food incredibly fast. He built a metal box to trap the waves, creating the very first microwave oven. Today, millions of kitchens have one.",dictionary:{magical:"sihirli",inventions:"icatlar",discovered:"keşfedildi",accident:"kaza",engineer:"mühendis",equipment:"ekipman",military:"ordu",invisible:"görünmez",sensation:"his/duyu",melted:"erimiş",sticky:"yapışkan",mess:"dağınıklık/karmaşa",curious:"meraklı",kernels:"çekirdekler",instantly:"anında",realized:"fark etti",trap:"hapsetmek"}},{icon:"✈️",title:"12. Planes",src:"12_planes.mp3",text:"Today, we can board a giant metal plane and fly across oceans in just a few hours. This incredible journey began with two brothers who repaired bicycles for a living.<br><br>Orville and Wilbur Wright loved machines. They spent years studying how birds fly and built giant kites to test the wind. On December 17, 1903, in North Carolina, Orville Wright climbed inside their wooden aircraft, called The Flyer, and launched into the air.<br><br>That historic first flight lasted just twelve seconds! The plane flew a distance shorter than the length of a modern passenger jet, but it proved that a machine could fly using its own engine power.<br><br>Just forty-four years later, planes were flying faster than the speed of sound! Aviation grew quicker than almost any other technology, turning our massive planet into a connected global neighborhood.",dictionary:{board:"binmek",incredible:"inanılmaz",journey:"yolculuk",repaired:"tamir etti",kites:"uçurtmalar",aircraft:"hava aracı",launched:"fırlatıldı/havalandı",historic:"tarihi",distance:"mesafe",passenger:"yolcu",proved:"kanıtladı",aviation:"havacılık",massive:"devasa",connected:"bağlantılı",neighborhood:"mahalle"}},{icon:"🍕",title:"13. Pizza",src:"13_pizza.mp3",text:"Pizza is one of the most loved foods on earth. You can find it in almost every country, but its modern story truly began in the city of Naples, Italy.<br><br>Long ago, flatbreads with simple toppings were a cheap food for poor workers who needed a quick meal. Then, in 1889, King Umberto and Queen Margherita visited Naples. The Queen was tired of eating fancy French food and wanted to try the local flatbread.<br><br>A chef named Raffaele Esposito wanted to make a very special pizza for the Queen. He chose three simple toppings to match the colors of the Italian flag: red tomatoes, white mozzarella cheese, and green basil leaves.<br><br>The Queen absolutely loved it! The chef named the pizza 'Margherita' in her honor. Italian immigrants later brought pizza recipes to America, and it quickly exploded into a global phenomenon.",dictionary:{flatbreads:"pideler",toppings:"malzemeler",cheap:"ucuz",fancy:"lüks/süslü",local:"yerel",chef:"şef",match:"eşleşmek",honor:"onur",immigrants:"göçmenler",recipes:"tarifler",exploded:"patladı/hızla yayıldı",global:"küresel",phenomenon:"fenomen/olgu"}},{icon:"🥔",title:"14. Potato Chips",src:"14_potato_chips.mp3",text:"Have you ever opened a bag of crunchy potato chips? This delicious snack was actually invented because a chef got very angry at a difficult customer!<br><br>In the year 1853, a chef named George Crum worked at a restaurant in New York. A wealthy customer ordered a plate of french fries. When the food arrived, the customer complained that the potatoes were too thick, too soft, and did not have enough salt.<br><br>George Crum made a second batch, but the customer rejected them again! Chef Crum became frustrated. To teach the customer a lesson, he sliced the potatoes paper-thin, fried them until they were rock-hard, and covered them in salt. He thought the customer would hate them.<br><br>Instead, the customer took a bite and yelled, 'These are amazing!' Soon, everyone wanted the crispy potato chips, and they became one of the most popular snacks in the world.",dictionary:{crunchy:"çıtır",delicious:"lezzetli",snack:"atıştırmalık",wealthy:"zengin",customer:"müşteri",complained:"şikayet etti",thick:"kalın",batch:"parti/porsiyon",rejected:"reddetti",frustrated:"hüsrana uğramış",sliced:"dilimledi",yelled:"bağırdı",crispy:"çıtır"}},{icon:"🧊",title:"15. Refrigerator",src:"15_refrigerator.mp3",text:"Have you ever wondered how your refrigerator stays so cold?<br><br>Long ago, people did not have refrigerators. To keep food fresh, they had to travel to frozen lakes in the winter. They cut giant blocks of real ice and carried them home on big boats! It was very hard work.<br><br>Then, everything changed. In the year 1748, a smart scientist named William Cullen showed the world the very first way to make artificial cooling. Later, in 1834, an inventor named Jacob Perkins built the first real cooling machine that actually worked for homes.<br><br>How does this machine work? It does not actually create cold. Instead, it acts like a vacuum cleaner for heat! Inside the
