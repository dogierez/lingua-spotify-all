er followed him. As they walked, all the smaller animals saw them and ran away in terror. The silly tiger thought the animals were running from the fox, but they were actually running from the tiger! The tiger quickly apologized and let the fox go free.<br><br><strong>Lesson:</strong> Do not be fooled by illusions. Some people use the power of the people standing behind them to look strong.',dictionary:{caught:"yakaladı",magical:"sihirli",prove:"kanıtlamak",followed:"takip etti",terror:"dehşet",actually:"aslında",apologized:"özür diledi",fooled:"kandırılmak",illusions:"yanılsamalar"}},{title:"The Tiger and the Woodpecker",src:"The Tiger and the Woodpecker .wav",text:`A tiger was eating when a bone got stuck in his teeth. He asked a woodpecker for help. "If you pull the bone out, I will give you a big reward," said the tiger. The brave bird did it and successfully saved the tiger from the pain. Later, the bird asked for the reward. The cruel tiger laughed and said, "You put your small head inside a hungry tiger's mouth, and I did not eat you. That is your reward! Now go away."<br><br><strong>Lesson:</strong> Do not expect toxic or bad people to be thankful when you do them a favor.`,dictionary:{stuck:"sıkıştı/takıldı",reward:"ödül",brave:"cesur",successfully:"başarıyla",saved:"kurtardı",cruel:"zalim",expect:"beklemek",toxic:"zehirli",thankful:"minnettar",favor:"iyilik"}},{title:"The Turtle and the Scorpion",src:"The Turtle and the Scorpion..wav",text:`A turtle and a scorpion were friends and needed to cross a river. The scorpion sat on the turtle's back. In the middle of the river, the turtle heard a scratching noise on his shell. The turtle asked, "What are you doing?" The scorpion answered, "I am trying to sting your shell. It is my nature." The turtle realized his friend was dangerous. The turtle said, "Well, it is my nature to dive under the water to protect myself." He dived, and the scorpion washed away.<br><br><strong>Lesson:</strong> If someone shows you they are toxic, protect yourself and let them go.`,dictionary:{cross:"karşıya geçmek",scratching:"tırmalama",sting:"sokmak",nature:"doğa/huy",realized:"fark etti",dangerous:"tehlikeli",protect:"korumak",toxic:"zehirli"}},{title:"The Turtle and the Two Geese",src:"The Turtle and the Two Geese..wav",text:'A friendly turtle talked way too much. Two geese offered to help him fly to a better lake. They said, "Bite the middle of this stick, and we will fly. But you must keep your mouth shut!" The turtle bit the stick, and they flew into the sky. People on the ground saw them and shouted, "Look at the funny flying turtle!" The proud turtle became angry. He opened his mouth to shout, "Be quiet!" but he immediately fell to the ground and died.<br><br><strong>Lesson:</strong> Knowing exactly when to keep your mouth shut can save your life.',dictionary:{friendly:"arkadaş canlısı",offered:"teklif etti",shouted:"bağırdı",proud:"gururlu",angry:"kızgın",immediately:"hemen",exactly:"tam olarak"}},{title:"The Two Dogs",src:"The Two Dogs..wav",text:'A grandfather was watching two dogs in the yard. One was black, and the other was white. They were fighting each other loudly. The grandfather explained to his grandson, "The white dog represents all our good feelings: love and kindness. The black dog represents our bad feelings: anger and hate. These two sides are always fighting inside our hearts." The little boy asked, "Which dog is going to win?" The old man answered, "The one that I feed better will win."<br><br><strong>Lesson:</strong> We choose who we become by the thoughts and actions we feed.',dictionary:{loudly:"yüksek sesle",explained:"açıkladı",represents:"temsil eder",feelings:"hisler",kindness:"nezaket",anger:"öfke",choose:"seçmek",actions:"eylemler"}},{title:"The Two Frogs and the Milk",src:"The Two Frogs and the Milk..wav",text:'Two frogs fell into a bucket of milk. The first frog became hopeless. He cried, "This is impossible!" He stopped swimming and drowned. The second frog refused to give up. He kicked his legs and swam in circles for hours. Because of his movement, the milk began to change. The cream turned into solid butter! Soon, the frog was standing on a hard piece of butter. He used the solid surface to jump out of the bucket and was safe.<br><br><strong>Lesson:</strong> Persistence is the key to survival. Your hard work can turn a difficult problem into a solution.',dictionary:{hopeless:"umutsuz",impossible:"imkansız",drowned:"boğuldu",refused:"reddetti",solid:"katı",surface:"yüzey",persistence:"azim/kararlılık",survival:"hayatta kalma",difficult:"zor",solution:"çözüm"}},{title:"The Two Roosters and the Eagle",src:"The Two Roosters and the Eagle ..wav",text:"Two roosters lived on a farm and fought for the farmyard. The winner, full of pride, flew to the top of a stone wall. He flapped his wings and crowed loudly to tell everyone about his great victory. However, a hungry eagle heard the loud crowing and saw the boastful rooster standing alone on the wall. In a second, the eagle dropped like a stone, grabbed the winner in his sharp claws, and carried him away to be eaten. The rooster who had lost the fight came out of his dark corner and became the master of the farmyard.<br><br><strong>Lesson:</strong> Pride often leads to a sudden fall. When you are successful, stay humble, or your own noise might attract your enemy.",dictionary:{pride:"gurur",victory:"zafer",boastful:"övüngen",grabbed:"yakaladı",sharp:"keskin",sudden:"ani",successful:"başarılı",humble:"mütevazı",attract:"çekmek"}},{title:"The Two Seeds",src:"The Two Seeds..wav",text:'Two small seeds lay side by side in the dark earth during the early spring. The first seed was very brave. "I want to grow!" she said. "I want to push my roots deep and see the beautiful world above the soil. I want to feel the warm sun on my face and bloom." The second seed was very shy and cautious. "I am afraid," he replied. "If I push my head into the air, a big bird might eat me. If I grow a flower, someone might pull me out of the ground. It is much safer to stay here in the dark where it is quiet." The first seed pushed through the dirt. Soon, she became a tall, strong plant with many green leaves. Meanwhile, the second seed stayed hidden under the soil, waiting for a safe time that never came. One afternoon, a hungry chicken walked through the garden. The sun was hot, so the chicken stopped to rest in the shadow of the tall plant. While sitting there, the chicken scratched the dirt. It found the cautious seed and ate it for lunch.<br><br><strong>Lesson:</strong> If you refuse to grow because you are afraid, you will be destroyed by the world anyway. Taking a risk to grow is often safer than doing nothing.',dictionary:{brave:"cesur",bloom:"çiçek açmak",shy:"utangaç",cautious:"temkinli",afraid:"korkmuş",hidden:"gizli",scratched:"kazıdı",refuse:"reddetmek",destroyed:"yok edilmiş",risk:"risk"}},{title:"The Warrior and the Loyal Wolf",src:"The Warrior and the Loyal Wolf..wav",text:"A brave warrior found an orphaned wolf cub and raised it as his best friend. Despite the tribe's warnings, the animal grew up very loyal. One day, the warrior had to leave his newborn baby alone and left the wolf to guard the tipi. When he returned, he saw the wolf outside with blood on its mouth and the baby's cradle pushed over. In a fit of rage, the warrior grabbed his gun and shot the wolf. As the wolf died, the warrior heard his baby crying. He ran inside and saw his child sleeping safely on the floor. Next to the cradle lay a massive, dead puma. The wolf had fought the predator to save the baby's life. The warrior cried as he realized he had killed his most loyal protector.<br><br><strong>Lesson:</strong> Do not let anger blind your judgment. What looks like a betrayal might actually be a sacrifice.",dictionary:{orphaned:"yetim kalmış",warnings:"uyarılar",loyal:"sadık",guard:"korumak/nöbet tutmak",rage:"öfke/hiddet",grabbed:"kaptı",massive:"devasa",predator:"yırtıcı",realized:"fark etti",protector:"koruyucu",blind:"körü körüne",judgment:"yargı",betrayal:"ihanet",sacrifice:"fedakarlık"}},{title:"The Wolf and the Lamb",src:"The Wolf and the Lamb..wav",text:'A hungry wolf saw a small lamb drinking water at a stream. The wolf shouted, "How dare you make my water dirty?" The lamb trembled and said, "Sir, I am drinking downstream from you. I cannot make your water dirty." The wolf was angry because the lamb was right. He tried another lie. "Last year, you said terrible things about my father!" The lamb cried, "Sir, I was not even born last year!" Finally, the wolf hissed, "I do not care about your logic. I am hungry, and you are dinner." He jumped on the lamb and ate him.<br><br><strong>Lesson:</strong> A wicked person will always find an excuse for their evil actions, even if your logic is perfect. Sometimes, truth cannot stop a predator.',dictionary:{dirty:"kirli",trembled:"titredi",angry:"kızgın",terrible:"korkunç",logic:"mantık",wicked:"kötü/zalim",excuse:"bahane",evil:"kötü",actions:"eylemler",perfect:"kusursuz",predator:"yırtıcı"}},{title:"The Wolf in Sheep’s Clothing",src:"The Wolf in Sheep’s Clothing..wav",text:'A hungry, clever wolf could not catch any sheep because the smart shepherd watched the flock closely. One day, the wolf found a sheep’s skin and put it over his own body. He walked into the group of sheep. The busy shepherd thought he was a real sheep and locked him securely in the pen for the night. The wolf planned to eat a fat sheep in the dark. But that night, the shepherd suddenly wanted fresh meat for his own dinner. He went into the dark pen, grabbed the first "sheep" he saw, and killed it. It was the disguised wolf.<br><br><strong>Lesson:</strong> Pretending to be someone else to do bad things will eventually destroy you.',dictionary:{clever:"zeki",shepherd:"çoban",closely:"yakından",securely:"güvenli bir şekilde",planned:"planladı",suddenly:"aniden",grabbed:"yakaladı",disguised:"kılık değiştirmiş",pretending:"numara yapmak",eventually:"sonunda",destroy:"yok etmek"}},{title:"The Woodcutter and the Trees",src:"The Woodcutter and the Trees..wav",text:'A poor woodcutter went deep into the quiet forest. He had an axe head, but he did not have a wooden handle for it. He politely asked the trees, "Please, give me just a small piece of strong wood to make a handle for my tool." The kind trees felt sorry for the man. They gave him a nice, strong piece of ash wood. The woodcutter quickly fixed his axe. Then, he immediately started swinging his sharp axe to cut down all the beautiful trees in the forest. The generous trees realized their terrible mistake far too late.<br><br><strong>Lesson:</strong> Be extremely careful who you help. You might be handing your enemy the exact weapon they need to destroy you.',dictionary:{politely:"kibarca",fixed:"tamir etti",immediately:"hemen",swinging:"sallamaya",sharp:"keskin",generous:"cömert",realized:"fark ettiler",terrible:"korkunç",mistake:"hata",extremely:"son derece",exact:"tam/kesin",weapon:"silah",destroy:"yok etmek"}}]},HS={"historic-people":AS,concepts:SS,freedom:MS,history:ES,food:zS,satires:DS,fables:jS},qf="historic-people",ri={CUSTOM_PLAYLISTS:"audioverse_custom_playlists_v1",BOOKMARKS:"audioverse_bookmarks_v1",SAVED_WORDS:"audioverse_saved_words_v1",TRACK_NOTES:"audioverse_track_notes_v1",PLAYBACK_PREFS:"audioverse_playback_prefs_v1"},RS=()=>{try{const k=localStorage.getItem(ri.CUSTOM_PLAYLISTS);return k?JSON.parse(k):[]}catch(k){return console.error("Failed to load custom playlists",k),[]}},P0=k=>{try{localStorage.setItem(ri.CUSTOM_PLAYLISTS,JSON.stringify(k))}catch(N){console.error("Failed to save custom playlists",N)}},CS=()=>{const k=RS(),N={...HS};return k.forEach(D=>{N[D.id]=D}),N},Zr=()=>{try{const k=localStorage.getItem(ri.BOOKMARKS);return k?JSON.parse(k):[]}catch{return[]}},nk=(k,N,D)=>{const C=Zr(),_=C.findIndex(E=>E.playlistId===k&&E.trackIndex===N);let R,F=!1;return _>=0?(R=C.filter((E,V)=>V!==_),F=!1):(R=[{playlistId:k
