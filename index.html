tion to the people of Flanders (modern Belgium), who were called "Flemings." In the past, people thought these birds were as colorful and unusual as the Flemings, so they used a similar word. Another interesting fact is that the flamingo is not born pink; it gets its color from eating special shrimp and algae that contain a natural "fire" pigment. If the bird stops eating this food, its feathers will eventually turn white! Today, the flamingo is a symbol of tropical vacations and exotic nature. Its name is a perfect description of its unique beauty. Every time we see a flamingo, we are looking at a "flame-colored" bird that carries a name from the Spanish and Latin languages, representing the bright colors of the sun.',dictionary:{glowing:"parıldayan",feathers:"tüyler",flames:"alevler",pigment:"renk maddesi",exotic:"egzotik",unique:"benzersiz",tropical:"tropikal"}},{title:"46. Freelance",src:"Freelance female us.mp3",text:'The word freelance is used to define people who work independently and have no affiliation with any company or employer. The origin of this word dates back to the middle ages when knights would fight for their lords. Occasionally, a knight would abandon his lord and become a mercenary. This particular knight would rent his lance, which was the knight’s main weapon, to anyone who could afford his fee. Since then, the term freelance has been used to define self-employed people, although the era of knights finished long ago. Nowadays, the skill of a professional is the lance of a knight in the middle ages. Today, many writers, artists, and teachers work as freelancers. They are not tied to one boss; they are "free" to choose which projects they want to work on. It is a word about professional freedom and independence. Even though we do not use real spears or lances today, we still use our skills to earn a living just like those brave and independent knights did hundreds of years ago in the old times. It is a very popular way to work in the modern world.',dictionary:{independently:"bağımsız olarak",affiliation:"bağlantı",abandon:"terk etmek",mercenary:"paralı asker",weapon:"silah",freedom:"özgürlük"}},{title:"47. Geisha",src:"Geisha female us.mp3",text:'The word geisha is a beautiful example of the elegance of the Japanese language. It is made of two different parts: gei, which means "art," and sha, which means "a person." So, a geisha is literally an "artist" or "a person of art." In traditional Japanese culture, a geisha is a highly trained professional whose job is to entertain guests with music, dancing, and poetry. They spend many years learning how to play instruments like the shamisen and how to perform the delicate tea ceremony. They are famous for their beautiful kimonos, white makeup, and incredible hairstyles. It is important to know that a geisha is not just a servant; she is a living symbol of the history and art of Japan. The word represents a high level of discipline and beauty. In the past, there were even male geishas! Today, while there are fewer geishas than in the past, they are still a very respected part of Japanese life, especially in the city of Kyoto. The name reminds us that art is not just something we look at in a museum; it can be a way of living and a profession dedicated to making the world a more beautiful and graceful place.',dictionary:{elegance:"zarafet",entertain:"eğlendirmek",delicate:"narin",ceremony:"tören",discipline:"disiplin",graceful:"zarif/hoş"}},{title:"48. Ghetto",src:"Ghetto male us.mp3",text:'The word ghetto has a very specific and historical origin that begins in the beautiful city of Venice, Italy. In 1516, the local government forced all the Jewish people in the city to live on a small island that was separated from the rest of the community. This island was located near an old metal factory, or a "foundry." In the Venetian language, a foundry was called a ghèto. This specific neighborhood became the first ghetto in history. For many centuries, the word was used to describe any segregated part of a city where a minority group was forced to live because of their religion or race. In the twentieth century, the word became sadly famous again during World War II when millions of people were forced into crowded neighborhoods. Today, the word is also used to describe any poor or isolated area of a modern city. The history of the word is a dark reminder of a time when people were separated and treated differently because of who they were. It is a word that reminds us of the importance of inclusion and the long struggle for human rights and equality in our global cities.',dictionary:{segregated:"ayrıştırılmış",foundry:"dökümhane",minority:"azınlık",isolated:"yalıtılmış",inclusion:"dahil etme",equality:"eşitlik"}},{title:"49. Gorilla",src:"Gorilla male us.mp3",text:`The word gorilla has a very ancient and dramatic history that starts with an explorer from Carthage named Hanno. Over two thousand years ago, he sailed down the coast of West Africa and wrote about seeing "hairy people" in the jungle. He asked the local people what they were, and they used a word that meant "hairy women." Hanno wrote this word down in his notebook as gorillai. For many centuries, European scientists thought these stories were just a legend or a myth. However, in the 1840s, a missionary found a giant skull in the jungle and realized that the "hairy people" from the old stories were actually real animals. He decided to use Hanno's ancient word to name the giant, strong apes we know today. A gorilla is a truly powerful and intelligent animal that lives in family groups in the deep forest. Even though they are massive and strong, they are usually very quiet and gentle. Today, the name gorilla is used in every language. It is a word that connects a modern scientific discovery to a mysterious traveler's story from thousands of years ago, showing how history and nature are always linked together.`,dictionary:{dramatic:"çarpıcı",skull:"kafatası",legend:"efsane",gentle:"uysal/nazik",massive:"devasa",scientific:"bilimsel"}},{title:"50. Gourmet",src:"Gourmet male us.mp3",text:'The history of the word gourmet shows how a person’s job can change its meaning over time. In old France, a gourmet was not a person who loved eating; he was a servant or a "wine taster" whose job was to help a wine merchant. He had to have a very good sense of taste to make sure the wine was high quality before the merchant bought it. He was a professional taster! Over many years, the meaning changed from the worker to the customer. It began to describe anyone who had a very fine and "educated" taste for high-quality food and expensive drinks. Today, we use the word for a person who loves fancy meals or for a shop that sells very special ingredients like truffles or expensive cheeses. If you go to a "gourmet" restaurant, you expect the food to be cooked by a great chef with the best ingredients. The word has moved from the simple world of wine servants to the world of luxury and culinary art. It is a word about the joy of eating and the appreciation of the best flavors that life has to offer us.',dictionary:{taster:"tadıcı",expensive:"pahalı",fancy:"lüks",culinary:"mutfakla ilgili",luxury:"lüks",appreciation:"takdir",flavors:"lezzetler"}},{title:"51. Graffiti",src:"Graffiti male us.mp3",text:'The word graffiti comes from the Italian word graffiato, which means "scratched." This is derived from the Greek word graphein, meaning "to write." Long ago, in the ancient cities of Rome and Pompeii, people did not have paper or social media to share their feelings. Instead, they "scratched" messages, jokes, and drawings onto the stone walls of buildings and streets. They wrote about politics, love, and even complaining about the food! When archaeologists found these cities hundreds of years later, they were amazed to see these ancient "wall scratchings" still there. They used the Italian word to describe them. Today, even though we use colorful spray paint instead of scratching stones, we still use the same name for art on walls. While some people think graffiti is a problem, many others see it as a powerful form of modern street art that gives a voice to the city. Whether it is a quick tag or a beautiful mural, the name still connects us back to those ancient Romans who wanted to leave a message on a wall. It is a word about the human desire to be heard and remembered.',dictionary:{scratched:"kazınmış",archaeologists:"arkeologlar",complaining:"şikayet eden",mural:"duvar resmi",desire:"arzu/istek",remembered:"hatırlanan"}},{title:"52. Guerilla",src:"Guerilla female us.mp3",text:'The word guerilla has a very strong history that comes from the Spanish language. In Spanish, guerra means "war." By adding the suffix -illa, the word becomes guerrilla, which literally means "little war." This term was first used in the early 1800s during the Napoleonic Wars in Spain. When the giant French army invaded, the local Spanish people could not fight them in a traditional big battle because they were too small. Instead, they fought a "little war" by using surprises, hiding in the mountains, and attacking quickly before disappearing back into the forest. It was a very effective way for a small group to fight a much larger enemy. The English language borrowed the word, and it became the standard name for this style of fighting all over the world. Today, guerilla is used to describe any small group of soldiers who use irregular tactics to fight. It can also be used for "guerilla marketing" or "guerilla gardening," which means doing something in a surprising and unofficial way. It is a word about being clever, fast, and using your surroundings to win against a much bigger force.',dictionary:{invaded:"istila etti",tactics:"taktikler",irregular:"kuralsız/düzensiz",effective:"etkili",surroundings:"çevre",clever:"akıllıca"}},{title:"53. Guillotine",src:"Guillotine female us.mp3",text:`This famous machine was named after a French doctor named Joseph-Ignace Guillotin. This is a slightly sad story because Dr. Guillotin was actually a very kind man who loved people. During the French Revolution, the government used very cruel and painful methods to punish criminals. Dr. Guillotin thought this was wrong and uncivilized. In 1789, he suggested that the government should use a machine with a heavy blade to make punishments "instant and painless." He didn't invent the machine himself—it was actually built by an engineer named Tobias Schmidt—but everyone started calling it the guillotine after the doctor's suggestion. Dr. Guillotin was not happy about this! He didn't want his family name to be associated with a machine of death, and his family even tried to change their name later because they were embarrassed. Today, the machine is a famous symbol of the French Revolution and the end of the monarchy. The name reminds us of a dark time in history. It is a story of how a person’s name can become famous for something they never wanted, showing us that history sometimes remembers us for the wrong reasons.`,dictionary:{punish:"cezalandırmak",criminals:"suçlular",uncivilized:"vahşi/medeniyetsiz",instant:"anlık",painless:"acısız",blade:"kesici ağız/bıçak",embarrassed:"utanmış"}},{title:"54. Hamburger",src:"Hamburger female us.mp3",text:'This famous food is named after the city of Hamburg in Germany, but its journey to becoming a world-famous sandwich happened in America. In the eighteenth and nineteenth centuries, the city of Hamburg was famous for a dish called "Hamburg steak," which was made of minced beef mixed with onions and spices. When millions of German people moved to the United States, they brought this recipe with them. At first, it was served on a plate as a regular meal. However, during the busy time of the industrial revolution, factory workers needed a way to eat their lunch quickly with one hand. According to the stories, smart cooks started putting the beef steak between two slices of bread so people could eat it while they walked or worked. This "sandwich from Hamburg" became known as the hamburger. Today, it is the most popular fast food in the world, found in almost every country. Even though the word has "ham" in it, the name has nothing to do with pigs! It is a delicious reminder of the city in Germany where the idea for the meat first started.',dictionary:{minced:"kıyılmış",recipe:"tarif",industrial:"endüstriyel",convenient:"elverişli",popular:"popüler",delicious:"lezzetli",slices:"dilimler"}},{title:"55. Helicopter",src:"Helicopter male us.mp3",text:`The word helicopter is a very logical name made of two ancient Greek parts. The first part is helix, which means "a spiral" or "a circle," and the second part is pteron, which means "a wing." So, a helicopter is literally a "spiral wing." This is a perfect description because the long blades on top of the machine spin in a circle to create the power that lifts it into the sky. This name was first created by a French inventor in 1861, many years before a real one could actually fly! For a long time, scientists like Leonardo da Vinci had dreamed of a "spiral wing" machine, but they didn't have the technology to build it. When the first successful helicopters were finally built in the 1930s and 1940s, the name was already waiting for them. Today, these machines are vital for saving lives, fighting fires, and traveling to places where there are no runways. Unlike an airplane, a helicopter can move straight up and even stay still in the air. The name is a simple and elegant reminder of the beautiful "spiral" motion that makes this amazing flying machine work so well.`,dictionary:{blades:"pervaneler/kanatlar",spin:"dönmek",lifts:"kaldırır",vital:"hayati",motion:"hareket",runways:"pistleri"}},{title:"56. Hotel",src:"Hotel female us.mp3",text:'The word hotel has a very welcoming history that comes from the French language. It is closely related to the words "hostel" and "hospital." In the Middle Ages, these words all referred to the same idea: a place where a guest (hostis in Latin) was treated with kindness and care. Originally, a hôtel in France was a very large and grand private house for a noble family. When these families were away, they would sometimes let travelers stay there. By the 1700s, the word started to be used for a public building that offered a bed and food for people who were traveling. Before this, most people stayed in simple "inns," but a hotel was seen as something more elegant and professional. Today, whether it is a small family-run building or a giant skyscraper in a big city, a hotel is a place of comfort and service. It is where we stay when we are on vacation or traveling for business. The name reminds us of the ancient tradition of "hospitality," which means opening your door to a stranger and making them feel at home. It is a word about comfort and safety.',dictionary:{welcoming:"misafirperver",hospitality:"konukseverlik",stranger:"yabancı",elegant:"şık/zarif",skyscraper:"gökdelen",safety:"güvenlik"}},{title:"57. Hammock",src:"Hammock male us.mp3",text:'The name of this modern-age luxury item comes from the 15th-century Spanish word hamacca. In fact, this word is not Spanish. When the Spanish sailors arrived in the area of Florida, they encountered a tribe called the Arawakan. Those people were expert fishermen. They would sleep on their worn-out fishnets which they would stretch between two trees or between two masts in their boats. They did not have a different name for their beds and they were calling them simply "amaka," which meant fishnet. The Spaniards misinterpreted it and introduced this bed to Europe as hamacca. Soon the Dutch sailors translated it to a more meaningful word in their language, and they called it hangmat, which translates as "hang mat." Although this item was known since the early ages, it did not have a specific name until the colonization of the Americas. Today, the hammock is a global word for a bed that swings in the air. It is the perfect invention for relaxing in the garden or on a ship. The name reminds us of the clever fishermen who turned their old nets into a comfortable place to sleep.',dictionary:{"worn-out":"eskimiş",fishnets:"balık ağları",stretch:"germek",masts:"direkler",misinterpreted:"yanlış anladı",swings:"sallanır",relaxing:"dinlendirici"}},{title:"58. Hypnosis",src:"Hypnosis female us.mp3",text:'The word hypnosis is a term that is used to define the state of being in a trance. Although this state has been known since 2600 BC by Chinese medicine men, this state was called hypnosis in the late 19th century by prominent psychologists. Hypnos means sleep in ancient Greek and it was synonymous with the mythological Greek god of sleep. On the other hand, the suffix "-osis" means condition, hence hypnosis means "sleep condition." Later, psychologists like Freud and Adler called this methodology psychoanalysis. However, the word was not abandoned and, nowadays, hypnosis is the state where people are half awake and half asleep and their subconscious is accessible. Doctors use it to help people stop bad habits or to reduce pain and stress. Even though a person is not truly asleep during the process, the name of the Greek god of sleep is still used to describe this very relaxed and focused state of mind. It is a word that connects ancient mythology with modern medical science. It helps us understand the power of the mind and how we can use it to feel better.',dictionary:{trance:"trans",prominent:"önde gelen",condition:"durum",subconscious:"bilinçaltı",accessible:"erişilebilir",relaxed:"gevşemiş",focused:"odaklanmış"}},{title:"59. Jacuzzi",src:"Jacuzzi male us.mp3",text:"The word jacuzzi today immediately evokes the image of a warm, bubbling bath, but its story begins with an Italian family whose real name was Iacuzzi. When the family emigrated from Italy to the United States in 1907, immigration officials at Ellis Island misspelled their surname as Jacuzzi. From that moment on, the family was known by this new name. The brothers first entered the aviation industry, designing wooden propellers during World War I. However, after one brother died in a plane accident, their father forbade them from flying. They shifted instead to manufacturing hydraulic water pumps. In 1943, a young member of the family named Ken was diagnosed with painful arthritis. To help him feel better, his father, Candido, invented a small, portable pump that could be placed into a regular bathtub to create therapeutic bubbling water. This was the first hydrotherapy pump! It worked so well that the family began selling the invention to others. Eventually, they built the pump directly into large tubs, and the name became a global symbol of luxury and health. It is a beautiful story of how a misspelled name became famous through a father’s desire to help his son.",dictionary:{evokes:"çağrıştırır",bubbling:"köpüren/fıkırdayan",emigrated:"göç etti",misspelled:"yanlış yazılmış",propellers:"pervaneler",therapeutic:"tedavi edici",luxury:"lüks"}},{title:"60. Jaguar",src:"Jaguar male us.mp3",text:'The word jaguar comes from a Native American language in South America called Tupi-Guarani. The original word was yaguara, which means "the beast that kills with one jump." This is a perfect and terrifying name for this beautiful spotted cat! The people who lived in the jungle saw that the jaguar was a very powerful hunter that did not run for a long time like a dog. Instead, it hid quietly in the trees and killed its prey instantly with a single, fast leap. They respected the cat as the king of the jungle. When the first European explorers arrived in the Americas, they heard this name and used it for the cat. In English, it became jaguar. Today, the jaguar is famous as the largest cat in the Americas and a symbol of power and speed. A famous car company even uses the name because it represents elegance and fast movement. Even though we see them in zoos today, the name still connects us to the deep, green jungles of the Amazon and the ancient respect that people had for this amazing animal that kills "with one jump." It is a word about nature’s power.',dictionary:{spotted:"benekli",hunter:"avcı",instantly:"anında",leap:"sıçrama",power:"güç",elegance:"zarafet"}},{title:"61. Jet Set",src:"Jet Set.mp3",text:'At the dawn of commercial jet flights, a new habit of the rich emerged. They would get on the jet airplane early in the morning and fly from New York to Paris for breakfast and from there to Naples for lunch and finally back to New York for dinner. Flying a jet airliner was very expensive and only the lucky few could afford such a luxury, and they were called the jet society, and later it was shortened to jet set. When flying jet airliners became affordable, the jet setters had found their new toys, namely the Concorde airplane that could fly from London to New York in less than 4 hours. Taking the Concorde was always a privilege for the wealthy ones until the day when those supersonic aircraft were removed from the airline system. Today, we still use the term jet set to describe people who are very rich and travel all over the world for fun and parties. It is a word that represents a life of fashion, speed, and expensive vacations. Even though more people can fly today, the "jet set" still refers to the most exclusive and glamorous group of travelers.',dictionary:{dawn:"başlangıç",emerged:"ortaya çıktı",affordable:"alınabilir/hesaplı",supersonic:"ses üstü",privilege:"ayrıcalık",exclusive:"seçkin",glamorous:"büyüleyici"}},{title:"62. Kangaroo",src:"Kangaroo female us.mp3",text:`There is a very famous story about the word kangaroo, but it is actually a myth! The story says that when Captain Cook arrived in Australia and asked a local person the name of the jumping animal, the person said "Kangaroo," which meant "I don't understand." This is not true! The word actually comes from a real name in the local Guugu Yimidhirr language. Their word was gangurru, which was the specific name for the large grey kangaroo. Captain Cook wrote the word down in his notebook in 1770, and it became the name used by the whole world. For a long time, people thought the myth was true, but scientists later visited the same area and found that the local people still used that same word! A kangaroo is a truly unique animal that is the symbol of Australia. They carry their babies in a pouch and move by hopping on their strong back legs. The name is a great example of how explorers learned from the indigenous people they met. It is a word that represents the unique wildlife of a distant continent and the true history of language and discovery.`,dictionary:{myth:"efsane",indigenous:"yerli",pouch:"kese",hopping:"zıplayan",unique:"eşsiz",discovery:"keşif"}},{title:"63. Karaoke",src:"Karaoke male us.mp3",text:'The word karaoke is a clever mix of two different languages in Japan. In the Japanese language, kara means "empty." The second part, oke, is a short version of the English word "orchestra." So, karaoke literally means "empty orchestra." It was given this name because the music is playing, but the lead singer is missing—the "orchestra" is empty until you pick up the microphone! The idea started in Japan in the 1970s when a musician realized that people loved to sing along to their favorite songs at parties. He created a machine that played only the music, allowing everyone to be a "star" for a few minutes. At first, it was only popular in small bars in Japan, but it quickly became a global phenomenon. Today, you can find karaoke boxes in almost every city in the world. It is a fun and social way for friends to enjoy music together, even if they are not professional singers. The name is a perfect description of how the music wait for you to fill the "empty" space with your own voice. It is a word about fun, music, and participation.',dictionary:{empty:"boş",missing:"eksik",phenomenon:"fenomen",participation:"katılım",boxes:"kabinler"}},{title:"64. Ketchup",src:"Ketchup male us.mp3",text:'You might be surprised to learn that ketchup has a very "fishy" history that began in China hundreds of years ago. The original word was kê-tsiap, and it was a salty sauce made from fermented fish and spices! European sailors discovered this tasty sauce in Southeast Asia in the seventeenth century and brought the idea back home. Because they did not have the same ingredients, English cooks started making their own versions using mushrooms, walnuts, or even oysters. For a long time, there were no tomatoes in the recipe at all! It was not until the early 1800s that American cooks finally added tomatoes to the mixture, creating the sweet and red sauce we know today. In 1876, Henry Heinz began selling his famous version in glass bottles, and it became a massive success all over the world. Today, ketchup is the most popular condiment for burgers and fries, and we almost never think about its fishy past. Its name is a delicious reminder of how a Chinese fish sauce traveled across the ocean and changed completely to become a global favorite in every kitchen and restaurant.',dictionary:{fermented:"mayalanmış",condiment:"sos/çeşni",spices:"baharatlar",ingredients:"malzemeler",success:"başarı",delicious:"lezzetli"}},{title:"65. Koala",src:"Koala female us.mp3",text:'The name koala comes from an Australian Aboriginal language, likely the Dharug language of the Sydney area. The original word was gula, which literally means "no drink" or "no water." The local people gave the animal this name because they observed that koalas almost never come down to the ground to drink from rivers or ponds. This is a very smart observation because koalas get 90% of the water they need from eating eucalyptus leaves! They only drink water if they are sick or if the weather is extremely hot. When European settlers arrived in Australia, they incorrectly called them "koala bears" because they looked like small, cuddly bears, but they are actually marsupials, like kangaroos. They have a pouch for their babies! Today, the koala is one of the most loved symbols of Australia. Its name is a reminder that the indigenous people of Australia had a very deep and accurate knowledge of their animals. Every time we say koala, we are using a word that describes the unique diet and lifestyle of this sleepy, leaf-eating creature that "does not drink." It is a word about nature’s clever survival tricks.',dictionary:{observed:"gözlemledi",eucalyptus:"okaliptüs",marsupials:"keseliler",accurate:"isabetli",sleepy:"uykulu",survival:"hayatta kalma"}},{title:"66. Limousine",src:"Limousine male us.mp3",text:'This luxury car has a very surprising history that began in a rural region of France called Limousin. The people who lived there were famous for wearing a special type of coat or "cloak" with a large hood to protect them from the rain and wind. This coat was called a "limousine." When the first luxury cars were built in the early 1900s, they had a very unusual design: the driver sat outside in the open air, while the wealthy passengers sat inside a covered area. The shape of the roof over the passengers looked exactly like the hood of the old French cloak! Because of this visual similarity, people started calling these cars limousines. Over time, the design changed, and the cars became longer and more expensive, used by movie stars and politicians. Today, we use the word for any very long, luxury car that has a partition between the driver and the passengers. It is amazing to think that the most expensive and modern car in the world is named after a simple hooded coat worn by French farmers hundreds of years ago! It is a story of how fashion can influence the names of technology.',dictionary:{cloak:"pelerin",unusual:"olağandışı",similarity:"benzerlik",partition:"bölme",luxury:"lüks",influence:"etkilemek"}},{title:"67. Lotto",src:"Lotto female us.mp3",text:'The word lotto comes from the Italian word lotto, which means "a lot," "a share," or "fate." It is derived from an old Germanic word that refers to how people divided land or goods by choosing a hidden object. The game of lotto as we know it today began in Italy in the 1500s. The city of Genoa used a system of choosing names to select their political leaders, and people started betting money on which names would be picked. This became so popular that it turned into a national game to raise money for the government. The word traveled to France as lotterie and then into English as "lottery." Today, millions of people play the lotto every week, hoping that their "fate" will be lucky and they will win a giant prize. Whether it is for a small game or a national jackpot, the name reminds us of the ancient human desire to trust in luck and chance. It is a word about hope, risk, and the excitement of waiting to see which number will be "your lot." The name has stayed the same for five hundred years.',dictionary:{fate:"kader",divided:"bölünmüş",hidden:"gizli",jackpot:"büyük ikramiye",risk:"risk",excitement:"heyecan"}},{title:"68. Lynch",src:"Lynch male us.mp3",text:'The word lynch has a very dark and violent history that comes from the American Revolutionary War. It is named after a man named William Lynch, who was a local judge in the state of Virginia in the late 1700s. During this time of chaos, Lynch and his neighbors formed a group to catch people they believed were criminals or spies who supported Britain. Instead of giving them a fair trial in a real court, they staged public gatherings where they judged the person themselves and punished them immediately. Many were executed by hanging, while others suffered whippings before cheering crowds. His methods became very famous, and the term "Lynch Law" spread as a description of mob justice without legal authority. The French, who were allies during the war, also borrowed the term and helped spread it to other places. Today, the word is a dark reminder of why we have courts and laws to protect everyone’s rights. It represents a scary part of history where people used violence to control others. It is a story of how a person’s name can stay in history for a very negative and painful reason.',dictionary:{violent:"şiddetli",chaos:"kargaşa",gatherings:"toplantılar",whippings:"kırbaçlamalar",suffered:"acı çekti",justice:"adalet"}},{title:"69. Mafia",src:"Mafia female us.mp3",text:`The word Mafia is known to be of Italian origin. However, it derives from old Sicilian. Among numerous theories for the origin of the word Mafia, one stands out as more credible. In 1282, when the French invaded the island of Sicily, they would torment the local people; consequently, resistance against the French was rooted in the island. One day, a group of French soldiers defiled and killed a Sicilian girl and left her body in the city square. Her mother was holding her daughter's dead body and crying in her local dialect "Ma Fia" which would be "Mia Figlia" in standard Italian and it means "My daughter." Her cry mobilized the Sicilians to fight and liberate their homeland from the French invaders. They were yelling "Morte Alla Francia Italia Anela!" or shortly MAFIA, which translates "Death to the French is Italy’s Cry!" and paying tribute to the woman who cried over her daughter's dead and defiled body. Today, the word is used for organized crime families all over the world. It is a word that represents a secret and dangerous power, but its name started with a mother's sadness and a people's rebellion.`,dictionary:{torment:"eziyet etmek",resistance:"direniş",liberate:"özgürleştirmek",invaders:"istilacılar",defiled:"kirletilmiş",rebellion:"isyan"}},{title:"70. Massage",src:"Massage female us.mp3",text:'The word massage has a very "touching" history that connects France, Greece, and the Middle East. Most historians believe the word comes from the French word masser, which means "to rub" or "to handle." However, the French word was likely inspired by the Arabic word massa, which means "to touch" or "to feel with the hand." For thousands of years, people in ancient Egypt, Greece, and India have used the power of touch to heal the body and relax the mind. In the early 1800s, "massage parlors" became popular in Europe as places for health and therapy. A massage helps to fix tired muscles, improve blood flow, and reduce stress by using different pressures on the skin. Today, it is a very common part of health and beauty all over the world, found in luxury spas and sports clinics. Even though the word has traveled through many languages, its core meaning has never changed: it is the simple and natural art of using our hands to help another person feel better and stay healthy. It is a word that represents the basic human need for care and physical healing through touch.',dictionary:{rub:"ovmak",heal:"iyileştirmek",relax:"rahatlatmak",muscles:"kaslar",pressure:"baskı",natural:"doğal"}},{title:"71. Mayonnaise",src:"Mayonnaise female us.mp3",text:'The history of mayonnaise is a delicious story of war and a chef’s creativity. Most historians believe the word comes from the city of Mahon on the Spanish island of Menorca. In 1756, a French army led by the Duke of Richelieu captured the city after a big battle. To celebrate the victory, the Duke’s chef wanted to make a special sauce using cream and eggs. However, he realized he had no cream in the kitchen! He decided to use olive oil instead, creating a smooth and thick white sauce that the Duke loved. He called it mahonnaise in honor of the city they had just won. The word eventually changed to mayonnaise and became a massive success in France and then the rest of the world. Another story says the name comes from an old French word for "egg yolk." Today, it is one of the most popular condiments for sandwiches, salads, and fries. Whether it started with a battle in Spain or a simple egg yolk, the name is a creamy reminder of how a kitchen mistake can turn into a global favorite that everyone loves to eat.',dictionary:{captured:"ele geçirdi",victory:"zafer",smooth:"pürüzsüz",thick:"koyu/kıvamlı",condiments:"soslar",creamy:"kremamsı"}},{title:"72. Menu",src:"Menu male us.mp3",text:'In the French language, menu means "small," "thin," or "detailed." It comes from the Latin word minutus, which also gave us the word "minute." In the beginning, a menu was not a list of prices in a restaurant. Instead, it was a very "detailed" list written by a chef to describe all the different courses he was preparing for a grand royal dinner. Because these dinners had many small, complex dishes, the king and his guests needed a list to know what was coming next. It was a "small list of big food!" In the 1800s, as restaurants became popular in Paris, they started using these lists so that customers could choose their own meals. The word quickly spread to England and the rest of the world. Today, whether we are reading a paper list in a cafe or looking at a digital list on a tablet, we still call it a menu. The name reminds us that the best meals are made of many "small" and "detailed" parts. It is a word that helps us organize our appetite and choose our favorite food from the kitchen’s art.',dictionary:{detailed:"ayrıntılı",courses:"öğünler/yemekler",complex:"karmaşık",appetite:"iştah",spread:"yayılmak",customers:"müşteriler"}},{title:"73. Ninja",src:"Ninja male us.mp3",text:'In the Japanese language, the word ninja is made of two parts: nin, which means "to endure" or "to be hidden," and ja, which means "a person." So, a ninja is literally "a person who endures" or "a person of secrecy." These were special soldiers in old Japan who were experts in the art of ninjutsu. Unlike the samurai, who fought in open battles with honor, the ninja worked in the shadows. They were experts at climbing walls, wearing disguises, and moving silently through the night to collect information or attack their enemies by surprise. They were the "secret agents" of the medieval world! For a long time, their history was a secret, but in the 20th century, they became famous through movies, cartoons, and video games. Today, the word ninja is used to describe anyone who is very fast, quiet, or highly skilled at a difficult task. Even though they are often shown as wearing black masks in movies, the real name is about the mental strength to "endure" and the skill to stay "hidden." It is a word about mystery, discipline, and the power of the shadows.',dictionary:{endure:"katlanmak/dayanmak",secrecy:"gizlilik",honor:"onur",shadows:"gölgeler",disguises:"kılık değiştirmeler",silently:"sessizce",skilled:"yetenekli"}},{title:"74. Pajamas",src:"Pajamas male us.mp3",text:'These comfortable sleeping clothes were introduced to the western world by British merchants who returned from India in the 18th century. After the Battle of Plassey, the English started the East India Company in India. They saw that the local people were wearing comfortable clothes when they went to bed. The locals called them pajamas (pajamas in American English). Originally, this word was borrowed from the Persian words pay, which means the leg, and jama, which means clothing, hence pajamas. Due to the comfort in the bed, pajamas were welcomed in Europe and later all around the world. In the past, Europeans used to wear long nightshirts to bed, but they found the Indian "leg clothing" much more practical and warm. Today, almost everyone in the world wears a version of these clothes to relax at home or to sleep at night. Every time you put them on, the name reminds you of those loose, comfortable pants from the warm lands of India and Persia. It is a wonderful story of how a simple piece of clothing from one culture became a global standard for comfort.',dictionary:{merchants:"tüccarlar",comfortable:"rahat",practical:"pratik",welcomed:"benimsendi",loose:"bol",relax:"dinlenmek"}},{title:"75. Panda",src:"Panda male us.mp3",text:'The word panda has a very interesting history that likely began in the mountains of Nepal. Most historians believe the name comes from the Nepali word ponya, which means "the bamboo eater" or "the plant-eating animal." This is a perfect name because these beautiful bears spend almost 12 hours every day eating nothing but bamboo! When European scientists first saw these animals in the 1800s, they actually gave the name to the "Red Panda" first. Later, when they discovered the much larger black-and-white animal we know today, they called it the "Giant Panda." Because of its unique colors and friendly appearance, the panda became a global symbol of nature conservation and peace. In China, they have a different name: da xiong mao, which means "giant bear-cat." However, the rest of the world uses the name from Nepal. Today, the panda is one of the most loved animals in the world. Its name is a simple and honest description of its favorite food. Every time we say panda, we are using a word that reminds us of the high, snowy mountains where these "bamboo eaters" live their quiet lives.',dictionary:{conservation:"koruma",friendly:"sevimli/dost canlısı",unique:"eşsiz",appearance:"görünüm",snowy:"karlı",discovered:"keşfetti"}},{title:"76. Pandemic",src:"Pandemic female us.mp3",text:'The word pandemic has a very logical origin that comes from the ancient Greek language. It is made of two parts: pan, which means "all," and demos, which means "the people." So, a pandemic is literally something that affects "all the people." In the beginning, the word was used to describe anything that was common to everyone, like a law or a social custom. However, doctors started using the word to describe a sickness or a virus that spreads very quickly across many different countries or even the whole world at the same time. Unlike an "epidemic," which is a sickness in only one city or country, a pandemic has no borders. Throughout history, there have been several major pandemics, such as the Spanish Flu or the Black Death. Recently, the whole world experienced the COVID-19 pandemic, which changed how we live and work. The word reminds us that we are all connected to each other, no matter where we live. It is a word that represents a global challenge but also the global effort of "all the people" working together to stay healthy and find a cure for a shared problem.',dictionary:{affects:"etkiler",sickness:"hastalık",spreads:"yayılır",borders:"sınırlar",experienced:"tecrübe etti",challenge:"zorluk",cure:"tedavi/şifa"}},{title:"77. Panic",src:"Panic female us.mp3",text:'The word panic has a very scary history that comes from ancient Greek mythology. It is named after Pan, who was the Greek god of nature, forests, and shepherds. According to the myths, Pan was a strange-looking god with the legs of a goat and the body of a man. He loved to hide in the deep, dark woods and suddenly jump out or make a terrifying scream to scare people who were traveling alone. This would cause a "sudden and irrational fear" that made people and animals run away in terror without knowing why! The Greeks called this feeling panic, which basically means "the fear caused by Pan." In ancient times, when a whole army suddenly ran away in fear for no reason, they believed the god Pan was present. Today, we use the word to describe that fast, overwhelming feeling of fear or worry that we get during an emergency or a stressful situation. Even though we no longer believe in goat-legged gods hiding in the forest, the name still connects our modern feelings of fear to the ancient stories of the wild and unpredictable power of nature.',dictionary:{mythology:"mitoloji",shepherds:"çobanlar",terrifying:"korkutucu",scream:"çığlık",irrational:"mantıksız",overwhelming:"ezici/yoğun",unpredictable:"öngörülemez"}},{title:"78. Parachute",src:"Parachute male us.mp3",text:'The word parachute is a clever mix of two different languages that describes exactly what the invention does. The first part, para, comes from the Italian word parare, which means "to protect" or "to stop." The second part, chute, is the French word for "a fall." So, a parachute is literally a tool that "stops the fall." The name was first created by a French inventor named Louis-Sébastien Lenormand in 1783. He wanted to find a way for people to jump safely from a burning building or a high tower. He even tested his idea by jumping from a tree using two umbrellas! Later, as hot-air balloons and airplanes were invented, the parachute became a vital piece of safety equipment. Today, it is used by soldiers, pilots, and people who love the extreme sport of skydiving. It works by creating "drag" or air resistance to slow down the speed of a person falling through the sky. The name is a perfect and simple description of its job. Every time we see one opening in the sky, we are seeing a "fall-stopper" in action, continuing a design that started with a simple French idea for protection.',dictionary:{protect:"korumak",drag:"hava direnci",resistance:"direnç",falling:"düşen",safety:"güvenlik",equipment:"ekipman"}},{title:"79. Penguin",src:"Penguin male us.mp3",text:`The name penguin has a very mysterious history that likely comes from the Welsh language. Many historians believe it comes from the Welsh words pen, which means "head," and gwyn, which means "white." So, a penguin is a "white head." This is a bit strange because modern penguins have black heads! The reason is that travelers first used this name for a different bird called the "Great Auk," which lived in the North Atlantic and had a large white spot on its head. When sailors traveled to the South Pole and saw the black-and-white birds we know today, they thought they looked very similar and used the same name. Eventually, the Great Auk became extinct, and the name stayed with the birds of the Southern Ocean. Today, the penguin is one of the most popular animals in the world, known for its funny walk and its ability to survive in the freezing cold. Even though they don't have white heads, they kept their Welsh name across the centuries. It is a story of how explorers can get a bit confused and how names can move from one bird to another across the globe.`,dictionary:{mysterious:"gizemli",similar:"benzer",extinct:"soyu tükenmiş",survive:"hayatta kalmak",freezing:"dondurucu",confused:"kafası karışmış"}},{title:"80. Petrol",src:"Petrol female us.mp3",text:'As we learned with the word "Petroleum," the name petrol comes from two Latin words: petra, which means "rock," and oleum, which means "oil." Together, they mean "rock oil." The word was first used in the 1800s as a brand name for a specific type of fuel sold in England. For a long time, the company that owned the name tried to stop other people from using it! However, it became so popular that it eventually became the common word for the fuel we put in our cars. In American English, people use the word "gasoline," but in most other English-speaking countries, everyone says petrol. It is a very important liquid because it provides the energy for millions of vehicles to move every day. However, it is also a limited resource that we must use carefully. Today, as we start to use electric cars, the era of "rock oil" might slowly be coming to an end. The name is a simple reminder of where our energy comes from: deep inside the rocks of the Earth. It is a word about power, transportation, and the history of modern industry over the last century.',dictionary:{fuel:"yakıt",common:"yaygın",vehicles:"araçlar",limited:"sınırlı",resource:"kaynak",industry:"sanayi"}},{title:"81. Picnic",src:"Picnic female us.mp3",text:'The word picnic has a very social history that began in France in the 17th century. It comes from the French word pique-nique. The first part, piquer, means "to pick" or "to peck," and the second part, nique, means "a small thing" or "something of little value." Originally, a picnic was not an outdoor meal in a park. Instead, it was a social party where everyone "picked" a small dish or some wine to bring and share with the group. It was a "potluck" dinner where everyone contributed something small to make a big feast! After the French Revolution, public parks were opened for the first time, and people started taking their shared meals outside to enjoy the nature and the sunshine. The word traveled to England, and the picnic became a favorite activity for families and friends. Today, a picnic is a symbol of a relaxing day in the countryside with a basket of food and a blanket on the grass. The name still reminds us of the joy of sharing "small things" with the people we love. It is a word about community, nature, and the simple pleasure of eating together.',dictionary:{contributed:"katkıda bulundu",feast:"ziyafet",shared:"paylaşılan",countryside:"kırsal",pleasure:"keyif/zevk",relaxing:"dinlendirici"}},{title:"82. Piranha",src:"Piranha male us.mp3",text:'The name of this scary fish comes from the Tupi language of the indigenous people in the Amazon rainforest of Brazil. In their language, pira means "fish" and anha means "tooth." So, a piranha is literally a "tooth-fish." This is a very honest and accurate name! The local people saw that these fish were not very large, but they had incredibly sharp, triangle-shaped teeth and very strong jaws. They are famous for their ability to eat a large animal very quickly if they work together in a group. In many movies, piranhas are shown as monsters that eat everything in seconds, but in reality, they are usually quite shy unless they are very hungry. The local people even used the sharp teeth of the fish as tools for cutting and sewing! When explorers first visited the Amazon, they heard this name and were very impressed by the power of the small fish. Today, the word is used all over the world. It is a name that represents the danger and the mystery of the jungle rivers. Every time we hear it, we think of the small but powerful "fish with teeth" from the deep Amazon.',dictionary:{accurate:"doğru",sharp:"keskin",jaws:"çeneler",shy:"çekingen",sewing:"dikiş dikme",danger:"tehlike"}},{title:"83. Pizza",src:"Pizza male us.mp3",text:'The word pizza has a very humble history that began in the city of Naples, Italy. Most historians believe the word comes from the Latin word pinsa, which means "flatbread." For hundreds of years, pizza was simply a cheap and easy food for poor workers who needed a quick meal. It was just flat dough with some oil and herbs on top! However, the history changed in the eighteenth century when people in Naples started adding tomatoes, which had just arrived from the Americas. According to a famous story, in 1889, a baker made a special pizza with mozzarella cheese and green basil to represent the colors of the Italian flag for Queen Margherita. This "Margherita" style became a massive success! When Italian immigrants moved to America, they brought the recipe with them, and the dish became a global phenomenon. Today, pizza is the most recognized food word in the world, found in almost every city on every continent. Even though it started as a simple bread for poor people, its name is now a delicious symbol of Italian culture and international culinary success for everyone to enjoy.',dictionary:{humble:"mütevazı",flatbread:"yassı ekmek",dough:"hamur",immigrants:"göçmenler",phenomenon:"olgu",culinary:"mutfakla ilgili"}},{title:"84. Police",src:"Police female us.mp3",text:'The word police has a very civic history that goes back to the heart of ancient Greece. It comes from the Greek word polis, which means "a city." Originally, the word politeia meant "the administration of a city" or "how a city is organized." In the past, this included everything from cleaning the streets to managing health and public safety. For many centuries, the word was used for any public official who worked for the government of a city. However, in the early 1800s, the meaning narrowed to describe the specific people whose job was to maintain law, order, and safety. In 1829, Sir Robert Peel created the first modern, organized force of officers in London, and they were called the "metropolitan police." Today, every country has a force of officers who prevent crime, protect citizens, and investigate offenses. The name is a great reminder that the core job of these officers is to serve and protect the "city" and its people. It is a word that has moved from the general idea of government to the specific force that helps keep our modern societies safe.',dictionary:{civic:"kentsel",administration:"yönetim",maintain:"korumak",citizens:"vatandaşlar",investigate:"soruşturmak",offenses:"suçlar"}},{title:"85. Pornography",src:"Pornography male us.mp3",text:'When people hear the word pornography, some obscene matters come to mind. This word has a neutral meaning though. It was borrowed from the French in the 19th century, but it is derived from ancient Greek. Porno meant prostitute and graph meant writing. Consequently, pornography meant writings about prostitutes and their qualities in brothels. In other words, it was a leaflet about legitimate business and it was welcomed by the public without any offense. In the 18th century, literature started to involve erotic themes. Upon this, lewd pieces of literature with adult content started to be called pornography. Later, all adult content started to be labeled as pornography by the French and it still continues likewise. Today, the word is a major part of the legal and social world, but its name still carries that original Greek meaning of "recording" a specific part of human life. It is a word that has moved from the technical records of ancient times to a massive modern industry, showing how social attitudes and language can change over many thousands of years.',dictionary:{neutral:"tarafsız",brothels:"genelevler",qualities:"nitelikler",leaflet:"broşür",legitimate:"yasal/meşru",erotic:"erotik"}},{title:"86. Potato",src:"Potato male us.mp3",text:'The potato has a very successful history that began high in the Andes mountains of South America. The local people there called the plant papa. When Spanish explorers first saw the vegetable in the 16th century, they were a bit confused. They mixed the word papa with the word batata, which was the name for the "sweet potato" found on the Caribbean islands. They created the new word patata, which eventually became potato in English. For a long time, many people in Europe were afraid to eat them because they grow in the dirt and look a bit strange. Some people even thought they were poisonous! However, they eventually realized that potatoes are very healthy and easy to grow almost anywhere. They became the most important food for millions of people, especially in Ireland and Germany. Today, whether they are fried, mashed, or baked, potatoes are a favorite food in every country. From American french fries to Turkish kumpir, the potato is a global hero of the kitchen. Its name is a reminder of how explorers can mix up words but still bring a wonderful new gift to the world.',dictionary:{confused:"şaşırmış",poisonous:"zehirli",healthy:"sağlıklı",staple:"temel gıda",fried:"kızarmış",mashed:"püre yapılmış"}},{title:"87. Quarantine",src:"Quarantine male us.mp3",text:'The word quarantine has a very precise history that comes from the Italian city of Venice during the Middle Ages. In the fourteenth century, the "Black Death" was a terrifying disease that was killing millions of people in Europe. To protect their city, the leaders of Venice ordered that any ship arriving from a foreign place must anchor offshore and wait for forty days before the sailors or the goods could touch the land. In Italian, forty is quaranta, and this forty-day waiting period was called a quarantina. Doctors believed that forty days was enough time to see if the sailors were healthy or if they would die from the plague. If they were still alive after forty days, they were safe to enter the city! Today, a quarantine can be for any amount of time—it could be two days or two weeks—but the name still reminds us of those "forty days" in old Italy. It is a word that represents the difficult but necessary measures we take to stop the spread of infection and protect the health of everyone in our modern global community.',dictionary:{precise:"kesin",plague:"veba",anchor:"demir atmak",offshore:"açıkta/kıyıdan uzakta",measures:"önlemler",infection:"enfeksiyon"}},{title:"88. Raccoon",src:"Raccoon female us.mp3",text:'The word raccoon has a very descriptive history that comes from the Powhatan language of the Native Americans in Virginia. The original word was aroughcoune, which literally means "he who scratches with his hands." This is a perfect name because raccoons have very sensitive paws that look almost like small human hands. They are famous for "washing" their food in water before they eat it. In reality, they are not trying to get the food clean; they are actually "scratching" and feeling the food with their hands to learn more about it. The water makes their paws even more sensitive! When the first English settlers arrived in America in the 1600s, they had never seen an animal like this before. They tried to say the Powhatan word, and it eventually became raccoon. Today, these "masked" animals are known for being very clever and sometimes a bit of a problem in big cities where they open trash cans with their "hands." The name is a great example of how the first people in America gave animals names based on their unique behavior. It is a word about observation.',dictionary:{descriptive:"betimleyici",sensitive:"duyarlı/hassas",paws:"patiler",scratching:"tırmalama",settlers:"yerleşimciler",clever:"akıllı/kurnaz"}},{title:"89. Restaurant",src:"Restaurant male us.mp3",text:'In 1765, a soup vendor whose name was Antoine Boulanger opened his shop where he sold soups on the way to the Louvre. He had a motto written in Latin which translates as "Those who have problems with their stomachs come here and I will restore you with my soups." The customers who dined in his shop started to advertise his delicious soups. Later, his nickname became "restaurant" which means, in French, the one who restores. This was the era when the Bourgeoisie did not want to cook at home and looked for places where they could dine with their guests. Hence, places popped up imitating Antoine Boulanger’s shop and they were hosting the Bourgeoisie. Later, this term became a business where people are served cooked food and from France, the term restaurant traveled first to Germany and eventually to the whole world. Today, the word is used in every country for any place where you can sit down and pay for a meal. It is a great story of how a single soup vendor’s promise to "restore" health gave a name to a massive global industry.',dictionary:{vendor:"satıcı",restore:"onarmak/canlandırmak",stomachs:"mideler",advertise:"tanıtmak",imitating:"taklit eden",industry:"sektör"}},{title:"90. Robot",src:"Robot male us.mp3",text:'When people picture in their brain a robot, a man-made machine that looks like a human being comes to mind. The word robot has its origins in ancient Slavic texts. In these texts, it is robota and it means forced labor, in other words, a tenant who pays his rent through his service or his labor instead of money. In 1920, Karel Čapek, a brilliant Czech playwright, wrote a play called Rossum’s Universal Robots which involved humanlike machines. This play became a hit and soon science fiction fans acknowledged the term robot from this play. In time, all the novelists and filmmakers enjoyed using this word for the humanlike machines in their works. As a result, this word has become a benchmark for humanlike machines. Today, robots are used in factories, in space exploration, and even in our homes to clean floors. It is amazing to think that the most high-tech word in our language actually comes from an old Slavic word for "hard work." The name reminds us of the long-standing human dream of creating machines that can work just like us to help our daily lives.',dictionary:{forced:"zorla yapılan",labor:"emek/iş gücü",playwright:"oyun yazarı",benchmark:"ölçüt",exploration:"keşif",humanlike:"insansı"}},{title:"91. Rocket",src:"Rocket female us.mp3",text:'The word rocket has a very surprising history that begins in Italy with a simple tool for spinning wool. In Italian, a rocchetto was a small, wooden spindle or "bobbin" used to hold thread. Because of its long, thin shape, people began using the same name for the small firework tubes that children played with during festivals. These early fireworks looked just like the wooden spindles used by weavers. When scientists later started building much larger machines to fly into the sky and eventually reach space, they kept using this old Italian name. In English, it became rocket. Even though a modern space vehicle is a massive piece of high-tech engineering made of metal and fuel, its name still connects back to the humble wooden tools used by Italian grandmothers hundreds of years ago to spin their yarn. It is a wonderful example of how a very old and simple word can travel through time to describe the most advanced technology in human history. Whether it is a small firework in a park or a giant ship going to the moon, every rocket carries a name from a simple wooden thread holder.',dictionary:{spindle:"iğ/kirmen",bobbin:"masura",firework:"havai fişek",weavers:"dokumacılar",engineering:"mühendislik",advanced:"ileri"}},{title:"92. Roulette",src:"Roulette male us.mp3",text:'The word roulette is a French word that literally means "a little wheel." It is derived from the Latin word rota, which means "a wheel." The history of the game began in the seventeenth century with the brilliant French scientist and mathematician Blaise Pascal. He was not trying to create a gambling game; instead, he was fascinated by physics and was trying to invent a "perpetual motion machine" that would never stop spinning! Even though his machine failed for science, gamblers quickly saw that the spinning wheel was perfect for a game of chance. By the early 1700s, people in Paris started using the wheel in gambling houses, and it became a massive success. In the nineteenth century, the game was refined in the luxury casinos of Monte Carlo and spread to every corner of the world. Today, roulette is the most famous game in any casino, and its name is used globally. It is a story of how a scientist’s failed experiment turned into a world-famous game of luck. Every time the ball spins around the "little wheel," it carries a name that was born from the world of French mathematics.',dictionary:{perpetual:"sürekli/daimi",gamblers:"kumarbazlar",refined:"geliştirilmiş",experiment:"deney",spinning:"dönen"}},{title:"93. Sabotage",src:"Sabotage female us.mp3",text:'There is a widespread belief that in France, during the early years of industrialization, workers threw their sabots (wooden clogs) into machines to break them. Although the word stems from a conflict in textile factories, it has nothing to do with throwing shoes. At that time, textile workers were well-paid and could afford leather shoes. When they went on strike for higher wages, the bosses hired poor peasants from rural areas who wore sabots. The urban workers hated these new workers and called them "The Sabots" to humiliate them. These peasants were novice workers and made many mistakes with the delicate machinery, costing the bosses a lot of money. The urban workers realized they could get what they wanted if they worked like "The Sabots"—on purpose! Later, this became the French verb saboteur, which meant to prevent something from functioning willfully, and it was borrowed into English as "to sabotage." Today, we use it for any act of intentional destruction or interference to stop a project or hurt a company. It is a word about protest and the intentional failure of a system to win a fight.',dictionary:{widespread:"yaygın",conflict:"çatışma",clogs:"takunyalar",peasants:"köylüler",humiliate:"aşağılamak",novice:"acemi",intentional:"kasıtlı"}},{title:"94. Samurai",src:"Samurai male us.mp3",text:`The word samurai is famous all over the world today, but its original meaning was very humble. It comes from the old Japanese verb saburau, which means "to serve" or "to stand by the side of someone." Originally, these people were not just warriors; they were servants who protected the high-ranking nobles of Japan. Over hundreds of years, their role changed, and they became a powerful military class with a very strict code of honor called Bushido. However, even when they became the leaders of the country, their name still reminded everyone that their main job was to "serve" their masters and their people. They were experts in using the sword and the bow, but they also studied poetry, art, and philosophy. To be a samurai meant to be a person of great discipline and loyalty. Today, when we see movies about these brave fighters, we should remember that the word doesn't just mean "soldier." It represents the idea of a person who is dedicated to a life of service and duty. This deep connection between strength and service is what makes the history of the samurai so interesting for people to learn.`,dictionary:{humble:"mütevazı",warriors:"savaşçılar",servants:"hizmetkarlar",discipline:"disiplin",loyalty:"sadakat",dedicated:"adanmış"}},{title:"95. Sandalette",src:"Sandalette female us.mp3",text:'A sandalette is a stylish and elegant type of sandal, and its name reflects a long history of fashion and language. The word sandal is thousands of years old and comes from the Greek word sandalon, which described a simple flat shoe with straps. For most of history, sandals were the most practical footwear for hot climates like Egypt, Rome, and Greece. In the twentieth century, as the fashion industry grew, designers in France started creating more delicate and feminine versions of these shoes for women to wear at parties or on vacation. They added the French ending "-ette," which means "small" or "refined," to create the word sandalette. So, the name literally means a "pretty little sandal." Today, we use the word for sandals that are made of fine materials and are more about beauty than just walking in the dirt. It is a perfect example of how a very old and simple word for a basic shoe can be updated with a French touch to become a modern word for style and luxury. The name reminds us that even our simplest items of clothing have a long history of design and cultural change over many centuries.',dictionary:{stylish:"şık",elegant:"zarif",footwear:"ayakkabı",delicate:"narin",refined:"zarif/inceltilmiş",materials:"malzemeler"}},{title:"96. Sandwich",src:"Sandwich male us.mp3",text:`The word sandwich comes from a real person named John Montagu, who was the 4th Earl of Sandwich in England during the eighteenth century. Lord Sandwich was a very busy man who loved playing cards and gambling for many hours without stopping. According to the legend, he was once in the middle of a very long and exciting game and did not want to leave the table to eat a proper dinner with a knife and fork. He asked his servant to bring him some slices of salt beef placed between two pieces of toasted bread. This clever idea allowed him to eat with one hand while keeping his fingers clean, so he could continue playing his cards with the other hand! Other men at the club saw what he was doing and started ordering "the same as Sandwich." Eventually, people just called it a sandwich. While people had probably eaten bread and meat together before, Lord Sandwich made it fashionable and famous all over the world. Today, it is the most popular and convenient food for lunch, all because a nobleman didn't want to stop playing his favorite game for a meal.`,dictionary:{proper:"düzgün/uygun",toasted:"kızarmış",fashionable:"moda",convenient:"pratik",nobleman:"soylu"}},{title:"97. Sauna",src:"Sauna female us.mp3",text:"The word sauna is the only Finnish word that is commonly used in daily English. In the Finnish language, sauna simply refers to a traditional hot-air bath or the small wooden building where this activity happens. For the people of Finland, the sauna has been a sacred place for thousands of years. In the past, it was not just a place to get clean; it was also used for cooking, making medicine, and even giving birth to babies because it was the cleanest room in the house. The heat is created by throwing water onto hot stones to create steam. Finnish people believe that the sauna helps to clean both the body and the mind. When Finnish people moved to other countries, they took this tradition with them, and the word spread across the globe. Today, you can find a sauna in almost every gym or hotel in the world, but for the Finns, it remains a very important part of their national identity and daily life. It is a place for quiet thinking, relaxation, and health that has stayed the same for a very long time.",dictionary:{sacred:"kutsal",steam:"buhar",identity:"kimlik",relaxation:"rahatlama",tradition:"gelenek"}},{title:"98. Shampoo",src:"Shampoo male us.mp3",text:'The word shampoo has a very interesting journey from India to the rest of the world. It comes from the Hindi word chāmpo, which means "to press" or "to massage." In the 18th century, "shampooing" was a type of head massage with oils used by people in India during their daily baths. When British travelers visited India, they loved this relaxing practice and brought the idea back to Europe. At first, a shampoo was still a professional head massage that you would receive at a special bathhouse. However, over time, the meaning changed. Instead of the massage itself, the word started to describe the special liquid soap used to wash the hair. By the early 20th century, companies began selling bottles of this soap in shops, and everyone started using the word as we do today. So, every time you wash your hair in the shower, you are using a word that originally described a relaxing Indian head massage. It is a great example of how a word for a physical action can turn into a word for a product that we use in our everyday lives.',dictionary:{relaxing:"rahatlatıcı",bathhouse:"hamam",physical:"fiziksel",product:"ürün",practice:"uygulama"}},{title:"99. Spa",src:"Spa female us.mp3",text:'The word spa is named after a real town in Belgium called Spa. Since the time of the ancient Romans, this town has been famous for its natural cold springs that produce water filled with minerals. People believed that drinking this water or bathing in it could cure many different sicknesses and make the body feel young again. In the 16th and 17th centuries, many wealthy people from all over Europe traveled to the town of Spa to "take the waters" for their health. Because the town became so famous for its healing water, the name started to be used for any place that had a natural spring or offered health treatments with water. There is a common myth that SPA is an abbreviation for the Latin phrase Salus Per Aquam, which means "health through water." However, this is not true; the word definitely comes from the name of the Belgian town. Today, a spa is a place where people go to relax, get a massage, or enjoy a hot bath, carrying on the very old tradition of using water to feel better.',dictionary:{natural:"doğal",springs:"kaplıcalar",cure:"iyileştirmek",abbreviation:"kısaltma",treatments:"tedaviler",healing:"şifalı"}},{title:"100. Sponsor",src:"Sponsor female us.mp3",text:'The word sponsor comes from the Latin word spondere, which means "to promise" or "to give your word." In ancient Rome, a sponsor was a person who made a formal promise to take responsibility for another person. For example, if someone wanted to borrow money or start a new job, a sponsor would stand next to them and tell the community, "I promise that this person is honest." If there was a problem, the sponsor would have to pay the debt or face the consequences. Over time, the word moved into the church, where "godparents" were called sponsors because they promised to help a child grow up. Later, the meaning changed again. In the modern world, a sponsor is usually a company that pays money to support a sports team, a television show, or an event. They "promise" their support in exchange for showing their name to the public. Even though the context has changed from ancient Roman law to modern advertising, the core idea is still the same: a sponsor is someone who gives their support and stands behind something to help it succeed.',dictionary:{formal:"resmi",responsibility:"sorumluluk",consequences:"sonuçlar",advertising:"reklamcılık",support:"desteklemek",succeed:"başarılı olmak"}},{title:"101. Sushi",src:"Sushi female us.mp3",text:'Many people think that sushi means "raw fish," but this is actually a mistake! The word sushi refers to the special rice that is seasoned with vinegar, sugar, and salt. In the Japanese language, the word comes from an old term meaning "sour-tasting." Thousands of years ago in Southeast Asia, people preserved fish by wrapping it in fermented rice. The rice created a sour acid that kept the fish fresh for a long time. Originally, people threw the rice away and only ate the fish. Later, in Japan, people started to eat the rice and the fish together while they were still fresh. This evolved into the beautiful and delicious art form we see today. So, the "sour" part of the history is actually the most important part of the name! Whether the dish has raw fish, cooked egg, or vegetables, it is only called sushi if it uses that specific vinegared rice. It is a fascinating story of how an ancient way to keep food from going bad turned into one of the most famous and healthy cuisines in the modern world.',dictionary:{preserved:"saklanmış/korunmuş",fermented:"mayalanmış",acid:"asit",vinegared:"sirkeli",cuisines:"mutfaklar",delicious:"lezzetli"}},{title:"102. Taboo",src:"Taboo male us.mp3",text:'The word taboo comes from the Pacific Islands, specifically from the Tongan word tapu. It was first brought to the Western world by the famous explorer Captain James Cook in the 18th century. In the culture of the Pacific Islands, something that was tapu was considered "sacred" or "forbidden" because it was connected to spirits or gods. It could be a specific place that people were not allowed to walk on, or a type of food that only leaders could eat. If someone broke a taboo, people believed that something very bad would happen to the community. When the word entered English, it began to describe any social rule or behavior that people find shocking or "forbidden" to talk about. For example, in many cultures, it is a taboo to ask someone how much money they earn. The word reminds us that every society has its own secret rules about what is "clean" and "unclean" or "right" and "wrong." It is a powerful word that helps us understand the invisible boundaries that exist in human culture and how we behave with each other.',dictionary:{sacred:"kutsal",forbidden:"yasak",shocking:"şok edici",boundaries:"sınırlar",invisible:"görünmez",behave:"davranmak"}},{title:"103. Tango",src:"Tango male us.mp3",text:'The tango is a world-famous dance that started in the late 19th century in the city of Buenos Aires, Argentina. The origin of the word is a bit mysterious, but most historians believe it comes from African languages. In many parts of Africa, the word tango or tamgu meant "a place to dance" or "the sound of the drum." African people who were brought to South America used this word for their social gatherings where they played music and danced to remember their homes. Over time, these African rhythms mixed with Spanish and Italian music in the poor neighborhoods of Argentina. At first, the tango was considered "low-class" and "dangerous" because it was so emotional and close. However, it eventually became popular in Paris and then the rest of the world. Today, the tango is famous for its passion, drama, and complex footwork. Its name is a beautiful reminder of how different cultures—African, European, and South American—can come together to create something entirely new and beautiful that speaks to the hearts of people everywhere.',dictionary:{mysterious:"gizemli",gatherings:"buluşmalar",rhythms:"ritimler",emotional:"duygusal",passion:"tutku",footwork:"ayak hareketleri"}},{title:"104. Tariff",src:"Tariff male us.mp3",text:'The word tariff has a very busy history that begins along the ancient trade routes of the Mediterranean Sea. It comes from the Italian word tariffa, which was borrowed from the Arabic word ta‘rīf, meaning "notification" or "a list of information." Hundreds of years ago, merchants in powerful cities like Venice and Genoa would post these lists on the city gates or at the harbor. The list informed travelers and traders exactly how much money they had to pay to the city for bringing in exotic goods like silk, spices, and salt. These were the "official costs" of doing business! The word traveled across Europe as international trade grew and reached England in the 1600s. Today, a tariff is a tax that a government puts on goods coming from other countries to control trade and protect its own companies. While the word is mostly used by economists and politicians today, its origin reminds us of the sunlit markets and busy harbors of the past. It is a word that has moved from a simple "list of prices" to a powerful tool in global economics and international relations.',dictionary:{notification:"bildirim",merchants:"tüccarlar",exotic:"egzotik",protect:"korumak",economists:"ekonomistler",relations:"ilişkiler"}},{title:"105. Therapy",src:"Therapy male us.mp3",text:'The word therapy comes from the ancient Greek word therapeia, which means "service" or "taking care of someone." In ancient Greece, a therapon was a person who served as an assistant or a helper. It did not just mean a doctor; it was anyone who stood by your side to help you feel better or to help you through a difficult time. Over many centuries, the meaning narrowed to describe specific medical treatments to fix a sickness or an injury. Today, we use the word in many different ways. We talk about physical therapy to help a broken leg, or psychological therapy to help with our feelings and mental health. The core idea has never changed: it is the "service" of helping a person return to health and happiness. Whether a person is talking to a counselor or doing exercises at the gym, they are engaging in the ancient Greek practice of being "cared for." It is a word that represents hope and the process of getting stronger, reminding us that we often need the help and service of others to heal ourselves.',dictionary:{service:"hizmet/yardım",assistant:"yardımcı",injury:"yaralanma",psychological:"psikolojik",counselor:"danışman",healing:"iyileşme"}},{title:"106. Tiramisu",src:"Tiramisu female us.mp3",text:'Tiramisu is one of the most famous Italian desserts, and its name tells you exactly how it makes you feel! In the Italian language, tira mi su literally means "pick me up" or "lift me up." This is because the dessert is made with strong espresso coffee and cocoa, which give you a lot of energy and caffeine. It also contains sugar and creamy mascarpone cheese, which make it very delicious and satisfying. The story goes that the dessert was invented in the 1960s or 1970s in the region of Veneto, Italy. Some people say it was created in a restaurant to give customers a "boost" of energy at the end of their meal. Others say it was a treat for people who were feeling tired or sad. Whatever the true origin, the name has become a global symbol for a delicious treat that makes you feel happy and energetic. Today, you can find tiramisu in almost every Italian restaurant in the world, and its name continues to promise a sweet and powerful "pick me up" for anyone who eats a slice of it.',dictionary:{satisfying:"tatmin edici",energy:"enerji",boost:"canlılık/artış",sweet:"tatlı",creamy:"kremamsı",delicious:"lezzetli"}},{title:"107. Tomato",src:"Tomato male us.mp3",text:'The tomato has a very long history that begins in South and Central America with the Aztec people. They called the fruit tomatl, which means "the swelling fruit" because of its round, full shape. When Spanish explorers arrived in Mexico in the 16th century, they saw these bright red fruits and brought the seeds back to Europe. At first, many people in Europe were afraid to eat them! Because the tomato is part of the "nightshade" family of plants, people thought it was poisonous. For a long time, it was only used as a decoration in gardens because it looked pretty. In Italy, they called it pomodoro, which means "golden apple." Eventually, people realized that it was not only safe but also very tasty. It became the most important ingredient in Italian pasta sauce and Spanish gazpacho. Today, the tomato is a staple food in almost every country, from American ketchup to Turkish salads. Its journey from a "scary" fruit in Mexico to a global kitchen favorite is one of the most successful food stories in history, and its name still sounds like the original Aztec word.',dictionary:{swelling:"büyüyen/şişen",poisonous:"zehirli",decoration:"süsleme",staple:"temel gıda",ingredient:"malzeme",scary:"korkutucu"}},{title:"108. Traffic",src:"Traffic female us.mp3",text:'The word traffic comes from the Old Italian word trafficare, which means "to carry out trade" or "to buy and sell goods." Originally, it did not have anything to do with cars or crowded roads. In the past, if you were a "trafficker," you were a merchant who moved goods like silk, spices, and salt from one city to another to make money. Because these merchants often traveled in large groups with many horses and wagons, the word started to describe the movement of people and vehicles along a path. By the 19th and 20th centuries, as cities became busier and cars were invented, the meaning shifted to describe the slow and crowded movement of vehicles on the stree
