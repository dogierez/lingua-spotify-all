i",legacy:"miras"}},{icon:"🇵🇸",title:"20. Leila Khaled",src:"20_Leila_Khaled.mp3",text:"Leila Khaled is a famous Palestinian activist and a member of the Popular Front for the Liberation of Palestine (PFLP). She was forced to leave her home in Haifa when she was just a small child during the creation of Israel in 1948. Growing up in a refugee camp, she decided to dedicate her life to fighting for a free Palestine. She became globally famous in 1969 when she became the first woman to hijack an airplane. She did this to bring the world's attention to the struggles of the Palestinian people. Even though her actions were highly controversial and seen as terrorism by many, she became an iconic symbol of Palestinian resistance. A famous photograph of her wearing a kuffiyeh scarf and holding a rifle was printed in newspapers around the world. Today, she continues to speak out for Palestinian rights and refugees. She remains a powerful and deeply debated figure in the long history of the Middle East conflict.",dictionary:{forced:"zorlandı",refugee:"mülteci",dedicate:"adamak",globally:"küresel olarak",hijack:"kaçırmak - uçak vs.",controversial:"tartışmalı",terrorism:"terörizm",iconic:"ikonik",rifle:"tüfek",debated:"tartışılan"}},{icon:"🕊️",title:"21. Mahatma Gandhi",src:"21_Mahatma_Gandhi.mp3",text:'Mahatma Gandhi was a lawyer who became the ultimate global symbol of peaceful resistance. He led the massive struggle to free India from the British Empire. Unlike many other revolutionary leaders, Gandhi completely rejected war and violence. He developed a new method of fighting called "Satyagraha," which means holding firmly to the truth. He organized millions of Indian people to refuse to cooperate with British laws through peaceful boycotts, marches, and strikes. One of his most famous actions was the Salt March, where he walked for hundreds of miles to make his own salt to protest an unfair British tax. He spent many years in prison and often went on long hunger strikes to stop violence between different religious groups in India. His peaceful but powerful methods finally forced the British to grant India independence in 1947. Sadly, he was assassinated a few months later by an angry radical. His ideas deeply inspired other famous leaders, including Martin Luther King Jr. and Nelson Mandela.',dictionary:{ultimate:"nihai",violence:"şiddet",firmly:"sıkıca",cooperate:"işbirliği yapmak",boycotts:"boykotlar",unfair:"haksız",tax:"vergi",grant:"vermek/bağışlamak",radical:"radikal"}},{icon:"✊🏾",title:"22. Malcolm X",src:"22_Malcolm_X.mp3",text:"Malcolm X was a powerful leader who fought for the rights of African Americans. He believed that Black people should be proud of their identity and defend themselves against unfair treatment. He was a very famous speaker who told the truth about racism in America. Later in his life, he went on a religious trip to Mecca. This experience changed his mind about many things, and he began to believe that people of all races could work together for human rights. He was a man of great courage who was never afraid to say what he thought. He was killed in 1965, but his ideas about justice and self-respect continue to inspire millions of people around the world.",dictionary:{identity:"kimlik",defend:"savunmak",treatment:"muamele",racism:"ırkçılık",courage:"cesaret",justice:"adalet","self-respect":"özsaygı"}},{icon:"🗣️",title:"23. Martin Luther King Jr.",src:"23_Martin_Luther_King_Jr.mp3",text:'Martin Luther King Jr. was a Christian minister and the most famous leader of the American Civil Rights Movement. He dedicated his life to fighting against the cruel system of racial segregation in the United States. He strongly believed in non-violent protest, using peaceful marches, speeches, and boycotts to fight unfair laws. He inspired millions of people to stand up for equality without using weapons or hate. In 1963, he gave his famous "I Have a Dream" speech in Washington, D.C., where he shared his hope that one day people would be judged by their character and not by the color of their skin. Because of his incredible leadership, the United States government was forced to pass new laws that protected the rights of Black Americans. He won the Nobel Peace Prize for his peaceful struggle. Tragically, he was assassinated in 1968, but his powerful message of love, justice, and peaceful resistance continues to inspire freedom movements all over the world.',dictionary:{minister:"rahip/bakan",cruel:"zalim",segregation:"ayrımcılık",equality:"eşitlik",judged:"yargılanmak",character:"karakter",incredible:"inanılmaz",tragically:"trajik bir şekilde"}},{icon:"⚔️",title:"24. Michael Collins",src:"24_Michael_Collins.mp3",text:'Michael Collins was a brilliant military leader and a key figure in the Irish struggle for independence. He wanted to free Ireland from hundreds of years of British rule. During the famous 1916 Easter Rising, he fought bravely but was captured and sent to a prison camp. When he was released, he completely changed how the Irish fought. Instead of fighting in large, open battles against the massive British army, he created a secret intelligence network and organized a highly effective guerrilla war. His "flying columns" of soldiers used quick, surprise attacks that the British could not stop. In 1921, he helped negotiate a peace treaty that created the Irish Free State, giving Ireland independence but keeping it tied to the British Empire. Sadly, this treaty caused a bitter civil war among the Irish people. In 1922, Collins was tragically shot and killed in an ambush by those who opposed the treaty. He was only 31 years old, but he is remembered as the boldest hero of the Irish revolution.',dictionary:{brilliant:"parlak",intelligence:"istihbarat",network:"ağ",effective:"etkili",negotiate:"müzakere etmek",treaty:"antlaşma",bitter:"acı",ambush:"pusu",opposed:"karşı çıktı",boldest:"en cesur"}},{icon:"🎤",title:"25. Miriam Makeba",src:"25_Miriam_Makeba.mp3",text:`Miriam Makeba, known around the world as "Mama Africa," was a legendary singer and a powerful voice against the cruel system of apartheid in South Africa. She used her beautiful music to tell global audiences about the terrible racism and suffering in her home country. Because she spoke the truth so boldly, the South African government took away her passport while she was traveling abroad, forcing her into exile for thirty years. She could not even return home for her mother's funeral. Despite this heartbreak, she never stopped fighting. She performed at the United Nations, demanding that the world take action against the racist government. She became the first African artist to win a Grammy Award, mixing traditional African sounds with popular music. When Nelson Mandela was finally freed from prison, he personally invited her to return home. She is remembered not just as a brilliant musician, but as a fearless warrior who used art as a weapon for freedom.`,dictionary:{legendary:"efsanevi",apartheid:"ırk ayrımcılığı",audiences:"izleyiciler",boldly:"cesurca",exile:"sürgün",heartbreak:"kalp kırıklığı",demanding:"talep eden",fearless:"korkusuz"}},{icon:"⛓️",title:"26. Nat Turner",src:"26_Nat_Turner.mp3",text:"Nat Turner was an enslaved preacher who led one of the most famous and powerful slave rebellions in American history. Born into slavery in Virginia in 1800, he was a deeply religious man who learned to read and write at a young age. He believed that God was speaking to him through visions, telling him to rise up and fight against the horrific cruelty of slavery. In 1831, after seeing a solar eclipse that he believed was a divine sign, he and a group of trusted friends launched a sudden and violent rebellion. They moved from plantation to plantation, fighting their oppressors and freeing other enslaved people to join their army. The rebellion caused massive panic among wealthy slave owners across the Southern United States. The government sent a large militia to crush the uprising, and Turner was eventually captured and executed. Although the rebellion was defeated, Nat Turner became a powerful symbol of ultimate resistance, proving that enslaved people would never stop fighting for their humanity and freedom.",dictionary:{enslaved:"köleleştirilmiş",preacher:"vaiz",rebellions:"isyanlar",visions:"görüler",horrific:"korkunç",cruelty:"zulüm",eclipse:"tutulma",divine:"ilahi",oppressors:"zalimler",militia:"milis",humanity:"insanlık"}},{icon:"🇿🇦",title:"27. Nelson Mandela",src:"27_Nelson_Mandela.mp3",text:'Nelson Mandela is one of the most respected people in history. He spent his life fighting against "apartheid," which was a system of cruel racism in South Africa. He was a lawyer who became a leader of the resistance. Because of his work, the government put him in prison for 27 years. Even while he was in a small cell, he never gave up his hope for a free country. He was finally released in 1990 and worked with his former enemies to create a new democracy. In 1994, he became the first Black President of South Africa. He chose to forgive those who hurt him, and he showed the world the power of peace and reconciliation.',dictionary:{respected:"saygıdeğer",apartheid:"ırk ayrımcılığı",cruel:"zalim",resistance:"direniş",former:"eski",democracy:"demokrasi",forgive:"affetmek",reconciliation:"uzlaşma"}},{icon:"🦁",title:"28. Omar Mukhtar",src:"28_Omar_Mukhtar.mp3",text:'Omar Mukhtar was a religious teacher who became a legendary warrior in Libya. When Italy invaded his country, he organized a group of fighters to defend the land. He was an expert in "guerrilla warfare," which means attacking quickly and then hiding in the desert. For 20 years, he fought the powerful Italian army, even though his group was much smaller. He was a man of great honor and faith. He was finally captured and executed by the Italians in 1931. Before he died, he famously said that his people would never surrender. He is known as the "Lion of the Desert" and is a hero to all Libyans and Arabs.',dictionary:{warrior:"savaşçı",invaded:"işgal etti",defend:"savunmak",expert:"uzman",hiding:"saklanmak",honor:"onur",faith:"inanç",surrender:"teslim olmak"}},{icon:"🇨🇩",title:"29. Patrice Lumumba",src:"29_Patrice_Lumumba.mp3",text:"Patrice Lumumba was the first Prime Minister of the independent Republic of the Congo. He was a passionate leader who wanted his country to be truly free from Belgian control. He believed that Africa’s wealth should belong to African people. After he was elected, he faced many problems from foreign countries and rebels at home. Because he was very independent and strong, powerful countries became his enemies. He was removed from power in a coup and was killed in 1961. He was only 35 years old. Today, he is seen as a symbol of the struggle for African independence and a martyr for the dream of a united and strong Africa.",dictionary:{passionate:"tutkulu",wealth:"zenginlik",elected:"seçildi",rebels:"isyancılar",coup:"darbe",symbol:"sembol",martyr:"şehit"}},{icon:"🚌",title:"30. Rosa Parks",src:"30_Rosa_Parks.mp3",text:'Rosa Parks is known as the "Mother of the Civil Rights Movement." In 1955, in Alabama, she did something very brave. She refused to give up her bus seat to a white man, even though the law said she had to. Her arrest started a massive protest where Black people refused to use the buses for over a year. This protest was led by Martin Luther King Jr. and eventually forced the government to change the unfair laws. Rosa Parks showed the world that one person can start a big change just by saying "no" to injustice. She spent the rest of her life working for peace and equality for all people.',dictionary:{brave:"cesur",refused:"reddetti",protest:"protesto",eventually:"sonunda",injustice:"adaletsizlik",equality:"eşitlik"}},{icon:"🇨🇱",title:"31. Salvador Allende",src:"31_Salvador_Allende.mp3",text:"Salvador Allende was a dedicated doctor and politician who became the first democratically elected socialist president of Chile in 1970. He believed deeply that his country's immense wealth, like its copper mines, should belong to the Chilean people and not to powerful foreign companies. During his presidency, he worked hard to improve the lives of the poor by raising wages, providing free milk to children, and giving land to struggling farmers. However, his radical changes angered wealthy elites and the United States government, who secretly worked to destroy Chile's economy. In September 1973, the military, led by General Augusto Pinochet, launched a violent coup against the government. As the military bombed the presidential palace, Allende refused to surrender or run away. He gave a famous final speech over the radio, telling his people to keep their hope alive for a better future. He died defending the palace, becoming an eternal martyr for democracy and social justice in Latin America.",dictionary:{dedicated:"adanmış",democratically:"demokratik olarak",immense:"muazzam",wages:"maaşlar",struggling:"mücadele eden",radical:"radikal",elites:"seçkinler",violently:"şiddetle",eternal:"sonsuz",martyr:"şehit"}},{icon:"🇲🇿",title:"32. Samora Machel",src:"32_Samora_Machel.mp3",text:"Samora Machel was the leader who brought independence to Mozambique. He led a long and difficult war against the Portuguese army for many years. He was a charismatic military commander who believed in socialism and equality for everyone. When the war ended in 1975, he became the first President of the country. He worked to build new schools and hospitals for the poor and to unite different groups of people. He also helped other African countries fight for their freedom. He died in a mysterious plane crash in 1986. Many people believe his enemies caused the crash. He remains a beloved hero in Mozambique and throughout Southern Africa.",dictionary:{charismatic:"karizmatik",commander:"komutan",socialism:"sosyalizm",equality:"eşitlik",mysterious:"gizemli",crash:"kaza",beloved:"sevilen"}},{icon:"⚔️",title:"33. Sim��n Bolívar",src:"33_Simon_Bolivar.mp3",text:'Simón Bolívar was a brilliant military commander and political leader who is famously known as "The Liberator." He was born into a wealthy family in Venezuela, but he spent his life fighting to free South America from the powerful Spanish Empire. He dreamed of a united, independent continent where people could rule themselves. Bolívar led rebel armies across massive mountains and deep jungles, fighting in incredibly difficult conditions. Through years of brilliant military campaigns, he successfully won independence for Venezuela, Colombia, Ecuador, Peru, and Bolivia—a country that was actually named in his honor. He served as the president of a large new nation called Gran Colombia, hoping to build a strong republic like the United States. However, political fighting and regional differences eventually caused his great nation to break apart. He died feeling disappointed, but today he is celebrated across the entire continent as the greatest hero of South American independence. Statues of him stand in almost every major city from Caracas to La Paz.',dictionary:{liberator:"kurtarıcı",continent:"kıta",incredibly:"inanılmaz derecede",campaigns:"seferler/kampanyalar",successfully:"başarıyla",regional:"bölgesel",disappointed:"hayal kırıklığına uğramış",celebrated:"kutlanan"}},{icon:"🪶",title:"34. Sitting Bull",src:"34_Sitting_Bull.mp3",text:"Sitting Bull was a legendary chief and holy man of the Lakota Nation who fiercely defended his people's land and traditional way of life. During the 19th century, the United States government repeatedly broke its treaties and sent the army to push Native American tribes off their ancestral lands to search for gold. Sitting Bull refused to surrender or move his people to reservations. He was a brilliant spiritual and military leader who united several different tribes to fight back against the invading forces. His greatest moment came in 1876 at the famous Battle of the Little Bighorn, where his united warriors completely defeated General Custer and the US military. Even after this massive victory, the government hunted his people relentlessly, destroying their food supply. He eventually surrendered to save his people from starving, but he never stopped speaking out for their rights. He was tragically killed by police in 1890, but he remains an enduring symbol of Native American pride and resistance.",dictionary:{legendary:"efsanevi",fiercely:"şiddetle",treaties:"antlaşmalar",ancestral:"atasal",reservations:"rezervasyonlar - yerli bölgesi",invading:"işgalci",relentlessly:"acımasızca",starving:"açlıktan ölmek",enduring:"kalıcı/dayanıklı"}},{icon:"🌹",title:"35. Sophie Scholl",src:"35_Sophie_Scholl.mp3",text:"Sophie Scholl was a remarkably brave young woman who fought a non-violent war against the cruel Nazi government in Germany. When Adolf Hitler came to power, many people were too afraid to speak out, but Sophie and her brother Hans believed they had to do something. They created a secret resistance group called the White Rose at their university in Munich. Together with a few friends, they secretly printed thousands of leaflets that told the truth about the terrible crimes committed by the Nazis. They risked their lives to mail these papers and leave them in public places, urging the German people to wake up and rebel against Hitler's dictatorship. In 1943, Sophie and her brother were caught dropping leaflets from a balcony at their school. They were interrogated by the secret police but refused to betray their friends. Sophie was executed by the government when she was only 21 years old. Today, she is honored worldwide as a brilliant symbol of moral courage and youthful resistance against pure evil.",dictionary:{remarkably:"dikkat çekici bir şekilde",secretly:"gizlice",leaflets:"bildiriler",urging:"teşvik eden",dictatorship:"diktatörlük",interrogated:"sorgulandı",betray:"ihanet etmek",moral:"ahlaki",youthful:"genç"}},{icon:"✊🏿",title:"36. Steve Biko",src:"36_Steve_Biko.mp3",text:'Steve Biko was a brilliant young leader who fought against racism in South Africa. He started the "Black Consciousness" movement, which taught Black people to be proud of themselves and their history. He believed that the first step to freedom was for people to realize they were not inferior to anyone else. The government was very afraid of his ideas and banned him from speaking to the public. In 1977, he was arrested and beaten so badly by the police that he died. He was only 30 years old. His death made the whole world angry at the South African government. He is remembered for the famous phrase: "Black is beautiful."',dictionary:{consciousness:"bilinç",inferior:"aşağı/daha düşük",banned:"yasakladı",beaten:"dövüldü",phrase:"ifade/söz"}},{icon:"⭐",title:"37. Thomas Sankara",src:"37_Thomas_Sankara.mp3",text:`Thomas Sankara was the President of Burkina Faso in the 1980s. He was a very different kind of leader because he lived a very simple life and refused to be rich while his people were poor. He changed the name of his country to Burkina Faso, which means "Land of Incorruptible People." He built many schools, planted millions of trees, and was a strong supporter of women's rights. He wanted his country to be independent and not rely on money from other nations. He was killed in a coup in 1987 by people who did not like his radical changes. He is often called the "African Che Guevara" and is a hero to many young Africans today.`,dictionary:{incorruptible:"yozlaştırılamaz",supporter:"destekçi",rely:"güvenmek/bel bağlamak",coup:"darbe",radical:"radikal"}},{icon:"🎸",title:"38. Víctor Jara",src:"38_Victor_Jara.mp3",text:"Víctor Jara was a brilliant teacher, theater director, and folk singer who became one of the most beloved cultural figures in Chile. He believed that art should be a voice for the voiceless. With his acoustic guitar, he sang beautiful, powerful songs about the struggles of poor farmers, workers, and everyday people. He strongly supported President Salvador Allende and the dream of a fairer, more equal society. When the violent military coup led by General Pinochet took over the country in 1973, the army immediately arrested Jara because they were terrified of his influence over the people. He was taken to a massive sports stadium that the military had turned into a prison. Even while he was being tortured, he bravely sang songs of resistance to give courage to the other prisoners. He was brutally murdered by the soldiers, but they could not silence his voice. Today, his music is sung by activists all over the world, and the stadium where he died is now named in his honor.",dictionary:{beloved:"sevilen",voiceless:"sessiz/sesi olmayan",acoustic:"akustik",terrified:"dehşete düşmüş",influence:"etki",tortured:"işkence gördü",brutally:"vahşice",silence:"susturmak"}},{icon:"🇵🇸",title:"39. Yasser Arafat",src:"39_Yasser_Arafat.mp3",text:'Yasser Arafat was the most famous leader of the Palestinian people for many decades. He spent his whole life fighting for a country for his people. He was the founder of the Fatah movement and the leader of the PLO. He was a very complicated man who used both war and peace to achieve his goals. In 1993, he signed a peace agreement with Israel and won the Nobel Peace Prize. He became the first President of the Palestinian Authority. He was a symbol of his people’s struggle, always wearing his famous "kuffiyeh" scarf. Whether people agreed with him or not, everyone knew he was a man who never stopped fighting for Palestine until he died.',dictionary:{complicated:"karmaşık",achieve:"başarmak/elde etmek",agreement:"anlaşma",struggle:"mücadele"}}],githubRepoUrl:"https://github.com/dogierez/fredom-fighters"},$g={id:"cognates",title:"Etymology Cognates",cover:"🔤",color:"#9b59b6",description:"A complete collection of 119 audio lessons and stories exploring English etymology, cognates, and word origins.",baseUrl:"https://dogierez.github.io/etmoylogy-cognates/",githubRepoUrl:"https://github.com/dogierez/etmoylogy-cognates",tracks:[{title:"1. Address",src:"Address male us.mp3",text:`The word address has a very helpful history that begins in France hundreds of years ago. It comes from the old French word adresser, which means "to guide," "to direct," or "to put something straight." In the beginning, people used this word when they wanted to talk directly to someone or send a message straight to their hands. It was about making sure a message didn't get lost on the way. Eventually, as cities became larger and more people started sending letters, the meaning changed. It began to describe the specific location of a house or a building. This made it much easier for the postman to "direct" a letter to the correct door. Today, we use an address for our homes, our offices, and even our emails on the internet. It is the special set of information that helps the world find us among millions of other people. Even though we live in a modern world with GPS and smartphones, the word still keeps its original French soul. It is all about "directing" things to the right place so that we can stay connected with our friends, family, and the businesses we use every day.`,dictionary:{helpful:"faydalı",guide:"yol göstermek",direct:"yönlendirmek",straight:"düzgün/doğru",describe:"tarif etmek",specific:"belirli/özel",location:"konum/yer",connected:"bağlantılı"}},{title:"2. Alcohol",src:"Alcohol male us.mp3",text:'The word alcohol has a very surprising history that begins in the ancient Middle East. It comes from the Arabic word al-kuḥl, which originally referred to a very fine, black powder used by both men and women as eyeliner. To make this powder, scientists used a process called distillation to refine the mineral into its purest form. During the Middle Ages, European chemists learned these secrets from Arabic books. They started using the word to describe any substance that was purified or "distilled." By the sixteenth century, the meaning shifted specifically to the "spirits" of wine that were produced through distillation. Over time, it became the general name for the intoxicating ingredient found in beer, wine, and liquor. Today, the word is used in science to describe a specific group of chemical compounds, but most people think of it as a drink for celebrations. It is a fascinating example of how a word can travel from the world of ancient cosmetics and beauty into the worlds of modern chemistry and social life. The name reminds us of the long history of Arabic science and how it helped shape the language of the modern world.',dictionary:{surprising:"şaşırtıcı",ancient:"antik/eski",referred:"kastetti",fine:"ince/zarif",powder:"toz",refine:"arıtmak/saflaştırmak",purified:"saflaştırılmış",intoxicating:"sarhoş edici",substance:"madde"}},{title:"3. Ambulance",src:"Ambulance female us.mp3",text:`In the past, an ambulance was not the fast, loud vehicle with flashing lights that we see on the streets today. The word actually comes from the Latin verb ambulare, which means "to walk." During the late 1700s, a French doctor for Napoleon's army realized that many soldiers died because help arrived too slowly. He created "mobile hospitals" that could move quickly across the battlefield. These were called ambulances volantes, or "flying walking-hospitals." Because they "walked" or moved along with the soldiers, they could save lives much faster than before. Later, during the American Civil War, people started using special wagons pulled by horses to carry sick or hurt people to the doctor. They kept the name from the French military style. Even when cars were invented and replaced horses, the name stayed the same. Today, when we hear the siren of an ambulance, we are hearing a word that is thousands of years old. It reminds us of a time when medical help had to "walk" to find the people who needed it most. It is a story of how moving fast has always been the best way to help someone who is very sick.`,dictionary:{vehicle:"araç/taşıt",flashing:"yanıp sönen",realized:"fark etti",battlefield:"savaş alanı",military:"askeri",replaced:"yerini aldı",medical:"tıbbi"}},{title:"4. Anaconda",src:"Anaconda  male us.mp3",text:'The anaconda is famous for being one of the largest and most powerful snakes in the entire world. Its name has a very mysterious history that probably started far away from the jungles of South America. Many historians believe the word comes from the Tamil language of Sri Lanka. In that language, the word anaikkonda means "elephant killer." It is possible that travelers heard stories about giant snakes in Asia and used that scary name when they saw the massive green snakes in the Amazon rainforest. Another theory is that the name comes from a local word meaning "lightning snake" because they strike their prey so quickly. Even though anacondas do not actually eat giant elephants, the name was perfect for a creature that looks like a monster from a movie. These snakes spend most of their time in the water, waiting quietly for a meal to pass by. When European explorers first saw them, they were terrified by their size and strength. They kept the name anaconda to describe this king of the river. Today, the name still makes people think of the deep, dark jungle and the incredible power of nature’s most famous giant reptile.',dictionary:{powerful:"güçlü",mysterious:"gizemli",massive:"devasa",strike:"çarpmak/saldırmak",prey:"av",terrified:"dehşete düşmüş",reptile:"sürüngen",creature:"yaratık"}},{title:"5. Ananas",src:"Ananas female us.mp3",text:'While people in English-speaking countries call this spiked fruit a "pineapple," almost every other language in the world uses the word ananas. This beautiful word comes from the Tupi people who lived in the tropical forests of Brazil. In their native language, they called the fruit nanas, which literally means "excellent fruit." They chose this name because they believed it was the best-tasting thing in the forest. When Christopher Columbus and other explorers arrived in the Americas, they tasted this sweet fruit and were very impressed. The Spanish and Portuguese took the fruit and its original name back to Europe and then to their colonies in Africa and Asia. Because the fruit looks like a giant pine cone but tastes like a sweet apple, the English combined those two words to make "pineapple." However, the rest of the world stayed loyal to the original name used by the people of Brazil. Today, whether you are in Turkey, Germany, or Russia, you will hear the word ananas. It is a perfect example of how a simple word from a local tribe can travel across the ocean to become a global word for something delicious.',dictionary:{spiked:"dikenli",tropical:"tropikal",literally:"kelimenin tam anlamıyla",excellent:"mükemmel",impressed:"etkilenmiş",loyal:"sadık",delicious:"lezzetli"}},{title:"6. Aquarium",src:"Aquarium  male us.mp3",text:'The word aquarium has a very simple origin that comes from the ancient Latin language. The root word is aqua, which simply means "water." In the time of the Romans, an aquarium was just a place where animals went to drink water, like a small pond or a stone basin. It was a very practical word for a very simple thing. However, in the middle of the 1800s, people in England became very interested in nature and science. A famous naturalist named Philip Gosse realized that people would love to watch colorful fish and sea plants inside their own homes. He helped design the first glass boxes that could hold water and keep fish alive for a long time. He decided to use the old Latin word but gave it a new, exciting meaning. Suddenly, an aquarium was no longer a place for thirsty cows; it was a beautiful window into the underwater world. The first public display of these glass tanks opened in London in 1853, and people were amazed. Today, we visit giant buildings with sharks and tropical fish, but the name still reminds us of that simple Latin word for water.',dictionary:{practical:"kullanışlı/pratik",naturalist:"doğa bilimci",colorful:"renkli",design:"tasarlamak",display:"sergi/gösterim",amazed:"büyülenmiş",underwater:"su altı"}},{title:"7. Asphalt",src:"Asphalt female us.mp3",text:'The word asphalt is incredibly old and has a history that connects modern roads to the ancient world. It comes from the Greek word asphaltos, which means "to secure," "to make firm," or "to keep from falling." Thousands of years ago, people did not use this black material for driving cars. Instead, they found thick, sticky "tar" bubbling up from the ground in places like the Middle East. They used this natural material as a type of glue to hold bricks together or to paint the bottom of wooden boats. This helped "secure" the boats so that water could not leak inside. The ancient Egyptians even used it during the process of making mummies to keep them preserved for a long time. It was the "super glue" of the ancient world! In the 1800s, engineers realized that if they mixed this material with small stones, they could create a very smooth and "firm" surface for wheels to move on. Today, we use it to cover millions of kilometers of roads all around the planet. The name still carries that original Greek meaning of making things strong, stable, and ready for a long journey.',dictionary:{secure:"sağlamlaştırmak",firm:"sert/sağlam",sticky:"yapışkan",bubbling:"kabaran/kaynayan",preserved:"korunmuş",smooth:"pürüzsüz",surface:"yüzey",stable:"istikrarlı/dengeli"}},{title:"8. Avocado",src:"Avocado female us.mp3",text:`The history of the avocado is quite funny because of a big misunderstanding between two different languages. The story begins in Mexico with the Aztec people. In their language, called Nahuatl, the word for this creamy green fruit was ahuacatl. Because of the fruit's unique oval shape and how it hangs from the tree in pairs, the Aztecs also used the same word to mean "testicle." When Spanish explorers arrived in the 16th century, they found the word very difficult to pronounce. They changed it to aguacate, which sounded more like a Spanish word to them. Later, English speakers heard the Spanish name and changed it again to "avogato" and finally to avocado. For a short time in history, people in the United States even called it an "alligator pear" because of its dark, bumpy skin that looks like the back of a reptile. Today, the avocado is one of the most popular healthy foods in the world, especially for breakfast. Even though the name has changed many times over five hundred years, it still connects back to that original, slightly embarrassing Aztec word. It shows us how language can change as food travels from one culture to another.`,dictionary:{misunderstanding:"yanlış anlaşılma",creamy:"kremsi",unique:"benzersiz",pronounce:"telaffuz etmek",bumpy:"tümsekli/pürüzlü",embarrassing:"utanç verici"}},{title:"9. Bank",src:"Bank female us.mp3",text:'During the Renaissance, Italians had a monopoly on the banking system. All the Italian banks used bancos. Those bancos were benches. The Italians also called the bank banco because the client and the banker would sit on a bench and exchange money and bills of debt by putting them on the bench. In many languages around the world, the word bank means both the bench and the bank. What’s more, the word bankrupt also has something to do with the bench. When the bankers who could not afford to provide money for their clients failed, the representatives of the banking system would come and break their benches. Eventually, everybody would understand that these particular bankers were bankrupt and out of business. By the way, in Italian, this was called banka rotta, which translates as "broken bench." It was a very public and embarrassing way for a professional to fail. This history shows us that the modern global financial system started with very simple wooden furniture in the streets of Italy. It is a great example of how a word for a physical object can become a very important term for the entire world of money.',dictionary:{monopoly:"tekel",exchange:"değiş tokuş etmek",debt:"borç",bankrupt:"iflas etmiş",afford:"gücü yetmek",representatives:"temsilciler",financial:"mali/finansal"}},{title:"10. Banana",src:"Banana  male us.mp3",text:'The word banana has a long and interesting history that likely began in West Africa. In the Wolof language of Senegal and Gambia, the word for this fruit was banaana. Around the same time, traders in the Middle East used the Arabic word banan, which means "finger." This makes perfect sense because a single fruit looks like a finger, and a group of them is still called a "hand." Sailors from Portugal and Spain first discovered the fruit on the African coast and were very impressed by its sweet taste and how easy it was to peel. They brought the fruit and its African name to the Americas in the early 1500s. For a long time, bananas were a very rare and expensive luxury in Europe and North America. They were even sold individually in fancy paper at world fairs! Today, the banana is the most popular fruit in the world, found in almost every kitchen. Its journey from West African forests to global supermarkets is a great story of international trade. Whether you eat it for breakfast or as a healthy snack, the name reminds us of its ancient roots in Africa and the Middle East.',dictionary:{traders:"tüccarlar",discovered:"keşfetti",peel:"soymak",rare:"nadir",expensive:"pahalı",luxury:"lüks",individually:"tek tek"}},{title:"11. BBQ",src:"BBQ male us.mp3",text:"The word BBQ, or barbecue, comes from the Taíno people, who were the original inhabitants of the Caribbean islands. They used a clever method for cooking meat by placing it on a wooden frame made of green sticks over a slow, smoky fire. In their native language, they called this wooden structure a barbacoa. This method was very smart because the smoke kept insects away and helped the meat stay fresh for a longer time in the hot weather. When Spanish explorers arrived in the 1490s, they loved the delicious, smoky flavor of the meat and took the word back to Europe. In English, the word became barbecue. Over hundreds of years, different cultures added their own spices and sauces, but the basic idea of slow-cooking meat over a fire stayed the same. Today, a BBQ is more than just a way to cook; it is a popular social event where friends and family gather together outdoors. Even though we use modern metal grills today, the name still connects us to the ancient cooking traditions of the Caribbean islands. It is a word that represents sunshine, smoke, and good food shared with people.",dictionary:{inhabitants:"yerliler",clever:"akıllıca",frame:"iskelet/çerçeve",smoky:"isli/dumanlı",flavor:"lezzet",spices:"baharatlar",gather:"toplanmak"}},{title:"12. Barista",src:"Barista  male us.mp3",text:'In the Italian language, a barista is simply a "person who works at a bar." However, in Italy, a "bar" is not a place for alcohol; it is a busy shop where people go all day to get a quick espresso or a cappuccino. The word comes from the Italian barra, which refers to the physical counter or "bar" that separates the worker from the customers. For many years, the word was only used in Italy. However, in the 1980s and 1990s, modern coffee companies began to open shops all over the world. They wanted to make their employees sound like experts who knew the art of making perfect coffee. They decided to use the Italian name to give the job a more professional and stylish feeling. Today, the word barista is used in almost every country to describe someone who is highly skilled at using a coffee machine. They must know the perfect temperature of the milk and the exact pressure for the coffee. It is a great example of how a very common and simple Italian job title became a global word for a modern professional artist who serves our favorite morning drinks.',dictionary:{separates:"ayırır",stylish:"şık",skilled:"yetenekli/uzman",temperature:"sıcaklık",pressure:"basınç",common:"yaygın",expert:"uzman"}},{title:"13. Bikini",src:"Bikini  male us.mp3",text:`The history of the bikini is quite shocking because it is named after a small island in the Pacific Ocean called "Bikini Atoll." In the summer of 1946, the United States military was using this island to test very powerful and scary atomic bombs. At exactly the same time, a French fashion designer named Louis Réard created a new swimsuit that was much smaller than anything seen before. He knew that his tiny design would be very controversial and would surprise everyone in the world. He decided to call it the bikini because he believed it would be as "explosive" and exciting as the news of the atomic tests on the island. He was right! At first, many countries banned the swimsuit because they thought it was too small and scandalous. However, movie stars started wearing them, and soon the bikini became a symbol of summer fashion and freedom. Today, we use the name without thinking about the island or the bombs, but the word's origin reminds us of a time when fashion was changing very fast. It is a story of how a small piece of clothing caused a massive explosion in global culture.`,dictionary:{shocking:"şok edici",controversial:"tartışmalı",explosive:"patlayıcı/çarpıcı",banned:"yasaklandı",scandalous:"skandal yaratan",freedom:"özgürlük",massive:"devasa"}},{title:"14. Bluetooth",src:"Bluetooth female us.mp3",text:`The technology that enables us to connect our electronic devices in a short range is called Bluetooth. This technology was invented by Intel but it was commercially used by Ericsson, the Swedish mobile phone company. They decided to name this technology after the Viking king Harald Gormsson. His nickname was "Blachtent," which translates as blue tooth. He had a bad tooth that was blue. That is why he was called Harald the Blue Tooth. He was the Viking king who united the Vikings under one kingdom. Likewise, Bluetooth connects nearby devices to each other so they can work together. Even the famous symbol for this technology is made from the old Viking letters for the king's name. It is a wonderful story of how a thousand-year-old king from Denmark inspired the name for the wireless connection we use every day on our smartphones and computers. It shows that even the newest technology can have a very old and interesting history. The engineers chose this name because they wanted their invention to "unite" devices just like the king united his people.`,dictionary:{enables:"sağlar/olanak tanır",commercially:"ticari olarak",united:"birleştirdi",nearby:"yakındaki",symbol:"simge/sembol",inspired:"ilham verdi"}},{title:"15. Boycott",src:"Boycott female us.mp3",text:"During the late 19th century, in Ireland, the English had a great deal of farmland which they rented to poor Irish farmers. One of those rich landowners was Lord Erne, who had a representative to collect his rent from the tenants. His name was Charles Boycott and he was a mean person. The union of the farmers offered him a 25% reduction in their rents but he refused them. Upon this, all the farmers decided not to work for him. This action was soon accepted by the local businessmen. Soon this movement involved all the people in that area. He was ignored even by the local postman and his servants at his estate. This protest cost his boss a huge amount of money. Consequently, he had to return to England in shame. This community protest became a synonym with his last name in the national English newspapers. Ever since then, protesting something has been called to boycott it. It is a powerful word that represents how a peaceful protest by a whole community can be very effective. It is a story of how an unkind man’s name became a global word for protest.",dictionary:{tenants:"kiracılar",reduction:"indirim/azaltma",refused:"reddetti",ignored:"görmezden gelindi",servants:"hizmetçiler",protest:"protesto",effective:"etkili"}},{title:"16. Bug",src:"Bug  male us.mp3",text:'The word bug is nowadays a synonym for failure in computers. By the great majority, it is believed that this word came into usage in the early 1960s. In those years, a computer was a machine that was as big as a room. When computer terminal users encountered a problem, they would call the IT people to solve the problem. After some inspections, they would detect a jammed relay switch, which had electro-mechanic moving parts. Upon unjamming the relay switch, the system would be fixed. The IT people would record the cause of such failures in the logbooks as bugs although they never saw any sign of the insect. Those IT people were inspired by Thomas Edison, the inventor of the phonograph. Every once in a while, his phonograph would stop working because an insect was stuck in the device and he would say "we are bugged." The IT people were paying a kind of homage to Thomas Edison by identifying a failure in their computers as a bug. Today, we still use this word for every small mistake in a computer program, even though there are no real insects inside.',dictionary:{failure:"arıza/başarısızlık",majority:"çoğunluk",encountered:"karşılaştı",inspections:"incelemeler",detect:"tespit etmek",jammed:"sıkışmış",stuck:"takılmış",homage:"saygı duruşu"}},{title:"17. Bungalow",src:"Bungalow  male us.mp3",text:"This word has a very cozy history that began in the region of South Asia. In the Hindi language, a bangla was a small, one-story house built in the traditional style of Bengal. These houses were designed with large porches and high ceilings to keep the air moving and help people stay cool in the very hot and humid weather of India. In the 18th and 19th centuries, British officials living in India loved these houses because they were comfortable and easy to build. They changed the name to bungalow and brought the architectural style back to England and eventually to America. The idea of a simple, cozy house with everything on one floor became very popular for vacation homes and for families who wanted a quiet life. Today, a bungalow is a common sight in many countries, and the word is used for any small house that is built low to the ground. Even though these houses are now found in cold places like Canada or England, the name still carries the memory of the warm, breezy houses of India. It is a word that traveled across the world to bring comfort to many people.",dictionary:{cozy:"rahat/sıcak",traditional:"geleneksel",porches:"verandalar",ceilings:"tavanlar",humid:"nemli",comfortable:"rahat",breezy:"esintili/ferah"}},{title:"18. Cactus",src:"Cactus female us.mp3",text:'The word cactus has a very long journey that began in ancient Greece. The word kaktos was originally used by the Greeks to describe a prickly, thorny plant found on the island of Sicily. This plant was actually a type of cardoon or artichoke, not the desert plant we know today. Hundreds of years later, when European scientists and explorers first visited the Americas, they saw strange, thorny plants that survived in the dry desert without any rain. They did not have a word for these unique plants, so they decided to use the old Greek name for "prickly plant." In a way, they "borrowed" the name from a Mediterranean vegetable and gave it to a desert survivor! A cactus is a truly amazing plant because its thick skin and sharp thorns protect the water stored inside it. The thorns are actually leaves that changed over millions of years to stop animals from eating the plant. Today, we use the word for thousands of different types of these plants. The name reminds us that even though these desert plants are only from the Americas, their name connects back to the very old language of the Greek philosophers.',dictionary:{prickly:"dikenli",thorny:"dikenli",survived:"hayatta kaldı",borrowed:"ödünç aldı",protect:"korumak",stored:"depolanmış",philosophers:"filozoflar"}},{title:"19. Camouflage",src:"Camouflage female us.mp3",text:'The word camouflage was first used by a magazine which covered news and photos of the British and French war machines which were painted to blend in with the landscape. In military jargon, the meaning of the word camouflage is to fool the enemy. The war machines were painted to prevent them from the enemy pilots’ eyes. Until this particular coverage, long definitions such as dazzle-painting or concealment-painting were used to describe this military trick. The word camouflage has its origins in the 19th-century French slang "camoufler" which means to veil. However, the French thieves borrowed this word from their Italian counterparts who used the verb "camuffare" which means to disguise in Italian. Like numerous military terms, the word camouflage came into the use of daily language and today it is a global cognate to say to hide something from unwanted eyes. It is also used in nature to describe how animals stay safe. Whether it is a soldier in the forest or a lizard on a tree, the goal is always the same: to stay hidden and invisible to the eyes of others.',dictionary:{blend:"karışmak/uyum sağlamak",jargon:"meslek dili",fool:"kandırmak",prevent:"önlemek",disguise:"gizlemek/kamufle etmek",invisible:"görünmez"}},{title:"20. Cappuccino",src:"Cappuccino  male us.mp3",text:"On September the 12th, 1683, when the siege of Vienna finished, the Turks left everything behind and fled. The famished people of Vienna rushed to the provisions and started to cook whatever they could get. Coffee beans were among those foods. They started to roast those beans and the smell was extremely bad. The Capuchin monks were among the Vienna people during the siege and they taught them to grind, roast, and mix the coffee beans with milk and honey. The Austrian people named this beverage after those monks and called it Kapuziner. However, due to the Italian origin of the monks, the coffee is known globally as cappuccino. The light brown color of the drink looks exactly like the brown robes that the monks used to wear. Today, this is one of the most popular coffee drinks in the world. Every time you enjoy a cup with foamy milk on top, the name reminds you of the monks who helped the people of Vienna. It is a delicious story of how a religious group and a famous historical war gave us our favorite morning drink.",dictionary:{siege:"kuşatma",famished:"açlıktan kıvranan",provisions:"erzak/yiyecek",roast:"kavurmak",grind:"öğütmek",beverage:"içecek",robes:"cübbeler",foamy:"köpüklü"}},{title:"21. Casino",src:"Casino  male us.mp3",text:'In order to understand the meaning of casino, we need to know that casa means house in Italian and the suffix "-ino" makes the word diminutive, hence the word means "small house." When we look from today’s perspective, the connection between a place where people gamble and a small house doesn’t make sense. However, in rural Italy, in 1744, there were such small public houses where people would go and listen to music and watch people dancing. Regarding the religious and social oppressions, visiting such places was related to sin. Rumor had it that people were not only drinking and dancing, but they were also gambling. Day by day, the fame of those houses exceeded borders and any place where people would meet and play cards, dice games or even roulette was called casinos. The widespread usage of the word has become famous after luxurious hotels with casinos were built in Las Vegas. Coincidentally, there was a famous card game called cassino and most probably people related these small houses with this game. Today, it represents big lights and games of chance, but it started as a small house for friends.',dictionary:{diminutive:"küçültme bildiren",perspective:"bakış açısı",gamble:"kumar oynamak",oppressions:"baskılar",sin:"günah",rumor:"söylenti",luxurious:"lüks",exceeded:"aştı"}},{title:"22. Cathedral",src:"Cathedral  male us.mp3",text:'A cathedral is a very large and impressive church, but its name is actually about a simple piece of furniture. The word comes from the Greek word kathedra, which means "a chair" or "a seat." In the early days of the Christian church, the Bishop was the leader of a large area. The church where the Bishop had his official "seat" or office was called the "cathedral church." It was the most important building in the city because it was the center of power and law. Because these buildings had to be big enough to hold many people and show the importance of the Bishop, they were built with high ceilings, beautiful windows, and tall towers. Over many centuries, the word stopped being about the chair and started describing the giant, beautiful building itself. Today, when we visit a cathedral in a city like London, Paris, or Florence, we are amazed by the art and the architecture. However, the name still reminds us of its original purpose as the official "seat" for a leader. It is a word that shows how a small symbol of authority can give a name to some of the most famous buildings in the world.',dictionary:{impressive:"etkileyici",furniture:"mobilya",official:"resmi",center:"merkez",authority:"yetki/otorite",amazed:"büyülenmiş",architecture:"mimari"}},{title:"23. Charisma",src:"Charisma female us.mp3",text:'The word charisma comes from the ancient Greek language, where it had a very special and spiritual meaning. The word charis meant "grace" or "favor," and a charisma was a "gift" given by the gods to a human being. In the past, people believed that if someone was a great leader or a powerful speaker, it was because the gods had given them a magic power to inspire others. They had a "gift of grace" that made them special. For a long time, the word was only used in religious books to describe miracles or spiritual powers. However, in the 20th century, social scientists started using the word to describe the personality of famous politicians, actors, and leaders. Today, when we say someone has charisma, we mean they are very charming, attractive, and can easily make people follow them. It is that "invisible quality" that makes a person stand out in a crowd. Even though we no longer talk about gods and magic, the name still carries the original Greek idea of a "special gift." It is a word for a personality that is so strong it feels like it came from another world.',dictionary:{spiritual:"ruhani",grace:"zarafet/lütuf",favor:"iyilik",miracles:"mucizeler",charming:"büyüleyici",attractive:"çekici",invisible:"görünmez"}},{title:"24. Charlatan",src:"Charlatan  male us.mp3",text:'In the early 17th century, the common people were in trouble with epidemics, and the number of real doctors was scarce. What’s more, even if the commoners could access real doctors, they could not afford them. This is where the charlatans came in. The word charlatan originates in the Italian word "ciarlatano," which is derived from the Italian verb "ciarlare," which means to chatter. They were traveling from town to town by cart, and they would address the people with fancy words, various light shows, and musicians in order to distract them. As the term suggests, they were chattering too much to convince the commoners that they were real experts of pharmacology. Eventually, they would sell them useless potions for high prices and leave the village. When the villagers understood that they were conned by the chattering con artist, their charlatan had already arrived in another town to prey on new victims. Today, we use this word for anyone who pretends to have special knowledge that they do not really have. It is a word that reminds us to be careful of people who talk too much but tell lies.',dictionary:{epidemics:"salgınlar",scarce:"kıt/az",afford:"gücü yetmek",chatter:"gevezelik etmek",distract:"dikkat dağıtmak",convince:"ikna etmek",useless:"yararsız",potions:"iksirler"}},{title:"25. Chauvinism",src:"Chauvinism  male us.mp3",text:'Nowadays, people use the word chauvinism when they refer to extreme patriotism or aggressive nationalism. What’s more, "male chauvinism" came into use in the early 1960s by feminist activists who wanted to put the masculine-centric approach under the spotlight. This word has a historical background, and it is the last name of Nicolas Chauvin. He was a low-ranked soldier in Napoleon’s army, and he was known for his full support for Napoleon. He was praising Napoleon publicly and zealously even if Napoleon was wrong. His preaches became so annoying that anyone who talked about nationalism feverishly was called a chauvinist. In time, his last name became an adjective to belittle people who have fanatic thoughts and utter them with exaggeration. Today, we use it for anyone who is too proud of their own group and refuses to respect others. It is a story of how a soldier’s extreme loyalty turned into a word for a very narrow-minded and aggressive way of thinking. It reminds us that being too proud can sometimes lead to being unkind or unfair to other people in the world.',dictionary:{extreme:"aşırı",patriotism:"vatanseverlik",aggressive:"saldırgan",nationalism:"milliyetçilik",zealously:"şevkle/fanatikçe",belittle:"küçümsemek",fanatic:"bağnaz"}},{title:"26. Chocolate",src:"Chocolate female us.mp3",text:'The word chocolate has a very rich history that begins over three thousand years ago in the jungles of Central America. It comes from the Aztec word xocolatl, which is a combination of two words: xocol, meaning "bitter," and atl, meaning "water." The Aztecs and the Mayans did not eat sweet bars of candy; instead, they made a spicy, bitter drink by grinding cacao beans and mixing them with chili peppers and water. They believed this drink was a gift from the gods that gave them strength and wisdom. When Spanish explorers arrived in Mexico in the sixteenth century, they were surprised by this dark liquid. They brought the beans and the name back to Europe, where people eventually started adding sugar, cinnamon, and milk to make it taste better. For a long time, it was a very expensive luxury that only kings and queens could afford to drink. In the nineteenth century, machines were finally invented to turn the liquid into the solid bars we love today. Now, chocolate is the most popular treat in the world. Its name is a sweet reminder of its ancient, bitter, and "watery" roots in the heart of the Aztec empire.',dictionary:{bitter:"acı",spicy:"baharatlı",grinding:"öğütme",wisdom:"bilgelik",luxury:"lüks",afford:"gücü yetmek",solid:"katı"}},{title:"27. Cinema",src:"Cinema  male us.mp3",text:'The word cinema is a short version of a much longer and more technical name. In the 1890s, when the first machines to show moving pictures were invented, they were called "cinematographs." This long word was made from two Greek parts: kinema, which means "movement," and graphein, which means "to record" or "to write." So, the invention was literally a machine that "recorded movement." This was a massive miracle at the time because, before this, pictures were always still and never moved. The French people were the first to shorten the long name to just cinema, and the word quickly spread to almost every other language. It became the name for both the art of making movies and the building where people go to watch them on a big screen. Today, we have movies on our phones and computers, but we still use this word that was born from the excitement of the very first moving pictures. It is a great example of how a scientific name can become a common part of our daily life. The name still reminds us that the magic of movies is all about the beauty of "recorded movement."',dictionary:{technical:"teknik",movement:"hareket",record:"kaydetmek",miracle:"mucize",spread:"yayılmak",excitement:"heyecan",shorten:"kısaltmak"}},{title:"28. Circus",src:"Circus  male us.mp3",text:'The word circus has a very old and circular history that begins in the heart of ancient Rome. It comes from the Latin word circus, which literally means "a circle," "a ring," or "an oval." In Roman times, the most famous place for entertainment was the Circus Maximus, a giant oval stadium where thousands of people gathered to watch exciting chariot races. It was the center of social life and noise in the city! Over many centuries, the word stopped being just a name for the stadium and started describing the performances that happened inside a ring. In the late 1700s, an Englishman named Philip Astley created the modern version by bringing together horse riders, acrobats, and clowns into a single circular stage. He realized that a circle was the perfect shape because it allowed everyone in the audience to see the action perfectly. Today, the word circus makes us think of big tents, lions, and amazing acrobats performing under the "big top." Even though the shows have changed a lot over two thousand years, the name still connects us back to the original circular shape of those ancient Roman racing tracks.',dictionary:{circular:"dairesel",stadium:"stadyum",entertainment:"eğlence",acrobats:"akrobatlar",clowns:"palyaçolar",audience:"seyirci"}},{title:"29. Clinic",src:"Clinic female us.mp3",text:`The word clinic has a very interesting history that connects it to the comfort of your own home. It comes from the ancient Greek word kline, which means "a bed" or "a couch." Originally, the word was used for a doctor who visited patients while they were lying in their beds at home. These were "bedside" doctors who cared for people who were too sick to walk or travel. Over time, the meaning changed to describe a small building where doctors teach students by showing them real patients in beds. By the modern era, the word started to be used for any small medical center where you go for a check-up or a quick treatment. Unlike a giant hospital where you might stay for many days, a clinic is usually a place for faster medical service. Today, we have dental clinics, eye clinics, and even animal clinics for our pets. The name is a gentle reminder that all medicine started with a doctor sitting next to a patient's bed and offering help. It is a word that represents the care and personal attention that doctors give to people to help them feel healthy and strong again.`,dictionary:{comfort:"rahatlık",couch:"sedir/kanepe",bedside:"hasta başı",treatment:"tedavi",service:"hizmet",gentle:"nazik",healthy:"sağlıklı"}},{title:"30. Cobra",src:"Cobra female us.mp3",text:'When Portuguese explorers first arrived in Africa and India in the 15th and 16th centuries, they were terrified by a specific type of snake that could lift its head and widen its neck. This unique shape reminded them of a hood or a hat. In the Portuguese language, a "hood" is called a capelo. They called the snake cobra de capelo, which literally means "snake with a hood." In Portuguese, the word cobra actually means any type of snake, but for English speakers, the word became the specific name for this dangerous hooded reptile. The cobra is famous for its deadly poison and its dramatic appearance when it feels threatened. In many ancient cultures, especially in Egypt and India, the cobra was a powerful symbol of royalty, protection, and wisdom. You can even see them on the crowns of the ancient Pharaohs! Today, the name cobra is used all over the world. It is a word that traveled from Portugal to the tropical jungles of the East. The name still helps us visualize the scary but beautiful "hood" of one of nature’s most famous and respected snakes. It is a story of discovery and the fear of the unknown.',dictionary:{terrified:"dehşete düşmüş",hood:"başlık",widen:"genişletmek",deadly:"ölümcül",poison:"zehir",threatened:"tehdit altında",visualize:"gözünde canlandırmak"}},{title:"31. Cocktail",src:"Cocktail female us.mp3",text:'There are many colorful stories about the word cocktail, but the most accurate history is likely related to horses. In the 18th century, people would cut the tails of "mixed-breed" horses to make them stand up, similar to the tail of a rooster or a "cock." These horses were called "cock-tails" because they were not "pure" through the bloodline. Around the same time, people started making drinks that were not "pure" wine or spirit, but a mixture of different ingredients like sugar, water, and bitters. Because the drink was a "mixture," they used the same word for it that they used for the mixed-breed horses. It was a "cocktail" of flavors! The word became very popular in America in the early 1800s, and bartenders started creating hundreds of different recipes. Today, a cocktail is a sophisticated and fancy drink served at parties and in elegant bars. Even though the word started with horses and roosters, it is now the international name for any creative mix of drinks. It is a word that represents fun, creativity, and the social history of people gathering together to enjoy a "mixed" drink in a tall glass with ice.',dictionary:{accurate:"doğru/kesin",mixed:"karışık",pure:"saf",bloodline:"soy",ingredients:"malzemeler",sophisticated:"sofistike",elegant:"zarif"}},{title:"32. Coffee",src:"Coffee female us.mp3",text:'The word coffee has a very global history that traveled through many different languages before it reached English. It began with the Arabic word qahwa, which originally referred to a type of wine or a drink that reduced the appetite. By the fifteenth century, the name was given to a new, stimulating drink made from roasted beans in Yemen. From Arabic, the word moved into the Turkish language as kahve. The Turks were the ones who brought the drink to Europe through their trade and wars. When the beverage arrived in Italy, it became caffè, and the Dutch changed it to koffie. Finally, the English borrowed the Dutch version to create the word coffee. For a long time, people in Europe were suspicious of this "dark liquid," but it quickly became the center of social life in "coffeehouses" where people met to discuss politics and news. Today, it is the most popular morning drink in the world. Whether you call it kahve, caffè, or coffee, the name carries the history of travelers and traders moving between the Middle East, Turkey, and Europe. It is a word that wakes up the whole world every day.',dictionary:{appetite:"iştah",stimulating:"uyarıcı",roasted:"kavrulmuş",suspicious:"şüpheli",trade:"ticaret",politics:"politika"}},{title:"33. Credit",src:"Credit male us.mp3",text:'The word credit has a very deep and personal history that comes from the Latin word credere, which means "to trust" or "to believe." In the ancient world, if you gave someone credit, it meant that you "believed" they were an honest person who would pay you back later. It was not just about money; it was about your reputation and your good name in the community. As international trade grew in the Middle Ages, merchants and bankers in Italy and France began using the word to describe financial loans. They realized that the whole economy depends on people "trusting" each other to follow through on their promises. Today, we use credit cards every day to buy things, but the core idea has never changed: the bank "believes" in our ability to pay the money back. We also use the word in other ways, such as giving someone "credit" for a job well done, which means we "believe" they are responsible for the success. It is a powerful word that connects our modern financial system to the ancient human value of trust. Without credit, the modern world and its commerce would simply stop working.',dictionary:{trust:"güvenmek",believe:"inanmak",reputation:"itibar",financial:"finansal",loans:"krediler",promises:"sözler",commerce:"ticaret"}},{title:"34. Croupier",src:"Croupier male us.mp3",text:`The word croupier has a very surprising history that starts on the back of a horse! In the French language, the word croupe refers to the back part of a horse’s body. Originally, a croupier was a person who sat on the back of a horse behind the main rider to offer support and help. Later, in the seventeenth century, this idea moved from the world of horses to the world of gambling in France. In early gambling houses, a wealthy person would often bring a friend or a servant to stand "behind" them while they played. This person's job was to watch the money, give advice, and make sure everything was fair. They were "sitting on the back" of the player for support! Eventually, the name was given to the professional worker hired by the house to manage the table, collect the bets, and give out the winnings. Today, a croupier is the skilled professional who runs the games in a modern casino with speed and elegance. It is amazing to think that this fancy title for a casino expert actually started with a person sitting on the back of a horse to help a rider.`,dictionary:{surprising:"şaşırtıcı",rider:"binici",support:"destek",gambling:"kumar",manage:"yönetmek",skilled:"yetenekli",elegance:"zarafet"}},{title:"35. Deodorant",src:"Deodorant female us.mp3",text:`The word deodorant is a very logical name that describes exactly what the product does. It is made of two parts from the Latin language. The root word is odor, which means "a smell" or "a scent." The prefix de- means "to remove" or "to take away." So, a deodorant is literally something that "takes away smells." Before this product was invented, people used heavy perfumes to try and hide their body odors, but this didn't always work very well! The first modern, branded deodorant was invented in Philadelphia in 1888. It was a thick cream called "Mum," named after the nurse who created it. Later, in the 1940s, a researcher invented the first "roll-on" version, which was inspired by the design of a ballpoint pen! Today, using a deodorant is part of the daily morning routine for millions of people around the world. It is a word that has become a standard part of our hygiene and health. The name is simple and honest, reminding us that its only job is to help us stay fresh and clean throughout the day, especially in crowded cities or during hot summer weather.`,dictionary:{logical:"mantıklı",scent:"güzel koku",remove:"gidermek/kaldırmak",perfumes:"parfümler",branded:"markalı",inspired:"ilham almış",hygiene:"hijyen"}},{title:"36. Depot",src:"Depot male us.mp3",text:'The word depot comes from the French word dépôt, which means "a place to put things" or "a storehouse." It is derived from the Latin verb deponere, meaning "to put down." In the beginning, a depot was a military building used to keep food, weapons, and uniforms for soldiers. It was a safe place to "put down" important supplies until they were needed for a battle. Later, as the world of transportation grew, the meaning changed. It became the word for a station where a train or a bus would stop to "put down" passengers or goods. In American English, the word is often used for a large store that sells building materials, while in other places, it still refers to a bus or train station. Today, whether it is a place for storage or a place for travel, a depot is always a busy center of activity. The name reminds us that for thousands of years, humans have needed special places to store their things and organize their journeys. It is a word about organization, safety, and the movement of goods and people from one place to another.',dictionary:{storehouse:"depo",supplies:"erzak/malzeme",battle:"savaş",transportation:"ulaşım",passengers:"yolcular",storage:"depolama",activity:"faaliyet"}},{title:"37. Despot",src:"Despot male us.mp3",text:'Until the French revolution, the word despot did not have a negative meaning. The Greek female name Despina is the feminine version of this term, and it is still a very popular name today. However, the French people called Louis XVI a despot due to his tyrannical rule, and ever since then, the word has become a common word to define tyrannical people. The ancient Greeks used the word as a combination of words meaning "house" and "master," hence "the master of the house." Later, the Romans used it for local rulers who were obedient to them. In 1508, the Venetians and the Genoese used "dispotto" as a title for Byzantine city rulers under the Ottoman Empire. Interestingly, this title had been used to emphasize the tribute-paying and obedient rulers who lived under the reign of the Ottomans. With time, the meaning evolved into the opposite, and it became a way to describe a cruel leader who has total power. Today, while Despina is a beautiful name for a girl, despot is a word we use for scary leaders who do not listen to the people they rule.',dictionary:{tyrannical:"zorba",obedient:"itaatkar",tribute:"vergi/haraç",reign:"hükümranlık",cruel:"zalim",evolved:"evrildi",opposite:"zıt"}},{title:"38. Disco",src:"Disco female us.mp3",text:'The word disco is a short version of the French word discothèque. This word was created in the 1940s by combining "disc" (which means a music record) and bibliothèque (which means a library). So, a discothèque was literally a "library of records." In the beginning, these were small clubs in Paris where people went to listen to jazz records because live music was difficult to find during the war. Instead of a live band, there was a "DJ" who played the discs for the crowd. In the 1970s, this style of music became a global phenomenon with bright lights, shiny clothes, and a specific beat for dancing. The long French name was shortened to just disco, and it became the name for the music, the dance style, and the clubs. Even though the "disco era" of the 1970s is over, the word is still used today for any place where people dance to recorded music. It is a great example of how a technical name for a "record library" became a word that represents energy, fun, and the history of nightlife. Every time we go to a disco, we are using a word born from French records.',dictionary:{phenomenon:"fenomen/olgu",shiny:"parlak",nightlife:"gece hayatı",energy:"enerji",shortened:"kısaltılmış",crowd:"kalabalık"}},{title:"39. Doctor",src:"Doctor female us.mp3",text:'The word doctor has a very scholarly history that begins in the ancient Latin language. It comes from the verb docere, which means "to teach." Originally, a doctor was not a person who fixed your broken leg; instead, it was a title given to the most brilliant "teachers" or experts in a university. If you were a doctor, it meant you were a master of your subject and had the authority to teach others. For many centuries, the title was mostly used for experts in law or religion. However, in the Middle Ages, as medicine became a formal science in universities, people who studied the human body also began to receive this title. By the fourteenth century, the word entered English and started to be used specifically for medical professionals. Today, we usually think of a doctor as someone in a white coat at a hospital, but the name still reminds us of its original meaning: a person who has great knowledge and can "teach" us how to be healthy. Whether they have a medical degree or a PhD in history, every doctor is continuing the ancient tradition of being an expert and a teacher for the community.',dictionary:{scholarly:"akademik/ilmi",brilliant:"parlak/zeki",authority:"yetki/otorite",medicine:"tıp",professionals:"uzmanlar",tradition:"gelenek"}},{title:"40. Dolphin",src:"Dolphin male us.mp3",text:'The word dolphin has a very smart history that shows how the ancient Greeks were great observers of nature. It comes from the Greek word delphys, which means "womb." The Greeks called this sea animal delphis, which basically means "the fish with a womb." This is a truly amazing discovery because thousands of years ago, the Greeks noticed that dolphins were not like normal fish that lay eggs. They saw that dolphins are mammals that give birth to live babies and feed them with milk, just like humans and other land animals. This scientific fact was hidden inside their name for over two thousand years! Later, the word traveled into Latin and then into Old French as daulphin. In the Middle Ages, the "Dauphin" was even the title given to the eldest son of the King of France! Today, the dolphin is loved by everyone for its intelligence and its friendly nature. Its name is a reminder that the ancient people were much smarter than we often think. They gave the animal a name that perfectly describes its biology, connecting the ocean world to the world of mammals and the miracle of birth.',dictionary:{observers:"gözlemciler",womb:"rahim",mammals:"memeliler",biology:"biyoloji",miracle:"mucize",intelligence:"zeka",friendly:"dost canlısı"}},{title:"41. Drone",src:"Drone male us.mp3",text:'The word drone has a very "buzzy" history that connects modern technology to the world of insects. In nature, a drone is a male honeybee. Unlike the female worker bees, the male drones do not collect honey or help build the hive; their only job is to fly around and make a low, humming sound. In the 1930s, the British military created small, remote-controlled airplanes that they used for target practice. These planes were not very fast, and they made a very loud, constant humming noise that sounded exactly like a swarm of male bees. Because they made that annoying "buzz," the pilots started calling them drones. For many years, the word was only used by the military for secret projects. However, in the last twenty years, small flying machines with cameras became available for everyone to buy. Today, people use drones for taking photos, delivering packages, and even for farming. The name has become a global word for any flying machine without a pilot. It is a perfect name because even the most expensive and advanced modern drone still makes that same humming sound that gave it its name nearly one hundred years ago.',dictionary:{remote:"uzaktan kumandalı",constant:"sürekli",annoying:"sinir bozucu",delivering:"teslim eden",farming:"tarım",advanced:"gelişmiş"}},{title:"42. Eskimo",src:"Eskimo female us.mp3",text:'The word Eskimo was used to define the people who lived in the circumpolar region of the Earth. This covers areas like Siberia, Greenland, Canada, and Alaska. In 1980, the federation of these native people declared that they would call themselves Inuit and they would accept the word Eskimo as disrespectful. Inuit means "the people" and Inuk means "the person." Arctic people call all humans who live there Inuit. On the other hand, native people from west Alaska continue to call themselves Eskimos because their language does not have the word Inuit. The Cree, a native American nation, encountered the Inuits and called them "escheemau." This meant "eaters of the raw meat" and they meant to insult them. However, the Inuit people are proud of their dietary habits. In time, the French used the word "esquimaux," which later became the global word Eskimo. Today, we use the name Inuit to show respect to these brave people who live in the cold north. It is a story of how a name from an enemy became famous, but the people chose their own name to be more respectful.',dictionary:{disrespectful:"saygısızca",dietary:"beslenme ile ilgili",insult:"aşağılamak",proud:"gururlu",brave:"cesur",respectful:"saygılı"}},{title:"43. Ferry boat",src:"Ferry boat female us.mp3",text:'The word ferry has a very old and solid history that comes from the Germanic and Old English languages. It is related to the ancient word fher, which means "to lead," "to carry," or "to go." For thousands of years, before there were many big bridges, a ferry was a vital way for people to travel across rivers or lakes. It was a boat that "carried" people, animals, and goods from one side to the other. In the past, these were small wooden boats moved by men with long poles or oars. Later, they became large steamships and eventually the massive modern ships that can carry hundreds of cars and trucks across the sea. A ferry boat is essentially a moving piece of road that connects two different pieces of land. The "way" part of the word simply means the path or the road. Today, we use ferries to go to beautiful islands or to cross busy harbors like New York or Istanbul. The name is a simple and honest description of its job: it is a boat that "leads" us to our destination across the water, continuing a tradition that is as old as human travel itself.',dictionary:{vital:"hayati",destination:"varış noktası",bridges:"köprüler",steamships:"buharlı gemiler",essentially:"esas olarak",harbors:"limanlar"}},{title:"44. Fiasco",src:"Fiasco male us.mp3",text:`When there is a failure, all around the world people use the word fiasco. The origin of this word is Italian and it means glass bottle. The relationship between a flop and a bottle is quite interesting. The Venetians were famous for producing glassware. They would create fine glass art pieces. Surely, some pieces had flaws, and instead of throwing them away, they would turn them into glass bottles. This action was called fare fiasco which translates "to make a bottle." The French borrowed this term from the Italians and introduced it to other languages to indicate failure or flop. Nowadays, people use the term fiasco when something goes wrong or it has flaws. So did the Venetian glassmakers when they downgraded a piece of valuable glass with flaws into an ordinary glass bottle. It is a great word because it reminds us that a mistake doesn't have to be a total waste; you can still turn it into something simple and useful like a bottle. Every time a plan fails and someone calls it a fiasco, they are using a word born from the beautiful glass workshops of ancient Venice.`,dictionary:{failure:"başarısızlık",flop:"fiyasko",glassware:"cam eşya",flaws:"kusurlar",downgraded:"değeri düşürüldü",valuable:"değerli",ordinary:"sıradan"}},{title:"45. Flamingo",src:"Flamingo male us.mp3",text:'The name for this beautiful pink bird comes from the Spanish word flamenco. This word is derived from the Latin flamma, which means "a flame" or "a fire." When Spanish explorers first saw these birds standing in the water, they were amazed by the bright, glowing color of their feathers. Under the hot sun, the birds looked like dancing flames of fire. There is also a connec
