<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioVerse - English Audio & Vocabulary Player</title>
  <meta name="description" content="Interactive Spotify-style audio player for English learning with interactive transcript and Turkish flashcards.">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Custom Scrollbars */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #121212; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    /* Range Slider Styling */
    input[type=range] { accent-color: #10b981; }
  </style>
<script src="/_aistudio-iframe.js?v=2f1c016a"></script></head>
<body class="bg-black text-white h-screen w-screen overflow-hidden select-none">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- PLAYLIST DATA ---
    const rawData = {
      defaultPlaylistId: "jokes",
      playlists: {
        jokes: {
          id: "jokes",
          title: "Funny Jokes & Stories",
          description: "44 witty, funny, and clever short English stories with vocabulary and interactive audio.",
          cover: "😂",
          color: "#eab308",
          baseUrl: "https://raw.githubusercontent.com/dogierez/satires-spotify/main/tracks/",
          tracks: [
            { id: "jk_01", title: "1. The Doctor's Advice", audioUrl: "01.mp3", duration: "1:15", transcript: "A man went to the doctor complaining of severe headaches. The doctor said: 'You must stop drinking coffee immediately.' The man replied: 'Doctor, will that cure my headaches?' The doctor answered: 'No, but you won't poke your eye with the spoon anymore!'", keywords: [{word: "Severe", translation: "Şiddetli, ağır"}, {word: "Complain", translation: "Şikayet etmek"}, {word: "Cure", translation: "Tedavi etmek, iyileştirmek"}, {word: "Poke", translation: "Dürtmek, batırmak"}] },
            { id: "jk_02", title: "2. The Golden Watch", audioUrl: "02.mp3", duration: "1:20", transcript: "A grandfather was showing his grandson his precious antique gold watch. 'Your great-grandfather gave this to me on his deathbed,' he said proudly. The boy looked at it in awe and asked: 'How much did you pay for it?' The grandfather smiled: 'Nothing! He was asleep!'", keywords: [{word: "Precious", translation: "Değerli, kıymetli"}, {word: "Antique", translation: "Antika"}, {word: "Deathbed", translation: "Ölüm döşeği"}, {word: "In awe", translation: "Hayranlıkla"}] },
            { id: "jk_03", title: "3. The Math Test", audioUrl: "03.mp3", duration: "1:10", transcript: "Teacher: 'If you have ten dollars in your pocket and you lose three dollars, what do you have in your pocket?' Student: 'A hole in my pocket, teacher!'", keywords: [{word: "Pocket", translation: "Cep"}, {word: "Hole", translation: "Delik"}, {word: "Lose", translation: "Kaybetmek"}] },
            { id: "jk_04", title: "4. The Intelligent Parrot", audioUrl: "04.mp3", duration: "1:35", transcript: "A pet shop owner had a parrot that spoke five languages fluently. A customer walked in and was astonished. He asked the parrot: 'Can you speak French?' The parrot answered: 'Oui, monsieur!' The customer said: 'Can you speak German?' The parrot replied: 'Jawohl!' Astonished, the customer bought the bird immediately. At home, the parrot stayed silent for three days. Finally the man asked: 'Why won't you talk?' The parrot replied: 'I only talk when I get paid!'", keywords: [{word: "Fluently", translation: "Akıcı bir şekilde"}, {word: "Astonished", translation: "Şaşkına dönmüş"}, {word: "Silent", translation: "Sessiz"}, {word: "Get paid", translation: "Ödeme almak"}] },
            { id: "jk_05", title: "5. Late for School", audioUrl: "05.mp3", duration: "1:05", transcript: "Mother: 'Wake up, Johnny! It is time to go to school!' Johnny: 'I don't want to go. The kids hate me, and the teachers despise me.' Mother: 'You have no choice, Johnny.' Johnny: 'Give me two good reasons why I should go.' Mother: 'First, you are forty-five years old. Second, you are the principal!'", keywords: [{word: "Despise", translation: "Hor görmek, nefret etmek"}, {word: "Choice", translation: "Seçim, seçenek"}, {word: "Principal", translation: "Okul müdürü"}] }
          ]
        },
        business: {
          id: "business",
          title: "Business & Career English",
          description: "Professional workplace dialogs, meetings, negotiations, and corporate vocabulary.",
          cover: "💼",
          color: "#3b82f6",
          baseUrl: "https://raw.githubusercontent.com/dogierez/audioverse-business/main/audio/",
          tracks: [
            { id: "bs_01", title: "1. Pitching a Product", audioUrl: "bs_01.mp3", duration: "1:40", transcript: "Good morning team. Today I want to walk you through our latest quarterly performance and our strategic roadmap for Q4. We have observed a 25% increase in user retention across all mobile platforms.", keywords: [{word: "Quarterly", translation: "Üç aylık"}, {word: "Strategic", translation: "Stratejik"}, {word: "Retention", translation: "Müşteri tutma"}, {word: "Roadmap", translation: "Yol haritası"}] },
            { id: "bs_02", title: "2. Salary Negotiation", audioUrl: "bs_02.mp3", duration: "1:55", transcript: "I would like to discuss my compensation package in light of my recent leadership on the expansion project. My contributions have generated substantial revenue growth.", keywords: [{word: "Compensation", translation: "Tazminat, ücret paketi"}, {word: "In light of", translation: "Işığında, göz önüne alarak"}, {word: "Substantial", translation: "Önemli, kayda değer"}, {word: "Revenue", translation: "Gelir"}] }
          ]
        },
        daily: {
          id: "daily",
          title: "Daily Life & Travel",
          description: "Everyday situations: airport check-in, ordering food, hotel booking, and casual conversations.",
          cover: "✈️",
          color: "#10b981",
          baseUrl: "https://raw.githubusercontent.com/dogierez/audioverse-daily/main/audio/",
          tracks: [
            { id: "dl_01", title: "1. At the Airport Check-in", audioUrl: "dl_01.mp3", duration: "1:30", transcript: "Good morning. May I please see your passport and flight booking confirmation? Would you prefer a window or an aisle seat for this flight?", keywords: [{word: "Passport", translation: "Pasaport"}, {word: "Confirmation", translation: "Onay"}, {word: "Aisle", translation: "Koridor (uçakta/otobüste)"}] },
            { id: "dl_02", title: "2. Ordering in a Restaurant", audioUrl: "dl_02.mp3", duration: "1:45", transcript: "Welcome to our bistro! Are you ready to order, or would you like a few more minutes to look over the chef's specials today?", keywords: [{word: "Bistro", translation: "Küçük restoran"}, {word: "Look over", translation: "Göz gezdirmek"}, {word: "Specials", translation: "Günün özel yemekleri"}] }
          ]
        }
      }
    };

    function App() {
      const [playlists, setPlaylists] = useState(rawData.playlists);
      const [currentPlaylistId, setCurrentPlaylistId] = useState(rawData.defaultPlaylistId);
      const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [playbackRate, setPlaybackRate] = useState(1.0);
      const [repeatMode, setRepeatMode] = useState('off'); // 'off' | 'all' | 'one'
      const [isShuffle, setIsShuffle] = useState(false);
      const [volume, setVolume] = useState(0.9);
      const [isMuted, setIsMuted] = useState(false);
      const [showTranscript, setShowTranscript] = useState(true);
      const [activeTab, setActiveTab] = useState('player'); // 'player' | 'vocab' | 'quiz'
      const [savedWords, setSavedWords] = useState(() => {
        try { return JSON.parse(localStorage.getItem('saved_vocab') || '[]'); } catch { return []; }
      });
      const [selectedWord, setSelectedWord] = useState(null);

      const audioRef = useRef(null);

      const currentPlaylist = playlists[currentPlaylistId] || playlists[rawData.defaultPlaylistId];
      const currentTrack = currentPlaylist?.tracks[currentTrackIndex] || currentPlaylist?.tracks[0];

      // Play specific track
      const playTrack = (index, autoPlay = true) => {
        setCurrentTrackIndex(index);
        const track = currentPlaylist.tracks[index];
        if (!track) return;

        let fullUrl = track.audioUrl;
        if (!fullUrl.startsWith('http')) {
          fullUrl = (currentPlaylist.baseUrl || '') + fullUrl;
        }

        if (audioRef.current) {
          audioRef.current.src = fullUrl;
          audioRef.current.playbackRate = playbackRate;
          if (autoPlay) {
            audioRef.current.play().then(() => setIsPlaying(true)).catch(() => setIsPlaying(false));
          }
        }
      };

      // Toggle Play/Pause
      const togglePlay = () => {
        if (!audioRef.current) return;
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          audioRef.current.play().then(() => setIsPlaying(true)).catch(e => console.log(e));
        }
      };

      // Next / Prev
      const handleNext = () => {
        if (!currentPlaylist || !currentPlaylist.tracks.length) return;
        if (isShuffle) {
          const rand = Math.floor(Math.random() * currentPlaylist.tracks.length);
          playTrack(rand, true);
          return;
        }
        const next = (currentTrackIndex + 1) % currentPlaylist.tracks.length;
        playTrack(next, true);
      };

      const handlePrev = () => {
        if (currentTime > 3) {
          if (audioRef.current) audioRef.current.currentTime = 0;
          return;
        }
        const prev = (currentTrackIndex - 1 + currentPlaylist.tracks.length) % currentPlaylist.tracks.length;
        playTrack(prev, true);
      };

      // Save word
      const handleSaveWord = (word, trans) => {
        const exists = savedWords.some(w => w.word.toLowerCase() === word.toLowerCase());
        let updated;
        if (exists) {
          updated = savedWords.filter(w => w.word.toLowerCase() !== word.toLowerCase());
        } else {
          updated = [...savedWords, { word, trans, date: Date.now(), lesson: currentTrack.title }];
        }
        setSavedWords(updated);
        localStorage.setItem('saved_vocab', JSON.stringify(updated));
      };

      const formatTime = (secs) => {
        if (isNaN(secs) || secs === 0) return '0:00';
        const m = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      // Initialize Lucide icons on render
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Initial track load
      useEffect(() => {
        if (currentTrack) {
          let fullUrl = currentTrack.audioUrl;
          if (!fullUrl.startsWith('http')) {
            fullUrl = (currentPlaylist.baseUrl || '') + fullUrl;
          }
          if (audioRef.current) audioRef.current.src = fullUrl;
        }
      }, []);

      return (
        <div className="flex h-screen w-screen bg-black text-white overflow-hidden select-none font-sans">
          {/* Native Audio Element */}
          <audio
            ref={audioRef}
            preload="auto"
            onTimeUpdate={() => audioRef.current && setCurrentTime(audioRef.current.currentTime)}
            onLoadedMetadata={() => audioRef.current && setDuration(audioRef.current.duration || 0)}
            onEnded={() => {
              if (repeatMode === 'one') {
                if (audioRef.current) {
                  audioRef.current.currentTime = 0;
                  audioRef.current.play();
                }
              } else {
                handleNext();
              }
            }}
          />

          {/* Left Sidebar */}
          <div className="w-64 bg-zinc-950 flex flex-col border-r border-zinc-850 p-4 shrink-0 hidden md:flex">
            <div className="flex items-center gap-3 px-2 mb-6">
              <div className="w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center text-black font-black text-xl shadow-lg shadow-emerald-500/20">
                🎧
              </div>
              <div>
                <h1 className="font-extrabold text-base tracking-tight text-white">AudioVerse</h1>
                <p className="text-[11px] text-zinc-400 font-medium">English Learning Hub</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="space-y-1 mb-6">
              <button 
                onClick={() => setActiveTab('player')}
                className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-semibold transition-all ${
                  activeTab === 'player' ? 'bg-zinc-800 text-white' : 'text-zinc-400 hover:text-white hover:bg-zinc-900'
                }`}
              >
                <i data-lucide="music" className="w-4 h-4 text-emerald-400"></i>
                Lessons & Tracks
              </button>
              <button 
                onClick={() => setActiveTab('vocab')}
                className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-semibold transition-all ${
                  activeTab === 'vocab' ? 'bg-zinc-800 text-white' : 'text-zinc-400 hover:text-white hover:bg-zinc-900'
                }`}
              >
                <i data-lucide="book-open" className="w-4 h-4 text-amber-400"></i>
                Saved Words
                <span className="ml-auto text-xs px-2 py-0.5 rounded-full bg-zinc-700 text-zinc-300">
                  {savedWords.length}
                </span>
              </button>
            </div>

            <div className="text-[11px] font-bold uppercase tracking-wider text-zinc-500 px-3 mb-2">
              Playlists
            </div>

            {/* Playlists List */}
            <div className="space-y-1 overflow-y-auto custom-scrollbar flex-1">
              {Object.values(playlists).map(p => (
                <button
                  key={p.id}
                  onClick={() => {
                    setCurrentPlaylistId(p.id);
                    setCurrentTrackIndex(0);
                    setActiveTab('player');
                    playTrack(0, isPlaying);
                  }}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left transition-all ${
                    currentPlaylistId === p.id && activeTab === 'player'
                      ? 'bg-zinc-850 text-emerald-400 font-bold border border-zinc-700/60'
                      : 'text-zinc-300 hover:bg-zinc-900/80 hover:text-white'
                  }`}
                >
                  <span className="text-xl">{p.cover}</span>
                  <div className="min-w-0 flex-1">
                    <p className="text-xs font-semibold truncate leading-tight">{p.title}</p>
                    <p className="text-[10px] text-zinc-500 font-normal mt-0.5">{p.tracks.length} audio tracks</p>
                  </div>
                </button>
              ))}
            </div>
          </div>

          {/* Main Content Area */}
          <div className="flex-1 flex flex-col bg-zinc-950 overflow-hidden relative">
            {/* Top Bar on Mobile */}
            <div className="md:hidden flex items-center justify-between p-4 bg-zinc-900 border-b border-zinc-800">
              <div className="flex items-center gap-2">
                <span className="text-xl">🎧</span>
                <span className="font-bold text-sm">AudioVerse</span>
              </div>
              <div className="flex gap-2">
                {Object.values(playlists).map(p => (
                  <button 
                    key={p.id}
                    onClick={() => {
                      setCurrentPlaylistId(p.id);
                      playTrack(0, isPlaying);
                    }}
                    className={`px-3 py-1 rounded-full text-xs font-bold ${
                      currentPlaylistId === p.id ? 'bg-emerald-500 text-black' : 'bg-zinc-800 text-zinc-300'
                    }`}
                  >
                    {p.cover} {p.title.split(' ')[0]}
                  </button>
                ))}
              </div>
            </div>

            {/* Tab: Main Player */}
            {activeTab === 'player' && (
              <div className="flex-1 overflow-y-auto custom-scrollbar p-6 pb-36">
                {/* Playlist Banner Header */}
                <div 
                  className="rounded-2xl p-6 mb-6 flex flex-col md:flex-row items-center md:items-end gap-6 shadow-xl border border-white/10"
                  style={{ background: `linear-gradient(135deg, ${currentPlaylist.color}33 0%, rgba(24,24,27,0.95) 100%)` }}
                >
                  <div className="w-32 h-32 md:w-40 md:h-40 rounded-xl bg-black/50 border border-white/10 flex items-center justify-center text-6xl md:text-7xl shadow-2xl shrink-0">
                    {currentPlaylist.cover}
                  </div>
                  <div className="flex-1 text-center md:text-left">
                    <span className="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-white/20 text-white">
                      Listening Lesson Series
                    </span>
                    <h1 className="text-2xl md:text-4xl font-black text-white mt-2 mb-1">
                      {currentPlaylist.title}
                    </h1>
                    <p className="text-xs md:text-sm text-zinc-300 max-w-2xl font-normal leading-relaxed">
                      {currentPlaylist.description}
                    </p>
                    <div className="mt-4 flex items-center justify-center md:justify-start gap-4">
                      <button
                        onClick={togglePlay}
                        className="px-6 py-2.5 rounded-full bg-emerald-500 hover:bg-emerald-400 text-black font-bold flex items-center gap-2 shadow-lg shadow-emerald-500/25 transition-transform hover:scale-105 active:scale-95"
                      >
                        <i data-lucide={isPlaying ? "pause" : "play"} className="w-5 h-5 fill-black"></i>
                        <span>{isPlaying ? "Pause Audio" : "Play Lesson"}</span>
                      </button>
                      <button
                        onClick={() => setShowTranscript(!showTranscript)}
                        className={`px-4 py-2 rounded-full text-xs font-semibold border transition-all ${
                          showTranscript ? 'bg-emerald-500/10 border-emerald-500/60 text-emerald-400' : 'border-zinc-700 text-zinc-300 hover:border-zinc-500'
                        }`}
                      >
                        {showTranscript ? "Hide Transcript" : "Show Transcript"}
                      </button>
                    </div>
                  </div>
                </div>

                {/* Interactive Transcript Panel */}
                {showTranscript && currentTrack && (
                  <div className="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-5 mb-6 shadow-lg">
                    <div className="flex items-center justify-between mb-3 border-b border-zinc-800 pb-3">
                      <div className="flex items-center gap-2">
                        <span className="text-emerald-400 font-bold text-sm">Interactive English Transcript</span>
                        <span className="text-[10px] bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded-full">Tap any vocabulary below</span>
                      </div>
                      <span className="text-xs text-zinc-400 font-mono">{currentTrack.duration}</span>
                    </div>

                    <p className="text-base md:text-lg text-zinc-100 font-medium leading-relaxed mb-4">
                      {currentTrack.transcript}
                    </p>

                    {/* Vocabulary Chips */}
                    {currentTrack.keywords && currentTrack.keywords.length > 0 && (
                      <div className="mt-4 pt-3 border-t border-zinc-800/80">
                        <div className="text-[11px] font-bold uppercase tracking-wider text-emerald-400 mb-2 flex items-center gap-1.5">
                          <span>🇹🇷 Key Vocabulary & Turkish Meanings:</span>
                        </div>
                        <div className="flex flex-wrap gap-2">
                          {currentTrack.keywords.map((kw, i) => {
                            const isSaved = savedWords.some(w => w.word.toLowerCase() === kw.word.toLowerCase());
                            return (
                              <button
                                key={i}
                                onClick={() => handleSaveWord(kw.word, kw.translation)}
                                className={`flex items-center gap-2 px-3 py-1.5 rounded-xl border text-xs font-semibold transition-all ${
                                  isSaved 
                                    ? 'bg-amber-500/20 border-amber-500/60 text-amber-300' 
                                    : 'bg-zinc-800 border-zinc-700 text-zinc-200 hover:border-emerald-500/50'
                                }`}
                                title="Click to bookmark word"
                              >
                                <span className="font-bold text-white">{kw.word}:</span>
                                <span className="text-zinc-400 font-normal">{kw.translation}</span>
                                <span className="text-[10px]">{isSaved ? "⭐" : "☆"}</span>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* Track List */}
                <div className="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl overflow-hidden">
                  <div className="px-4 py-3 border-b border-zinc-800 text-xs font-bold text-zinc-400 uppercase tracking-wider grid grid-cols-12">
                    <span className="col-span-1">#</span>
                    <span className="col-span-8">Lesson Title</span>
                    <span className="col-span-3 text-right">Length</span>
                  </div>

                  <div className="divide-y divide-zinc-800/40">
                    {currentPlaylist.tracks.map((t, idx) => {
                      const isCurrent = currentTrackIndex === idx;
                      return (
                        <div
                          key={t.id}
                          onClick={() => playTrack(idx, true)}
                          className={`grid grid-cols-12 items-center px-4 py-3.5 cursor-pointer transition-colors ${
                            isCurrent ? 'bg-zinc-850 text-emerald-400' : 'text-zinc-300 hover:bg-zinc-800/60 hover:text-white'
                          }`}
                        >
                          <span className="col-span-1 text-xs font-mono">
                            {isCurrent && isPlaying ? "▶️" : idx + 1}
                          </span>
                          <div className="col-span-8 pr-2">
                            <p className="text-sm font-semibold leading-snug">{t.title}</p>
                            <p className="text-[11px] text-zinc-500 truncate max-w-md">{t.transcript}</p>
                          </div>
                          <span className="col-span-3 text-right text-xs font-mono text-zinc-400">
                            {t.duration}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* Tab: Saved Vocabulary */}
            {activeTab === 'vocab' && (
              <div className="flex-1 overflow-y-auto custom-scrollbar p-6 pb-36">
                <div className="flex items-center justify-between mb-6">
                  <div>
                    <h2 className="text-2xl font-black text-white">⭐ Saved Turkish Vocabulary</h2>
                    <p className="text-xs text-zinc-400">Words and phrases you saved during your lessons</p>
                  </div>
                  {savedWords.length > 0 && (
                    <button
                      onClick={() => {
                        if (confirm("Clear all saved vocabulary?")) {
                          setSavedWords([]);
                          localStorage.removeItem('saved_vocab');
                        }
                      }}
                      className="text-xs text-red-400 hover:underline"
                    >
                      Clear All
                    </button>
                  )}
                </div>

                {savedWords.length === 0 ? (
                  <div className="text-center py-20 bg-zinc-900/40 rounded-2xl border border-zinc-800">
                    <p className="text-4xl mb-3">📖</p>
                    <p className="text-base font-semibold text-zinc-300">No saved words yet</p>
                    <p className="text-xs text-zinc-500 mt-1">Tap any vocabulary card while listening to save it here.</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {savedWords.map((item, idx) => (
                      <div key={idx} className="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col justify-between hover:border-amber-500/50 transition-colors">
                        <div>
                          <div className="flex items-center justify-between mb-1">
                            <span className="text-base font-bold text-white">{item.word}</span>
                            <button
                              onClick={() => handleSaveWord(item.word, item.trans)}
                              className="text-xs text-zinc-500 hover:text-red-400"
                            >
                              ✕
                            </button>
                          </div>
                          <p className="text-sm text-emerald-400 font-semibold">{item.trans}</p>
                        </div>
                        <p className="text-[10px] text-zinc-500 mt-3 pt-2 border-t border-zinc-800 font-mono">
                          {item.lesson}
                        </p>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Bottom Sticky Player Bar */}
          <div className="fixed bottom-0 left-0 right-0 h-24 bg-zinc-950/95 backdrop-blur-xl border-t border-zinc-800 px-4 md:px-6 flex items-center justify-between z-50">
            {/* Track Info */}
            <div className="flex items-center gap-3 w-1/4 min-w-[160px]">
              <div className="w-12 h-12 rounded-lg bg-zinc-800 border border-zinc-700 flex items-center justify-center text-2xl shrink-0">
                {currentPlaylist?.cover || "🎵"}
              </div>
              <div className="min-w-0">
                <p className="text-xs md:text-sm font-bold text-white truncate">{currentTrack?.title || "No Track"}</p>
                <p className="text-[11px] text-zinc-400 truncate">{currentPlaylist?.title}</p>
              </div>
            </div>

            {/* Playback Controls & Progress Bar */}
            <div className="flex flex-col items-center gap-1.5 w-2/4 max-w-xl">
              <div className="flex items-center gap-4">
                {/* Shuffle */}
                <button
                  onClick={() => setIsShuffle(!isShuffle)}
                  className={`p-1.5 rounded text-xs transition-colors ${isShuffle ? 'text-emerald-400' : 'text-zinc-400 hover:text-white'}`}
                  title="Shuffle"
                >
                  <i data-lucide="shuffle" className="w-4 h-4"></i>
                </button>
                {/* Prev */}
                <button
                  onClick={handlePrev}
                  className="text-zinc-300 hover:text-white transition-colors"
                  title="Previous Track"
                >
                  <i data-lucide="skip-back" className="w-5 h-5"></i>
                </button>
                {/* Play/Pause */}
                <button
                  onClick={togglePlay}
                  className="w-10 h-10 rounded-full bg-white hover:scale-105 active:scale-95 text-black flex items-center justify-center shadow-lg transition-transform"
                  title={isPlaying ? "Pause" : "Play"}
                >
                  <i data-lucide={isPlaying ? "pause" : "play"} className="w-5 h-5 fill-black"></i>
                </button>
                {/* Next */}
                <button
                  onClick={handleNext}
                  className="text-zinc-300 hover:text-white transition-colors"
                  title="Next Track"
                >
                  <i data-lucide="skip-forward" className="w-5 h-5"></i>
                </button>
                {/* Repeat */}
                <button
                  onClick={() => setRepeatMode(prev => prev === 'off' ? 'all' : prev === 'all' ? 'one' : 'off')}
                  className={`p-1.5 rounded text-xs transition-colors ${repeatMode !== 'off' ? 'text-emerald-400 font-bold' : 'text-zinc-400 hover:text-white'}`}
                  title={`Repeat: ${repeatMode}`}
                >
                  <i data-lucide="repeat" className="w-4 h-4"></i>
                  {repeatMode === 'one' && <span className="text-[9px] absolute -mt-2">1</span>}
                </button>
              </div>

              {/* Progress Slider */}
              <div className="w-full flex items-center gap-2 text-[10px] font-mono text-zinc-400">
                <span>{formatTime(currentTime)}</span>
                <input
                  type="range"
                  min="0"
                  max={duration || 100}
                  value={currentTime}
                  onChange={(e) => {
                    const time = Number(e.target.value);
                    if (audioRef.current) audioRef.current.currentTime = time;
                    setCurrentTime(time);
                  }}
                  className="flex-1 h-1 bg-zinc-800 rounded-lg cursor-pointer"
                />
                <span>{formatTime(duration)}</span>
              </div>
            </div>

            {/* Volume & Speed Controls */}
            <div className="flex items-center justify-end gap-3 w-1/4 min-w-[140px]">
              {/* Playback Rate Badge */}
              <button
                onClick={() => {
                  const rates = [0.8, 1.0, 1.25, 1.5];
                  const next = rates[(rates.indexOf(playbackRate) + 1) % rates.length];
                  setPlaybackRate(next);
                  if (audioRef.current) audioRef.current.playbackRate = next;
                }}
                className="px-2 py-0.5 rounded text-[11px] font-mono font-bold bg-zinc-800 hover:bg-zinc-700 text-zinc-300"
                title="Playback Speed"
              >
                {playbackRate}x
              </button>

              {/* Mute / Volume */}
              <button
                onClick={() => {
                  const next = !isMuted;
                  setIsMuted(next);
                  if (audioRef.current) audioRef.current.volume = next ? 0 : volume;
                }}
                className="text-zinc-400 hover:text-white"
              >
                <i data-lucide={isMuted ? "volume-x" : "volume-2"} className="w-4 h-4"></i>
              </button>
              <input
                type="range"
                min="0"
                max="1"
                step="0.05"
                value={isMuted ? 0 : volume}
                onChange={(e) => {
                  const v = Number(e.target.value);
                  setVolume(v);
                  setIsMuted(false);
                  if (audioRef.current) audioRef.current.volume = v;
                }}
                className="w-16 md:w-24 h-1 bg-zinc-800 rounded-lg hidden sm:inline"
              />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
