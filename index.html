ame of this theory was coined by the British psychologist John Bowlby, and literally means one thing holding tightly onto another. Bowlby named it "Attachment" because he believed there was an invisible, almost magical rope or halyard between a newborn baby and the mother or father who cares for it. Just like a giant ship is tied to a safe harbor with thick ropes to protect it from storms, a human infant also attaches to its family to survive. This concept in psychology became a fundamental name explaining how securely that first rope is cast during infancy affects our entire lives.<br><br>If our family lovingly hugs us when we cry as babies, our mind learns the rule "The world is a safe place, I can trust people." Because of this, we form friendships much easier and stronger at school when we grow up. However, children who are left very alone or whose needs are not met when they are babies develop the belief "I can't trust anyone" in their minds. When they grow up, they have a hard time trusting people and are always afraid of forming friendships. It's just like if the first team you joined in a game let you down, you would always be suspicious about joining another team. Fortunately, as people grow up, they can realize and overcome this insecurity.`,dictionary:{coined:"yaratıldı",psychologist:"psikolog",invisible:"görünmez",halyard:"halat",harbor:"liman",infant:"bebek",suspicious:"şüpheci",overcome:"aşmak",insecurity:"güvensizlik"}},{icon:"🚗",title:"2. Baader-Meinhof Phenomenon",src:"2.Baader-Meinhof Phenomenon.m4a",text:`A completely funny coincidence lies behind this weird name. In the 1990s, an American man read the name of an old group called "Baader-Meinhof" in a newspaper. The next day on the radio, and the following day on television, he kept hearing this word, thought he was going crazy, and wrote a letter to the newspaper. The reason for this event was his own brain taking that word onto its new radar, but the letter became so famous that people gave this mind perception the name of the word in the letter.<br><br>Your family bought a very cool, new red car. You are sure you had never seen that car on the streets before, but after the car is bought, you suddenly start seeing that red vehicle on every corner. Actually, those cars are always there, and no one just bought them. It's just that because your brain has newly learned that brand and included it in your life, it has now started to find it like a detective everywhere and show it to you.`,dictionary:{coincidence:"tesadüf",weird:"tuhaf",perception:"algı",vehicle:"araç",detective:"dedektif",radar:"radar"}},{icon:"🛡️",title:"3. Backfire Effect",src:"3.Backfire Effect.m4a",text:`This name is borrowed from firearms or the working logic of battle cannons in ancient times. When you ignite a cannon's fuse to shoot a cannonball at a target, you expect all the energy to go forward. However, sometimes the weapon malfunctions and explodes backward, hitting the person who fired it. Scientists used this term when they saw that trying to persuade people with definitive evidence, instead of moving them forward, caused them to defend their opinions even more harshly (backfiring).<br><br>When definitive information and scientific facts proving that you are completely wrong about a subject are placed in front of you, instead of your mind admitting its mistake and changing its opinion, it gives the exact opposite reaction. You cling to your old wrong opinion much more stubbornly than before. This is because your brain perceives this new correction as a direct "attack" made against you, and it raises its mental shields to protect its pride. This shield is the biggest reason why people can never convince each other in arguments.`,dictionary:{firearms:"ateşli silahlar",ignite:"ateşlemek",fuse:"fitil",malfunctions:"arızalanır",persuade:"ikna etmek",definitive:"kesin",cling:"tutunmak",stubbornly:"inatla",shields:"kalkanlar"}},{icon:"🚂",title:"4. Bandwagon Effect",src:"4.Bandwagon Effect.m4a",text:`The origin of this name comes from political election campaigns in America in the 19th century and an interesting tradition based on circuses. "Bandwagon" was the name given to the giant, ornate, and showy horse-drawn carriages on which the circus's band played music. Politicians would jump onto these musical carriages and tour the city like that to grab the public's attention. People would get caught up in that enthusiastic music and crowd, and start walking behind the carriage. In psychology, this name was given to people blindly joining an idea, "like jumping on a bandwagon," simply because that idea is very popular, and following that crazy crowd.<br><br>Imagine a newly released computer game or a cool pair of shoes. At first, that item might not have caught your attention at all. But when you see that first your three closest friends, and then almost everyone in the class is playing that game, you suddenly feel an irresistible desire to play it. You want that game not because it's the best game in the world, but just to be included in the group and not be left out. Since ancient times, the human brain has been programmed to follow crowds to feel safe. The main reason why trends on the internet or in schools spread so fast like a virus is our mind's desire to conform to the crowd.`,dictionary:{campaigns:"kampanyalar",ornate:"süslü",carriages:"arabalar",enthusiastic:"hevesli/coşkulu",blindly:"körü körüne",irresistible:"karşı konulmaz",desire:"arzu",conform:"uymak"}},{icon:"🪃",title:"5. Boomerang Effect",src:"5.Boomerang Effect.m4a",text:'This name was taken from the boomerang, a curved wooden throwing tool used by indigenous people in Australia for hunting or playing games. The faster and harder you throw a boomerang forward into the air, the more it draws a curve in the air and returns at the same speed to hit the person who threw it. This name was born from the fact that trying to force people to do something, instead of moving forward, misses its target and bounces back, just like this tool.<br><br>You were just about to clean your room when someone came in and yelled harshly, "Clean up this room right now!" Even though you were going to do that task seconds ago, simply because you heard that command and felt your freedom was restricted, you rebel by saying, "Now I will never clean it!" When the human brain feels forced, it automatically opens a defense shield and wants to do the exact opposite of what is requested. Giving orders is the worst way to convince a person.',dictionary:{curved:"kavisli",indigenous:"yerli",bounces:"seker",harshly:"sertçe",restricted:"kısıtlanmış",rebel:"isyan etmek",automatically:"otomatik olarak",convince:"ikna etmek"}},{icon:"🪟",title:"6. Broken Windows Theory",src:"6.Broken Windows Theory.m4a",text:`This theory takes its name from a very simple observation made by two researchers working on criminal psychology while examining American cities. They realized that crimes in neighborhoods never started with big robberies, but always with a single "broken window" of an empty building on the street being left unrepaired. As the window remained broken, other windows were broken too, and then the neighborhood turned into a dump. The theory explaining the collapse of social order through small negligences was symbolically dedicated to that first broken window.<br><br>If a single window is broken in a very beautiful neighborhood and it is not repaired, passersby subconsciously receive the message "There are no rules here," and they start throwing trash everywhere. If you throw just one dirty sock on the floor in your own room and don't pick it up, your brain says "The room is already messy" and throws all your belongings on the floor. If a small deterioration or bad deed is not corrected immediately, it leads to much greater disasters. The easiest way to stop the course of events is to fix that first mistake immediately.`,dictionary:{observation:"gözlem",robberies:"soygunlar",unrepaired:"tamir edilmemiş",dump:"çöplük",collapse:"çöküş",negligences:"ihmaller",subconsciously:"bilinçaltında",deterioration:"bozulma",disasters:"felaketler"}},{icon:"🦋",title:"7. Butterfly Effect",src:"7.Butterfly Effect.m4a",text:'This poetic name is derived from that famous question asked at a scientific meeting by Edward Lorenz, a renowned mathematician and weather expert: "Can the tiny ripple of wind created by a tiny butterfly flapping its wings in the Amazon forests travel the world, gain strength, and cause a massive hurricane in America?" This extraordinary theory, explaining that everything in the universe is connected by invisible bonds, took its name from the wing flap of that delicate insect.<br><br>In time travel movies, if someone who goes to the past accidentally steps on a tiny bug, they see that the whole world has completely changed when they return to the future. In your life as well, a tiny decision today, like taking a different route to school, might cause you to make a very good friend or choose a completely different profession in the future. Tiny decisions we make in life that seem very insignificant have the power to give birth to massive consequences and wonderful adventures over the years.',dictionary:{poetic:"şiirsel",ripple:"dalgalanma",hurricane:"kasırga",extraordinary:"olağanüstü",delicate:"narin",accidentally:"kazara",insignificant:"önemsiz",consequences:"sonuçlar"}},{icon:"👁️",title:"8. Bystander Effect",src:"8.Bystander Effect.m4a",text:'The name of this psychological concept is derived from that weird reaction people give when they are in a massive crowd in the face of an urgent or dangerous situation. Scientists specifically gave it the name "Bystander" because that large crowd not getting involved in the incident simply stands and "watches" as if they were watching a movie at the cinema or a play on stage. Because the responsibility is divided equally among all the bystanders present at that moment, no one wants to take action and be the lead actor of the event. Thus, the name of the event was chosen from the most perfect word describing people preferring to remain purely passive viewers instead of intervening, and it sums up that dangerous inaction created by the crowd very well.<br><br>Imagine someone falling in the school hallway and all their books scattering. If there are fifty people around, everyone just watches from afar, saying to themselves, "Someone else will go and help anyway." The responsibility is distributed to so many people that no one takes a step. But if it were just the two of you in that hallway, you would immediately run and help without thinking because all the responsibility would be entirely on you. As the crowd increases, the rate at which people take action and help each other drops just as rapidly. This is why if you need help in a crowd, you should ask for help from a single person you point out, not from everyone.',dictionary:{urgent:"acil",bystander:"seyirci",equally:"eşit olarak",intervening:"müdahale etmek",inaction:"eylemsizlik",scattering:"dağılan",distributed:"dağıtılmış",rapidly:"hızla"}},{icon:"👤",title:"9. Carl Jung's Shadow Self",src:"9.Carl Jung's Shadow Self.m4a",text:`The famous psychiatrist Carl Jung, the creator of this name, deliberately chose the word "Shadow" to describe the hidden dark sides of the human mind. Because just like having a dark and shapeless shadow that silently follows you from behind wherever you go on a sunny day, there are dark emotions in your mind that never leave you. The shadow belongs to you, but unless you turn and look at it or accept it, it continues to grow in an unseen place behind you and scare you. The name comes from this physical reflection.<br><br>Inside every person lie emotions they are ashamed of and don't want others to see, such as jealousy, sudden flares of anger, or selfishness. Since society always tells us to be good, we lock these bad emotions in the basement of our minds. However, denying these emotions is dangerous because they confront you as a massive outburst of anger when you least expect it. To be a truly strong person, you must befriend that hidden shadow. If you accept it when you feel jealousy, you can tame and control that dark power inside you.`,dictionary:{psychiatrist:"psikiyatrist",deliberately:"kasten",shapeless:"şekilsiz",reflection:"yansıma",ashamed:"utanmış",selfishness:"bencillik",basement:"bodrum",confront:"yüzleşmek",outburst:"patlama",tame:"evcilleştirmek"}},{icon:"💻",title:"10. Cognitive Behavioral Therapy",src:"10.Cognitive Behavioral Therapy.m4a",text:`The name of this concept consists of the combination of two very important words in psychology. The word "Cognitive" means the thoughts, beliefs, and the way we perceive events inside our minds. The word "Behavioral" refers to our physical movements and reactions visible from the outside. This therapy method aims to heal people's wrong actions and habits (behavior) by repairing faulty thoughts (cognition). The name is literally a very clear scientific definition explaining how the software inside the mind and the movement on the outside are connected to each other, and how these two are treated at the same time.<br><br>Think of your mind just like a computer you use every day, and your thoughts as the software running inside that device. Sometimes virus-infected software like "I will never pass the math exam, I am a failure" enters our brains. This therapy is the method of finding those infected thoughts and rewriting them as "If I study, I can do it." It teaches us this: Events do not upset us directly; what upsets us is our own faulty thoughts that we produce about the events. If you manage to notice that small error in your thoughts and change the codes, you can completely fix the emotions you feel and your subsequent behaviors, and become a happier person.`,dictionary:{cognitive:"bilişsel",perceive:"algılamak",behavioral:"davranışsal",faulty:"hatalı",cognition:"biliş",software:"yazılım",infected:"enfekte olmuş",subsequent:"sonraki"}},{icon:"⚖️",title:"11. Cognitive Dissonance",src:"11.Cognitive Dissonance.m4a",text:'The word "Cognitive" in this refers to the beliefs and ideas inside our minds. The word "Dissonance" means contrast, incompatibility, and conflict. This name was first coined by psychologist Leon Festinger, inspired by the disturbing, ear-grating sound (dissonance) produced in music when two completely incompatible keys on a piano are pressed at the same time. It describes the feeling of internal itchiness and discomfort that occurs when a truth and a falsehood clash at the same time in our minds.<br><br>You know you have to get up very early tomorrow (Logic: I should sleep), but you keep playing the game (Behavior). When the truth you believe in and the action you take contradict each other in your brain, you feel distressed. The mind does not like this discomfort at all and immediately makes up excuses: "I worked hard all week, I deserve this," it says, trying to cover up that contrast by telling itself lies. It is our process of constantly deceiving ourselves while making mistakes, even though we know we are wrong.',dictionary:{dissonance:"uyumsuzluk",incompatibility:"uyuşmazlık",disturbing:"rahatsız edici",incompatible:"uyumsuz",falsehood:"yalan",contradict:"çelişmek",distressed:"sıkıntılı",excuses:"bahaneler",deceiving:"kandırmak"}},{icon:"✈️",title:"12. Concorde Fallacy",src:"12.Concorde Fallacy.m4a",text:`This name comes from the famous "Concorde" project, the world's fastest passenger plane jointly produced by England and France years ago. While the two countries were building this supersonic plane, they realized at a very early stage that the plane would incur massive losses and that the project actually made no sense at all. However, because they had already invested so many millions of dollars into the engineering right from the start, they stubbornly continued to pour money into the project knowingly, simply saying, "We have spent so much, we can't quit halfway and turn back now." Ultimately, they sank with a much bigger and historic loss. The scientific world engraved this famous psychological stubbornness, which describes people's inability to accept a loss and insisting on a mistake, into history by naming it after that legendary plane.<br><br>Let's say you started building a giant castle out of Legos. You worked for hours, but realized that the tower was crooked from the foundation and wasn't as beautiful as you planned. The logical thing to do is to immediately break that castle and switch to a brand new model with a solid foundation. But your mind plays a trick on you, and by saying, "I worked for so many hours, if I break it now, my effort will go to waste," it makes you waste your whole day trying to fix that bad castle. Sometimes, simply because they have spent a lot of time or effort in the past, people continue walking on a path they know is completely wrong. In order not to pity past effort and throw your precious future time in the trash, sometimes admitting you were wrong and starting over is the smartest thing you can do.`,dictionary:{jointly:"ortaklaşa",supersonic:"sesten hızlı",incur:"maruz kalmak",stubbornly:"inatla",engraved:"kazınmış",stubbornness:"inatçılık",crooked:"çarpık",foundation:"temel",precious:"değerli"}},{icon:"🔎",title:"13. Confirmation Bias",src:"13.Confirmation Bias.m4a",text:`The name of this concept comes from our brain acting as its own lawyer instead of being a completely impartial detective investigating both sides. A person only gathers clues to prove, that is, to "confirm," what they previously believed. Because they ignore the facts that contradict them and display an attitude entirely tilted towards their own side, that is, "biased," psychology gave this situation this name that describes the brain bending and twisting facts.<br><br>If you believe that your favorite gaming console is the best in the world, you only watch and like videos on the internet that agree with you. You instantly shut down those who criticize your opinion by saying, "They don't know anything." Our brains love it when their own opinion turns out to be correct. Therefore, it only sees the evidence that supports its own belief, and becomes practically blind to opposing facts. If you only listen to those who agree with you on the internet, you become someone who refuses to learn new things.`,dictionary:{impartial:"tarafsız",detective:"dedektif",confirm:"doğrulamak",contradict:"çelişmek",attitude:"tutum",biased:"önyargılı",criticize:"eleştirmek",evidence:"kanıt",opposing:"karşıt"}},{icon:"🦀",title:"14. Crab Mentality",src:"14.Crab Mentality.m4a",text:`This name was found inspired by the buckets or baskets into which fishermen put the live crabs they take out of the sea. There is no need at all to close the lid of that basket. Because just as one of the crabs is about to climb out of the bucket and reach freedom, the other crabs below grab it by the leg and forcefully pull it down back to their side! People's habit of pulling each other down out of jealousy for their success, just like these sea creatures, has been immortalized with this metaphorical name in psychology.<br><br>When you want to do something good in your life, for example, when you decide to eat healthy or read a book, some jealous people around you want to stop you. By saying, "Never mind that, why bother, play games with us," they don't want you to improve and reach a better position than them. You must ignore these people with this mentality trying to pull you to the bottom of the bucket, and you must continue climbing upwards toward your own goals.`,dictionary:{buckets:"kovalar",baskets:"sepetler",freedom:"özgürlük",forcefully:"zorla",jealousy:"kıskançlık",immortalized:"ölümsüzleştirilmiş",metaphorical:"metaforik",ignore:"görmezden gelmek",goals:"hedefler"}},{icon:"👘",title:"15. Diderot Effect",src:"15.Diderot Effect.m4a",text:`This concept comes from a very interesting and true event that happened to the 18th-century French philosopher Denis Diderot himself. Diderot, an impoverished writer, was gifted a very stylish, red, remarkably beautiful new dressing gown (house robe). However, when he sat down at his desk in this flashy outfit, he realized that his old desk did not match this wonderful outfit at all and looked very ugly. First he changed his desk, then the rug in the room started looking old and he threw it away; then he renewed the chairs, and finally the paintings on the walls. This consumption chain, which explains how a single new item creates an obsession in a person's mind to match everything around them to that new quality and drags the person into debt, took its name directly from the philosopher who experienced this event himself.<br><br>Let's say you bought a brand new gaming keyboard with cool, colorful lights for your computer. You are very happy on the first day, but the next day, your old, faded mouse starts looking very dull and ugly next to that wonderful keyboard. You go and buy a new mouse. Then you think your old small monitor doesn't suit this wonderful duo and you want a giant screen; eventually, you even change your desk and chair! Initially, when you only needed a keyboard, your mind made you buy a bunch of things you didn't need at all just to adapt to that "new and perfect" item. To avoid falling into this endless trap that causes people to constantly buy more in shopping malls or on the internet, you must recognize the urge to want another new thing after every new item and know how to be content with what you have.`,dictionary:{impoverished:"yoksul",stylish:"şık",flashy:"gösterişli",consumption:"tüketim",obsession:"takıntı",debt:"borç",faded:"solmuş",dull:"mat/sıkıcı",adapt:"uyum sağlamak",urge:"dürtü",content:"hoşnut/yetinen"}},{icon:"🎮",title:"16. Dunning-Kruger Effect",src:"16.Dunning-Kruger Effect.m4a",text:'This bizarre name comes from two psychologists named David Dunning and Justin Kruger, who researched this topic in 1999. It all started when they read the news of a not-so-smart man who rubbed lemon juice on his face to become invisible and tried to rob a bank. These two scientists discovered that some people are so ignorant that they cannot realize their own ignorance, and therefore they think they are geniuses. Because they scientifically proved the tendency of people to exaggerate their own abilities, they gave this mental fallacy their own surnames directly. Today, the most famous rule explaining ignorant courage in the world of psychology is known by the names of these two men.<br><br>When you start a new strategy game, learning just two buttons and thinking you are the best player in the world is exactly this. However, real professional players or successful scientists always say, "There are still so many tactics and so much information I need to learn." People who know nothing about a subject cannot see how ignorant they are, so they are overly and comically confident in themselves. But as you start to truly learn a subject in-depth, you notice your shortcomings and become much more humble. In short, someone who talks very loudly about something and claims to know everything might actually know nothing about that subject.',dictionary:{bizarre:"tuhaf",invisible:"görünmez",ignorant:"cahil",ignorance:"cehalet",geniuses:"dahiler",tendency:"eğilim",exaggerate:"abartmak",fallacy:"yanılgı",shortcomings:"eksiklikler",humble:"mütevazı"}},{icon:"🦠",title:"17. Emotional Contagion",src:"17.Emotional Contagion.m4a",text:`The origin of this name is taken from the logic of how viruses spread in the medical world to explain how emotions follow a path among people. The word "Contagion" is usually used for illnesses that spread rapidly in schools during the winter months, like colds, the flu, or the sniffles. Because scientists realized that a person's joy, anger, or fear also passes from person to person through the air, sneezing, or contact, just like these viruses, they directly gave this psychological condition this name where illnesses spread.<br><br>When everything is very quiet in class, if someone randomly starts giggling, even if you don't know what the joke is, you suddenly start laughing too. Or, even though you woke up very joyful in the morning, when you sit down for breakfast with someone who is very angry and grumpy, your energy is suddenly drained as well. Because we are social creatures, our brains are programmed to quickly adapt to the emotional state of the people around us. Therefore, if you surround yourself with people who constantly complain, that negativity will infect you too. For your own happiness, you should choose cheerful friends.`,dictionary:{contagion:"bulaşma",rapidly:"hızla",sniffles:"burun çekme/nezle",sneezing:"hapşırma",randomly:"rastgele",giggling:"kıkırdama",grumpy:"huysuz",drained:"tükenmiş",complain:"şikayet etmek"}},{icon:"🎯",title:"18. Fundamental Attribution Error",src:"18.Fundamental Attribution Error.m4a",text:`The word "Attribution" in this name means assigning the cause of an event or behavior to something, pointing to a target in psychology. The human brain is very lazy when judging others. Instead of investigating why the other person made a mistake, it instantly attributes the problem to the person's character. Thus, this most classic, fundamental, and common faulty judgment process that people fall into in seconds every single day has been given this heavy but explanatory name with all its details in the scientific world.<br><br>If someone takes your spot in line at the canteen, you immediately think, "What a disrespectful, rude, and bad person!" However, if you rush and cut in front of someone else with just one second left before the class bell rings, you say, "I'm in a big hurry today, otherwise I am a very polite person." While we ruthlessly attribute the mistakes people make to their bad character, we always tend to attribute our own mistakes to bad luck or a difficult situation. Realizing that the other person might also be in a hurry makes us much more understanding.`,dictionary:{attribution:"atıf",assigning:"atamak",judging:"yargılamak",fundamental:"temel",explanatory:"açıklayıcı",disrespectful:"saygısız",ruthlessly:"acımasızca",tend:"eğiliminde olmak",understanding:"anlayışlı"}},{icon:"😇",title:"19. Halo Effect",src:"19.Halo Effect.m4a",text:`This word comes from "Halo," the English name given to that bright ring of light drawn right above the heads of angels or saints in pictures. Psychologist Edward Thorndike discovered that people become blinded by a single good trait of a person when evaluating them. Just as if that person had a shining angelic halo on their head, this mind trick that causes us to ignore all other negative traits in a person by looking only at that glowing feature was named after that dazzling ring above the head.<br><br>When we see a new kid at school playing soccer very well or dressing very coolly, our mind gets lazy. It automatically assumes that they are very smart, very fun, and a wonderful person. Looking at only a single positive ability of a person and thinking they are perfect in everything is a big mistake. However, in real life, someone being good at sports never guarantees that they will not lie or that they will be a loyal friend. We shouldn't be fooled by a single good trait when getting to know people.`,dictionary:{halo:"hale",saints:"azizler",trait:"özellik",evaluating:"değerlendirmek",glowing:"parlayan",dazzling:"göz kamaştırıcı",assumes:"varsayar",guarantees:"garanti eder",fooled:"kandırılmış"}},{icon:"🏭",title:"20. Hawthorne Effect",src:"20.Hawthorne Effect.m4a",text:`The source of this name is based on the very famous experiments conducted in the 1920s at a massive electrical factory in America called "Hawthorne Works." Scientists wanted to find out how turning the factory lights on and off or changing break times would affect the workers' production. Something very strange happened: Whether they increased or dimmed the lights, the workers started working much better every single time! Finally, the scientists realized the truth: The workers weren't reacting to the lights, they were just working much harder than normal because they knew they were being "watched" by the scientists. The rule that being watched changes human behavior takes its name from that factory.<br><br>Think about how you behave when the teacher is in the classroom versus when they are not. If the school principal came in during the lesson, sat in the back row, and just watched the class, even the most mischievous student would suddenly sit up straight, become very quiet, and look like they were focused on the lesson. Because the human brain completely changes all of its behaviors the moment it realizes it is being watched or observed by someone authoritative or important. When we feel that a spotlight or a camera is on us, we automatically want to turn into our most perfect and hardworking version that follows the rules.`,dictionary:{conducted:"yürütülen",dimmed:"karartılmış",reacting:"tepki veren",mischievous:"yaramaz",observed:"gözlemlenmiş",authoritative:"yetkili",spotlight:"sahne ışığı",hardworking:"çalışkan"}},{icon:"🦍",title:"21. Invisible Gorilla Test",src:"21.Invisible Gorilla Test.m4a",text:`The very funny name of this experiment comes from the video test prepared by psychologists Christopher Chabris and Daniel Simons. In the video, viewers trying to count people passing a ball to each other claimed they "never saw" a man in a giant gorilla suit walking onto the stage right in the middle of the video and looking at the camera. This experiment, which proved how a giant gorilla instantly becomes invisible in the face of human brain focus, got its fame directly from that massive and unnoticed gorilla.<br><br>When you are trying to pass a very difficult and attention-demanding level on the computer, you don't even hear someone calling you from the back room because you are hyper-focused. When our brain focuses on a specific task or thought with all its energy, it temporarily turns off the cameras and microphones around it. You can't even see very obvious and huge things standing right in front of your eyes. This condition, also called inattentional blindness, perfectly shows how our brain uses energy efficiently.`,dictionary:{claimed:"iddia etti",instantly:"anında",unnoticed:"fark edilmeyen",temporarily:"geçici olarak",obvious:"apaçık/belli",inattentional:"dikkatsizlikten kaynaklanan",blindness:"körlük",efficiently:"verimli bir şekilde"}},{icon:"⚔️",title:"22. J.Campbell's Hero's Journey",src:"22.J.Campbell's Hero's Journey.m4a",text:"The source of this name is the author Joseph Campbell, who dedicated his life to researching ancient myths and fairy tales around the world. When Campbell examined thousands of epics from different cultures, he found that they all actually followed the same basic map. In every story, the main character leaves their safe home, embarks on a dangerous adventure (Journey), and finally defeats the great evil and returns as a changed person (Hero). Because he proved that all great stories in history have the same skeleton, this theory was given his name.<br><br>Think of your favorite movies: Harry Potter, Star Wars, or Lord of the Rings. Their stories are all exactly the same! An ordinary character is called to adventure, meets a wise teacher, passes difficult tests, makes friends, fights the main villain, and returns home as a completely empowered, knowledgeable person. We humans love these stories a lot because this template is actually our own growth story. Dealing with difficulties at school and facing our fears are the steps of our own heroic journey.",dictionary:{dedicated:"adadı",myths:"mitler",epics:"destanlar",embarks:"atılır",defeats:"yener",skeleton:"iskelet",ordinary:"sıradan",villain:"kötü adam",empowered:"güçlenmiş",template:"şablon"}},{icon:"⛓️",title:"23. Learned Helplessness",src:"23.Learned Helplessness.m4a",text:`The name of this concept emerged during an experiment conducted on animals by American psychologist Martin Seligman. Seligman discovered that helplessness is not an innate trait, but a "learning" process that gets engraved into the mind later on due to bad experiences in the past. Even in situations where they could escape whenever they wanted, the animals in the experiment chose not to escape because of their past failures, meaning they had memorized helplessness. Therefore, the situation was called "Learned" because the mind accepted giving up as a rule, and "Helplessness" because it did not try even though it had the power.<br><br>If you die ten times in the same level in a difficult game, after a while you might give up completely, saying, "No matter what I do, I will never be able to finish this level." Even if things get easier, you stop trying. When people experience consecutive failures, they bow down to failure even if they have the power to overcome it. However, just because you couldn't do something in the past doesn't mean you won't find the right tactic today. You must never stop trying by falling into this "I can't do it" trap that your mind plays on you.`,dictionary:{emerged:"ortaya çıktı",innate:"doğuştan",engraved:"kazınmış",failures:"başarısızlıklar",memorized:"ezberlemiş",consecutive:"üst üste",bow:"boyun eğmek",overcome:"aşmak",tactic:"taktik"}},{icon:"🧠",title:"24. Mandela Effect",src:"24.Mandela Effect.m4a",text:`The source of this name is a very bizarre claim made by a writer named Fiona Broome in 2009. The writer said she very clearly remembered that Nelson Mandela, the leader of South Africa, died in prison in the 1980s. However, Mandela was still alive at that time (he died in 2013). But what was shocking was that tens of thousands of people on the internet supported the writer, saying, "Yes, we watched his funeral on television!" This famous leader's name was given to the phenomenon of large masses sharing a false memory as if it were completely real.<br><br>You remember the tip of Pikachu's tail being black from the cartoon you've watched since childhood, right? Or that the Monopoly man had a monocle on his eye? Actually, Pikachu's tail is completely yellow, and that man never had glasses. People's brains sometimes create made-up memories to fill in the blanks. As these memories are talked about with each other, they spread like a virus, and a giant group of people starts believing in a lie that never actually happened as if it were absolute truth.`,dictionary:{bizarre:"tuhaf",claim:"iddia",funeral:"cenaze",phenomenon:"olgu/fenomen",masses:"kitleler",monocle:"tek camlı gözlük","made-up":"uydurma",spread:"yayılır",absolute:"mutlak"}},{icon:"🍬",title:"25. Marshmallow Experiment",src:"25.Marshmallow Experiment.m4a",text:'The name of this famous psychology experiment comes from the candy used as the main material of the test at Stanford University in the 1960s. Psychologist Walter Mischel takes children into an empty room and puts a "Marshmallow," a spongy sweet very popular among children in America, on the table. This very important scientific research, which measures how willpower and patience are connected to success in life, despite its seriousness, has been charmingly engraved in history with the name of that innocent and tempting soft candy.<br><br>If they put a chocolate you really love in front of you and said, "If you wait fifteen minutes without eating it, I will give you another one," could you hold out? Being able to give up instant entertainment and be patient for bigger rewards is just like not spending your gold immediately in a game but saving it to buy the strongest sword. Scientists have proven that these children who managed to be patient when they were little became much more successful at school and at work when they grew up. Patience is the secret superpower in life.',dictionary:{spongy:"süngerimsi",willpower:"irade",patience:"sabır",charmingly:"çekici bir şekilde",innocent:"masum",tempting:"cezbedici",instant:"anlık",rewards:"ödüller"}},{icon:"🧗",title:"26. Maslow's Hierarchy of Needs",src:"26.Maslow's Hierarchy of Needs.m4a",text:`The name of this theory comes from the world-famous American psychologist Abraham Maslow, who put it forward. When Maslow examined people's goals and needs in life, he realized that they were not random. He named this system a "Hierarchy" because he drew all these needs in the form of a pyramid, that is, steps that are climbed step by step from bottom to top. Because he argued that one cannot go up to higher steps without satisfying the basic needs at the very bottom of the pyramid, this term permanently settled in the world of psychology as "Maslow's Hierarchy of Needs." The name is literally the scientific name of the upward-narrowing stepped system drawn by this scientist, and it represents the strict rules of the system that progress step by step.<br><br>You can think of this like a tough survival game you are playing. If your character has very low health, is sleepless, or is very hungry, they cannot go and focus on the mission to save the world. Humans are just like these game characters. First, we must feed our stomachs and survive physically, which is the first level. At the second level, we need to feel safe and warm. At the third level, we want to make friends and belong to a group. The fourth level is being appreciated by others and being proud of our achievements. The final level, the boss level, is using all our talents to reach the peak of our potential, that is, self-actualization. We can never reach the upper levels without completely passing the lower levels.`,dictionary:{hierarchy:"hiyerarşi",pyramid:"piramit",satisfying:"tatmin etmek",permanently:"kalıcı olarak","upward-narrowing":"yukarı doğru daralan",stepped:"kademeli",sleepless:"uykusuz",appreciated:"takdir edilen",achievements:"başarılar",potential:"potansiyel","self-actualization":"kendini gerçekleştirme"}},{icon:"🪞",title:"27. Mirror Neurons",src:"27.Mirror Neurons.m4a",text:`The name of this concept comes from a fact that scientists coincidentally discovered while examining the brains of monkeys in a laboratory in Italy in the 1990s. Researchers saw that certain cells in a monkey's brain fired up when it ate a peanut. However, the real surprise was that the same cells in the monkey's brain fired up even when it merely "watched" another monkey eating a peanut! Biologists gave them this perfect name because these special brain cells copy and reflect the action or the emotion of the other person just like a "mirror."<br><br>When a friend's finger accidentally gets jammed in a door, you also wince and say "Ouch!", don't you? You didn't get hurt, but these special cells in your brain instantly copy the pain the other person feels and create a simulation in your brain. They make you feel as if you are experiencing that event yourself. This is entirely our biological superpower that allows humans to empathize, that is, to understand the sorrow or joy of others and help them. If we didn't have this copying ability, we would never be able to cry at sad movies.`,dictionary:{coincidentally:"tesadüfen",peanut:"yer fıstığı",merely:"sadece",biologists:"biyologlar",reflect:"yansıtmak",jammed:"sıkışmış",wince:"yüzünü buruşturmak/irkilmek",simulation:"simülasyon",empathize:"empati kurmak",sorrow:"üzüntü"}},{icon:"📖",title:"28. Need for Narrative",src:"28.Need for Narrative.m4a",text:`The origin of this psychological concept comes from the tradition of humans passing on information by "telling" each other tales and epics while sitting in caves or around campfires for thousands of years. Because our brain's hardware does not work with disconnected lists or boring formulas, but rather with a "narrative" (story) that progresses with an introduction, development, and conclusion, this name was given to literally summarize the fact that humans cannot live without stories.<br><br>If I were to read twenty different historical events or names to your mind one after another, you would probably forget all of them five minutes later. However, if I added a hero, a great war, and an exciting ending into those events, you would never forget them. The human brain shoots a movie in its head by putting pieces together to make sense of the world. We learn what is good and what is bad not from rules, but from heroic stories. We recognize and understand life and ourselves solely through these stories in our minds.`,dictionary:{tradition:"gelenek",tales:"masallar",epics:"destanlar",hardware:"donanım",disconnected:"kopuk/bağlantısız",narrative:"anlatı",conclusion:"sonuç",summarize:"özetlemek",solely:"yalnızca"}},{icon:"🪒",title:"29. Occam's Razor",src:"29.Occam's Razor.m4a",text:`This theory takes its name from William of Ockham, a logician and philosopher who lived in England in the 14th century. There is a very sharp reason why his theory is named a "Razor": When solving events, it means cutting off and shaving away all the unnecessary, complex, and epic thoughts in our minds. This theory, which aims to reach the smoothest and most basic logic by getting rid of excess details while solving a problem, has literally gone down in history as a philosophical razor blade.<br><br>Imagine the chocolate sitting on the table in the kitchen has been eaten. It is a possibility that aliens came and did it, and it's also a possibility that your waking little sibling ate it. Which option do you think is more logical? Your sibling, of course! This rule tells us: If you have more than one option to explain an event, the option that is the simplest and requires the least fantastic assumption is usually the correct one. Before thinking that secret agents hacked you when your computer doesn't work, you should check if the plug is plugged into the socket.`,dictionary:{logician:"mantıkçı",razor:"ustura/jilet",shaving:"tıraş etmek",unnecessary:"gereksiz",complex:"karmaşık",smoothest:"en pürüzsüz",possibility:"olasılık",assumption:"varsayım",socket:"priz"}},{icon:"💔",title:"30. Physical Effects of Loneliness",src:"30.Physical Effects of Loneliness.m4a",text:`The reason this name emerged is that for years loneliness was thought to be just a "psychological," meaning emotional, sadness. However, when scientists scanned the brain with MRI machines, they found something shocking. The brain of an excluded or lonely person was suffering just as if their arm was broken or they were physically beaten. Because it was proven that the effects are experienced entirely in the body, meaning physically, this "physical" emphasis was specifically added to the title.<br><br>Feeling very lonely for a long time doesn't just sadden your soul, it also seriously damages your body. The brain perceives being socially kicked out of a group as a massive stress alarm. When this stress continues for days, your immune system collapses, and you start getting sick much more easily. In short, making real friends, chatting and laughing with them is not just a fun activity; it is mandatory for us to survive, just like drinking water and eating food.`,dictionary:{loneliness:"yalnızlık",scanned:"tarandı",excluded:"dışlanmış",suffering:"acı çeken",emphasis:"vurgu",sadden:"üzmek",perceives:"algılar",immune:"bağışıklık",collapses:"çöker",mandatory:"zorunlu"}},{icon:"💊",title:"31. Placebo Effect",src:"31.Placebo Effect.m4a",text:'The origin of this word dates back to Latin and means "I shall please" or "I shall be acceptable." Since ancient times, doctors would sometimes give their patients fake pills made only of sugar, containing no medicinal substance, just to relax them. The patient would recover from the illness because they believed that the medicine would cure them. These fake belief pills, which please by tricking the mind and defeat the illness, have fully settled in the world of medicine and psychology under the name "Placebo."<br><br>You scraped your knee, and your family applied a regular bandage saying, "This magical bandage will stop your pain in a second." Even though there was no special feature in the bandage, your pain actually went away! If our brain fully believes that something will cure us, our body starts producing its own natural painkillers. What heals you is not the medicine given to you or that bandage, it is entirely the incredible power of your own brain and your belief in getting well.',dictionary:{acceptable:"kabul edilebilir",medicinal:"tıbbi",substance:"madde",recover:"iyileşmek",cure:"tedavi etmek",defeat:"yenmek",scraped:"kazıdın/sıyrıldı",bandage:"bandaj",painkillers:"ağrı kesiciler"}},{icon:"🏕️",title:"32. Psychology of Tribalism",src:"32.Psychology of Tribalism.mp3",text:`This name comes from the fact that in prehistoric times, humans had to live in small "tribes" or clans of 30-40 people in order to survive and protect themselves from wild animals in the forests. If you were kicked out of the tribe, it meant certain death. Today, we no longer live in forests, but our minds still operate with the fears of that era. The brain's need to feel obliged to be a member of a tribe gave this strong psychological belonging its name.<br><br>The soccer team we support, the clan of the game we play, or our school is our new tribe. Feeling like you belong to a group is wonderful, but it has a dangerous dark side: feeling unprovoked hostility towards those who are not one of us. We start seeing people who are not from our own tribe as a threat, as if they were rival cavemen in the wild. Loving our own group is nice, but not acting hostile and unfairly toward other groups is the biggest rule of being a modern and smart human.`,dictionary:{prehistoric:"tarih öncesi",tribes:"kabileler",operate:"çalışmak/işlemek",obliged:"zorunlu/mecbur",belonging:"aidiyet",unprovoked:"kışkırtılmamış/sebepsiz",hostility:"düşmanlık",threat:"tehdit",rival:"rakip",hostile:"düşmanca"}},{icon:"🗿",title:"33. Pygmalion Effect",src:"33.Pygmalion Effect.m4a",text:"The highly interesting name of this effect comes from the legend of Pygmalion, a very talented sculptor living in Ancient Greek mythology. According to the legend, Pygmalion creates a statue of a woman out of ivory that is so flawless and beautiful that he falls deeply in love with his own creation. He wants her to be a real, living human so much and believes in this so deeply that the gods bring the statue to life in the face of this high expectation and belief. Scientists used the name of this miraculous legend to describe how the unshakable belief that others have in us changes and improves us.<br><br>Let's say you are on the school team, and your coach wholeheartedly believes that you are a great talent and that you will turn into a star player in the future. Because you feel this high trust and expectation your coach has for you, without even realizing it, you work much harder than everyone else in practice so as not to betray that trust. Ultimately, you truly become an excellent player. The expectations others have of us instill a magical self-confidence in our minds and force us to reach that high level. This is also called the self-fulfilling prophecy through the power of beliefs.",dictionary:{sculptor:"heykeltıraş",mythology:"mitoloji",statue:"heykel",ivory:"fildişi",flawless:"kusursuz",expectation:"beklenti",miraculous:"mucizevi",unshakable:"sarsılmaz",wholeheartedly:"tüm kalbiyle",betray:"ihanet etmek",instill:"aşılamak",prophecy:"kehanet"}},{icon:"🏆",title:"34. Pyrrhic Victory",src:"34.Pyrrhic Victory.m4a",text:`The name of this term comes from King Pyrrhus, who lived in Antiquity and fought against the Romans. King Pyrrhus won a massive pitched battle against the Romans, but to achieve this victory, he sacrificed such a large part of his army that he was devastated at the end of the war. According to historians, after the battle, he said, "God, do not give me another victory like this, or I will be completely ruined!" and his name went down in history this way.<br><br>Imagine you defeated the boss monster in a difficult game. It says "You won" on the screen, but you have spent your rarest items and lost your entire team. You don't even have the strength left to pass the next easy level. In real life too, when arguing with your friend, you might act very stubbornly and prove them wrong. You have won the argument, but because you hurt them for this sake, you completely lose your best friend. This is what we call fake victories that come at a very heavy price and actually harm you.`,dictionary:{antiquity:"ilkçağ",pitched:"meydan (savaşı)",sacrificed:"feda etti",devastated:"mahvolmuş",historians:"tarihçiler",ruined:"mahvolmuş",rarest:"en nadir",stubbornly:"inatla",sake:"uğruna",fake:"sahte"}},{icon:"🍕",title:"35. Scarcity and Abundance Mindsets",src:"35.Scarcity and Abundance Mindsets.m4a",text:`The names of these two opposing mindsets are a legacy from human history thousands of years ago. In ancient times, there was a food "scarcity," and people fought with each other for a piece of bread. In the modern world, however, there is an "abundance" (limitlessness) of food and resources. But our minds still act with the panic that everything will run out, just like in ancient times. The name comes from people thinking that success in life is limited, just like the insufficient food in those eras.<br><br>The scarcity mindset is seeing success in the world as a single pizza. If someone else takes a big slice, you think there won't be any pizza left for you and you envy them. The abundance mindset, on the other hand, knows that the universe is a magical kitchen. When your friend succeeds, you are happy, because their success doesn't take anything away from you; new pizzas can come out of the oven. Doing teamwork with others and celebrating their success is the most important mindset that saves a person from the poison of jealousy and allows them to reach their own goals peacefully.`,dictionary:{opposing:"zıt",mindsets:"zihniyetler",legacy:"miras",scarcity:"kıtlık",abundance:"bolluk",insufficient:"yetersiz",eras:"çağlar",envy:"kıskanmak/imrenmek",teamwork:"takım çalışması",peacefully:"huzurla"}},{icon:"📏",title:"36. Social Comparison Theory",src:"36.Social Comparison Theory.m4a",text:'The name of this theory was coined by psychologist Leon Festinger while thinking about how people measure themselves. We use a meter to measure our height and a scale to measure our weight. However, there is no physical tool to measure our intelligence, our beauty, or our success in life. Therefore, people use other people, that is, "sociology," as a tool for measurement and "comparison." The name comes from our constant need to look at the person next to us to find our place in society.<br><br>You might think you are very fast at running in school, until you see someone who runs much faster than you. Comparing ourselves sometimes pushes us to work harder. However, if you constantly look at people living the most luxurious lives or always looking perfect on social media and compare them with your own life, you will feel inadequate and unhappy. You should use comparison not to envy others or to put yourself down, but simply as a source of inspiration to say, "I can do better too.”',dictionary:{measure:"ölçmek",scale:"terazi/tartı",intelligence:"zeka",sociology:"sosyoloji",comparison:"karşılaştırma",constant:"sürekli",luxurious:"lüks",inadequate:"yetersiz",inspiration:"ilham"}},{icon:"🏦",title:"37. Stockholm Syndrome",src:"37.Stockholm Syndrome.m4a",text:"The name of this syndrome comes from a very famous and real bank robbery incident that took place in Stockholm, the capital of Sweden, in 1973. The robbers held the people inside the bank hostage for days, but occasionally treated them a bit nicely by giving them food. At the end of the incident, the hostages began to hate the police and started protecting, and even befriending, the robbers who had kidnapped them. The scientific world went down in history by giving this very bizarre and incomprehensible psychological condition, where the victim feels affection for their tormentor, the name of that famous city where the event took place.<br><br>In action movies, sometimes bad guys kidnap someone, but after a while, the hostage starts helping the bad guy. Although this seems very absurd, it is actually the brain's incredible survival trick. When a person is extremely scared and feels completely helpless, they realize that to survive, they are dependent on that dangerous person who holds the power. When the dangerous person does a small favor, the mind perceives this as heroism. By feeling sympathy for that person and establishing a fake friendship with them, the victim hopes to escape being harmed and tries to ease that massive fear inside them in this way.",dictionary:{robbery:"soygun",hostage:"rehine",kidnapped:"kaçırdı",bizarre:"tuhaf",incomprehensible:"anlaşılmaz",affection:"şefkat/sevgi",tormentor:"eziyet eden",absurd:"saçma",dependent:"bağımlı",heroism:"kahramanlık",sympathy:"sempati/duygudaşlık",ease:"hafifletmek"}},{icon:"📸",title:"38. Streisand Effect",src:"38.Streisand Effect.m4a",text:`This interesting name comes from the world-famous American singer Barbra Streisand. In 2003, Streisand got very angry when she saw an aerial photo of her house on a website on the internet. She applied to court to get the photo deleted and created a huge scene. Before the lawsuit, only 6 people had downloaded that photo, but millions of people who heard about this lawsuit on the news went to the site and downloaded the photo, saying, "What is she hiding, I wonder?" The effort to hide something making it more famous was given her name.<br><br>When a friend takes a funny photo of you, if you panic and say, "Delete that immediately, don't show anyone!", everyone in the class gets curious and gathers around. The more you try to hide or ban a secret, a mistake, or a photo on the internet or at school, the more you shine a massive spotlight on that topic. Banned or hidden things arouse great curiosity in people's brains and spread thousands of times faster than normal.`,dictionary:{aerial:"havadan",lawsuit:"dava",downloaded:"indirdi",hiding:"saklamak",curious:"meraklı",ban:"yasaklamak",spotlight:"sahne ışığı",arouse:"uyandırmak/kışkırtmak"}},{icon:"⚓",title:"39. Sunk Cost Fallacy",src:"39.Sunk Cost Fallacy.mp3",text:`The name of this concept comes from the world of economics and trade. "Sunk cost" means money or time that has already been spent and is impossible to get back, like a ship that has sunk to the bottom of the ocean. "Fallacy" (faulty thinking) is the situation where people cannot let go of a bad endeavor despite it harming them, simply because they have spent too much time or money on it. It received this name because instead of accepting the loss and abandoning the ship, they stubbornly try to load more cargo onto a sinking ship, making the situation much worse.<br><br>Let's say you went to the cinema, bought a very expensive ticket, and started watching the movie. After the first half hour passed, you realized that this was the most boring, worst movie you have ever watched in your life. Would you leave the cinema at that moment, or would you sit in that seat for two more hours suffering by saying, "I paid that much for the ticket"? Most people continue to suffer simply because they spent money or time. Or, continuing to play with a character in a game that you no longer enjoy, just because you played for months and leveled it up, is the same thing. Sometimes the smartest thing you can do in life is to accept the loss and spend your remaining precious time on things you truly love.`,dictionary:{economics:"ekonomi",trade:"ticaret",impossible:"imkansız",fallacy:"yanılgı",endeavor:"çaba/girişim",abandoning:"terk etmek",stubbornly:"inatla",cargo:"kargo/yük",suffering:"acı çekmek",precious:"değerli"}},{icon:"🚫",title:"40. Toxic Positivity",src:"40.Toxic Positivity.m4a",text:`This name contains two completely opposite words. Being "positive" is normally a good thing, like taking vitamins or eating healthy. However, the word "Toxic" represents a beneficial thing turning into an acid that harms a person when the dose is taken way too far. Because scientists realized that the pressure of constantly appearing happy literally poisons and rots a person's mental health, they brought words together in such a striking contrast to describe this situation.<br><br>You scraped your knee badly and it hurts a lot. Right at that moment, someone comes up to you and says, "Smile! It could have been worse, we must always be positive!" This is extremely dangerous. We don't have to look happy all the time, every single second. Feeling sad, angry, or tired is perfectly normal. Trying to forcefully sweep bad feelings under the rug delays the healing of the wound inside us. A truly good friend is not the person who orders you to laugh, but the one who can say, "I understand that you are sad, you are right" while you are crying.`,dictionary:{opposite:"zıt",beneficial:"faydalı",dose:"doz",pressure:"baskı",poisons:"zehirler",rots:"çürütür",striking:"çarpıcı",contrast:"zıtlık",forcefully:"zorla",delays:"geciktirir",wound:"yara"}},{icon:"🐴",title:"41. Trojan Horse",src:"41.Trojan Horse.m4a",text:'The origin of this name comes from the massive Trojan War epic in Ancient Greece. The Greek army cannot breach the high walls of the city of Troy for years. Finally, they play a clever trick and build a giant wooden horse. They pretend to leave it as a "gift to the Gods" and depart. When the Trojans joyfully take the gift inside, the hidden Greek soldiers coming out of the horse at night conquer the city. Cybersecurity viruses on the internet are entirely named after this legendary hiding logic.<br><br>Imagine while playing a game on the internet, an ad pops up saying, "You won unlimited free gold, download the file!" You get very happy and download it, but not only do you not get the gold, but a virus enters your computer and all your accounts get stolen. This clever trap that looks like a wonderful and harmless gift from the outside but harbors a hidden disaster inside is what they call this. If something looks free, very easy, and flawless, it might contain an invisible danger; you should always be cautious.',dictionary:{epic:"destan",breach:"yarmak/aşmak",pretend:"gibi yapmak",depart:"ayrılmak",conquer:"fethetmek",cybersecurity:"siber güvenlik",legendary:"efsanevi",unlimited:"sınırsız",harmless:"zararsız",harbors:"barındırır",flawless:"kusursuz",cautious:"temkinli"}},{icon:"🧩",title:"42. Zeigarnik Effect",src:"42.Zeigarnik Effect.m4a",text:'This name was born from an interesting event experienced by Russian psychologist Bluma Zeigarnik during a meal she had at a restaurant in Berlin in the 1920s. Zeigarnik notices that the waiter perfectly keeps the orders of the crowded table in his mind without taking any notes. However, five minutes after paying the bill, when they ask the waiter what they ate, the waiter has completely forgotten! Having discovered that the brain stays on alert when a job is "half-finished" and throws everything in the trash when the job is done, Zeigarnik gave her own surname to this mind rule.<br><br>If you have to close the game just as you are about to defeat the monster in a difficult game, you obsessively think about that half-finished level all day. But you immediately forget the levels you passed easily. The human brain remembers half-finished jobs and uncompleted tasks much more clearly compared to finished ones. If you get very bored while studying, get up from the table leaving at least a part of it half-finished. Your brain will constantly bother you and call you back to the table to finish that homework.',dictionary:{waiter:"garson",alert:"tetikte",obsessively:"takıntılı bir şekilde",uncompleted:"tamamlanmamış",compared:"kıyasla",constantly:"sürekli",bother:"rahatsız etmek"}}]},Pg={id:"freedom",title:"Freedom Fighters",cover:"✊",color:"#c0392b",description:"A complete collection of 39 listening lessons exploring the lives and struggles of legendary freedom fighters and revolutionaries around the world.",baseUrl:"https://raw.githubusercontent.com/dogierez/fredom-fighters/main/",tracks:[{icon:"🇩🇿",title:"1. Ahmed Ben Bella",src:"01_Ahmed_Ben_Bella.mp3",text:"Ahmed Ben Bella was a revolutionary leader and the first President of an independent Algeria. As a young man, he fought for the French army during World War II, but he realized that his own people in Algeria were treated unfairly by French colonial rulers. He decided to fight for his country's freedom and became one of the main founders of the National Liberation Front (FLN). He helped organize a massive war for independence against France that began in 1954. Because of his leadership, he was arrested by the French military and spent many years in prison during the war. When Algeria finally won its independence in 1962, he was released and chosen to lead the new nation. He worked hard to rebuild the country and support other anti-colonial movements across Africa. Although he was later removed from power by his own military, he is remembered today as a founding father of modern Algeria and a great hero of African independence.",dictionary:{revolutionary:"devrimci",unfairly:"haksızca",colonial:"sömürgeci",founders:"kurucular",massive:"devasa",independence:"bağımsızlık",arrested:"tutuklandı",released:"serbest bırakıldı",rebuild:"yeniden inşa etmek"}},{icon:"🇧🇦",title:"2. Alija Izetbegović",src:"02_Alija_Izetbegovic.mp3",text:"Alija Izetbegović was a lawyer and philosopher who became the first President of Bosnia and Herzegovina. He spent many years in prison because the Communist government did not like his religious and political ideas. When Yugoslavia began to break apart, he led his people toward independence. During the Bosnian War, he stayed in the capital city of Sarajevo while it was under attack. He worked hard to protect the unity of his country and to save his people from destruction. In 1995, he signed the Dayton Peace Agreement to end the fighting. He is known as the father of the Bosnian nation because he helped the country survive its most difficult time. He is respected for his wisdom and his dedication to freedom and justice.",dictionary:{philosopher:"filozof",independence:"bağımsızlık",destruction:"yıkım",agreement:"anlaşma",survive:"hayatta kalmak",dedication:"adanmışlık",justice:"adalet"}},{icon:"🇬🇼",title:"3. Amílcar Cabral",src:"03_Amilcar_Cabral.mp3",text:"Amílcar Cabral was a brilliant engineer and a revolutionary leader in West Africa. He fought against Portuguese colonial rule in Guinea-Bissau and Cape Verde. Cabral believed that freedom was not just about removing foreign soldiers, but also about improving the lives of the poor through education and farming. He organized a very successful guerrilla war that forced the Portuguese army to retreat. He was a great thinker whose books about culture and independence are still studied today. Tragically, he was killed by a rival group just months before his country became free. Even though he did not see the independence he fought for, he is remembered as one of Africa’s greatest heroes.",dictionary:{brilliant:"parlak/zeki",improving:"geliştirmek/iyileştirmek",successful:"başarılı",guerrilla:"gerilla",retreat:"geri çekilmek",tragically:"trajik bir şekilde",rival:"rakip"}},{icon:"✊🏾",title:"4. Angela Davis",src:"04_Angela_Davis.mp3",text:"Angela Davis is a famous activist and teacher in the United States. She became a leader in the civil rights movement during the 1960s. She spoke out strongly against racism and the unfair treatment of prisoners. In 1970, she became one of the most famous women in the world when she was placed on the FBI's Most Wanted List. She spent over a year in jail for a crime she did not commit. After a long trial, she was found not guilty. Today, she continues to fight for the rights of all people. She believes that we must change the prison system and work for true equality. She is a powerful symbol of resistance and courage for people around the world.",dictionary:{activist:"aktivist",civil:"sivil",racism:"ırkçılık",treatment:"muamele",commit:"işlemek",trial:"duruşma",equality:"eşitlik",resistance:"direniş",courage:"cesaret"}},{icon:"🛡️",title:"5. Assata Shakur",src:"05_Assata_Shakur.mp3",text:"Assata Shakur was an activist in the Black Panther Party who fought for the rights of Black Americans. In 1973, she was involved in a gunfight on a highway where a police officer was killed. She was injured and captured by the police. Even though she said she was innocent, she was sent to prison for life. In 1979, she managed to escape from prison with the help of her friends. She traveled secretly to Cuba, where the government gave her protection. She still lives in Cuba today. Many activists see her as a hero who survived a very unfair system, while the US government still wants to arrest her. Her story is a famous example of the struggle for civil rights.",dictionary:{involved:"karıştı/dahil oldu",injured:"yaralandı",captured:"yakalandı",innocent:"masum",escape:"kaçmak",secretly:"gizlice",protection:"koruma",struggle:"mücadele"}},{icon:"🇳🇮",title:"6. Augusto Sandino",src:"06_Augusto_Sandino.mp3",text:"Augusto Sandino was a fierce revolutionary leader in Nicaragua who fought against foreign control. During the 1920s, the United States military occupied Nicaragua to protect American businesses and control the government. Sandino believed this was deeply unfair and completely unacceptable. He refused to surrender his weapons and organized a peasant army to fight the powerful US Marines. Even though his army was small and poorly equipped, Sandino used clever guerrilla warfare. He launched sudden attacks from the thick jungle mountains, making it impossible for the foreign soldiers to defeat him. He became a famous symbol of resistance across Latin America, proving that a small nation could stand up to a massive empire. Eventually, the US troops left Nicaragua, but the local military commander, Anastasio Somoza, saw Sandino as a threat. In 1934, Sandino was invited to a peace dinner and was assassinated afterward. Decades later, a famous revolutionary group called the Sandinistas took his name and finally overthrew the Somoza dictatorship to honor his dream of true freedom.",dictionary:{fierce:"şiddetli/vahşi",occupied:"işgal etti",unacceptable:"kabul edilemez",surrender:"teslim olmak",peasant:"köylü",equipped:"donanımlı",impossible:"imkansız",resistance:"direniş",empire:"imparatorluk",assassinated:"suikasta kurban gitti",overthrew:"devirdi",dictatorship:"diktatörlük"}},{icon:"🇮🇳",title:"7. Bhagat Singh",src:"07_Bhagat_Singh.mp3",text:"Bhagat Singh was a young and brave revolutionary in India. He fought against British rule because he wanted his country to be free and fair for everyone. He did not agree with non-violent protests only; he believed that strong action was needed to wake up the people. In 1929, he threw a small bomb into a government building to protest against unfair laws. He did not want to hurt anyone, but he wanted the British to listen. He was arrested and stayed very strong while in prison. The British executed him when he was only 23 years old. His sacrifice made him a legend in India and Pakistan. Today, young people still look to him as a symbol of bravery and patriotism.",dictionary:{brave:"cesur","non-violent":"şiddetsiz",protest:"protesto",executed:"idam edildi",sacrifice:"fedakarlık",legend:"efsane",patriotism:"vatanseverlik"}},{icon:"🇮🇪",title:"8. Bobby Sands",src:"08_Bobby_Sands.mp3",text:"Bobby Sands was a member of the IRA in Northern Ireland. He wanted his country to be independent of British rule. While he was in prison, he led a famous hunger strike in 1981. He and other prisoners refused to eat because they wanted to be treated as political prisoners, not as criminals. During the strike, the people actually elected him to the British Parliament. After 66 days without food, Bobby Sands died. His death caused a massive reaction around the world and brought a lot of attention to the problems in Northern Ireland. He is remembered as a man who was willing to give his life for his political beliefs and his country’s freedom.",dictionary:{independent:"bağımsız",strike:"grev",criminals:"suçlular",elected:"seçildi",parliament:"parlamento",reaction:"tepki",attention:"dikkat",beliefs:"inançlar"}},{icon:"⭐",title:"9. Che Guevara",src:"09_Che_Guevara.mp3",text:'Ernesto "Che" Guevara was a doctor from Argentina who became a global symbol of revolution. While traveling as a young man, he saw the terrible poverty in Latin America and decided to fight for the poor. He joined Fidel Castro and helped lead the Cuban Revolution to victory in 1959. After the war, he held important jobs in the new government, but he wanted to help other countries too. He traveled to Africa and then to Bolivia to start new revolutions. He was captured and killed in the mountains of Bolivia in 1967. Today, his face is famous all over the world. People see him as a symbol of rebellion against unfair power.',dictionary:{global:"küresel",poverty:"yoksulluk",victory:"zafer",government:"hükümet",captured:"yakalandı",rebellion:"isyan"}},{icon:"🇹🇷",title:"10. Deniz Gezmiş",src:"10_Deniz_Gezmis.mp3",text:"Deniz Gezmiş was a student leader and a revolutionary in Turkey. During the late 1960s, he led many protests against foreign influence and for the rights of workers and students. He believed that Turkey should be a completely independent and socialist country. He founded a group that used armed action to fight the government. After a military coup in 1971, he was caught and put on trial. He remained very brave and never apologized for his actions. He was executed by hanging in 1972 at the age of 25. His death made him a hero for many young people in Turkey. He is still remembered today as a symbol of the fight for a better and fairer world.",dictionary:{influence:"etki",socialist:"sosyalist",founded:"kurdu",armed:"silahlı",coup:"darbe",trial:"duruşma",apologized:"özür diledi",executed:"idam edildi",fairer:"daha adil"}},{icon:"⛪",title:"11. Dietrich Bonhoeffer",src:"11_Dietrich_Bonhoeffer.mp3",text:"Dietrich Bonhoeffer was a brave Christian pastor and a leading thinker who fought a dangerous secret war against the Nazi government in Germany. When Adolf Hitler came to power, many church leaders stayed silent or supported the regime, but Bonhoeffer believed that true faith required standing up against pure evil. He openly criticized the government's racist laws and secretly joined the German resistance movement. He used his position to help Jewish people escape to safety in other countries. Eventually, he even participated in a secret plan to overthrow Hitler. In 1943, he was arrested by the Gestapo and sent to a prison camp. Even in prison, he continued to write beautiful letters and books about faith, courage, and doing the right thing. He was executed in a concentration camp just weeks before the end of World War II. Today, he is remembered worldwide as a brilliant symbol of moral courage and sacrificing oneself for justice.",dictionary:{pastor:"papaz",regime:"rejim",faith:"inanç",criticized:"eleştirdi",overthrow:"devirmek",concentration:"toplama",moral:"ahlaki"}},{icon:"🇩🇿",title:"12. Djamila Bouhired",src:"12_Djamila_Bouhired.mp3",text:"Djamila Bouhired is one of the most famous women in the history of North Africa. She was a resistance fighter who fought for Algeria's independence from France. During the war, she carried out dangerous missions in the city of Algiers. She was eventually captured and tortured by French soldiers, but she never gave away the secrets of her group. She was sentenced to death, but people all over the world protested to save her life. Because of this international pressure, she was released when Algeria became free in 1962. She is a national hero and a symbol of how women played a vital role in the struggle for freedom and national dignity.",dictionary:{dangerous:"tehlikeli",missions:"görevler",tortured:"işkence gördü",sentenced:"mahkum edildi",pressure:"baskı",released:"serbest bırakıldı",vital:"hayati",dignity:"haysiyet/onur"}},{icon:"🇲🇽",title:"13. Emiliano Zapata",src:"13_Emiliano_Zapata.mp3",text:'Emiliano Zapata was a legendary revolutionary leader who fought for the rights of the poorest people in Mexico. He grew up in a small farming village and saw how wealthy landowners and corrupt politicians stole land from the peasants. Zapata decided to fight back. During the Mexican Revolution in 1910, he organized a powerful army of farmers called the Liberation Army of the South. His famous motto was "Tierra y Libertad," which means "Land and Freedom." He demanded that the stolen lands be returned to the poor farmers who actually worked the soil. Zapata was a man of deep principles who refused to be bought by rich politicians. He only fought for justice and equality. Because he was so popular and powerful, the government saw him as a major threat. In 1919, he was tricked into attending a meeting and was brutally assassinated by the military. Although he was killed, his ideas survived, and he remains a beloved national hero for the poor and indigenous people of Mexico.',dictionary:{legendary:"efsanevi",wealthy:"zengin",corrupt:"yozlaşmış",peasants:"köylüler",liberation:"kurtuluş",motto:"slogan",principles:"prensipler",justice:"adalet",equality:"eşitlik",tricked:"kandırıldı",brutally:"vahşice",indigenous:"yerli"}},{icon:"✍️",title:"14. Frantz Fanon",src:"14_Frantz_Fanon.mp3",text:"Frantz Fanon was a doctor and a very important writer from Martinique. He studied how colonialism and racism hurt the minds of people. He moved to Algeria and joined the fight for independence against France. He wrote several famous books, like The Wretched of the Earth, which explained why people have a right to fight for their freedom. He believed that colonized people must stand up and be proud of their own culture to be truly free. His ideas inspired many freedom movements in Africa, the Caribbean, and America. Although he died very young from a sickness, his books are still read by millions of people who want to understand justice and equality.",dictionary:{colonialism:"sömürgecilik",racism:"ırkçılık",wretched:"sefil/zavallı",colonized:"sömürgeleştirilmiş",truly:"gerçekten",inspired:"ilham verdi"}},{icon:"✊🏿",title:"15. Fred Hampton",src:"15_Fred_Hampton.mp3",text:'Fred Hampton was a brilliant young leader in the Black Panther Party in Chicago. He was a very talented speaker who wanted to bring people of all races together to fight against poverty and racism. He created the "Rainbow Coalition" to unite Black, Hispanic, and white working-class people. He also started programs to give free breakfast to children in poor neighborhoods. The government and the police were very afraid of his power to unite people. In 1969, while he was sleeping in his apartment, the police and the FBI raided the building and killed him. He was only 21 years old. His death is seen as a tragic assassination of a man who wanted peace and unity for everyone.',dictionary:{brilliant:"parlak",talented:"yetenekli",poverty:"yoksulluk",coalition:"koalisyon",neighborhoods:"mahalleler",raided:"baskın yaptı",tragic:"trajik",assassination:"suikast",unity:"birlik"}},{icon:"💥",title:"16. Gavrilo Princip",src:"16_Gavrilo_Princip.mp3",text:"Gavrilo Princip was a young student from a poor farming family in Bosnia. At that time, his homeland was controlled by the powerful Austro-Hungarian Empire. Princip strongly believed that all Southern Slavic people should be free from foreign rule and united into one independent nation called Yugoslavia. He joined a secret revolutionary group to fight for this dream. On June 28, 1914, when Archduke Franz Ferdinand of Austria visited the city of Sarajevo, Princip assassinated him and his wife. He believed this dramatic action would spark a revolution and free his people. Instead, this event started a massive chain reaction that led directly to the First World War. Because he was under twenty years old, the government could not execute him, so he was sent to prison. He died of illness in his cell in 1918. Today, people still argue about his legacy. Some view him as a dangerous terrorist who started a terrible global war, while others see him as a brave patriot who sacrificed himself for freedom.",dictionary:{homeland:"memleket",slavic:"slav",dramatic:"dramatik",spark:"ateşlemek/kıvılcım",massive:"devasa",legacy:"miras",patriot:"vatansever",sacrificed:"feda etti"}},{icon:"🇻🇳",title:"17. Ho Chi Minh",src:"17_Ho_Chi_Minh.mp3",text:'Ho Chi Minh was the most important leader in the history of Vietnam. He spent many years traveling the world to find a way to make his country free from French rule. He founded the Communist Party of Vietnam and led the resistance for decades. After the French left, he led North Vietnam during the war against the United States. He was a very simple man who lived a quiet life, but his people loved him and called him "Uncle Ho." He died before the war ended, but his dream of a united and independent Vietnam finally came true in 1975. The largest city in the country was renamed Ho Chi Minh City to honor his memory.',dictionary:{resistance:"direniş",decades:"onyıllar",simple:"basit",united:"birleşik",honor:"onurlandırmak",memory:"anı/hatıra"}},{icon:"☘️",title:"18. James Connolly",src:"18_James_Connolly.mp3",text:"James Connolly was a dedicated socialist and a brave leader of the Irish revolutionary movement. He was born to a very poor Irish immigrant family in Scotland and started working when he was just eleven years old. He believed strongly that Ireland should be a completely free republic, but he also believed that true freedom meant protecting the rights of poor workers and fighting against greedy businesses. He organized labor unions and led massive strikes to demand fair pay and better lives for the working class. In 1916, he became one of the main leaders of the famous Easter Rising in Dublin. He commanded the rebel forces fighting against the powerful British army. He was severely wounded during the battle but continued to lead his soldiers from a stretcher. When the rebellion failed, the British army captured him. Because he was too injured to stand, they tied him to a chair and executed him by firing squad. His death made the Irish people furious and sparked the final war for independence.",dictionary:{dedicated:"adanmış",immigrant:"göçmen",republic:"cumhuriyet",greedy:"açgözlü",unions:"sendikalar",strikes:"grevler",rebel:"isyancı",severely:"ciddi şekilde",stretcher:"sedye",rebellion:"isyan",furious:"öfkeli"}},{icon:"🇲🇿",title:"19. Josina Machel",src:"19_Josina_Machel.mp3",text:"Josina Machel was a fearless revolutionary who fought for the freedom of Mozambique and for the equal rights of women across Africa. When she was just a teenager, she joined the fight against Portuguese colonial rule. She tried to escape the country to join the liberation army but was captured and put in prison. She never gave up, and after she was freed, she finally reached the military camps. Josina became a key leader in the armed struggle, fighting directly on the front lines alongside male soldiers. She strongly believed that her country could never be truly free unless women were also free from traditional oppression. She helped create schools and health clinics for families suffering during the war and organized the first women's military unit. Tragically, she died of a severe illness in 1971 when she was only 25 years old. In Mozambique, the day of her death is now celebrated as National Women's Day to honor her incredible legacy.",dictionary:{fearless:"korkusuz",colonial:"sömürgeci",liberation:"kurtuluş",alongside:"yanında",oppression:"baskı/zulüm",clinics:"klinikler",severe:"şiddetl
