t. Today, we usually think of traffic as something annoying that makes us late for work, but its origin reminds us of a time when movement was all about business and the exciting exchange of goods between different cultures. It is a word that has moved from the world of international trade to the world of daily transportation.',dictionary:{merchants:"tüccarlar",movement:"akış/hareket",transportation:"ulaşım",annoying:"sinir bozucu",exchange:"takas/değişim",crowded:"kalabalık"}},{title:"109. Tramway",src:"Tramway male us.mp3",text:'The word tramway has a very old and interesting origin that has nothing to do with electricity or modern cities. It comes from the Middle Dutch word trame, which meant a "beam" or a "wooden log." In the past, people built roads made of wooden beams or logs to make it easier for heavy wagons to move through muddy areas, especially in coal mines. These wooden paths were called "trams." Later, when people started using metal rails instead of wood, they kept the old name. The "way" part of the word simply means the road or the path. So, a tramway is literally a "log road" that evolved into the modern rail systems we see in cities today. In many countries, these vehicles are also called "streetcars" or "trolleys," but the word tram is still the most common name in Europe and many other places. It is a perfect example of how a very old word for a simple piece of wood changed over hundreds of years to describe a fast and modern way to travel through a busy city.',dictionary:{muddy:"çamurlu",evolved:"gelişti",rails:"raylar",common:"yaygın",wagons:"vagonlar"}},{title:"110. Tsunami",src:"Tsunami female us.mp3",text:`The devastating tidal waves that destroy coastal areas are globally known as tsunamis. This word originates from Japanese. It consists of two words; Tsu, which means harbor, and Nami, which means wave. In fact, the definition of "tidal waves" is technically wrong because the earthquake waves under the water have nothing to do with tides. Consequently, the term tsunami is commonly used by news agencies. Since Japan is an island, and the inhabitants are very familiar with the oceanic phenomena, they have such words in their language. In 1896, gigantic waves struck Japan's coastal line after an earthquake in the ocean. This disaster was covered in National Geographic Magazine with reference to the Japanese word "Tsunami." Especially after the disaster in 2004 that swept South Asian countries, the word tsunami has become a global word. Today, scientists and reporters use this name to be more accurate about these dangerous natural events. It is a word that represents the power of the sea and the history of a nation that has lived with the ocean for thousands of years.`,dictionary:{devastating:"yıkıcı",tidal:"gelgite bağlı",disaster:"felaket",swept:"süpürdü",gigantic:"devasa",coastal:"kıyı"}},{title:"111. Typhoon",src:"Typhoon female us.mp3",text:'The word typhoon is a great example of a "global" word because it has roots in many different languages. In Greek mythology, Typhon was a giant monster who created terrible winds and storms. At the same time, in Chinese, the word tai fung means "big wind." Because traders from Europe and Asia met in the oceans near China and Japan, these two similar-sounding words merged together to create the word we use today. A typhoon is a massive, spinning storm that forms over the warm waters of the Pacific Ocean, bringing heavy rain and very strong winds. It is exactly the same type of storm as a "hurricane," but it is called a typhoon when it happens in the part of the world near Asia. The name carries the history of ancient Greek monsters and the simple Chinese description of the weather. It shows us how different cultures can see the same powerful forces of nature and create a shared word to describe them. Every typhoon is a reminder of the power of the wind and the long history of travel and trade across the great oceans.',dictionary:{spinning:"dönen",merged:"birleşti",forces:"güçler",shared:"ortak",massive:"büyük/devasa"}},{title:"112. University",src:"University male us.mp3",text:'The word university comes from the Latin word universitas, which originally meant "a whole," "a community," or "a group of people working together." In the twelfth century, the term was applied to the communities of students and teachers who gathered in cities like Bologna and Paris to study. They were a "guild" or a group of scholars who wanted to protect their rights and share their knowledge. They were a community of people who wanted to study everything—the whole "universe" of knowledge—together! Over many centuries, these groups of scholars built permanent buildings and created the formal system of education we know today. By the early modern period, universities had become the most important centers for law, medicine, philosophy, and science. Today, the word is used for any institution of higher learning where students go to get a degree. The name is a beautiful reminder that education is not just about books and tests; it is about being part of a "community" of people who are searching for the truth together.',dictionary:{community:"topluluk",scholars:"bilginler/akademisyenler",guild:"birlik/lonca",permanent:"kalıcı",formal:"resmi",institution:"kurum"}},{title:"113. Vampire",src:"Vampire male us.mp3",text:`The word vampire comes from the Slavic word vampir, which appeared in Eastern Europe hundreds of years ago. In countries like Serbia and Romania, people used this word to describe a "living corpse" that would rise from its grave at night to drink the blood of humans and animals. These stories were very common in small villages, where people were afraid of death and disease. In the early 1700s, reports of "vampire attacks" reached Western Europe, and scientists and doctors even went to these villages to investigate. The word entered the English language in 1732 and became very famous. Later, in the nineteenth century, writers like Bram Stoker used these old folk stories to create famous characters like Count Dracula. Today, vampires are some of the most popular characters in movies and television shows. Even though the modern version of a vampire is often seen as elegant or romantic, the word's origin is rooted in deep fear and ancient superstitions from the dark forests of Europe. It is a word that connects old village legends with modern storytelling and our curiosity about the unknown.`,dictionary:{corpse:"ceset",superstitions:"batıl inançlar",curiosity:"merak",investigate:"araştırmak",legends:"efsaneler",romantic:"romantik"}},{title:"114. Vanilla",src:"Vanilla female us.mp3",text:'The word vanilla comes from the Spanish word vainilla, which is a "diminutive" or small version of the word vaina, meaning "sheath" or "pod." So, vanilla literally means "little pod." This name was given by Spanish explorers who saw the long, thin beans growing on orchid plants in Mexico. The Aztec people had been using these "little pods" for a long time to flavor their chocolate drinks. When the Spanish brought the beans back to Europe, they became an incredibly expensive luxury. For a long time, only kings and queens could afford to taste it! Eventually, people learned how to grow the plants in other places like Madagascar. Today, vanilla is the most popular flavor in the world for ice cream, cakes, and perfumes. Even though we sometimes use the word "vanilla" to mean something "plain" or "boring," its history is actually full of adventure, international trade, and exotic plants from the rainforest. It is a word that started in the jungles of Mexico and traveled all over the world to become a favorite taste for almost everyone.',dictionary:{sheath:"kılıf",pod:"kapsül/kabuk",expensive:"pahalı",luxury:"lüks",flavor:"tat/aroma",adventure:"macera",exotic:"egzotik"}},{title:"115. Volcano",src:"Volcano male us.mp3",text:"The word volcano comes from the name of the Roman god of fire, Vulcan. According to Roman mythology, Vulcan was the blacksmith of the gods who worked in a giant forge under the earth. The Romans believed that when a mountain started to smoke and explode with fire, it was because Vulcan was working on his anvil to create weapons and armor for the other gods. One of the most famous volcanoes in Italy, located on the island of Vulcano, was named in his honor. Eventually, the name of the island and the god became the general word for any mountain that erupts with lava and ash. It is a very fitting name because the inside of a volcano is hot and powerful, just like a blacksmith's fire. Today, scientists use the word to describe the movement of magma from deep inside the earth to the surface. The history of the word reminds us of a time when people looked at the terrifying power of nature and explained it through the stories of gods and ancient magic.",dictionary:{blacksmith:"demirci",forge:"demirci ocağı",erupts:"püskürür",anvil:"örs",terrifying:"korkutucu",fitting:"uygun"}},{title:"116. Yoga",src:"Yoga male us.mp3",text:'The word yoga comes from the ancient Indian language called Sanskrit. The word yuj means "to join" or "to yoke" together. In the past, this was a word used for joining two oxen together so they could pull a wagon. In a spiritual sense, yoga is about "joining" the mind, the body, and the spirit together so they can work as one. It is a practice that is thousands of years old and includes physical exercises, breathing techniques, and meditation. For a long time, it was a secret practice only for monks and teachers in India. However, in the 20th century, it became popular all over the world as a way to stay healthy and reduce stress. Today, millions of people go to yoga classes every day. The name reminds us that the goal of the practice is not just to be flexible or strong, but to create a "union" within ourselves. It is a word that has traveled from ancient Indian temples to modern city studios, bringing a message of balance and peace to the modern world.',dictionary:{yoke:"bağlamak",spiritual:"ruhani",union:"bütünleşme/birlik",meditation:"meditasyon",flexible:"esnek",balance:"denge",peace:"huzur"}},{title:"117. Yogurt",src:"Yogurt female us.mp3",text:'The word yogurt comes from the Turkish word yoğurt, which is derived from the old verb yoğurmak, meaning "to knead" or "to thicken." For thousands of years, nomadic people in Central Asia and Anatolia made this food by letting milk sit in the sun until it became thick and sour. It was a very important food for them because it lasted longer than fresh milk and was very healthy. In the early 20th century, a scientist discovered that the bacteria in yogurt helped people live longer, and it became a popular health food in Europe and America. While there are many different ways to spell the word in English, the Turkish origin is always the same. Today, yogurt is eaten in almost every country for breakfast or as a snack. Its name is a great example of how a simple Turkish word for "thickened milk" became a global term for one of the most common and healthy foods in the world. It is a word that carries the history of the ancient nomads and their clever ways of preserving food.',dictionary:{knead:"yoğurmak",thicken:"koyulaştırmak",nomadic:"göçebe",bacteria:"bakteri",preserving:"saklama/koruma",common:"yaygın"}},{title:"118. Zebra",src:"Zebra male us.mp3",text:'The word zebra has a very interesting and slightly confusing history. It comes from the Portuguese language, but the Portuguese actually borrowed it from a word used for a wild "Spanish horse" called an enzebro. When Portuguese explorers arrived in Africa and saw the striped animals for the first time, they thought they looked like those wild horses back home, so they gave them the same name. Some people think the word might also have roots in African languages, but the Portuguese connection is the most famous one. To the explorers, the zebra was a "beast of the wild" that looked like a horse but could not be ridden. In ancient times, the Romans called them "hippo-tigris," which means "horse-tiger" because of their stripes! Today, the zebra is one of the most recognizable animals in the world. Its name is a reminder of the time when European explorers were first seeing the amazing animals of Africa and trying to find words to describe the beautiful and strange things they discovered in the wild.',dictionary:{confusing:"kafa karıştırıcı",striped:"çizgili",ridden:"binilen",recognizable:"tanınabilir",wildlife:"vahşi yaşam",discovered:"keşfetti"}},{title:"119. Zombie",src:"Zombie female us.mp3",text:'The word zombie has its origins in Haitian folklore, which means animated corpse. It is a known fact that the Haitian people are the descendants of African slaves who were brought to America for cheap labor. They brought their folklore and belief as well. A sorcerer or a witch would cast magic on a corpse and animate it. In fact, the truth behind this was not magic. In Kongo, the term zombie was originally Nzambi and meant the god. They were using a medicine that would stop all the vitals of the body, hence the person would be dead. Then they would give him another medicine that would revive him, but they would claim that this corpse could walk among them thanks to their ability to contact the god, in this case, the Nzambi. This word was not widespread in the modern world until 1978 when the movie writer and director George Romero called the undead in his film Dawn of the Dead zombie. Since then, the term zombie has become widespread in movies and books. It is a story of how an ancient word for a spirit turned into a modern symbol of the "undead."',dictionary:{animated:"canlandırılmış",descendants:"soyundan gelenler",sorcerer:"büyücü",revive:"diriltmek",vitals:"yaşamsal fonksiyonlar",widespread:"yaygın"}}]},ep={id:"history",title:"History of Things",cover:"🕰️",color:"#8e44ad",description:"A complete collection of 25 listening lessons exploring the fascinating history of everyday objects.",baseUrl:"https://raw.githubusercontent.com/dogierez/history-of--things-listen/main/",githubRepoUrl:"https://github.com/dogierez/history-of--things-listen",tracks:[{icon:"❄️",title:"1. Air Conditioner",src:"01_air_conditioner.mp3",text:"On a hot summer day, nothing feels better than walking into a cool room. We can thank the air conditioner for that! But did you know it was not actually invented to keep humans cool?<br><br>In the year 1902, a young engineer named Willis Carrier worked at a printing company in New York. The hot, wet summer air was causing a big problem. It made the printing paper swell and twist, which ruined the colors of the books.<br><br>Willis Carrier built a clever machine to control the moisture in the air. To his surprise, the machine also made the room feel beautifully cold! Soon, movie theaters bought these machines so people could watch films comfortably during hot summers.<br><br>Before this invention, schools and businesses often closed during the summer because it was just too hot to work. The air conditioner changed how we build houses and allowed cities to grow in very hot places around the world.",dictionary:{invented:"icat edildi",engineer:"mühendis",swell:"şişmek",twist:"kıvrılmak/bükülmek",ruined:"mahvetti",clever:"zeki",moisture:"nem",comfortably:"rahatça",businesses:"işletmeler",allowed:"izin verdi"}},{icon:"👖",title:"2. Blue Jeans",src:"02_blue_jeans.mp3",text:"Blue jeans are probably the most popular pants in the world. They are strong, comfortable, and look great. But their story began in the dirt of the American Wild West.<br><br>In the 1870s, thousands of miners went to California to dig for gold. Their work was very rough, and their regular trousers ripped open constantly. A tailor named Jacob Davis wanted to help them. He had an idea to add small copper rivets—metal pieces—to the corners of the pockets so they would not tear.<br><br>Jacob Davis did not have enough money to patent his invention, so he wrote a letter to Levi Strauss, a businessman who sold heavy denim fabric. Together, they created the very first pair of Levi’s jeans in 1873.<br><br>At first, only laborers and cowboys wore jeans. But in the 1950s, cool movie stars started wearing them, and teenagers everywhere wanted a pair. Today, people of all ages wear jeans every single day.",dictionary:{comfortable:"rahat",miners:"madenciler",rough:"zorlu/kaba",trousers:"pantolon",ripped:"yırtıldı",constantly:"sürekli olarak",tailor:"terzi",copper:"bakır",rivets:"perçinler",tear:"yırtılmak",patent:"patent almak",fabric:"kumaş",laborers:"işçiler"}},{icon:"👓",title:"3. Eyeglasses",src:"03_eyeglasses.mp3",text:"Think about how hard it would be to read a book or look at a computer screen if everything looked blurry. Hundreds of years ago, if your eyes became weak, you could not work or read anymore.<br><br>That changed in Italy during the late 13th century. Glassmakers discovered that looking through specially shaped pieces of glass could make tiny letters look big and sharp. They connected two pieces of glass together to make the first eyeglasses.<br><br>At first, people had to hold these glasses with their hands or balance them carefully on their noses. They did not have the side arms that sit over your ears today! Side arms were not invented until the 1700s.<br><br>Eyeglasses completely changed the world. Suddenly, older teachers, doctors, and craftsmen could keep working, reading, and inventing for many more years. Today, glasses are both a helpful medical tool and a cool fashion accessory.",dictionary:{blurry:"bulanık",weak:"zayıf",discovered:"keşfetti",shaped:"şekillendirilmiş",tiny:"minik",sharp:"keskin",connected:"bağladı",balance:"dengelemek",craftsmen:"zanaatkarlar",inventing:"icat etmek",medical:"tıbbi",tool:"araç",accessory:"aksesuar"}},{icon:"🍟",title:"4. Fried Potatoes",src:"04_fried_potatoes.mp3",text:"Whether you call them french fries, chips, or fried potatoes, crispy golden potato strips are loved everywhere. But who actually invented them?<br><br>The French and the Belgians have had a friendly argument about this for over a hundred years! The citizens of Belgium say they invented fries in the late 1600s. According to local stories, poor villagers living near a river used to catch tiny fish and fry them for dinner. One winter, the river froze completely, so they could not fish. They cut potatoes into tiny fish shapes instead and fried them!<br><br>During World War I, American soldiers arrived in Belgium and tasted these delicious hot potatoes. Because the Belgian army spoke French, the soldiers named the snack 'French fries.'<br><br>No matter who invented them, today they are cooked in hot oil and served with salt and ketchup in almost every country on earth.",dictionary:{crispy:"çıtır",strips:"şeritler",invented:"icat etti",argument:"tartışma",citizens:"vatandaşlar",villagers:"köylüler",catch:"yakalamak",froze:"dondu",completely:"tamamen",delicious:"lezzetli",served:"servis edildi"}},{icon:"💨",title:"5. Hair Dryer",src:"05_hair_dryer.mp3",text:"Getting out of the shower with wet hair can be annoying, especially in the winter. Today, we use a handy electric hair dryer. But the very first hair dryers were actually giant living room machines!<br><br>In 1890, a French stylist named Alexandre Godefroy invented a large machine for his hair salon. It used a gas stove to blow hot air through a giant pipe into a hood that sat on top of a person's head. You could not move at all while using it!<br><br>Later, in the early 1900s, vacuum cleaner companies noticed something funny. The exhaust end of their vacuums blew out warm air. Their advertisements actually told women to connect a hose to the back of the vacuum to dry their hair!<br><br>Finally, in the 1920s, engineers invented the first handheld, portable hair dryers. They were made of heavy metal and were quite dangerous if they got wet, but they paved the way for the safe plastic hair dryers we use today.",dictionary:{annoying:"sinir bozucu",handy:"kullanışlı",giant:"dev",stylist:"stilist",stove:"soba/ocak",pipe:"boru",hood:"başlık",vacuum:"elektrikli süpürge",exhaust:"egzoz/çıkış",advertisements:"reklamlar",hose:"hortum",handheld:"elde taşınır",portable:"taşınabilir",paved:"yolunu açtı"}},{icon:"🍔",title:"6. Hamburger",src:"06_hamburger.mp3",text:"When you visit a fast-food restaurant, you might order a delicious hamburger with lettuce and cheese. While the name sounds German, the modern hamburger is an American classic.<br><br>The word hamburger comes from the city of Hamburg, Germany. In the 1800s, German immigrants traveling to America brought a popular dish called 'Hamburg steak'—which was just a seasoned piece of minced beef served on a plate.<br><br>At large American fairs, workers needed a way to eat their lunch while walking around the crowded grounds. Sometime around 1900, creative cooks decided to squash the hot beef steak between two soft slices of bread.<br><br>Suddenly, customers could hold their meat meal with one hand without needing a plate or a fork! This simple change turned the hamburger into the ultimate fast food, changing the way millions of people eat on the go.",dictionary:{delicious:"lezzetli",lettuce:"marul",immigrants:"göçmenler",seasoned:"baharatlı/çeşnili",minced:"kıyılmış",crowded:"kalabalık",creative:"yaratıcı",squash:"ezmek",slices:"dilimler",ultimate:"nihai"}},{icon:"🚁",title:"7. Helicopter",src:"07_helicopter.mp3",text:"An airplane flies fast across the sky, but it needs a long runway to land. A helicopter is special because it can take off straight up into the air and hover in one spot like an insect.<br><br>For hundreds of years, inventors tried to build flying machines with spinning blades. Even the great artist Leonardo da Vinci drew a design for an 'aerial screw' five hundred years ago! However, early helicopters had a dangerous problem: when the top blades spun around, the cabin would spin rapidly in the opposite direction, causing it to crash.<br><br>In 1939, an engineer named Igor Sikorsky solved this big puzzle. He added a tiny vertical rotor to the very back of the tail. This small tail rotor pushed against the air to keep the main cabin perfectly straight and steady.<br><br>Thanks to his design, helicopters can land on mountain peaks, hospital roofs, and boats to save lives during emergencies.",dictionary:{runway:"pist",hover:"havada asılı kalmak",insect:"böcek",inventors:"mucitler",spinning:"dönen",blades:"pervaneler/kanatlar",aerial:"havaya ait",rapidly:"hızla",opposite:"zıt",direction:"yön",vertical:"dikey",rotor:"döner parça",steady:"sabit",peaks:"zirveler",emergencies:"acil durumlar"}},{icon:"🔥",title:"8. Lighter",src:"08_lighter.mp3",text:"You might think that matches were invented first and lighters came later, but the truth is the exact opposite! The mechanical lighter was actually invented before the friction match.<br><br>In 1823, a German chemist named Johann Wolfgang Döbereiner invented a device called 'Döbereiner's Lamp.' It was a large glass jar that used a chemical reaction to create a flammable gas. When you turned a valve, the gas hit a piece of platinum metal and created a flame. It was very dangerous and looked like a piece of laboratory equipment, but it worked!<br><br>In the 1930s, a man named George Blaisdell invented the famous Zippo lighter. He wanted a small lighter that would not blow out in the wind. He added a little metal chimney around the flame to protect it.<br><br>Today, plastic lighters are small, cheap, and can fit easily inside a pocket. They show how a big, complex chemistry experiment became a simple daily tool.",dictionary:{matches:"kibritler",opposite:"zıt",mechanical:"mekanik",friction:"sürtünme",chemist:"kimyager",device:"cihaz",reaction:"tepkime",flammable:"yanıcı",valve:"vana",flame:"alev",laboratory:"laboratuvar",equipment:"ekipman",chimney:"baca",protect:"korumak",cheap:"ucuz",complex:"karmaşık"}},{icon:"💡",title:"9. Light Bulb",src:"09_light_bulb.mp3",text:"When the sun goes down, you just flip a switch to turn on the lights. It seems so simple! But the story of the light bulb is full of hard work and thousands of mistakes.<br><br>Many people think Thomas Edison invented the light bulb in 1879. The truth is, other scientists had already built bulbs, but they burned out after just a few minutes. Edison wanted to make a bulb that could stay bright for days.<br><br>To do this, he needed the perfect material for the tiny wire inside the bulb, called the filament. Edison and his team tested over six thousand different materials! They tested plants, thread, and even hair from a man’s beard.<br><br>Finally, they discovered that a piece of carbonized bamboo worked perfectly. It burned for more than twelve hours without breaking! Edison showed the world that failures are just steps to success. He famously said he did not fail six thousand times; he just found six thousand ways that did not work.",dictionary:{switch:"düğme",mistakes:"hatalar",scientists:"bilim insanları",burned:"yandı",bright:"parlak",material:"malzeme",wire:"tel",filament:"flaman",tested:"test etti",thread:"iplik",beard:"sakal",discovered:"keşfetti",carbonized:"karbonize edilmiş",failures:"başarısızlıklar",success:"başarı"}},{icon:"🪵",title:"10. Matches",src:"10_matches.mp3",text:"Fire is one of the most important tools in human history, but making a fire used to take a long time. People had to rub sticks together or strike rocks to create a tiny spark.<br><br>In 1826, a British chemist named John Walker was working in his laboratory. He was mixing chemicals with a wooden stick. When he pulled the stick out, he noticed a dried lump of chemicals on the tip.<br><br>He wanted to clean the stick, so he scraped the tip across his stone floor. Suddenly—whoosh! The friction created a bright flame right on the end of the wood. John Walker had accidentally invented the match.<br><br>At first, these early matches were dangerous because they could explode or ignite randomly in your pocket. Later, scientists created 'safety matches' that only light up when you strike them against a special strip on the side of the box.",dictionary:{rub:"sürtmek",strike:"çarpmak/vurmak",spark:"kıvılcım",chemist:"kimyager",laboratory:"laboratuvar",chemicals:"kimyasallar",noticed:"fark etti",dried:"kurumuş",lump:"topak",tip:"uç",scraped:"kazıdı",friction:"sürtünme",flame:"alev",accidentally:"kazara",explode:"patlamak",ignite:"tutuşmak",randomly:"rastgele",strip:"şerit"}},{icon:"🍱",title:"11. Microwave",src:"11_microwave.mp3",text:"The microwave is a magical kitchen machine. It can heat up your dinner or pop popcorn in just one minute! Like many great inventions, it was discovered completely by accident.<br><br>In 1945, an engineer named Percy Spencer was working at a company that built radar equipment for the military. One day, he stood in front of a working radar tube, which produces invisible energy waves.<br><br>Suddenly, he felt a strange, warm sensation in his pocket. He reached inside and discovered that his chocolate bar had completely melted into a sticky mess!<br><br>Percy Spencer was curious, not angry. He placed some corn kernels in front of the machine, and they instantly popped into popcorn all over the room! He realized these radar waves could cook food incredibly fast. He built a metal box to trap the waves, creating the very first microwave oven. Today, millions of kitchens have one.",dictionary:{magical:"sihirli",inventions:"icatlar",discovered:"keşfedildi",accident:"kaza",engineer:"mühendis",equipment:"ekipman",military:"ordu",invisible:"görünmez",sensation:"his/duyu",melted:"erimiş",sticky:"yapışkan",mess:"dağınıklık/karmaşa",curious:"meraklı",kernels:"çekirdekler",instantly:"anında",realized:"fark etti",trap:"hapsetmek"}},{icon:"✈️",title:"12. Planes",src:"12_planes.mp3",text:"Today, we can board a giant metal plane and fly across oceans in just a few hours. This incredible journey began with two brothers who repaired bicycles for a living.<br><br>Orville and Wilbur Wright loved machines. They spent years studying how birds fly and built giant kites to test the wind. On December 17, 1903, in North Carolina, Orville Wright climbed inside their wooden aircraft, called The Flyer, and launched into the air.<br><br>That historic first flight lasted just twelve seconds! The plane flew a distance shorter than the length of a modern passenger jet, but it proved that a machine could fly using its own engine power.<br><br>Just forty-four years later, planes were flying faster than the speed of sound! Aviation grew quicker than almost any other technology, turning our massive planet into a connected global neighborhood.",dictionary:{board:"binmek",incredible:"inanılmaz",journey:"yolculuk",repaired:"tamir etti",kites:"uçurtmalar",aircraft:"hava aracı",launched:"fırlatıldı/havalandı",historic:"tarihi",distance:"mesafe",passenger:"yolcu",proved:"kanıtladı",aviation:"havacılık",massive:"devasa",connected:"bağlantılı",neighborhood:"mahalle"}},{icon:"🍕",title:"13. Pizza",src:"13_pizza.mp3",text:"Pizza is one of the most loved foods on earth. You can find it in almost every country, but its modern story truly began in the city of Naples, Italy.<br><br>Long ago, flatbreads with simple toppings were a cheap food for poor workers who needed a quick meal. Then, in 1889, King Umberto and Queen Margherita visited Naples. The Queen was tired of eating fancy French food and wanted to try the local flatbread.<br><br>A chef named Raffaele Esposito wanted to make a very special pizza for the Queen. He chose three simple toppings to match the colors of the Italian flag: red tomatoes, white mozzarella cheese, and green basil leaves.<br><br>The Queen absolutely loved it! The chef named the pizza 'Margherita' in her honor. Italian immigrants later brought pizza recipes to America, and it quickly exploded into a global phenomenon.",dictionary:{flatbreads:"pideler",toppings:"malzemeler",cheap:"ucuz",fancy:"lüks/süslü",local:"yerel",chef:"şef",match:"eşleşmek",honor:"onur",immigrants:"göçmenler",recipes:"tarifler",exploded:"patladı/hızla yayıldı",global:"küresel",phenomenon:"fenomen/olgu"}},{icon:"🥔",title:"14. Potato Chips",src:"14_potato_chips.mp3",text:"Have you ever opened a bag of crunchy potato chips? This delicious snack was actually invented because a chef got very angry at a difficult customer!<br><br>In the year 1853, a chef named George Crum worked at a restaurant in New York. A wealthy customer ordered a plate of french fries. When the food arrived, the customer complained that the potatoes were too thick, too soft, and did not have enough salt.<br><br>George Crum made a second batch, but the customer rejected them again! Chef Crum became frustrated. To teach the customer a lesson, he sliced the potatoes paper-thin, fried them until they were rock-hard, and covered them in salt. He thought the customer would hate them.<br><br>Instead, the customer took a bite and yelled, 'These are amazing!' Soon, everyone wanted the crispy potato chips, and they became one of the most popular snacks in the world.",dictionary:{crunchy:"çıtır",delicious:"lezzetli",snack:"atıştırmalık",wealthy:"zengin",customer:"müşteri",complained:"şikayet etti",thick:"kalın",batch:"parti/porsiyon",rejected:"reddetti",frustrated:"hüsrana uğramış",sliced:"dilimledi",yelled:"bağırdı",crispy:"çıtır"}},{icon:"🧊",title:"15. Refrigerator",src:"15_refrigerator.mp3",text:"Have you ever wondered how your refrigerator stays so cold?<br><br>Long ago, people did not have refrigerators. To keep food fresh, they had to travel to frozen lakes in the winter. They cut giant blocks of real ice and carried them home on big boats! It was very hard work.<br><br>Then, everything changed. In the year 1748, a smart scientist named William Cullen showed the world the very first way to make artificial cooling. Later, in 1834, an inventor named Jacob Perkins built the first real cooling machine that actually worked for homes.<br><br>How does this machine work? It does not actually create cold. Instead, it acts like a vacuum cleaner for heat! Inside the fridge, a special liquid traps the warm air from your food. Then, the machine pushes that warm air out into your kitchen. That is why the back of a refrigerator always feels warm if you touch it!<br><br>Thanks to William Cullen and Jacob Perkins, we can enjoy cold juice and fresh ice cream anytime we want. Their invention completely changed how the world eats!",dictionary:{wondered:"merak ettin",fresh:"taze",frozen:"donmuş",scientist:"bilim insanı",artificial:"yapay",cooling:"soğutma",inventor:"mucit",vacuum:"elektrikli süpürge",liquid:"sıvı",traps:"hapseder",pushes:"iter",completely:"tamamen"}},{icon:"🧼",title:"16. Soap",src:"16_soap.mp3",text:"We use soap every day to wash our hands and stay healthy. It feels like a modern invention, but soap was actually discovered by accident thousands of years ago.<br><br>According to an old story, ancient people used to sacrifice animals on altars made of wood ash. When it rained, the melted animal fat mixed with the wood ash. This mixture washed down the hills into the river clay.<br><br>Women washing clothes in the river noticed something amazing. The strange clay made their clothes much cleaner and easier to wash! Without knowing the science, they had discovered soap.<br><br>For a long time, soap was heavy, expensive, and smelled bad. People only used it to clean clothes or animal skins. It took many centuries for scientists to make gentle, nice-smelling soap bars for our skin. Today, washing your hands with soap is the easiest way to protect yourself from germs and stay healthy.",dictionary:{healthy:"sağlıklı",accident:"kaza",ancient:"antik",sacrifice:"kurban etmek",altars:"sunaklar",ash:"kül",melted:"erimiş",mixture:"karışım",clay:"kil",noticed:"fark etti",strange:"tuhaf",expensive:"pahalı",centuries:"yüzyıllar",gentle:"nazik/yumuşak",protect:"korumak",germs:"mikroplar"}},{icon:"⚓",title:"17. Submarines",src:"17_submarines.mp3",text:"The ocean is deep, dark, and full of mysteries. Ships sail on top of the water, but a submarine can dive thousands of meters down into the deep sea.<br><br>The first working submarine was built all the way back in 1620 by a Dutch inventor named Cornelius Drebbel. It was a wooden rowboat covered in tight leather to keep the water out! Twelve rowers sat inside and used oars to move through the Thames River in London.<br><br>During the American Revolutionary War, inventors built a tiny, one-man submarine shaped like a giant egg, named The Turtle. The pilot had to turn foot-pedals and hand-cranks to move it under water.<br><br>Today, modern submarines are giant high-tech steel structures. They use nuclear power to stay submerged underwater for months at a time without ever coming up for air, exploring the deepest secrets of our blue planet.",dictionary:{mysteries:"gizemler",sail:"yelken açmak/seyretmek",dive:"dalmak",inventor:"mucit",rowboat:"sandal",tight:"sıkı",leather:"deri",rowers:"kürekçiler",oars:"kürekler",shaped:"şekillendirilmiş",pedals:"pedallar",modern:"modern",structures:"yapılar",nuclear:"nükleer",submerged:"su altında",exploring:"keşfederek"}},{icon:"🔘",title:"18. The Button",src:"18_the_button.mp3",text:"Look at your shirt or your jacket. Do you see any buttons? Buttons are everywhere today, but they were once used just for decoration, like jewelry.<br><br>Ancient people used buttons made of beautiful shells, bones, and round stones five thousand years ago. They pinned them onto their clothes just to look nice. To keep their clothes from falling off, they used metal pins, strings, or belts.<br><br>Then, around 13th century, someone in Germany had a brilliant, simple idea. They cut a small slit into the fabric. This slit was the very first buttonhole!<br><br>Suddenly, buttons became a magical technology. People could wear tight, warm clothes that locked out the cold wind. Buttons became so popular that rich people covered their entire outfits in buttons made of gold and silver. Today, plastic buttons are simple and cheap, but they remain one of the greatest fashion inventions in human history.",dictionary:{decoration:"dekorasyon",jewelry:"mücevher",ancient:"antik",shells:"kabuklar",pinned:"iğnelediler",strings:"ipler",brilliant:"parlak/zeki",slit:"yarık",fabric:"kumaş",magical:"sihirli",tight:"sıkı",locked:"kilitledi",outfits:"kıyafetler",cheap:"ucuz",fashion:"moda"}},{icon:"🌐",title:"19. The Internet",src:"19_the_internet.mp3",text:'Think about your favorite online video game, video website, or website. None of them could exist without the internet. But what is the internet, and how did it start?<br><br>The internet began in 1969 as a secret military project in America called ARPANET. Scientists wanted to connect computers at different universities so they could share information if phone lines stopped working.<br><br>In October 1969, engineers tried to send the very first message from one computer to another university computer. They planned to type the word "LOGIN." They typed the letter "L," then the letter "O," and then the entire system crashed! So, the very first internet message was just "LO."<br><br>Twenty years later, a scientist named Tim Berners-Lee invented the World Wide Web, which made it easy for regular people to open websites. Today, billions of computers, phones, and devices are connected to this giant digital web.',dictionary:{exist:"var olmak",secret:"gizli",military:"askeri",project:"proje",connect:"bağlamak",universities:"üniversiteler",share:"paylaşmak",information:"bilgi",message:"mesaj",entire:"bütün",crashed:"çöktü",regular:"sıradan/normal",billions:"milyarlar",devices:"cihazlar",connected:"bağlı",digital:"dijital"}},{icon:"🤐",title:"20. The Zipper",src:"20_the_zipper.mp3",text:'Imagine trying to put on your boots or close your backpack without a zipper. It would take a long time! The zipper is a great invention, but it took a very long time to perfect.<br><br>A man named Whitcomb Judson invented a "clasp locker" in 1893. He wanted a faster way to fasten his high boots. Sadly, his invention did not work well. It jammed constantly and popped open at the wrong times!<br><br>Twenty years later, a smart engineer named Gideon Sundback fixed the problem. He made the metal teeth much smaller and guided them together using a sliding piece.<br><br>At first, companies did not want to buy it. Then, the United States military put this new fastener on the boots and pockets of soldiers during World War I. In 1923, a company named it the "zipper" because of the fun zip sound it makes. Today, billions of zippers are manufactured every year around the world.',dictionary:{backpack:"sırt çantası",perfect:"mükemmelleştirmek",clasp:"toka/kopça",locker:"kilitleyici",fasten:"bağlamak/iliklemek",jammed:"sıkıştı",constantly:"sürekli",popped:"fırladı",guided:"yönlendirdi",sliding:"kayan",military:"ordu",fastener:"bağlayıcı",soldiers:"askerler",manufactured:"üretilmiş"}},{icon:"🧻",title:"21. Toilet Paper",src:"21_toilet_paper.mp3",text:"We use toilet paper every single day, and we expect it to be soft and clean. But what did people use before this common item was mass-produced?<br><br>In ancient Rome, public bathrooms had a stick with a sea sponge attached to the end, soaking in a bucket of saltwater. Everyone shared the exact same sponge! In other parts of the world, people used leaves, moss, coconut shells, or corn cobs.<br><br>When newspapers became popular in the 1800s, many people just hung old newspapers on a nail in the bathroom to use for free.<br><br>In 1857, an American businessman named Joseph Gayetty invented the first packet of modern toilet paper. He was very proud because his paper was treated with aloe vera to be soft. He even printed his own name on every sheet! Today, toilet paper is a basic necessity that we cannot imagine living without.",dictionary:{expect:"bekleriz",common:"yaygın",sponge:"sünger",attached:"eklenmiş",soaking:"ıslanan",bucket:"kova",shared:"paylaştı",exact:"kesin/aynı",moss:"yosun",hung:"astı",nail:"çivi",packet:"paket",proud:"gururlu",treated:"işlem görmüş/muamele edilmiş",printed:"yazdırdı/bastı",sheet:"yaprak",basic:"temel",necessity:"ihtiyaç/gereklilik"}},{icon:"🪥",title:"22. Toothpaste",src:"22_toothpaste.mp3",text:"Every morning and every night, you put toothpaste on your toothbrush to keep your teeth clean and white. Modern toothpaste tastes like sweet mint, but ancient toothpaste was very different—and a bit scary!<br><br>Ancient Egyptians invented the earliest toothpaste five thousand years ago. They did not have soft tubes. Instead, they mixed crushed ox hooves, ashes, burnt eggshells, and rough volcanic rock into a powder. They rubbed this powder onto their teeth with their fingers to scrub away food particles.<br><br>Later, the Romans added crushed bones and shells to make their teeth shine. For a long time, these powders tasted terrible and could actually hurt your gums.<br><br>In the 1800s, soap and mint were added to make the paste taste much better. Finally, a dentist named Washington Sheffield put toothpaste into a flexible metal tube in 1892. This made brushing your teeth clean, easy, and fun for everyone.",dictionary:{toothbrush:"diş fırçası",mint:"nane",scary:"korkutucu",earliest:"en erken",tubes:"tüpler",mixed:"karıştırdılar",crushed:"ezilmiş",hooves:"toynaklar",ashes:"küller",burnt:"yanmış",rough:"kaba/pürüzlü",volcanic:"volkanik",powder:"toz",rubbed:"ovaladılar",scrub:"fırçalamak/sürtmek",particles:"parçacıklar",shine:"parlamak",terrible:"berbat",gums:"diş etleri",dentist:"diş hekimi",flexible:"esnek"}},{icon:"☂️",title:"23. Umbrella",src:"23_umbrella.mp3",text:'Do you have an umbrella to protect you from the rain? Umbrellas have a very long history, but for thousands of years, they were used for a completely different reason: the sun!<br><br>The word umbrella comes from a Latin word that means "shadow." Four thousand years ago, ancient kings and queens in Egypt and China used umbrellas as sunshades. Having a big umbrella showed everyone that you were a very important and wealthy person.<br><br>In Europe, people did not use umbrellas for the rain until the 1700s. In fact, if a man carried an umbrella in London, people would laugh at him! They thought umbrellas were only for women and that men should just walk in the rain.<br><br>Then, a brave man named Jonas Hanway carried an umbrella every single day for thirty years. People stopped laughing when they saw he stayed perfectly dry. Soon, everyone wanted one, and umbrellas became a popular tool for rainy days.',dictionary:{protect:"korumak",completely:"tamamen",shadow:"gölge",ancient:"antik",sunshades:"güneşlikler",important:"önemli",wealthy:"zengin",carried:"taşıdı",brave:"cesur",perfectly:"kusursuzca",dry:"kuru",popular:"popüler",tool:"araç"}},{icon:"🧹",title:"24. Vacuum Cleaner",src:"24_vacuum _cleaner.wav",text:'Have you ever helped clean your house? Today, we use a vacuum cleaner to suck up dust from the floor. But long ago, cleaning was very different.<br><br>In the early 1900s, an engineer named Hubert Cecil Booth saw a machine that blew air to push dust away. He thought, "That is a bad idea! We should suck the dust into a container instead." To test his idea, he put a handkerchief over his own mouth, laid down on the floor, and sucked in the air. The handkerchief caught all the dust!<br><br>His first real vacuum cleaner was absolutely giant. It was so big that it had to be carried on a wagon pulled by horses! Workers parked the horses outside a house and ran giant hoses through the windows to clean the rugs. It was very loud, and it looked like a giant toy.<br><br>Later, smaller machines were invented for homes. Today, we even have tiny robot vacuums that clean the floor by themselves while we sleep!',dictionary:{vacuum:"elektrikli süpürge",suck:"emmek",dust:"toz",blew:"üfledi",container:"kap",handkerchief:"mendil",caught:"yakaladı",giant:"dev",wagon:"vagon",hoses:"hortumlar",rugs:"halılar",invented:"icat edildi",tiny:"minik",robot:"robot"}},{icon:"🎮",title:"25. Video Games",src:"25_video _games.wav",text:"Do you like playing video games on your computer or console? Today, games have beautiful 3D graphics and complex stories, but the very first video game was incredibly simple.<br><br>In 1958, a nuclear scientist named William Higinbotham wanted to make his laboratory tours more exciting for visitors. He used an old computer screen meant for science charts and turned it into a game called Tennis for Two.<br><br>The game showed a simple green line for the net and a bright glowing dot for the ball. Players turned a metal knob and pressed a button to hit the ball back and forth. Everyone loved it!<br><br>Later, in 1972, a game called Pong became the first successful arcade game. It looked like a simple digital table tennis match. These early experiments showed the world that computers could be used for pure fun, starting a massive global industry.",dictionary:{console:"konsol",graphics:"grafikler",complex:"karmaşık",incredibly:"inanılmaz derecede",nuclear:"nükleer",scientist:"bilim insanı",laboratory:"laboratuvar",tours:"turlar",exciting:"heyecan verici",visitors:"ziyaretçiler",charts:"grafikler/tablolar",glowing:"parlayan",dot:"nokta",knob:"düğme/topuz",pressed:"bastı",successful:"başarılı",arcade:"atari salonu",digital:"dijital",experiments:"deneyler",pure:"saf",massive:"devasa",industry:"endüstri"}}]},tp={id:"food",title:"Food History",cover:"🍽️",color:"#d35400",description:"A complete collection of 26 listening lessons exploring the fascinating history of foods that used to be cheap but are now luxury items.",baseUrl:"https://raw.githubusercontent.com/dogierez/poor-food-now-luxury-26-spotify/main/",githubRepoUrl:"https://github.com/dogierez/poor-food-now-luxury-26-spotify",tracks:[{icon:"🦞",title:"1. Lobster",src:"1.m4a",text:"Lobster is a very expensive food today. But in the past, people did not like it. In the 1600s, there were too many lobsters in America. After big storms, huge piles washed onto the beaches. People called them ocean trash.<br><br>Farmers used to put them on their fields to help plants grow. Servants and prisoners used to eat them because they were very cheap. People thought it was a punishment to eat lobster! Everything changed in the 1800s. People built the railroad. Trains traveled from the ocean to cities far away.<br><br>Chefs on the trains cooked fresh lobsters for the rich passengers. These passengers tasted lobster for the first time. They thought it was delicious. Because it was new, everyone wanted it.<br><br>Soon, restaurants started to serve lobster on fancy white tables. They charged a lot of money for it. The sea insect became a rich person's dinner. Now, people will save their money to buy lobster for special days. They will not remember its history as prison food!",dictionary:{expensive:"pahalı",storms:"fırtınalar",piles:"yığınlar",trash:"çöp",servants:"hizmetçiler",prisoners:"mahkumlar",punishment:"ceza",railroad:"demiryolu",passengers:"yolcular",delicious:"lezzetli",charged:"ücretlendirdi",insect:"böcek"}},{icon:"🐂",title:"2. Oxtail",src:"2.m4a",text:"Oxtail is exactly what it sounds like: the real tail of a cow. It is mostly bone with a little bit of meat. For hundreds of years, nobody wanted to pay for it. From the 17th century to the 20th century, oxtail was a food for poor people.<br><br>Because it was so tough, it needed a very long time to cook. People used to boil it for three hours. They made thick, rich soups. It cost almost nothing, and it easily filled a big family pot. Families used to eat this because they did not have much money.<br><br>Then, something interesting happened. When you cook oxtail slowly, the fat melts. The liquid becomes very tasty. In the 2000s, famous chefs noticed this. They realized that this cheap meat tasted amazing. They put it on their fancy menus. Food writers talked about it.<br><br>Suddenly, everyone wanted to eat oxtail. But a cow only has one tail! Because many people want it now, the price is high. It will stay expensive forever.",dictionary:{tough:"sert",boil:"kaynatmak",thick:"koyu/kalın",slowly:"yavaşça",melts:"erir",liquid:"sıvı",tasty:"lezzetli",noticed:"fark etti",realized:"farkına vardı",forever:"sonsuza dek"}},{icon:"🐟",title:"3. Caviar",src:"3.m4a",text:"Caviar is the salted eggs of a sturgeon fish. Today, people think of it as a very rich person's food. But a long time ago in America, it was free! In the 19th century, rivers in North America were full of sturgeon fish. There were so many fish eggs that the price was very low.<br><br>American bars used to put bowls of salty caviar on their tables for free. The owners did this as a trick. The salty fish eggs made people thirsty. When people felt thirsty, they bought more drinks! However, people fished too much. They also polluted the water. Soon, the fish disappeared. The supply of caviar stopped.<br><br>Then, American sellers remembered something. Russian kings used to eat caviar as a royal meal. The sellers told people that caviar was a rare, royal food. They started to serve it with special spoons. Because it was rare, the price went up. Today, you will pay a lot of money for a tiny spoon of caviar.",dictionary:{salted:"tuzlanmış",sturgeon:"mersin balığı",bowls:"kaseler",trick:"hile",thirsty:"susamış",polluted:"kirletti",disappeared:"yok oldu",supply:"tedarik",royal:"kraliyet",rare:"nadir"}},{icon:"🥓",title:"4. Pork Belly",src:"4.m4a",text:"Pork belly is the fat meat from the bottom of a pig. If you add salt and smoke to it, it becomes bacon. For a very long time, poor workers used to eat pork belly. In the past, rich people only bought the lean meat. Working families bought the fatty parts because they were very cheap.<br><br>They used to hide the pork belly inside sausages or boil it for many hours. Nobody saw it as a special meal. Then, in the 1990s, things changed. A new group of chefs started a movement. They wanted to use every single part of the animal.<br><br>Chefs learned how to cook pork belly perfectly. They cooked it very slowly until the fat became soft. Then, they cooked it quickly at a high heat to make the skin crispy. The result was beautiful and delicious. They put it in the center of the plate. Now, restaurants will charge forty dollars for a piece of pork belly! It is a true luxury.",dictionary:{smoke:"tütsü/duman",lean:"yağsız",hide:"saklamak",movement:"hareket",perfectly:"kusursuzca",heat:"ısı",crispy:"çıtır",luxury:"lüks"}},{icon:"🦪",title:"5. Oysters",src:"5.m4a",text:"In the past, New York City had millions of oysters. Before the late 1800s, the ocean around the city was full of them. They were so common that people sold them on the streets in cheap buckets. Anyone with a few coins used to buy them. Poor families put them in pies because meat was too expensive.<br><br>People even kept the empty oyster shells. Builders used to crush the shells to make roads and build houses. But then, the city grew bigger and dirtier. The ocean filled with pollution. People also ate too many oysters, so they almost disappeared.<br><br>For many years, it was dangerous to eat a New York oyster because it made people sick. In the early 2000s, clean oysters became popular again. But this time, they were rare. Restaurants decided to treat oysters like fine wine. Now, you will pay several dollars for just one single oyster. People will take pictures of them at expensive parties. They forgot their history as cheap street food!",dictionary:{common:"yaygın",buckets:"kovalar",coins:"bozuk paralar",crush:"ezmek",pollution:"kirlilik",sick:"hasta",rare:"nadir",treat:"muamele etmek"}},{icon:"🍖",title:"6. Short Ribs",src:"6.m4a",text:"Short ribs come from the lower chest of a cow. This meat is very tough. It has a lot of fat, heavy bones, and strong tissue. You cannot just cook it quickly on a fire. If you try, it will be too hard to chew! In the 1800s, rich families did not want this tough meat. So, it was very cheap.<br><br>Poor families used to buy short ribs. They cooked the meat in water on a low fire for many hours. After a long time, the meat finally became soft. Poor mothers used to put this meat into dinners to feed their hungry children.<br><br>In the late 1990s, fancy restaurants discovered short ribs. Chefs realized that slowly cooked short ribs tasted amazing. The meat easily fell off the bone. The chefs served it with smooth potatoes and rich sauces. It looked like a very expensive meal. Today, you will pay a lot of money for short ribs in a restaurant. You pay for the chef's hard work!",dictionary:{chest:"göğüs",tough:"sert",tissue:"doku",chew:"çiğnemek",hungry:"aç",discovered:"keşfetti",realized:"fark etti",smooth:"pürüzsüz"}},{icon:"🐌",title:"7. Escargot",src:"7.m4a",text:"Escargot is a famous French dish. It means cooked snails. Today, you will find escargot on the menus of very expensive restaurants. But the real history of this food is very simple: snails were completely free! Hundreds of years ago in France, poor farmers used to catch snails with their own hands. They picked them from gardens and roads. No one else wanted them.<br><br>During bad times, people did not have enough food. They used to eat snails because they needed meat to survive. The snails cost nothing at all. To make the snails taste good, farmers added cheap garlic, herbs, and butter.<br><br>Later, big French restaurants took this simple farmer food and made it fancy. They created tiny forks and special plates just for eating them. These strange tools made the meal look very special. Because it looked special, restaurants charged a high price. Now, when people order escargot, they want to show that they are rich. They pay for food that farmers used to get for free!",dictionary:{snails:"salyangozlar",survive:"hayatta kalmak",garlic:"sarımsak",herbs:"otlar",fancy:"lüks",forks:"çatallar",tools:"araçlar",charged:"fiyat biçti"}},{icon:"🦴",title:"8. Bone Marrow",src:"8.m4a",text:"Bone marrow is the soft, fatty middle part of a large animal bone. One hundred years ago, you could walk into a meat shop and get bones for free. Butchers thought bones were just trash. After they cut off the meat, they threw the bones away. Poor families used to take these cheap bones home.<br><br>They boiled them in big pots of water. The marrow melted and made delicious soups. People used to do this because they did not want to waste any part of the animal. Nobody thought of bones as a real meal.<br><br>This completely changed in the year 1994. A British chef named Fergus Henderson opened a new restaurant in London. He decided to roast large cow bones in a hot oven. The heat made the marrow soft like warm butter. He served it with toast and a green salad. It looked wild and exciting on the plate. Very quickly, famous restaurants everywhere copied him. Today, you will pay twenty dollars for roasted bone marrow!",dictionary:{marrow:"ilik",trash:"çöp",butchers:"kasaplar",threw:"attı",boiled:"kaynattı",waste:"israf etmek",roast:"fırında kızartmak",oven:"fırın",copied:"kopyaladı"}},{icon:"🍣",title:"9. Sushi",src:"9.m4a",text:"When we think of sushi today, we often imagine an expensive dinner. In some famous restaurants, a chef chooses the fish for you. You sit quietly, follow special rules, and eat very rare fish. You will pay hundreds of dollars for this dinner. But the original story of sushi is completely different.<br><br>A long time ago, sushi was just a trick to keep fish fresh. People packed fish in wet rice and left it for months. They ate the fish and threw the rice away. By the 17th century in Tokyo, sushi became a cheap street food.<br><br>Men stood on the street and made sushi in seconds. They pushed a piece of raw fish onto a ball of sour rice. Busy workers used to buy it and eat it fast. They ate it fast because they had to go back to work. It was the oldest kind of fast food! Fancy chefs turned this fast street food into a beautiful, expensive art for rich people.",dictionary:{imagine:"hayal etmek",rules:"kurallar",original:"orijinal",trick:"hile",fresh:"taze",packed:"paketledi",raw:"çiğ",sour:"ekşi"}},{icon:"🦆",title:"10. Foie Gras",src:"10.m4a",text:"Foie gras is the fat liver of a duck or a goose. Today, it is one of the most expensive foods in the world. Many places even ban it because of how farmers feed the birds. But this fancy food did not start in the kitchens of rich kings. It started with ordinary people who wanted to use everything.<br><br>Thousands of years ago, ancient Egyptians used to feed their geese extra food. Later, in Europe, Jewish families raised geese for their rich fat. They used the goose fat to cook their meals because they did not use butter. The large, fatty liver was just an extra part of the bird.<br><br>Ordinary families used to cook and eat it to save money. In the 18th century, famous French chefs tasted this amazing liver. They decided to take this simple farmer food and serve it to rich people. They cooked it with sweet fruit jams. Now, people will pay a huge amount of money for a tiny piece of foie gras.",dictionary:{liver:"karaciğer",ban:"yasaklamak",ordinary:"sıradan",ancient:"antik",raised:"yetiştirdi",extra:"fazladan",jams:"reçeller",huge:"devasa",amount:"miktar"}},{icon:"🍗",title:"11. Chicken Wings",src:"11.m4a",text:"Chicken wings are a very popular and expensive food today. But a long time ago, people did not want to eat them at all. Butchers thought chicken wings were just trash. They cut the wings off the birds and threw them away. The wings had very little meat and too many bones. Nobody wanted to buy them.<br><br>Poor families did not have enough money to buy good cuts of meat. So, they used to go to the local butchers and collect the cheap chicken wings. They put the small wings into big pots of boiling water with vegetables. The bones gave a delicious chicken flavor to their cheap meals. They used to eat this warm soup to survive the cold winters.<br><br>Then, some clever cooks discovered something amazing. They realized that if you fry the wings in hot oil and add a spicy sauce, they taste wonderful! Suddenly, everybody loved the taste. Today, chicken wings are a luxury food. People will pay a lot of money to eat them.",dictionary:{trash:"çöp",boiling:"kaynayan",vegetables:"sebzeler",flavor:"tat/lezzet",survive:"hayatta kalmak",clever:"zeki",fry:"kızartmak",spicy:"baharatlı",luxury:"lüks"}},{icon:"🐸",title:"12. Frog Legs",src:"12.m4a",text:"Many years ago in France, King Louis the Sixteenth lived a very rich life. He ate the best meals in his huge palace. But outside the palace, life was very hard. There was no meat left for the common people. The poor peasants were very hungry.<br><br>Because they needed food, the peasants discovered something new. They used to go to the lakes and rivers to catch wet frogs. They cooked the frogs over simple fires to feed their families and survive. Soon, King Louis and his royal chefs heard a story about this new food.<br><br>The King was very curious. He ordered his men to collect frogs from the rivers and bring them to the palace. His chefs cooked the frogs with fancy sauces, rich butter, and green herbs. King Louis tasted the frogs and he liked the flavor very much! Because the King loved it, the dish became famous. Soon, all the rich aristocrats wanted to eat it too. The simple river frog became a luxury meal.",dictionary:{palace:"saray",peasants:"köylüler",survive:"hayatta kalmak",curious:"meraklı",collected:"topladı",flavor:"lezzet/tat",aristocrats:"aristokratlar"}},{icon:"🌭",title:"13. Blutwurst (Blood Sausage)",src:"13.m4a",text:"Blood sausage is a popular food in Germany, Ireland, and many other countries. Today, chefs serve it in expensive restaurants. But in the past, it was a food for very poor farmers. When farmers killed an animal for meat, they did not want to waste anything. Meat was very expensive, and they needed every part of the animal to survive the cold winter.<br><br>They used to collect the dark blood of the animal in a bowl. They mixed the blood with fat, cheap grains, and strong spices. Then, they cooked it over a fire. It looked very strange, but it gave them a lot of energy. For hundreds of years, rich people refused to eat it. They thought it was dirty food.<br><br>But today, people think differently. Famous chefs cook blood sausage with fresh apples and sweet onions. Now, people will pay a high price for this old farmer food.",dictionary:{waste:"israf etmek",survive:"hayatta kalmak",grains:"tahıllar",spices:"baharatlar",refused:"reddetti",differently:"farklı şekilde"}},{icon:"🥩",title:"14. Pastırma (Cured Beef)",src:"14.m4a",text:"Pastırma is a delicious, salty meat. Today, you will find it in fancy Turkish breakfasts and expensive sandwiches. But its story started a very long time ago with tough nomadic riders in Central Asia. These riders traveled long distances on their horses. They did not have refrigerators to keep their food fresh. They needed a way to save meat for long journeys.<br><br>The riders used to cut the beef into thick slices. They rubbed a lot of salt and strong garlic on the meat. Then, they put the salty meat inside special bags. They hung these bags on the sides of their horses. When they rode their horses, their heavy legs pressed against the bags.<br><br>The pressure and the salt slowly cooked the meat. It lasted for many months without going bad! Later, the Ottoman palace chefs loved this spicy meat. They turned it into a luxury food. Today, pastırma is a very expensive delicacy.",dictionary:{nomadic:"göçebe",riders:"biniciler",distances:"mesafeler",journeys:"yolculuklar",slices:"dilimler",rubbed:"ovaladı",pressure:"basınç",delicacy:"leziz yemek"}},{icon:"🥣",title:"15. Bouillabaisse (Fish Soup)",src:"15.m4a",text:"Bouillabaisse is a famous French fish soup. If you visit a restaurant in southern France today, you will pay a lot of money for one bowl. The chef will serve it with fresh bread and a fancy sauce. But a long time ago, it was the cheapest food in the city of Marseille.<br><br>Fishermen used to go out to the sea in small boats. They caught many beautiful fish to sell at the market. But sometimes, they caught ugly fish with too many bones. Nobody wanted to buy these bony fish. The fishermen did not want to throw them away. So, they used to take the ugly fish home.<br><br>They boiled them in a big pot with sea water, cheap tomatoes, and old onions. It was a simple soup for poor families. Then, rich tourists visited Marseille and tasted the soup. They loved it! Soon, chefs added expensive spices and rare seafood. The poor fisherman's soup became a rich person's dinner.",dictionary:{southern:"güney",fishermen:"balıkçılar",ugly:"çirkin",bony:"kılçıklı",boiled:"kaynattı",rare:"nadir",seafood:"deniz ürünleri"}},{icon:"🧀",title:"16. Fondue (Melted Cheese)",src:"16.m4a",text:"Fondue is a famous Swiss dish. A family sits around a warm pot of melted cheese and dips bread into it. Today, people eat fondue on expensive ski holidays in the snowy mountains. But it started as a meal for poor Swiss farmers. In the winter, the villages in the Alps got very cold.<br><br>The snow blocked the roads. The farmers could not buy fresh food. They only had hard, old cheese and dry, hard bread in their houses. The bread was so hard that they broke their teeth! To fix this problem, they used to melt the old cheese in a big pot over the fire.<br><br>They dipped the old bread into the hot cheese to make it soft. It was a very cheap meal to survive the winter. Later, in the 1930s, Swiss cheese makers wanted to sell more cheese. They told everyone that fondue was a fancy national dish. Now, it is a very expensive luxury meal!",dictionary:{melted:"erimiş",dips:"batırır",blocked:"kapattı",hard:"sert",survive:"hayatta kalmak",national:"ulusal",luxury:"lüks"}},{icon:"🍕",title:"17. Pizza",src:"17.m4a",text:"Pizza is the most famous food in the world today. But a long time ago, rich people hated it. In the 1800s, Naples was a very poor city in Italy. The street workers did not have much money or time. They needed food that was cheap and fast.<br><br>Bakers used to make flat, round bread and put cheap tomatoes on top. Sometimes they added a little bit of old cheese or garlic. The poor workers used to buy a slice and eat it on the street. Rich Italians thought it was dirty peasant food. They refused to touch it.<br><br>Everything changed in the year 1889. Queen Margherita of Italy visited Naples. She felt tired of fancy royal food. She wanted to taste the poor people's bread. A baker made her a special pizza with red tomatoes, white cheese, and green leaves. She loved it! Because the Queen ate it, everyone wanted it. Now, people will pay high prices for gourmet pizza.",dictionary:{hated:"nefret etti",bakers:"fırıncılar",flat:"düz",slice:"dilim",peasant:"köylü",refused:"reddetti",tired:"yorgun",gourmet:"gurme"}},{icon:"🌮",title:"18. Fajitas",src:"18.m4a",text:"When you order fajitas in a restaurant today, the waiter brings a hot pan of delicious meat. You will pay a good price for this famous Mexican-American meal. But the story of the fajita started with poor cowboys in Texas. These cowboys worked very hard on big cattle farms in the 1930s.<br><br>The farm owners kept the best and most expensive cuts of beef to sell. They gave the cheap, tough meat to the cowboys as part of their pay. This meat came from the bottom of the cow. It was very tough and hard to chew. The clever cowboys used to cut the meat into very thin strips.<br><br>They mixed the strips with lime juice and strong spices to make it soft. Then, they cooked it quickly over a hot fire and ate it inside flat bread. For many years, only poor workers knew about it. In the 1980s, fancy restaurants discovered it. Now, everyone loves the famous cowboy meal.",dictionary:{waiter:"garson",pan:"tava",cattle:"sığır",tough:"sert",chew:"çiğnemek",clever:"zeki",strips:"şeritler",lime:"misket limonu"}},{icon:"🌾",title:"19. Quinoa",src:"19.m4a",text:'Quinoa is a very healthy grain. Today, you will find it in expensive salads at fancy health food cafes. People call it a "superfood." But for thousands of years, it was just the basic food of poor farmers in the Andes Mountains of South America. The weather in the high mountains was very cold and dry.<br><br>Most plants died in the cold, but quinoa grew perfectly. The ancient Inca people used to eat it every single day to stay strong. When the Spanish army arrived in South America, they hated the quinoa. They thought it was a useless food for poor peasants. They forced the farmers to grow wheat instead.<br><br>For hundreds of years, the rest of the world ignored quinoa. Then, in the 2000s, scientists discovered that it was very good for the human body. Suddenly, healthy eaters everywhere wanted it. Because the demand grew so fast, this cheap peasant food became very expensive.',dictionary:{healthy:"sağlıklı",grain:"tahıl",ancient:"antik",useless:"işe yaramaz",forced:"zorladı",wheat:"buğday",ignored:"görmezden geldi",scientists:"bilim insanları",demand:"talep"}},{icon:"🍜",title:"20. Ramen Noodles",src:"20.m4a",text:"Ramen is a bowl of hot soup, noodles, and meat. Today, there are famous ramen restaurants all over the world. People will wait in a long line to buy a bowl. But in the beginning, ramen was a cheap food for poor students and workers in Japan.<br><br>After World War Two, Japan did not have a lot of food. People were very hungry. Small street carts used to sell big bowls of hot salty soup with wheat noodles. The noodles cost almost nothing. Poor workers used to eat the soup fast so they could return to their jobs quickly.<br><br>In 1958, a man invented cheap instant noodles in a plastic cup. It became the food of poor college students everywhere. But in the 2000s, chefs decided to change it. They cooked the meat for many hours and made rich, beautiful soups. They turned the cheap street food into an art. Now, you will pay twenty dollars for gourmet ramen!",dictionary:{carts:"arabalar",instant:"hazır",college:"üniversite",gourmet:"gurme"}},{icon:"🍋",title:"21. Ceviche",src:"21.m4a",text:"Ceviche is a popular seafood dish in South America. The chef mixes raw fish with sour lemon or lime juice. The sour juice slowly cooks the raw fish without any fire. Today, you will eat it in luxury restaurants by the ocean. But hundreds of years ago, it was a fast meal for poor fishermen in Peru.<br><br>The fishermen used to spend all day on their boats under the hot sun. They did not have stoves or fires on their small boats to cook their food. When they felt hungry, they took a fresh fish directly from the water. They cut the raw fish into small pieces.<br><br>They used to squeeze fresh sour fruit juice over the fish and eat it right there on the boat. It was a cheap and easy way to eat at sea. Later, rich people in the big cities discovered this trick. Chefs added expensive spices and served it on fancy plates.",dictionary:{raw:"çiğ",sour:"ekşi",stoves:"ocaklar",directly:"doğrudan",squeeze:"sıkmak",trick:"hile",rare:"nadir"}},{icon:"🥔",title:"22. Gnocchi",src:"22.m4a",text:"Gnocchi is a delicious Italian food. They look like small, soft pillows. Today, Italian restaurants serve gnocchi with rich meat sauces and expensive cheese. But they started as a trick to save money. Hundreds of years ago, poor Italian farmers did not have enough money to buy wheat flour.<br><br>Flour was very expensive, but the farmers had very big families to feed. They needed a cheap way to fill their stomachs. When explorers brought potatoes from America to Europe, the Italian farmers grew them in the dirt. Potatoes were very cheap and easy to grow.<br><br>The mothers used to boil the cheap potatoes and mash them. They mixed a lot of potato with just a tiny bit of expensive flour. They rolled them into small balls and boiled them. This cheap potato meal kept the poor farmers full of energy. Today, chefs make gnocchi by hand in fancy kitchens. People will pay a high price for these simple potato pillows!",dictionary:{pillows:"yastıklar",flour:"un",stomachs:"mideler",explorers:"kaşifler",mash:"ezmek",rolled:"yuvarladı"}},{icon:"🥩",title:"23. BBQ Ribs",src:"23.m4a",text:"Barbecue ribs are a famous American meal. The meat is sweet, smoky, and very soft. Today, you will find special barbecue restaurants everywhere. They charge a lot of money for a plate of ribs. But the history of barbecue ribs is a story of poor people.<br><br>In the southern United States, rich farm owners took all the best cuts of the pig. They left the tough ribs for the enslaved people and poor farmers. The ribs had very little meat and big, thick bones. If you cooked them quickly, they were too hard to eat.<br><br>To make the ribs soft, poor people used to dig a hole in the ground. They made a slow, smoky fire. They cooked the cheap ribs over the smoke for many hours. They used to brush the meat with sweet and spicy sauces to cover the bad taste. Now, rich people love this smoky flavor. This cheap meat is now a big business!",dictionary:{smoky:"tütsülü",enslaved:"köleleştirilmiş",thick:"kalın",dig:"kazmak",hole:"delik",brush:"fırçalamak/sürmek",flavor:"lezzet"}},{icon:"🌽",title:"24. Polenta",src:"24.m4a",text:'Polenta is a thick, yellow corn meal from Italy. Today, chefs serve it in fancy restaurants with expensive mushrooms and rich meat. But for a very long time, it was the daily food of poor Italian farmers. When farmers grew corn in their fields, they dried the yellow corn and crushed it into small pieces.<br><br>They did not have meat, fish, or cheese. They only had this yellow powder. The poor farmers used to mix the polenta with boiling water in a big iron pot. They stirred it over the fire for an hour until it became a thick yellow paste.<br><br>A poor family used to eat it every day for breakfast, lunch, and dinner. It was very boring, but it kept them alive. Rich Italians used to laugh at the farmers and called them "polenta eaters." But today, the rich people changed their minds. They added butter and fancy cheese. Now, it is a very expensive Italian dish.',dictionary:{crushed:"ezilmiş",powder:"toz",iron:"demir",stirred:"karıştırdı",paste:"macun",boring:"sıkıcı"}},{icon:"🐮",title:"25. Brisket",src:"25.m4a",text:"Brisket is a very large cut of beef from the chest of the cow. Because the cow uses its chest muscles a lot, the meat is very tough. In the past, butchers could not sell it to rich people. So, the tough brisket was very cheap. Poor Jewish immigrants in Eastern Europe used to buy this cheap meat for their families.<br><br>They needed to make the tough meat soft. The mothers used to cook the brisket in a pot with onions and water on a very low fire. They cooked it all day until it was soft enough to cut with a fork. Later, Jewish families moved to America and brought this recipe with them.<br><br>Also in Texas, poor farmers cooked brisket slowly over smoke to make it soft. Today, slowly cooked brisket is very famous. People will stand in long lines to buy it. Because everyone loves it, this tough and cheap meat is now very expensive.",dictionary:{chest:"göğüs",muscles:"kaslar",tough:"sert",immigrants:"göçmenler",recipe:"tarif",lines:"kuyruklar"}},{icon:"🌯",title:"26. Tantuni",src:"26.mp3",text:`Tantuni is a very famous food from Mersin, Turkey. But fifty years ago, it started as a cheap meal for poor market workers. After a long day of work, the Arab workers felt very hungry. They did not have much money. So, they used to go to the butchers and collect the cheapest leftover meat. People called this meat "cındırık."<br><br>The workers also collected old metal trays from the baklava makers. They hit the middle of the tray with a hammer to make a deep hole. They put the tray over a hot fire. They used cheap cotton oil to fry small pieces of boiled meat. Then, they put the hot meat inside cheap bread or leftover pastry.<br><br>They added onions, tomatoes, and parsley to make it taste good. In their Arabic dialect, "tantuni" meant a mix of everything. Soon, the rich shop owners smelled this amazing food in the evenings. They wanted to taste it too. Because everyone loved the taste, this cheap worker's meal became Mersin's famous national dish!`,dictionary:{leftover:"artan",trays:"tepsiler",hammer:"çekiç",hole:"delik",pastry:"hamur işi",parsley:"maydanoz",dialect:"lehçe",smelled:"kokusunu aldı",national:"ulusal"}}]},ap={id:"satires",title:"Satires",cover:"🎭",color:"#e67e22",description:"A complete collection of 44 satirical listening lessons, wit, and historical humor.",baseUrl:"https://raw.githubusercontent.com/dogierez/satires-spotify/main/",githubRepoUrl:"https://github.com/dogierez/satires-spotify",tracks:[{icon:"⚔️",title:"1. The Spartan Reply",src:"1.The Spartan Reply.m4a",text:'Philip II of Macedon was conquering Greek city-states one by one. Frustrated by the stubbornness of Sparta, he sent them a threatening message: "If I invade Laconia, I shall turn you out, destroy your farms, slay your people, and raze your city, never to rise again." The Spartans wrote back a single word: "If." Philip never invaded Sparta.',dictionary:{conquering:"fetheden",invade:"istila etmek",raze:"yerle bir etmek"}},{icon:"🏺",title:"2. Diogenes the Cynic",src:"2.Diogenes the Cynic.m4a",text:'Alexander the Great went out of his way to meet the famous philosopher Diogenes, who lived in a ceramic jar on the streets of Corinth. Alexander found him resting in the sunlight. Hoping to impress him, the conqueror stood over him and said, "I am Alexander the Great. Is there nothing in the world I can do for you?" Diogenes looked up and replied, "Yes. Stand a little out of my sun."',dictionary:{philosopher:"filozof",impress:"etkilemek"}},{icon:"⛪",title:"3. The Greek Priest",src:"3.The Greek Priest.m4a",text:`During the Nazi occupation of Greece, a high-ranking German officer is stationed in a rural Greek village. One afternoon, he needs to relieve himself and demands that the local village priest show him to the restroom. The priest nods and leads the officer out behind the church to a barren, rocky field with nothing but a simple hole in the ground. Shocked and utterly disgusted, the German officer zips his pants and scoffs, "You Greeks! You have absolutely zero organization, zero infrastructure, and no culture! Just look at how you live!" The Greek priest shrugs and calmly replies, "Well, if we were an organized country, we'd be taking a shit in Berlin right now."`,dictionary:{occupation:"işgal",infrastructure:"altyapı"}},{icon:"🎩",title:"4. The Earl and the Radical",src:"4.The Earl and the Radical.m4a",text:`John Wilkes was a radical English politician and journalist known for his devastating wit. During a particularly heated debate, the Earl of Sandwich furiously shouted at him, "Sir, I do not know whether you will die on the gallows or of the pox!" Wilkes smoothly replied, "That depends, my lord, on whether I embrace your lordship's principles or your mistress."`,dictionary:{radical:"köklü/radikal",gallows:"darağacı"}},{icon:"🕊️",title:"5. Mahatma Gandhi's Opinion",src:"5.Mahatma Gandhi's Opinion.m4a",text:'When Mahatma Gandhi traveled to London to meet with British authorities, he was asked by a reporter what he thought of the "civilized" nature of the British Empire. The reporter asked, "Mr. Gandhi, what do you think of Western civilization?" Gandhi smiled and replied, "I think it would be a very good idea."',dictionary:{civilized:"uygar",empire:"imparatorluk"}},{icon:"🐶",title:"6. The Puppies",src:"6.The Puppies.m4a",text:'A German officer in occupied Athens sees a young boy on the street corner selling a basket of puppies. "What kind of puppies are these?" the officer asks. The boy replies, "They are Nazi puppies." Pleased, the officer walks away. A week later, he returns with his commanding General to show off the loyal local boy. "Boy," the officer says proudly, "tell the General what kind of puppies these are." The boy says, "They are Greek resistance puppies." Furious, the officer yells, "Last week you told me they were Nazi puppies!" The boy shrugs. "Yes, but since then, their eyes have opened."',dictionary:{resistance:"direniş",commanding:"komuta eden"}},{icon:"🥾",title:"7. Abraham Lincoln's Boots",src:"7.Abraham Lincoln's Boots.m4a",text:`During his presidency, Abraham Lincoln was known for his humble, frontier habits. One day, a foreign diplomat walked into Lincoln’s office and was appalled to find the President of the United States polishing his own footwear. The diplomat scoffed, "Mr. President, in my country, gentlemen do not clean their own shoes." Lincoln didn't even look up. "Is that so? Then whose shoes do they clean?"`,dictionary:{diplomat:"diplomat",polishing:"parlatma"}},{icon:"🐢",title:"8. Zhuangzi’s Tortoise",src:"8.Zhuangzi’s Tortoise.m4a",text:'The great Taoist philosopher Zhuangzi was fishing by a river when two messengers from the King of Chu arrived, offering him the position of Prime Minister. Zhuangzi kept his eyes on his fishing rod and said, "I have heard that the King keeps a sacred, three-thousand-year-old tortoise shell in a silk box in his shrine. Tell me, would that tortoise rather be dead and honored in a shrine, or alive and happily dragging its tail in the mud?" The messengers replied, "Alive and dragging its tail in the mud, of course." Zhuangzi waved them away. "Go away. I prefer dragging my tail in the mud."',dictionary:{tortoise:"kaplumbağa",shrine:"tapınak"}},{icon:"🎩",title:"9. The Polite Introduction",src:"9.The Polite Introduction.m4a",text:'A German officer is strutting down the sidewalk in occupied Paris when a Frenchman accidentally bumps into him. The angry officer snaps to attention and shouts, "Swine!" The Frenchman calmly tips his hat, bows slightly, and replies, "A pleasure to meet you. I am Pierre."',dictionary:{strutting:"çalımla yürümek",swine:"domuz"}},{icon:"🪶",title:"1
