Cnut was a very smart ruler, not just a strong warrior. He knew that to keep peace, he needed the respect of the people. He married an English queen and worked closely with the Catholic Church. He even traveled to Rome to meet the Pope and the Holy Roman Emperor. Because of his wise leadership, his lands enjoyed years of peace and great wealth. A famous legend says he once commanded the ocean waves to stop, showing his followers that only God is truly all-powerful. He died in 1035 as a legendary king.",dictionary:{wanted:"istiyordu",raid:"yağmalamak",build:"inşa etmek",fought:"savaştı",keep:"ellerinde tutmak",defeated:"yendi",conquered:"fethetti",united:"birleştirdi",knew:"biliyordu",needed:"ihtiyacı vardı",married:"evlendi",worked:"çalıştı",traveled:"seyahat etti",enjoyed:"yaşadı (barış yıllarını)",commanded:"emretti",stop:"durmalarını",showing:"göstererek"}},{icon:"🕊️",title:"11. Cyrus the Great",src:"11_Cyrus_the_Great.mp3",text:"Cyrus the Great was the brilliant founder of the ancient Persian Empire. Born around 600 BC, he was a powerful conqueror who created the largest empire the world had ever seen at that time. He started by uniting the Persian and Median tribes, and then his armies marched across the Middle East. He defeated powerful kingdoms like Lydia in Asia Minor and the mighty Neo-Babylonian Empire.<br><br>Even though he conquered many lands, Cyrus is most famous for how he treated the people he defeated. In the ancient world, conquerors were usually very cruel, burning cities and making people slaves. Cyrus was completely different. He was kind and fair. He respected the religions, languages, and cultures of the nations he ruled.<br><br>When he captured the great city of Babylon, he freed the Jewish people who had been kept there as prisoners for many years and allowed them to return to Jerusalem to rebuild their temple. Because of his wisdom and tolerance, millions of people accepted him as a great leader. His ideas about human rights and peaceful rule made him a legend in ancient history.",dictionary:{created:"yarattı",seen:"gördüğü",started:"başladı",uniting:"birleştirerek",marched:"yürüdüler",defeated:"mağlup etti",conquered:"fethetti",treated:"davrandı/muamele etti",burning:"yakmak",respected:"saygı duydu",captured:"ele geçirdi",freed:"özgür bıraktı",kept:"tutulan",allowed:"izin verdi",return:"dönmelerine",rebuild:"yeniden inşa etmek",accepted:"kabul ettiler"}},{icon:"⚔️",title:"12. El Cid",src:"12_El_Cid.mp3",text:'Rodrigo Diaz de Vivar was born in 1043 near Burgos in Christian Spain. His nickname, "El Cid," comes from the Arabic word El Seyit, meaning respected. He grew up as a skilled warrior and served King Sancho II of Castile. He supported the new ruler, King Alfonso VI. But political fights soon made him lose favor. He was accused of treachery and sent into exile.<br><br>Although he had to leave his king, Rodrigo gathered loyal soldiers and fought to survive. He often worked with Muslim rulers and fought for them when it helped his cause. His respect for Muslim soldiers and leaders made him different from other Christian knights of his time.<br><br>The most important moment in his life came in 1094, when he took the city of Valencia. Many Muslim families still lived there, and Rodrigo let them stay in the city under his rule. He kept peace with nearby Muslim states and sometimes hired Muslim soldiers to fight for him. His skill in battle and understanding of Muslim customs helped him keep Valencia safe from both Christian and Muslim enemies. Rodrigo continued to defend the city until he died in 1099. His life shows that his Islamic connections, alliances, and respect for Muslim culture were important for his success.',dictionary:{"grew up":"büyüdü",served:"hizmet etti",supported:"destekledi",lose:"kaybetmesine",accused:"suçlandı",gathered:"topladı",survive:"hayatta kalmak",worked:"çalıştı",helped:"yardımcı olduğunda",took:"aldı/ele geçirdi",lived:"yaşıyordu",let:"izin verdi",stay:"kalmalarına",kept:"korudu (barışı)",hired:"kiraladı/tuttu",defend:"savunmaya"}},{icon:"🐅",title:"13. Fahrettin Pasha",src:"13_Fahrettin_Pasha.mp3",text:'Fahrettin Pasha, known as the "Desert Tiger," was one of the bravest commanders of the Ottoman Empire. During World War I, in 1916, he was sent to defend the holy city of Medina. His mission was to protect the city against the Arab revolt supported by the British.<br><br>The famous British spy, Lawrence of Arabia, destroyed the Hejaz Railway and cut Medina off from the world. Food and water became very scarce. Soldiers and people even ate locusts to survive. Still, Fahrettin Pasha never gave up. He sent the holy relics to Istanbul for safety and refused to surrender, saying: "I will not lower the Turkish flag with my own hands!".<br><br>Even after the war ended, he resisted, but was finally forced to give up by his own officers. As he left Medina, he cried: "O Messenger of God, they are taking me by force!". Later, he was sent into exile in Egypt and Malta. In 1921, he was freed and joined the Turkish War of Independence. After victory, he became the first ambassador of the new Republic of Turkey in Afghanistan. Fahrettin Pasha died in 1948, but his courage, faith, and love for his country are never forgotten.',dictionary:{sent:"gönderildi",defend:"savunmak",protect:"korumak",destroyed:"yok etti","cut off":"kesti/ayırdı",survive:"hayatta kalmak","gave up":"pes etti",refused:"reddetti",surrender:"teslim olmayı",lower:"indirmeyeceğim",resisted:"direndi",forced:"zorlandı",freed:"özgür bırakıldı",joined:"katıldı"}},{icon:"🎖️",title:"14. Gazi Osman Pasha",src:"14_Gazi_Osman_Pasha.mp3",text:'Gazi Osman Pasha was a great Ottoman commander of the 19th century. He became famous during the Russo-Turkish War of 1877-1878 for defending the town of Plevna in Bulgaria. In July 1877, Russian and Romanian armies attacked Plevna. Osman Pasha quickly organized the defenses and built strong trenches around the town. His clever tactics helped the Ottomans, who had a smaller army, to win several battles. People in Europe admired his courage and military skill.<br><br>For five months, his army resisted one of the biggest forces in Europe. Although his soldiers were tired and food and ammunition became less, Osman Pasha did not want to surrender. In December 1877, when there was no food or ammunition left, Osman Pasha tried to attack the enemy.<br><br>He was wounded and captured... but the Russians respected him and treated him with dignity. After the war, Osman Pasha returned to Istanbul as a hero and was given the title "Gazi." His defense of Plevna is still remembered as a great moment in Ottoman history.',dictionary:{defending:"savunmasıyla",attacked:"saldırdı",organized:"organize etti",built:"inşa etti",helped:"yardımcı oldu",win:"kazanmasına",admired:"hayran kaldılar",resisted:"direndiler",surrender:"teslim olmak",tried:"denedi",wounded:"yaralandı",captured:"esir alındı",respected:"saygı duydular",treated:"davrandılar/muamele ettiler",returned:"geri döndü"}},{icon:"🔫",title:"15. Gustavus Adolphus",src:"15_Gustavus_Adolphus.mp3",text:`Gustavus Adolphus was a brilliant King of Sweden during the 17th century. He is often called the "Father of Modern Warfare" because he completely changed how armies fought. He became king in 1611 when he was only 17 years old. At that time, Sweden was fighting wars against Denmark, Russia, and Poland.<br><br>Gustavus was a highly intelligent leader who carefully studied military strategy. Before him, European armies moved very slowly and used heavy, difficult weapons. Gustavus created lighter cannons that horses could easily pull into battle. He also trained his soldiers to work closely together. His musketeers fired their guns in continuous waves, creating a storm of bullets.<br><br>During the massive conflict known as the Thirty Years' War, he led his well-trained Swedish army into Germany to defend the Protestant states. His amazing tactics helped him win several huge victories against much larger Catholic armies. His most famous success was at the Battle of Breitenfeld in 1631. Sadly, he was killed in battle a year later while leading a cavalry charge through thick fog. However, his military inventions changed warfare in Europe forever.`,dictionary:{changed:"değiştirdi",fought:"savaştığı",studied:"inceledi",moved:"hareket ediyordu",used:"kullanıyordu",created:"yarattı",pull:"çekmek",trained:"eğitti",fired:"ateşlediler",defend:"savunmak",helped:"yardımcı oldu",win:"kazanmasına",killed:"öldürüldü",leading:"yönetirken"}},{icon:"🛡️",title:"16. Halil Pasha",src:"16_Halil_Pasha.mp3",text:"The Siege of Kut al-Amara was one of the greatest Ottoman victories in World War I. It took place in Mesopotamia, today's Iraq, between December 1915 and April 1916. A British army of about 13,000 soldiers, led by General Townshend, entered the town of Kut after a defeat at Ctesiphon. The Ottomans, under the command of Halil Pasha, surrounded the town and cut off supplies. The British hoped that new troops would arrive to save them, but Ottoman forces stopped every attempt.<br><br>Although the British army was better equipped, hunger and disease became stronger enemies inside the town. After 147 days of resistance, General Townshend surrendered on 29 April 1916. More than 13,000 British and Indian soldiers were taken as prisoners.<br><br>This victory gave the Ottoman Empire great pride. It showed that the empire could still fight strongly against a world power. For the British, it was one of the worst defeats in their military history. For the Ottomans, Kut al-Amara became a symbol of courage and resistance in the dark days of World War I.",dictionary:{entered:"girdiler",surrounded:"kuşattılar","cut off":"kestiler",hoped:"umut ettiler",arrive:"varmasını",save:"kurtarmasını",stopped:"durdurdu",surrendered:"teslim oldu",taken:"alındılar",showed:"gösterdi",fight:"savaşabileceğini"}},{icon:"🐘",title:"17. Hannibal Barca",src:"17_Hannibal_Barca.mp3",text:"Hannibal Barca was a brilliant military commander from the ancient city of Carthage. He was born in 247 BC. From a very young age, his father taught him to hate the Roman Republic. Rome was Carthage's biggest enemy. When Hannibal became a general, he decided to attack Rome in a way nobody expected.<br><br>Instead of sailing across the sea, he gathered a huge army in Spain. In 218 BC, he led tens of thousands of soldiers and 37 war elephants on a long, dangerous journey over the snowy Alps mountains into Italy. The journey was incredibly difficult, and many men and animals died in the freezing cold. However, the surprise attack worked perfectly.<br><br>For the next 15 years, Hannibal moved through Italy and won many huge battles against the Romans. His most famous victory was at the Battle of Cannae, where his clever tactics destroyed a much larger Roman army. Although he won many battles, he never captured the city of Rome itself. Eventually, he had to return to Africa to defend his home. Today, military leaders still study his amazing strategies and his legendary journey over the Alps.",dictionary:{taught:"öğretti",hate:"nefret etmeyi",decided:"karar verdi",attack:"saldırmaya",expected:"beklediği",sailing:"denize açılmak",gathered:"topladı",led:"liderlik etti",died:"öldüler",worked:"işe yaradı",moved:"ilerledi",won:"kazandı",destroyed:"yok etti",captured:"ele geçirdi",return:"dönmek",defend:"savunmak",study:"incelerler"}},{icon:"🏛️",title:"18. Hatshepsut",src:"18_Hatshepsut.mp3",text:"Hatshepsut was one of the most successful and powerful pharaohs of ancient Egypt. She lived during the 15th century BC. When her husband, the pharaoh, died, his son from another woman was too young to rule. Hatshepsut stepped in to act as his regent, but soon she did something very unusual: she declared herself the official pharaoh. To show her authority, she often dressed in traditional male clothing and even wore the false beard that pharaohs wore.<br><br>Instead of fighting many wars, Hatshepsut focused on making Egypt wealthy and beautiful. She reopened ancient trade routes and sent an expedition to the mysterious land of Punt, bringing back rich treasures like gold, ivory, and exotic trees. With this wealth, she ordered the construction of hundreds of incredible buildings and monuments across Egypt. Her most famous creation is her stunning memorial temple at Deir el-Bahari, which is still admired by architects today.<br><br>After her death, later rulers tried to erase her name from history, but modern archaeologists discovered her amazing achievements. She is remembered as a brilliant female leader who brought peace and great wealth to the Egyptian empire.",dictionary:{rule:"yönetmek","stepped in":"devreye girdi",declared:"ilan etti",show:"göstermek",dressed:"giyindi",wore:"taktı/giydi",fighting:"savaşmak",focused:"odaklandı",reopened:"yeniden açtı",sent:"gönderdi",ordered:"emretti",admired:"hayranlıkla bakılır",erase:"silmeye",discovered:"keşfettiler",remembered:"hatırlanır",brought:"getirdi"}},{icon:"👑",title:"19. Isabella of Castile and Ferdinand of Aragon",src:"19_Isabella_of_Castile_and_Ferdinand_of_Aragon.mp3",text:"Isabella of Castile and Ferdinand of Aragon were the famous Catholic Monarchs of Spain. They married in 1469, uniting two powerful kingdoms. Together, they worked to create a strong and united Spain. Their most famous goal was the Reconquista, the long struggle to take back Iberia from Muslim rule. For centuries, Muslims had controlled large parts of Spain. In 1492, Isabella and Ferdinand's armies captured Granada, the last Muslim kingdom in Iberia. This victory ended hundreds of years of conflict.<br><br>Although many Muslims and Jews had lived peacefully in Spain, the monarchs wanted only Christianity to remain. They ordered Muslims and Jews to convert or leave the country. Many families lost their homes and were forced to start new lives elsewhere.<br><br>The same year, Isabella and Ferdinand also supported Christopher Columbus's voyage. This journey led to the discovery of the Americas by Europeans and the beginning of Spain's overseas empire. Isabella and Ferdinand changed the history of Spain forever. They built a strong monarchy, spread Christianity, and opened the way for Spanish power around the world. For some, they are great rulers, but for others, their rule is remembered with pain because of the removal of Muslims and Jews.",dictionary:{married:"evlendiler",uniting:"birleştirerek",create:"yaratmak","take back":"geri almak",controlled:"kontrol etmişlerdi",captured:"ele geçirdiler",ended:"bitirdi",lived:"yaşamışlardı",remain:"kalmasını",ordered:"emrettiler",convert:"din değiştirmelerini",leave:"terk etmelerini",supported:"desteklediler",led:"yol açtı",built:"inşa ettiler",spread:"yaydılar",opened:"açtılar"}},{icon:"🐎",title:"20. Ivan the Terrible",src:"20_Ivan_the_Terrible.mp3",text:'Ivan the Terrible was the first ruler to be crowned as the Tsar of all Russia. He was born in 1530 and had a very difficult childhood. His parents died when he was young, and cruel nobles controlled the government. When Ivan finally took power, he wanted to make sure nobody could challenge him.<br><br>During the early years of his rule, he did many good things. He changed the laws, created a permanent army, and expanded Russian lands by conquering the cities of Kazan and Astrakhan. This made Russia much larger and stronger. However, as Ivan grew older, he became extremely suspicious and violent. The word "Terrible" in his name means "fearsome" or "dangerous."<br><br>He created a secret police force dressed in black, who rode black horses. They hunted down and killed anyone Ivan did not trust. Entire families and towns were destroyed because of his anger. In his worst moment, he hit his own son during an argument and accidentally killed him. Ivan was a smart and powerful leader who built an empire, but his deep paranoia made his rule a dark time in Russian history.',dictionary:{crowned:"taçlandırıldı",controlled:"kontrol ettiler",took:"aldığında",challenge:"meydan okumak",changed:"değiştirdi",created:"yarattı/kurdu",expanded:"genişletti",conquering:"fethederek",grew:"yaşlandıkça","hunted down":"avladılar/yakaladılar",killed:"öldürdüler",trust:"güvenmediği",destroyed:"yok edildiler",hit:"vurdu",built:"inşa etti"}},{icon:"🧪",title:"21. Jacobi",src:"21_Jacobi.mp3",text:"Jacobi was born in a poor Jewish village near Genoa. From a young age he showed intelligence and skill in medicine. He studied herbs, medicines, and poisons in Italian cities. Venice and the Vatican noticed him and supported his studies, seeing him as useful for their secret plans. He became a skilled physician, respected for his knowledge and precision.<br><br>When the Ottomans rose and Mehmed II captured Constantinople, Venice and the Church feared his power. Jacobi was sent east under the name Yakup. He entered the Ottoman palace and served with care. He treated soldiers and advised pashas. Mehmed trusted him and made him head physician. To the sultan, he seemed loyal, but some whispered that he still served Venice and the Vatican.<br><br>In 1481, Mehmed prepared for a new campaign. Soon he fell ill. Yakup gave him medicine, and the sultan died. Suspicion fell on Yakup. Some said palace guards killed him; others said he fled but was captured. Jacobi, who had risen from poverty to the highest position in the Ottoman court, ended his life in mystery.",dictionary:{showed:"gösterdi",studied:"inceledi/eğitim aldı",noticed:"fark ettiler",supported:"desteklediler",captured:"ele geçirdiğinde",feared:"korktular",sent:"gönderildi",entered:"girdi",served:"hizmet etti",treated:"tedavi etti",advised:"tavsiyeler verdi",trusted:"güvendi",whispered:"fısıldadılar",prepared:"hazırlandı",fell:"düştü",fled:"kaçtı"}},{icon:"🛡️",title:"22. Jan Žižka",src:"22_Jan_Zizka.mp3",text:`Jan Žižka was a brilliant and terrifying Czech military commander during the 15th century who is famous for never losing a single battle. He became the military leader of the Hussites, a group of Christian rebels in Bohemia who wanted religious freedom from the Catholic Church. When the Pope and the Holy Roman Emperor sent massive armies of heavily armored crusader knights to crush them, the situation seemed hopeless.<br><br>Žižka's army was made up of poor farmers and ordinary townspeople, not trained soldiers. However, Žižka was a tactical genius. He invented the "war wagon," transforming ordinary farm carts into moving fortresses filled with soldiers armed with crossbows and early handguns. He arranged these heavily armored wagons into a defensive circle, creating an unbreakable wall against enemy cavalry charges.<br><br>Even more amazingly, Žižka lost an eye in battle, and later lost his second eye, becoming completely blind. Despite being totally blind, he continued to command his army perfectly using detailed descriptions of the battlefield provided by his officers. His revolutionary tactics and absolute fearlessness successfully defended his people against the greatest military powers of Europe.`,dictionary:{losing:"kaybetmemesiyle",wanted:"istiyorlardı",sent:"gönderdiklerinde",crush:"ezmek",invented:"icat etti",transforming:"dönüştürerek",arranged:"düzenledi/sıraladı",creating:"yaratarak",lost:"kaybetti",command:"komuta etmeye",provided:"sağlanan",defended:"savundu"}},{icon:"⚔️",title:"23. Joan of Arc",src:"23_Joan_of_Arc.mp3",text:"Joan of Arc was a very brave young woman who became a national hero of France. She was born in 1412 to a poor farming family. During her childhood, France was fighting the Hundred Years' War against England. The English controlled a large part of France. When Joan was 13 years old, she began to see visions and hear voices. She believed that God was telling her to save France and help the French prince become king.<br><br>Although she was only a teenager and had no military training, she traveled to the prince's court. She convinced him to give her an army. Dressed in white armor, Joan led her soldiers to the city of Orléans, which was surrounded by the English. Her courage inspired the French soldiers, and they won a great victory in just nine days.<br><br>Thanks to her leadership, the prince was crowned King Charles VII. Sadly, enemy soldiers captured Joan and sold her to the English. They put her on trial and burned her at the stake when she was only 19. Today, people around the world remember her incredible faith and bravery.",dictionary:{fighting:"savaşıyordu",controlled:"kontrol ediyordu",began:"başladı",believed:"inandı",telling:"söylediğine",save:"kurtarmasını",traveled:"seyahat etti",convinced:"ikna etti",led:"yönetti",surrounded:"kuşatılmış",inspired:"ilham verdi",won:"kazandılar",crowned:"taç giydirildi",captured:"esir aldılar",sold:"sattılar",burned:"yaktılar",remember:"hatırlarlar"}},{icon:"🗡️",title:"24. Khalid ibn al-Walid",src:"24_Khalid_ibn_al_Walid.mp3",text:`Khalid ibn al-Walid was one of history's most brilliant and successful military commanders. He lived in the 7th century during the very beginning of the Islamic conquests. What makes Khalid so famous is that he fought in over a hundred battles and never lost a single one. Because of his amazing skill and bravery, he was given the title "The Drawn Sword of God."<br><br>At first, Khalid fought against the early Muslims and even defeated them at the Battle of Uhud using smart cavalry tactics. However, he later converted to Islam and became their greatest general. He led Muslim armies against two massive superpowers of the time: the Byzantine Empire and the Sassanid Persian Empire.<br><br>Khalid was a master of speed and surprise. He could move his soldiers quickly across difficult deserts to attack enemies when they were not ready. His greatest victory was at the Battle of Yarmouk in 636 AD, where he defeated a huge Byzantine army. His clever strategies completely destroyed the enemy forces and brought the region of Syria under Islamic control. Military academies around the world still study his extraordinary battlefield tactics.`,dictionary:{fought:"savaştı",lost:"kaybetti",defeated:"yendi",converted:"din değiştirdi",led:"yönetti",move:"hareket ettirebiliyordu",attack:"saldırmak",destroyed:"yok etti",brought:"getirdi",study:"inceler/çalışır"}},{icon:"🌉",title:"25. Koca Sinan Pasha",src:"25_Koca_Sinan_Pasha.mp3",text:'In 1595, the Ottoman leader Koca Sinan Pasha led an army into Wallachia, which is now Romania. He fought against a rebel prince named Michael the Brave. The Ottomans captured the main city, but winter was coming. The army needed to return to safety. Sinan Pasha ordered his soldiers to retreat to the Danube River.<br><br>To cross the wide river, the army used a long wooden bridge at Giurgiu. The crossing was very slow. The soldiers carried heavy carts filled with treasure and goods. This delayed everyone. Sinan Pasha and the main army crossed first. He left the famous "Akıncı" warriors at the back to guard the bridge.<br><br>Suddenly, Michael the Brave arrived with his cannons. He saw the army was split in two. He fired directly at the bridge. The wood broke, and the bridge collapsed into the water. The Akıncı warriors were trapped on the wrong side. They could not escape the enemy or the deep river. Thousands of Akıncı soldiers died that day. Before this event, they were the most famous riders in the Ottoman army. Because of this single disaster, the Akıncı lost their strength and never recovered. In history, this sad event is called the "Bridge Disaster.”',dictionary:{led:"ilerletti",fought:"savaştı",captured:"ele geçirdi",ordered:"emretti",retreat:"geri çekilmelerini",cross:"geçmek",delayed:"geciktirdi",guard:"korumaları için",arrived:"geldi",fired:"ateş etti",collapsed:"çöktü",trapped:"kısıldılar",escape:"kaçamadılar",died:"öldüler",lost:"kaybettiler",recovered:"toparlanamadılar"}},{icon:"🛡️",title:"26. Leonidas I",src:"26_Leonidas_I.mp3",text:"Leonidas I was the legendary warrior king of the Greek city-state of Sparta. He lived in the 5th century BC. Sparta was famous for its extreme military training. From the time Leonidas was a young boy, he endured harsh physical trials to become a perfect, fearless soldier. He became king during a very dangerous time for Greece.<br><br>The powerful Persian Empire, led by King Xerxes, invaded with an army of hundreds of thousands of men. In 480 BC, Leonidas led a small force of Greeks, including his famous personal guard of 300 Spartans, to a narrow mountain pass called Thermopylae. Because the pass was so narrow, the massive Persian army could not use its superior numbers.<br><br>For three days, Leonidas and his brave warriors held the line, fighting with incredible skill and courage. They killed thousands of Persian soldiers. Eventually, a traitor showed the Persians a secret mountain path to surround the Spartans. Knowing he would die, Leonidas ordered most of the Greek army to leave. He and his 300 Spartans stayed behind to fight to the death. Their heroic sacrifice gave the rest of Greece time to prepare and eventually win the war.",dictionary:{endured:"katlandı",invaded:"işgal etti",led:"yönetti",use:"kullanamadı",held:"tuttular/korudular",killed:"öldürdüler",showed:"gösterdi",surround:"etrafını sarmaları",knowing:"bilerek",ordered:"emretti","stayed behind":"geride kaldılar",fight:"savaşmak",prepare:"hazırlanması",win:"kazanması"}},{icon:"👑",title:"27. Mansa Musa",src:"27_Mansa_Musa.mp3",text:"Mansa Musa was the legendary ruler of the Mali Empire in West Africa during the 14th century. Today, historians believe he might be the wealthiest person who has ever lived in human history. Under his leadership, the Mali Empire grew incredibly powerful, controlling huge territories and the extremely valuable trade routes for salt and gold. The empire produced more than half of the world's gold supply at the time.<br><br>Musa was a devout Muslim, and his most famous moment was his incredible pilgrimage to Mecca in 1324. He traveled across the vast Sahara Desert with a massive caravan of 60,000 men and 80 camels, each carrying hundreds of pounds of pure gold. As he traveled through Egypt, he gave away so much gold to the poor and to local markets that the value of gold actually crashed in the region for ten years.<br><br>When he returned home, he brought back brilliant architects and scholars to build beautiful mosques and massive universities in the city of Timbuktu. His leadership turned his empire into a global center of wealth, learning, and Islamic culture.",dictionary:{believe:"inanıyorlar",controlling:"kontrol ederek",produced:"üretti",traveled:"seyahat etti",carrying:"taşıyarak","gave away":"dağıttı/hediye etti",crashed:"çöktü (değeri düştü)",returned:"döndüğünde","brought back":"geri getirdi",build:"inşa etmek",turned:"dönüştürdü"}},{icon:"🛡️",title:"28. Matthias Corvinus",src:"28_Matthias_Corvinus.mp3",text:'Matthias Corvinus was one of the greatest and most famous kings of Hungary, ruling in the 15th century. He was elected king when he was only fourteen years old, which was highly unusual because he did not come from a traditional royal family. However, he quickly proved to be a military genius and a highly effective ruler. To protect his kingdom from the rapidly expanding Ottoman Empire to the south and the Holy Roman Empire to the west, he created the legendary "Black Army."<br><br>Unlike the armies of other kings, which relied on unloyal nobles, the Black Army was a permanent, professional force of highly trained mercenary soldiers. They were famously equipped with the very latest technology, including thousands of early firearms. With this unstoppable army, Matthias successfully defended his borders, conquered parts of Austria, and even captured the great city of Vienna.<br><br>Beyond his wars, Matthias was a true Renaissance king. He built stunning palaces, opened a massive library called the Bibliotheca Corviniana, and established fair laws that protected poor farmers. Even today, Hungarian legends remember him as "Matthias the Just.”',dictionary:{elected:"seçildi",proved:"kanıtladı",protect:"korumak",created:"yarattı",relied:"bel bağlıyordu",equipped:"donatılmıştı",defended:"savundu",conquered:"fethetti",captured:"ele geçirdi",built:"inşa etti",opened:"açtı",established:"kurdu"}},{icon:"⚓",title:"29. Mezamorta Hüseyin Pasha",src:"29_Mezamorta_Huseyin_Pasha.mp3",text:'Mezamorta Hüseyin Pasha was a famous Ottoman admiral born in the 17th century. Some people say he was originally from Spain and later became a Muslim. He started his career as a sailor and a pirate in the Mediterranean Sea. His interesting nickname, "Mezamorta," means "half-dead" in Italian. In a big battle against the Venetians, he was hurt very badly. His enemies thought he was dead, but he survived. Because of this amazing event, he got his famous name. By 1674, he was a captain and attacked many enemy ships.<br><br>In 1683, the French navy attacked Algiers. The leader of Algiers wanted to give up, but Mezamorta refused. He became the new ruler and defended the city. To show his strength, he put the French consul into a large cannon and fired him at the enemy ships. This stopped the French attack. Later, he attacked the French coast until they agreed to peace.<br><br>Later, Mezamorta went to Istanbul to join the Ottoman navy. In 1695, he won back Chios Island from the Venetians. Because of this victory, the Sultan made him the Grand Admiral, or "Kapudan Pasha." He changed how the navy fought. He stopped using old rowing ships and started using big sailing ships called "kalyons." Mezamorta died from an illness in 1701 while getting ready for a new war.',dictionary:{started:"başladı",hurt:"yaralandı",survived:"hayatta kaldı",attacked:"saldırdı","give up":"pes etmek",refused:"reddetti",defended:"savundu",fired:"ateşledi",stopped:"durdurdu",agreed:"anlaştılar",join:"katılmak","won back":"geri kazandı","stopped using":"kullanmayı bıraktı"}},{icon:"🏰",title:"30. Mir Ali Beg",src:"30_Mir_Ali_Beg.mp3",text:"In the late 1500s, Portugal controlled East African cities like Mombasa. They used these ports for trade. The local people disliked Portuguese rule and requested help from the Ottoman Empire. The Ottomans wanted to stop Portuguese power in the region. An Ottoman captain, Mir Ali Beg, arrived to fight. Cities on the coast supported him with supplies. He captured Portuguese ships and built a small castle in Mombasa. The Portuguese sent a large fleet to destroy him.<br><br>In 1589, Portuguese ships attacked Mombasa with heavy guns. Suddenly, a group of warriors called the Zimba attacked from the land. The Zimba were cannibals. During the battle, they caught and ate Ottoman soldiers. The city faced attacks from both sides at the same time.<br><br>Mir Ali Beg tried to escape, but the Portuguese captured him. They sent him to Portugal as a prisoner. He lived there for the rest of his life. This battle ended the Ottoman attempts to control East Africa. After this defeat, the Ottoman Empire did not try to take power in this region again.",dictionary:{controlled:"kontrol ediyordu",requested:"istediler (yardım)",stop:"durdurmak",arrived:"geldi",supported:"desteklediler",captured:"ele geçirdi",built:"inşa etti",sent:"gönderdiler",destroy:"yok etmek",attacked:"saldırdılar",caught:"yakaladılar",faced:"karşılaştı",escape:"kaçmak",ended:"sona erdirdi"}},{icon:"👑",title:"31. Mustafa 'the second'",src:"31_Mustafa_the_second.mp3",text:"In 1695, Sultan Mustafa the second became the Ottoman leader. He wanted to make the empire powerful again and gathered 100,000 soldiers to attack Austria. However, the Austrian general, Prince Eugene of Savoy, was very clever. He had spies inside the Ottoman army who told him exactly where the Sultan planned to cross the Tisa River.<br><br>At the river, the Ottoman leaders made a terrible mistake. Greedy commanders, called Pashas, stopped the soldiers at the narrow bridge. They demanded money from their own men before allowing them to cross. This caused a long delay. Prince Eugene saw the confusion and attacked with heavy cannons. The bridge broke, and thousands of soldiers died in the water while the Sultan watched helplessly from the other side.<br><br>The results were a disaster. The Ottomans lost 30,000 men, valuable treasure, and the Sultan’s official seal. Sultan Mustafa was heartbroken and never led an army again. In 1699, the empire signed the Treaty of Karlowitz and lost a large amount of land.",dictionary:{gathered:"topladı",attack:"saldırmak",told:"söyledi",planned:"planladığını",cross:"geçmeyi",stopped:"durdurdular",demanded:"istediler (talep ettiler)",allowing:"izin vermeden",caused:"sebep oldu",broke:"kırıldı",died:"öldüler",watched:"izledi",lost:"kaybettiler",signed:"imzaladı"}},{icon:"🛠️",title:"32. Peter the Great",src:"32_Peter_the_Great.mp3",text:'Peter the Great was a famous Tsar who completely changed the history of Russia. He was born in 1672 and grew up to be a very tall and energetic leader. When he became the ruler, Russia was an old-fashioned country that was far behind Western Europe. Peter wanted to make his country modern and powerful. To learn how other countries succeeded, he traveled secretly across Europe. He worked as a simple shipbuilder in the Netherlands and England to understand modern technology and navies.<br><br>When he returned home, he forced his people to change. He made Russian nobles cut off their long beards and wear European clothes. He also built a strong, modern army and created the very first Russian navy. With his new military strength, Peter fought a long war against Sweden, which was a great power at the time.<br><br>He won the Great Northern War and gained access to the Baltic Sea. On this newly captured land, he built a beautiful new capital city called St. Petersburg, which he called his "window to the West." By the time he died, Russia was a mighty European empire.',dictionary:{changed:"değiştirdi",succeeded:"başardıklarını",traveled:"seyahat etti",worked:"çalıştı",understand:"anlamak",returned:"döndüğünde",forced:"zorladı","cut off":"kesmelerini",built:"inşa etti",created:"yarattı",fought:"savaştı",won:"kazandı",gained:"elde etti"}},{icon:"🪓",title:"33. Ragnar Lodbrok",src:"33_Ragnar_Lodbrok.mp3",text:`Ragnar Lodbrok was a famous Viking leader who lived in the 9th century. He came from Scandinavia and led many attacks on England and France. Ragnar became well known for his brave fighting and smart battle plans. Stories say he got his name "Lodbrok" by wearing special pants to protect himself from a poisonous snake.<br><br>He led many successful Viking journeys. In 845, he attacked Paris with a large group of Viking ships. The French king paid him a great amount of silver to leave the city. This made Ragnar very wealthy and increased his fame.<br><br>Ragnar had several sons who also became famous Viking warriors. Their names were Ivar the Boneless, Bjorn Ironside, and Halfdan Ragnarsson. These sons later led the Great Heathen Army in England. Ragnar died during an attack on England. King Aella of Northumbria captured him and put him in a snake pit as punishment. Before he died, Ragnar said that his sons would punish King Aella for killing him. His sons kept this promise. They attacked England, captured King Aella, and killed him to avenge their father's death.`,dictionary:{led:"yönetti",protect:"korumak",attacked:"saldırdı",paid:"ödedi",leave:"ayrılması için",increased:"artırdı",captured:"yakaladı",put:"koydu",punish:"cezalandıracaklarını",kept:"tuttular (sözü)",avenge:"intikamını almak"}},{icon:"🦁",title:"34. Richard the Lionheart",src:"34_Richard_the_Lionheart.mp3",text:`Richard the Lionheart was a famous King of England who is best known as a heroic warrior of the Crusades. He was born in 1157 and became king in 1189. Although he ruled England, he spent almost his entire life away from the country, fighting battles in France and the Middle East. He earned his nickname, "the Lionheart," because of his incredible bravery and military skill on the battlefield.<br><br>When the Muslim leader Salahuddin captured Jerusalem, Richard led the Third Crusade to win the holy city back for the Christians. He won several major victories, including the important Battle of Arsuf in 1191, where his brilliant tactics defeated Salahuddin's powerful army. Even though the two great leaders fought fiercely against each other, they shared a deep mutual respect and sent gifts to one another.<br><br>Despite his battlefield successes, Richard could not capture Jerusalem. He eventually signed a peace treaty with Salahuddin that allowed Christian pilgrims to visit the city safely. On his journey home, Richard was captured and held for a huge ransom. He died from a crossbow wound while fighting in France, forever remembered as the ultimate medieval knight.`,dictionary:{ruled:"hükmetti",spent:"geçirdi",fighting:"savaşarak",earned:"kazandı/hak etti",captured:"ele geçirdi","win back":"geri kazanmak",defeated:"mağlup etti",shared:"paylaştılar",signed:"imzaladı",allowed:"izin verdi",held:"tutuldu"}},{icon:"🌲",title:"35. Rob Roy",src:"35_Rob_Roy.mp3",text:'Rob Roy MacGregor was a famous hero from Scotland. He lived in the Scottish Highlands from 1671 to 1734. At that time, England controlled Scotland very strongly. The English government made strict laws that were hard for Scottish families, called "clans." Rob Roy belonged to the MacGregor clan, which had a very difficult life because of these laws.<br><br>Rob Roy began as a farmer and sold cattle. He borrowed money from a rich noble to make his business bigger. But when he could not pay the money back, the rich man took his land. Rob Roy lost everything. Because of this, he became an outlaw. He started to steal cattle from rich people and gave some to poor families.<br><br>People called him the "Scottish Robin Hood." The English police offered money to anyone who could catch him. But Rob Roy was smart. For many years, he hid in the mountains of the Highlands.',dictionary:{controlled:"kontrol ediyordu",belonged:"aitti",sold:"sattı",borrowed:"ödünç aldı","pay back":"geri ödemek",took:"aldı",lost:"kaybetti",steal:"çalmak",offered:"teklif etti",catch:"yakalayacak",hid:"saklandı"}},{icon:"🕌",title:"36. Salahuddin Ayyubi",src:"36_Salahuddin_Ayyubi.mp3",text:"Salahuddin Ayyubi, also known as Saladin, was born in 1137 in Tikrit, Iraq. He came from a family of soldiers and learned about war when he was very young. He served his uncle, Shirkuh, who taught him how to be a leader. Later, Salahuddin became the ruler of Egypt after he won an important battle.<br><br>Salahuddin had a strong faith in Islam. At that time, many Muslim rulers fought against each other. Salahuddin worked hard to stop this and bring all Muslim lands together. His main goal was to defend his people against the Crusader armies from Europe.<br><br>His most famous moment happened in 1187 at the Battle of Hattin. His army won a huge victory against the Crusaders. After this battle, he captured the holy city of Jerusalem. He was a fair man. He treated the people in the city with kindness and respect. He let Christians and Jews stay in peace or leave safely if they wanted. After this victory, he protected Jerusalem from new attacks. He continued to lead his army until he died in 1193. Today, history remembers Salahuddin as a great hero who united Muslims and showed fairness to everyone.",dictionary:{learned:"öğrendi",served:"hizmet etti",taught:"öğretti",fought:"savaşıyordu",stop:"durdurmak",defend:"savunmak",captured:"ele geçirdi",treated:"davrandı/muamele etti",let:"izin verdi",stay:"kalmalarına",protected:"korudu",united:"birleştirdi"}},{icon:"🦅",title:"37. Skanderbeg",src:"37_Skanderbeg.mp3",text:'Skanderbeg, whose real name was Gjergj Kastrioti, is known as the national hero of Albania. He lived in the 15th century and became famous for his bravery and leadership. As a child, he was taken by the Ottoman Empire and trained as a soldier. He served the Ottomans for many years, but in 1443 he returned to Albania and started a great revolt for freedom. He raised the flag with the double-headed eagle, which is still the symbol of Albania today.<br><br>With his army, Skanderbeg fought many battles against the powerful Ottoman forces. Although his army was small, he used clever tactics and the knowledge he gained from his years with the Ottomans. For more than 20 years, he protected Albania and inspired Christian Europe with his courage.<br><br>Skanderbeg became a symbol of resistance. European leaders respected him, and the Pope called him the "Athlete of Christ." His victories showed that a small nation could stand strong against a great empire. Skanderbeg died in 1468, but his legend lived on. For Albanians, he is not only a warrior but also the father of their nation. His name and his flag continue to inspire Albanian pride and unity.',dictionary:{trained:"eğitildi",served:"hizmet etti",returned:"geri döndü",raised:"kaldırdı/dalgalandırdı",fought:"savaştı",used:"kullandı",gained:"kazandığı",protected:"korudu",inspired:"ilham verdi",respected:"saygı duydular",showed:"gösterdi"}},{icon:"🗡️",title:"38. Spartacus",src:"38_Spartacus.mp3",text:"Spartacus was a famous gladiator and a leader in the Roman Republic. At that time, Rome had a big empire with many slaves. Roman masters treated these slaves very badly. They forced them to work hard and fight games for fun. Spartacus was a man from Thrace. The Romans captured him and sent him to a gladiator school in Capua.<br><br>In 73 BC, Spartacus led a group of about 70 gladiators. They escaped from their school using kitchen knives. They went to Mount Vesuvius, a big volcano. Many other slaves joined them there. The Roman government sent armies to stop them. At first, Spartacus defeated every Roman army. He moved through Italy and freed thousands of slaves. His army became very large.<br><br>Spartacus was a smart military leader. He taught his followers to fight like real soldiers. He won big battles against Roman leaders. The Romans became very worried. They sent a general named Crassus with a huge army. After several fights, Crassus finally defeated Spartacus in 71 BC. Spartacus died in the final battle, but nobody found his body. The Romans captured about 6,000 rebels. They put them on crosses along the road to warn other slaves. Today, people remember Spartacus as a symbol of freedom.",dictionary:{treated:"davranıyordu",forced:"zorladılar",captured:"yakaladılar",led:"yönetti",escaped:"kaçtılar",joined:"katıldı",sent:"gönderdi",defeated:"mağlup etti",freed:"özgür bıraktı",taught:"öğretti",warn:"uyarmak"}},{icon:"👑",title:"39. Stefan Dušan",src:"39_Stefan_Dusan.mp3",text:"King Stefan Dušan ruled Serbia from 1331 to 1355. He built a strong Serbian Empire while the Ottoman Turks were growing powerful in the east. The Ottomans were taking land from the Byzantine Empire. Dušan used this situation to expand his own territory, capturing parts of Macedonia and Greece.<br><br>Dušan recognized the Ottoman threat. He tried to form alliances with other Christian nations to stop them. He spoke with the Pope and Venice about creating a united army against the Ottomans. He also made agreements with the Ottomans when it suited him. Sometimes he hired Ottoman soldiers for his army. Other times he made peace treaties with them.<br><br>Dušan's main goal was to capture Constantinople before the Ottomans could. He wanted to create a Christian empire strong enough to resist the Ottomans. However, Dušan died suddenly in 1355. After his death, his empire weakened and became divided. Without his leadership, later Serbian rulers could not stop the Ottomans. Just 34 years after Dušan's death, the Ottomans defeated the Serbs at the Battle of Maritsa, beginning their control over Serbian lands.",dictionary:{ruled:"hükmetti",built:"inşa etti",expand:"genişletmek",capturing:"ele geçirerek",recognized:"fark etti",form:"kurmak",creating:"yaratmak",suited:"işine geldiğinde",hired:"kiraladı",resist:"direnmek",weakened:"zayıfladı"}},{icon:"🐎",title:"40. Subutai",src:"40_Subutai.mp3",text:"Subutai was the greatest and most trusted military commander of Genghis Khan. While Genghis Khan was the supreme ruler, Subutai was the brilliant mind behind many of the Mongol Empire's most spectacular victories. He was not born into nobility; he was the son of a blacksmith who rose to command through pure genius. Subutai directed more than twenty campaigns, conquering thirty-two nations and winning sixty-five pitched battles. He was a master of strategy, using spies, speed, and coordinated attacks over vast distances.<br><br>His most famous achievement came during the Mongol invasion of Europe. In 1241, Subutai organized an incredible plan. He split his army into different groups that marched hundreds of miles apart, keeping perfectly in touch. Within a single week, his separated forces destroyed both the Polish-German army at the Battle of Liegnitz and the massive Hungarian army at the Battle of Mohi.<br><br>European knights with heavy armor could not stop his fast, disciplined horse archers. Subutai conquered more territory than any other commander in history, successfully leading armies from the borders of the Pacific Ocean all the way to the very heart of Central Europe.",dictionary:{rose:"yükseldi",command:"komuta etmeye",directed:"yönetti",conquering:"fethederek",split:"böldü/ayırdı",marched:"ilerlediler",destroyed:"yok ettiler",stop:"durduramadı",leading:"yöneterek"}},{icon:"👑",title:"41. Tamar of Georgia",src:"41_Tamar_of_Georgia.mp3",text:'Tamar the Great was the brilliant and powerful queen who led the Kingdom of Georgia into its absolute Golden Age. She was crowned as co-ruler with her father in 1178. Because she was a woman, many powerful nobles refused to accept her authority at first. However, Tamar quickly proved she was a masterful politician and a fierce leader. She carefully replaced disloyal officials with people she trusted and built a highly disciplined, powerful army.<br><br>Under her command, the Georgian military became unstoppable. They launched massive, successful campaigns against the neighboring Seljuk and Byzantine empires, conquering lands stretching from the Black Sea to the Caspian Sea. Despite her military might, she was famous for her fairness and deep religious faith.<br><br>She stopped the death penalty and rarely ordered harsh punishments. She also supported famous poets, builders, and scholars, making her kingdom a brilliant center of Christian culture and learning. Her people loved her so much that she was officially given the title of "Mepe," which means "King," proving that she ruled with the absolute power and ultimate respect of any great male monarch in history.',dictionary:{led:"taşıdı/yönetti",crowned:"taç giydirildi",refused:"reddettiler",accept:"kabul etmeyi",proved:"kanıtladı",replaced:"değiştirdi",launched:"başlattılar",conquering:"fethederek",stopped:"durdurdu",ordered:"emretti",supported:"destekledi",ruled:"hükmettiğini"}},{icon:"⚔️",title:"42. Taras Bulba",src:"42_Taras_Bulba.mp3",text:'Taras Bulba was a famous Cossack warrior in Ukraine during the 1500s. At that time, Poland ruled parts of Ukraine. The Cossack people wanted to be free and keep their traditions. The Polish rulers treated them very badly. They took Cossack land and did not respect their religion. This made Taras and his people very angry.<br><br>Taras had two sons, Andriy and Ostap. They went to school in Kyiv, but Taras wanted them to be strong soldiers. When they returned home, he took them to the Cossack army camp. They started to fight against the Polish army. Taras was a brave leader and won many battles.<br><br>However, a sad thing happened during a fight. His younger son, Andriy, fell in love with a Polish woman. He left his own people to join the enemy. Taras was furious at this betrayal. He caught Andriy and killed him. He famously said, "I gave you life, and I will take it away." Later, the Polish soldiers caught his older son, Ostap. They killed him in the city of Warsaw. Taras watched his son die but could not save him. Taras continued to fight, but the Polish army finally caught and killed him. Today, people remember Taras Bulba as a hero.',dictionary:{ruled:"yönetiyordu",keep:"korumak",treated:"davrandı",took:"aldılar",returned:"döndüklerinde",started:"başladılar",fight:"savaşmaya",left:"terk etti",join:"katılmak için",caught:"yakaladı","take away":"geri alacağım",watched:"izledi",save:"kurtaramadı"}},{icon:"🗡️",title:"43. Tariq ibn Ziyad",src:"43_Tariq_ibn_Ziyad.mp3",text:'Tariq ibn Ziyad was a famous Muslim commander in the 700s. At that time, the Visigoth kingdom ruled Spain. The people of North Africa wanted to go across the Mediterranean Sea. The Visigoth king, Roderick, was a harsh ruler. There were many problems inside his kingdom, and some rich nobles were not happy with him.<br><br>This situation was good for Tariq ibn Ziyad. He was a governor in North Africa. In 711 AD, he led an army of about 7,000 soldiers across the water between Africa and Europe. He landed at a large rock. Later, people named it "Jabal Tariq," or the Mountain of Tariq. Today, we know it as Gibraltar.<br><br>When his soldiers arrived, Tariq ordered them to burn their boats. He told his army: "The sea is behind you, and the enemy is before you." This brave speech helped his soldiers feel strong. Tariq’s army fought King Roderick at the Battle of Guadalete. Although the Visigoth army was much larger, Tariq used better plans. The unhappy Visigoth nobles also helped him win. King Roderick died in this fight. After this victory, Tariq took important cities like Cordoba and Toledo. His success began Muslim rule in Spain for nearly 800 years. Today, the name Gibraltar still remembers him.',dictionary:{ruled:"hükmediyordu",led:"yönetti",landed:"karaya çıktı",ordered:"emretti",burn:"yakmalarını",helped:"yardımcı oldu",fought:"savaştı",used:"kullandı",win:"kazanmasına",died:"öldü",took:"aldı",began:"başlattı"}},{icon:"🐎",title:"44. Timur",src:"44_Timur.mp3",text:"Timur, also called Tamerlane, was a powerful ruler and warrior from Central Asia. He was born in 1336. He created a large empire through many wars. He wanted to control all the lands along the Silk Road. He fought and defeated many kings. His army was known for being very strong and very cruel.<br><br>His most famous battle was against the Ottoman Empire. The Ottoman Sultan was named Yıldırım Bayezid. Bayezid was also a great conqueror and had a powerful army. The two armies met at the Battle of Ankara in 1402. The fighting was long and fierce in the very hot sun.<br><br>Timur was a more clever military leader. He knew that some soldiers in Bayezid's army were unhappy. He convinced them to switch sides during the battle. This was the turning point. Timur won the battle. His army captured Sultan Bayezid. Bayezid became Timur's prisoner. The capture of the great Ottoman Sultan was a huge shock to the world. It stopped the growth of the Ottoman Empire for a time.<br><br>After his victory, Timur continued traveling and conquering new lands. He took the captured Sultan Bayezid with him as he moved from place to place. Bayezid died while he was still Timur's prisoner. Timur died in 1405 while planning to invade China. His death saved China from his attack. Timur was one of history's greatest conquerors, also a brutal leader who showed no mercy to his enemies.",dictionary:{created:"yarattı",control:"kontrol etmek",fought:"savaştı",defeated:"mağlup etti",met:"karşılaştı",convinced:"ikna etti",switch:"değiştirmeye (taraf)",won:"kazandı",captured:"esir aldı",stopped:"durdurdu",conquering:"fethetmeye",moved:"ilerlerken",invade:"işgal etmeyi",saved:"kurtardı"}},{icon:"🏰",title:"45. Tiryaki Hasan Pasha",src:"45_Tiryaki_Hasan_Pasha.mp3",text:"In 1601, a huge Crusader army of 100,000 soldiers attacked Kanije Castle. The castle only had 9,000 Ottoman soldiers. Their commander was Tiryaki Hasan Pasha. He used clever tricks against the enemy commander, Archduke Ferdinand.<br><br>First, he hid his 100 cannons. When the enemy came close, he fired them all at once. Then, he used fake letters. He wanted Archduke Ferdinand to believe a giant Ottoman army was coming. He also showed fake food rooms to prisoners. He even played loud music every day to ruin the enemy's sleep.<br><br>Soon, winter arrived, and the weather became very cold. Many enemy soldiers froze. On the 73rd day, the Ottoman soldiers had almost no food left. At night, Tiryaki Hasan Pasha ordered a surprise attack. Archduke Ferdinand thought the giant army was finally there. He was so scared that he ran away with his army!<br><br>The Ottoman Sultan was very happy. He wrote a special letter and promoted Tiryaki Hasan Pasha to the high rank of Vizier. However, the old commander cried. He cried because, in his youth, such small wins did not get big rewards. He was sad that the empire was not as strong and great as before.",dictionary:{attacked:"saldırdı",used:"kullandı",hid:"sakladı",fired:"ateşledi",believe:"inanmasını",ruin:"mahvetmek",froze:"dondu",ordered:"emretti","ran away":"kaçtı",promoted:"terfi ettirdi"}},{icon:"🗡️",title:"46. Tomyris",src:"46_Tomyris.mp3",text:"Tomyris was the queen of the Massagetae, a strong group in Central Asia around 530 BC. She became the leader after her husband died. At this time, Cyrus the Great was the King of Persia. He was very powerful and wanted to take her land. Cyrus sent a message to marry Tomyris, but she knew this was a trick to take her kingdom. She refused him, so Cyrus decided to attack.<br><br>He crossed a river to fight her army, which was led by her son. The Persians used a clever plan. They left a camp full of wine and food. The Massagetae soldiers did not know wine well. They drank too much and fell asleep. The Persians attacked while they were sleeping and captured Tomyris's son. He felt great shame as a prisoner and killed himself.<br><br>Tomyris was very angry and wanted revenge. She gathered all her soldiers for a second big battle later in 530 BC. The fight was very hard, but the Massagetae army won. King Cyrus died in the battle. After the fight, Tomyris found his body. She cut off his head and put it in a bag of blood. She was a brave queen who defended her people.",dictionary:{take:"almak",marry:"evlenmek",refused:"reddetti",decided:"karar verdi",attack:"saldırmaya",crossed:"karşıya geçti",fight:"savaşmak",drank:"içtiler","fell asleep":"uyuyakaldılar",captured:"yakaladılar",gathered:"topladı",won:"kazandı","cut off":"kesti",defended:"savundu"}},{icon:"⚓",title:"47. Turgut Reis",src:"47_Turgut_Reis.mp3",text:"Born into a poor family in Muğla, Turgut Reis began as a young sailor and quickly rose to become a skilled captain. He eventually joined forces with the famous Admiral Barbarossa Hayreddin in Algeria. In 1538, Turgut played a key role leading the reserve fleet at the Battle of Preveza. However, while fighting near Corsica, he was captured by the Genoese and spent three years as a prisoner before Barbarossa rescued him.<br><br>Upon regaining his freedom, Turgut built a new fleet and terrorized Spanish waters near Naples. He established a base on Djerba Island, where he famously escaped a Spanish siege by transporting his ships overland to the opposite coast.<br><br>In 1551, Turgut was named Governor of Karli. Sultan Suleiman promised him rule over Tripoli if he helped capture it. Although the campaign succeeded, the position was initially given to another, leading a disappointed Turgut back to the sea. He finally received the Governorship of Tripoli in 1554 after bringing immense treasure to Istanbul. He continued to serve the Ottoman Empire, fighting at the Battle of Djerba in 1560. Turgut Reis ultimately fell in battle during the Siege of Malta in 1565; his tomb stands in Tripoli today.",dictionary:{began:"başladı",rose:"yükseldi",joined:"katıldı",captured:"esir alındı",rescued:"kurtardı",built:"inşa etti",terrorized:"dehşet saçtı",escaped:"kaçtı",transporting:"taşıyarak",promised:"söz verdi",helped:"yardımcı olursa",succeeded:"başarılı oldu",received:"aldı",fell:"düştü (şehit oldu)"}},{icon:"🦇",title:"48. Vlad III",src:"48_Vlad_III.mp3",text:`Vlad III was a prince born in 1431. He ruled Wallachia, which is in Romania today. His father belonged to a special group called the Order of the Dragon. Because of this, people called Vlad "Dracula," which means "son of the dragon."<br><br>When Vlad was a child, his father sent him and his brother Radu to the Ottoman Empire. They were hostages to ensure peace. They lived with Sultan Murad II and his son, Mehmed. The boys learned the Turkish language and how to fight in wars. Vlad was not happy there. He felt like a prisoner and was very angry at the Ottomans. However, his brother Radu liked Mehmed, and they became friends. This eventually made the two brothers enemies.<br><br>Later, Vlad became the ruler of Wallachia. He was a strict leader and became famous as "Vlad the Impaler." He fought against the Ottomans, even though he lived with them before. When Sultan Mehmed started a big war, Vlad fought back hard. He attacked at night to surprise them. He also burned villages and food so the Ottoman army had nothing to eat. But he lost the war. His brother Radu became the new prince with Mehmed's help. Vlad died in a battle near Bucharest in 1476. The Ottomans cut off his head and sent it to Sultan Mehmed as proof.`,dictionary:{ruled:"hükmetti",belonged:"aitti",ensure:"garantiye almak/sağlamak",learned:"öğrendiler",fight:"savaşmayı",fought:"savaştı",started:"başlattığında",attacked:"saldırdı",surprise:"şaşırtmak",burned:"yaktı",lost:"kaybetti","cut off":"kestiler"}},{icon:"🏹",title:"49. William Tell",src:"49_William_Tell.mp3",text:`William Tell was a famous hunter in Switzerland during the early 1300s. At that time, Austria ruled the Swiss lands. The Swiss people wanted their freedom. An Austrian ruler named Gessler arrived. He was a harsh man. To show his power, he put his hat on a pole in Altdorf's main square. He ordered everyone to bow before the hat.<br><br>One day, William Tell and his son walked through the square. They did not bow to the hat. Soldiers arrested Tell and brought him to Gessler. Gessler knew Tell was an excellent crossbow shooter. He created a cruel test. He ordered Tell's son to stand before a tree with an apple on his head. Tell had to shoot the apple. Success meant freedom. Failure meant death. Tell took two arrows. He used one arrow to shoot the apple perfectly. His son was safe. Gessler asked about the second arrow. Tell answered, "If I had hurt my son, the second arrow was for you."<br><br>Gessler ordered Tell's arrest. Soldiers put Tell on a boat to a prison. A storm came on the lake. The frightened Austrians freed Tell to steer the boat. Tell guided the boat to shore and escaped. Later, Tell used his second arrow against Gessler. This action inspired the Swiss rebellion. The Swiss people fought and won their independence.`,dictionary:{ruled:"yönetiyordu",wanted:"istiyorlardı",arrived:"geldi",show:"göstermek",ordered:"emretti",bow:"eğilmeye",arrested:"tutukladılar",created:"yarattı",shoot:"vurması",meant:"anlamına geliyordu",freed:"serbest bıraktılar",steer:"yönlendirmesi için",guided:"kılavuzluk etti",escaped:"kaçtı",inspired:"ilham verdi",fought:"savaştılar"}},{icon:"⚔️",title:"50. William Wallace",src:"50_William_Wallace.mp3",text:"William Wallace was a famous fighter in Scotland during the late 1200s. At that time, England ruled Scotland, and the Scottish people wanted their freedom. An English ruler named Edward I was very powerful. He placed English soldiers in Scottish towns to control the people. One day, English soldiers attacked Wallace's town and killed his wife. This made Wallace very angry.<br><br>He decided to fight against the English. He gathered other Scots who wanted freedom and became their leader. They attacked English forts across Scotland. Their most important victory was at the Battle of Stirling Bridge in 1297.<br><br>However, the English king sent a large army to stop Wallace. At the Battle of Falkirk in 1298, the English army defeated Wallace's forces. Wallace had to escape and hide, but he continued to fight for Scottish freedom for several years. Another Scottish noble, Robert the Bruce, later became the main leader. In 1305, English soldiers captured Wallace. They brought him to London for a trial. The court found him guilty of fighting against the king. They executed him in a cruel way, but he is still remembered as a hero.",dictionary:{ruled:"yönetiyordu",placed:"yerleştirdi",control:"kontrol etmek",attacked:"saldırdılar",decided:"karar verdi",fight:"savaşmaya",gathered:"topladı",sent:"gönderdi",stop:"durdurmak",defeated:"mağlup etti",escape:"kaçmak",hide:"saklanmak",captured:"esir aldılar",found:"buldu (suçlu)",executed:"idam ettiler"}},{icon:"🏕️",title:"51. Yusuf Pasha",src:"51_Yusuf_Pasha.mp3",text:`In 1788, a large Austrian army of about 100,000 soldiers camped in Romania to fight the Ottoman commander Yusuf Pasha. However, they never fought the enemy. Because of a foolish mistake and alcohol, the army destroyed itself.<br><br>The trouble began one night when Austrian horsemen crossed a river and bought strong drinks from local people. They drank too much. When foot soldiers arrived and asked to share the drink, the horsemen refused. A big fight started between them, and someone fired a gun. This loud shot made the soldiers panic and run back toward their main camp in the dark.<br><br>In the camp, soldiers woke up to the noise. They believed the enemy was attacking. Commanders shouted "Halt!"—which means stop in German—to control their men. However, soldiers who spoke different languages heard "Allah!" instead of "Halt!" They were very afraid and fired guns and cannons at their own friends. Two days later, Yusuf Pasha arrived for a battle. Instead, he found dead and wounded Austrian soldiers everywhere. The survivors had escaped, so the Ottomans took the town easily. They won the victory because of the Austrian army's total confusion.`,dictionary:{camped:"kamp kurdular",fought:"savaştılar",destroyed:"yok etti",crossed:"karşıya geçtiler",share:"paylaşmak",refused:"reddettiler",fired:"ateşledi","woke up":"uyandılar",believed:"inandılar",attacking:"saldırıyor",shouted:"bağırdılar",heard:"duydular",escaped:"kaçmışlardı",won:"kazandılar"}},{icon:"👑",title:"52. Zenobia",src:"52_Zenobia.mp3",text:"Queen Zenobia was the brilliant and courageous ruler of the Palmyrene Empire in Syria during the third century. When her husband died in 267 AD, she took control of the kingdom. At this time, the mighty Roman Empire was facing many crises and was very weak. Zenobia saw an opportunity to build her own empire. She was highly educated, rode horses with her soldiers, and could march for miles on foot.<br><br>In a shocking move, she led her powerful army to conquer Egypt, one of Rome's wealthiest and most important provinces. She also expanded her borders into Asia Minor. For a brief time, she controlled the entire eastern Mediterranean and declared herself an empress.<br><br>However, the new Roman Emperor, Aurelian, was a fierce military leader. He marched his army eastward to crush her rebellion. After several huge battles, Aurelian defeated Zenobia's forces and laid siege to the beautiful city of Palmyra. Zenobia tried to escape on a camel but was captured by Roman soldiers. She was taken to Rome in golden chains, but she is remembered forever as the warrior queen who challenged the greatest empire of the ancient world.",dictionary:{took:"aldı",facing:"yüzleşiyordu",build:"inşa etmek",rode:"biniyordu",march:"yürüyebiliyordu",conquer:"fethetmeye",expanded:"genişletti",declared:"ilan etti",crush:"ezmek",defeated:"mağlup etti",escape:"kaçmaya",captured:"esir alındı",challenged:"meydan okudu"}}],githubRepoUrl:"https://github.com/dogierez/historic-people"},MS={id:"freedom",title:"Freedom Fighters",cover:"✊",color:"#c0392b",description:"A complete collection of 39 listening lessons exploring the lives and struggles of legendary freedom fighters and revolutionaries around the world.",baseUrl:"https://raw.githubusercontent.com/dogierez/fredom-fighters/main/",tracks:[{icon:"🇩🇿",title:"1. Ahmed Ben Bella",src:"01_Ahmed_Ben_Bella.mp3",text:"Ahmed Ben Bella was a revolutionary leader and the first President of an independent Algeria. As a young man, he fought for the French army during World War II, but he realized that his own people in Algeria were treated unfairly by French colonial rulers. He decided to fight for his country's freedom and became one of the main founders of the National Liberation Front (FLN). He helped organize a massive war for independence against France that began in 1954. Because of his leadership, he was arrested by the French military and spent many years in prison during the war. When Algeria finally won its independence in 1962, he was released and chosen to lead the new nation. He worked hard to rebuild the country and support other anti-colonial movements across Africa. Although he was later removed from power by his own military, he is remembered today as a founding father of modern Algeria and a great hero of African independence.",dictionary:{revolutionary:"devrimci",unfairly:"haksızca",colonial:"sömürgeci",founders:"kurucular",massive:"devasa",independence:"bağımsızlık",arrested:"tutuklandı",released:"serbest bırakıldı",rebuild:"yeniden inşa etmek"}},{icon:"🇧🇦",title:"2. Alija Izetbegović",src:"02_Alija_Izetbegovic.mp3",text:"Alija Izetbegović was a lawyer and philosopher who became the first President of Bosnia and Herzegovina. He spent many years in prison because the Communist government did not like his religious and political ideas. When Yugoslavia began to break apart, he led his people toward independence. During the Bosnian War, he stayed in the capital city of Sarajevo while it was under attack. He worked hard to protect the unity of his country and to save his people from destruction. In 1995, he signed the Dayton Peace Agreement to end the fighting. He is known as the father of the Bosnian nation because he helped the country survive its most difficult time. He is respected for his wisdom and his dedication to freedom and justice.",dictionary:{philosopher:"filozof",independence:"bağımsızlık",destruction:"yıkım",agreement:"anlaşma",survive:"hayatta kalmak",dedication:"adanmışlık",justice:"adalet"}},{icon:"🇬🇼",title:"3. Amílcar Cabral",src:"03_Amilcar_Cabral.mp3",text:"Amílcar Cabral was a brilliant engineer and a revolutionary leader in West Africa. He fought against Portuguese colonial rule in Guinea-Bissau and Cape Verde. Cabral believed that freedom was not just about removing foreign soldiers, but also about improving the lives of the poor through education and farming. He organized a very successful guerrilla war that forced the Portuguese army to retreat. He was a great thinker whose books about culture and independence are still studied today. Tragically, he was killed by a rival group just months before his country became free. Even though he did not see the independence he fought for, he is remembered as one of Africa’s greatest heroes.",dictionary:{brilliant:"parlak/zeki",improving:"geliştirmek/iyileştirmek",successful:"başarılı",guerrilla:"gerilla",retreat:"geri çekilmek",tragically:"trajik bir şekilde",rival:"rakip"}},{icon:"✊🏾",title:"4. Angela Davis",src:"04_Angela_Davis.mp3",text:"Angela Davis is a famous activist and teacher in the United States. She became a leader in the civil rights movement during the 1960s. She spoke out strongly against racism and the unfair treatment of prisoners. In 1970, she became one of the most famous women in the world when she was placed on the FBI's Most Wanted List. She spent over a year in jail for a crime she did not commit. After a long trial, she was found not guilty. Today, she continues to fight for the rights of all people. She believes that we must change the prison system and work for true equality. She is a powerful symbol of resistance and courage for people around the world.",dictionary:{activist:"aktivist",civil:"sivil",racism:"ırkçılık",treatment:"muamele",commit:"işlemek",trial:"duruşma",equality:"eşitlik",resistance:"direniş",courage:"cesaret"}},{icon:"🛡️",title:"5. Assata Shakur",src:"05_Assata_Shakur.mp3",text:"Assata Shakur was an activist in the Black Panther Party who fought for the rights of Black Americans. In 1973, she was involved in a gunfight on a highway where a police officer was killed. She was injured and captured by the police. Even though she said she was innocent, she was sent to prison for life. In 1979, she managed to escape from prison with the help of her friends. She traveled secretly to Cuba, where the government gave her protection. She still lives in Cuba today. Many activists see her as a hero who survived a very unfair system, while the US government still wants to arrest her. Her story is a famous example of the struggle for civil rights.",dictionary:{involved:"karıştı/dahil oldu",injured:"yaralandı",captured:"yakalandı",innocent:"masum",escape:"kaçmak",secretly:"gizlice",protection:"koruma",struggle:"mücadele"}},{icon:"🇳🇮",title:"6. Augusto Sandino",src:"06_Augusto_Sandino.mp3",text:"Augusto Sandino was a fierce revolutionary leader in Nicaragua who fought against foreign control. During the 1920s, the United States military occupied Nicaragua to protect American businesses and control the government. Sandino believed this was deeply unfair and completely unacceptable. He refused to surrender his weapons and organized a peasant army to fight the powerful US Marines. Even though his army was small and poorly equipped, Sandino used clever guerrilla warfare. He launched sudden attacks from the thick jungle mountains, making it impossible for the foreign soldiers to defeat him. He became a famous symbol of resistance across Latin America, proving that a small nation could stand up to a massive empire. Eventually, the US troops left Nicaragua, but the local military commander, Anastasio Somoza, saw Sandino as a threat. In 1934, Sandino was invited to a peace dinner and was assassinated afterward. Decades later, a famous revolutionary group called the Sandinistas took his name and finally overthrew the Somoza dictatorship to honor his dream of true freedom.",dictionary:{fierce:"şiddetli/vahşi",occupied:"işgal etti",unacceptable:"kabul edilemez",surrender:"teslim olmak",peasant:"köylü",equipped:"donanımlı",impossible:"imkansız",resistance:"direniş",empire:"imparatorluk",assassinated:"suikasta kurban gitti",overthrew:"devirdi",dictatorship:"diktatörlük"}},{icon:"🇮🇳",title:"7. Bhagat Singh",src:"07_Bhagat_Singh.mp3",text:"Bhagat Singh was a young and brave revolutionary in India. He fought against British rule because he wanted his country to be free and fair for everyone. He did not agree with non-violent protests only; he believed that strong action was needed to wake up the people. In 1929, he threw a small bomb into a government building to protest against unfair laws. He did not want to hurt anyone, but he wanted the British to listen. He was arrested and stayed very strong while in prison. The British executed him when he was only 23 years old. His sacrifice made him a legend in India and Pakistan. Today, young people still look to him as a symbol of bravery and patriotism.",dictionary:{brave:"cesur","non-violent":"şiddetsiz",protest:"protesto",executed:"idam edildi",sacrifice:"fedakarlık",legend:"efsane",patriotism:"vatanseverlik"}},{icon:"🇮🇪",title:"8. Bobby Sands",src:"08_Bobby_Sands.mp3",text:"Bobby Sands was a member of the IRA in Northern Ireland. He wanted his country to be independent of British rule. While he was in prison, he led a famous hunger strike in 1981. He and other prisoners refused to eat because they wanted to be treated as political prisoners, not as criminals. During the strike, the people actually elected him to the British Parliament. After 66 days without food, Bobby Sands died. His death caused a massive reaction around the world and brought a lot of attention to the problems in Northern Ireland. He is remembered as a man who was willing to give his life for his political beliefs and his country’s freedom.",dictionary:{independent:"bağımsız",strike:"grev",criminals:"suçlular",elected:"seçildi",parliament:"parlamento",reaction:"tepki",attention:"dikkat",beliefs:"inançlar"}},{icon:"⭐",title:"9. Che Guevara",src:"09_Che_Guevara.mp3",text:'Ernesto "Che" Guevara was a doctor from Argentina who became a global symbol of revolution. While traveling as a young man, he saw the terrible poverty in Latin America and decided to fight for the poor. He joined Fidel Castro and helped lead the Cuban Revolution to victory in 1959. After the war, he held important jobs in the new government, but he wanted to help other countries too. He traveled to Africa and then to Bolivia to start new revolutions. He was captured and killed in the mountains of Bolivia in 1967. Today, his face is famous all over the world. People see him as a symbol of rebellion against unfair power.',dictionary:{global:"küresel",poverty:"yoksulluk",victory:"zafer",government:"hükümet",captured:"yakalandı",rebellion:"isyan"}},{icon:"🇹🇷",title:"10. Deniz Gezmiş",src:"10_Deniz_Gezmis.mp3",text:"Deniz Gezmiş was a student leader and a revolutionary in Turkey. During the late 1960s, he led many protests against foreign influence and for the rights of workers and students. He believed that Turkey should be a completely independent and socialist country. He founded a group that used armed action to fight the government. After a military coup in 1971, he was caught and put on trial. He remained very brave and never apologized for his actions. He was executed by hanging in 1972 at the age of 25. His death made him a hero for many young people in Turkey. He is still remembered today as a symbol of the fight for a better and fairer world.",dictionary:{influence:"etki",socialist:"sosyalist",founded:"kurdu",armed:"silahlı",coup:"darbe",trial:"duruşma",apologized:"özür diledi",executed:"idam edildi",fairer:"daha adil"}},{icon:"⛪",title:"11. Dietrich Bonhoeffer",src:"11_Dietrich_Bonhoeffer.mp3",text:"Dietrich Bonhoeffer was a brave Christian pastor and a leading thinker who fought a dangerous secret war against the Nazi government in Germany. When Adolf Hitler came to power, many church leaders stayed silent or supported the regime, but Bonhoeffer believed that true faith required standing up against pure evil. He openly criticized the government's racist laws and secretly joined the German resistance movement. He used his position to help Jewish people escape to safety in other countries. Eventually, he even participated in a secret plan to overthrow Hitler. In 1943, he was arrested by the Gestapo and sent to a prison camp. Even in prison, he continued to write beautiful letters and books about faith, courage, and doing the right thing. He was executed in a concentration camp just weeks before the end of World War II. Today, he is remembered worldwide as a brilliant symbol of moral courage and sacrificing oneself for justice.",dictionary:{pastor:"papaz",regime:"rejim",faith:"inanç",criticized:"eleştirdi",overthrow:"devirmek",concentration:"toplama",moral:"ahlaki"}},{icon:"🇩🇿",title:"12. Djamila Bouhired",src:"12_Djamila_Bouhired.mp3",text:"Djamila Bouhired is one of the most famous women in the history of North Africa. She was a resistance fighter who fought for Algeria's independence from France. During the war, she carried out dangerous missions in the city of Algiers. She was eventually captured and tortured by French soldiers, but she never gave away the secrets of her group. She was sentenced to death, but people all over the world protested to save her life. Because of this international pressure, she was released when Algeria became free in 1962. She is a national hero and a symbol of how women played a vital role in the struggle for freedom and national dignity.",dictionary:{dangerous:"tehlikeli",missions:"görevler",tortured:"işkence gördü",sentenced:"mahkum edildi",pressure:"baskı",released:"serbest bırakıldı",vital:"hayati",dignity:"haysiyet/onur"}},{icon:"🇲🇽",title:"13. Emiliano Zapata",src:"13_Emiliano_Zapata.mp3",text:'Emiliano Zapata was a legendary revolutionary leader who fought for the rights of the poorest people in Mexico. He grew up in a small farming village and saw how wealthy landowners and corrupt politicians stole land from the peasants. Zapata decided to fight back. During the Mexican Revolution in 1910, he organized a powerful army of farmers called the Liberation Army of the South. His famous motto was "Tierra y Libertad," which means "Land and Freedom." He demanded that the stolen lands be returned to the poor farmers who actually worked the soil. Zapata was a man of deep principles who refused to be bought by rich politicians. He only fought for justice and equality. Because he was so popular and powerful, the government saw him as a major threat. In 1919, he was tricked into attending a meeting and was brutally assassinated by the military. Although he was killed, his ideas survived, and he remains a beloved national hero for the poor and indigenous people of Mexico.',dictionary:{legendary:"efsanevi",wealthy:"zengin",corrupt:"yozlaşmış",peasants:"köylüler",liberation:"kurtuluş",motto:"slogan",principles:"prensipler",justice:"adalet",equality:"eşitlik",tricked:"kandırıldı",brutally:"vahşice",indigenous:"yerli"}},{icon:"✍️",title:"14. Frantz Fanon",src:"14_Frantz_Fanon.mp3",text:"Frantz Fanon was a doctor and a very important writer from Martinique. He studied how colonialism and racism hurt the minds of people. He moved to Algeria and joined the fight for independence against France. He wrote several famous books, like The Wretched of the Earth, which explained why people have a right to fight for their freedom. He believed that colonized people must stand up and be proud of their own culture to be truly free. His ideas inspired many freedom movements in Africa, the Caribbean, and America. Although he died very young from a sickness, his books are still read by millions of people who want to understand justice and equality.",dictionary:{colonialism:"sömürgecilik",racism:"ırkçılık",wretched:"sefil/zavallı",colonized:"sömürgeleştirilmiş",truly:"gerçekten",inspired:"ilham verdi"}},{icon:"✊🏿",title:"15. Fred Hampton",src:"15_Fred_Hampton.mp3",text:'Fred Hampton was a brilliant young leader in the Black Panther Party in Chicago. He was a very talented speaker who wanted to bring people of all races together to fight against poverty and racism. He created the "Rainbow Coalition" to unite Black, Hispanic, and white working-class people. He also started programs to give free breakfast to children in poor neighborhoods. The government and the police were very afraid of his power to unite people. In 1969, while he was sleeping in his apartment, the police and the FBI raided the building and killed him. He was only 21 years old. His death is seen as a tragic assassination of a man who wanted peace and unity for everyone.',dictionary:{brilliant:"parlak",talented:"yetenekli",poverty:"yoksulluk",coalition:"koalisyon",neighborhoods:"mahalleler",raided:"baskın yaptı",tragic:"trajik",assassination:"suikast",unity:"birlik"}},{icon:"💥",title:"16. Gavrilo Princip",src:"16_Gavrilo_Princip.mp3",text:"Gavrilo Princip was a young student from a poor farming family in Bosnia. At that time, his homeland was controlled by the powerful Austro-Hungarian Empire. Princip strongly believed that all Southern Slavic people should be free from foreign rule and united into one independent nation called Yugoslavia. He joined a secret revolutionary group to fight for this dream. On June 28, 1914, when Archduke Franz Ferdinand of A
