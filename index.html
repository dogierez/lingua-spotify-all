fridge, a special liquid traps the warm air from your food. Then, the machine pushes that warm air out into your kitchen. That is why the back of a refrigerator always feels warm if you touch it!<br><br>Thanks to William Cullen and Jacob Perkins, we can enjoy cold juice and fresh ice cream anytime we want. Their invention completely changed how the world eats!",dictionary:{wondered:"merak ettin",fresh:"taze",frozen:"donmuş",scientist:"bilim insanı",artificial:"yapay",cooling:"soğutma",inventor:"mucit",vacuum:"elektrikli süpürge",liquid:"sıvı",traps:"hapseder",pushes:"iter",completely:"tamamen"}},{icon:"🧼",title:"16. Soap",src:"16_soap.mp3",text:"We use soap every day to wash our hands and stay healthy. It feels like a modern invention, but soap was actually discovered by accident thousands of years ago.<br><br>According to an old story, ancient people used to sacrifice animals on altars made of wood ash. When it rained, the melted animal fat mixed with the wood ash. This mixture washed down the hills into the river clay.<br><br>Women washing clothes in the river noticed something amazing. The strange clay made their clothes much cleaner and easier to wash! Without knowing the science, they had discovered soap.<br><br>For a long time, soap was heavy, expensive, and smelled bad. People only used it to clean clothes or animal skins. It took many centuries for scientists to make gentle, nice-smelling soap bars for our skin. Today, washing your hands with soap is the easiest way to protect yourself from germs and stay healthy.",dictionary:{healthy:"sağlıklı",accident:"kaza",ancient:"antik",sacrifice:"kurban etmek",altars:"sunaklar",ash:"kül",melted:"erimiş",mixture:"karışım",clay:"kil",noticed:"fark etti",strange:"tuhaf",expensive:"pahalı",centuries:"yüzyıllar",gentle:"nazik/yumuşak",protect:"korumak",germs:"mikroplar"}},{icon:"⚓",title:"17. Submarines",src:"17_submarines.mp3",text:"The ocean is deep, dark, and full of mysteries. Ships sail on top of the water, but a submarine can dive thousands of meters down into the deep sea.<br><br>The first working submarine was built all the way back in 1620 by a Dutch inventor named Cornelius Drebbel. It was a wooden rowboat covered in tight leather to keep the water out! Twelve rowers sat inside and used oars to move through the Thames River in London.<br><br>During the American Revolutionary War, inventors built a tiny, one-man submarine shaped like a giant egg, named The Turtle. The pilot had to turn foot-pedals and hand-cranks to move it under water.<br><br>Today, modern submarines are giant high-tech steel structures. They use nuclear power to stay submerged underwater for months at a time without ever coming up for air, exploring the deepest secrets of our blue planet.",dictionary:{mysteries:"gizemler",sail:"yelken açmak/seyretmek",dive:"dalmak",inventor:"mucit",rowboat:"sandal",tight:"sıkı",leather:"deri",rowers:"kürekçiler",oars:"kürekler",shaped:"şekillendirilmiş",pedals:"pedallar",modern:"modern",structures:"yapılar",nuclear:"nükleer",submerged:"su altında",exploring:"keşfederek"}},{icon:"🔘",title:"18. The Button",src:"18_the_button.mp3",text:"Look at your shirt or your jacket. Do you see any buttons? Buttons are everywhere today, but they were once used just for decoration, like jewelry.<br><br>Ancient people used buttons made of beautiful shells, bones, and round stones five thousand years ago. They pinned them onto their clothes just to look nice. To keep their clothes from falling off, they used metal pins, strings, or belts.<br><br>Then, around 13th century, someone in Germany had a brilliant, simple idea. They cut a small slit into the fabric. This slit was the very first buttonhole!<br><br>Suddenly, buttons became a magical technology. People could wear tight, warm clothes that locked out the cold wind. Buttons became so popular that rich people covered their entire outfits in buttons made of gold and silver. Today, plastic buttons are simple and cheap, but they remain one of the greatest fashion inventions in human history.",dictionary:{decoration:"dekorasyon",jewelry:"mücevher",ancient:"antik",shells:"kabuklar",pinned:"iğnelediler",strings:"ipler",brilliant:"parlak/zeki",slit:"yarık",fabric:"kumaş",magical:"sihirli",tight:"sıkı",locked:"kilitledi",outfits:"kıyafetler",cheap:"ucuz",fashion:"moda"}},{icon:"🌐",title:"19. The Internet",src:"19_the_internet.mp3",text:'Think about your favorite online video game, video website, or website. None of them could exist without the internet. But what is the internet, and how did it start?<br><br>The internet began in 1969 as a secret military project in America called ARPANET. Scientists wanted to connect computers at different universities so they could share information if phone lines stopped working.<br><br>In October 1969, engineers tried to send the very first message from one computer to another university computer. They planned to type the word "LOGIN." They typed the letter "L," then the letter "O," and then the entire system crashed! So, the very first internet message was just "LO."<br><br>Twenty years later, a scientist named Tim Berners-Lee invented the World Wide Web, which made it easy for regular people to open websites. Today, billions of computers, phones, and devices are connected to this giant digital web.',dictionary:{exist:"var olmak",secret:"gizli",military:"askeri",project:"proje",connect:"bağlamak",universities:"üniversiteler",share:"paylaşmak",information:"bilgi",message:"mesaj",entire:"bütün",crashed:"çöktü",regular:"sıradan/normal",billions:"milyarlar",devices:"cihazlar",connected:"bağlı",digital:"dijital"}},{icon:"🤐",title:"20. The Zipper",src:"20_the_zipper.mp3",text:'Imagine trying to put on your boots or close your backpack without a zipper. It would take a long time! The zipper is a great invention, but it took a very long time to perfect.<br><br>A man named Whitcomb Judson invented a "clasp locker" in 1893. He wanted a faster way to fasten his high boots. Sadly, his invention did not work well. It jammed constantly and popped open at the wrong times!<br><br>Twenty years later, a smart engineer named Gideon Sundback fixed the problem. He made the metal teeth much smaller and guided them together using a sliding piece.<br><br>At first, companies did not want to buy it. Then, the United States military put this new fastener on the boots and pockets of soldiers during World War I. In 1923, a company named it the "zipper" because of the fun zip sound it makes. Today, billions of zippers are manufactured every year around the world.',dictionary:{backpack:"sırt çantası",perfect:"mükemmelleştirmek",clasp:"toka/kopça",locker:"kilitleyici",fasten:"bağlamak/iliklemek",jammed:"sıkıştı",constantly:"sürekli",popped:"fırladı",guided:"yönlendirdi",sliding:"kayan",military:"ordu",fastener:"bağlayıcı",soldiers:"askerler",manufactured:"üretilmiş"}},{icon:"🧻",title:"21. Toilet Paper",src:"21_toilet_paper.mp3",text:"We use toilet paper every single day, and we expect it to be soft and clean. But what did people use before this common item was mass-produced?<br><br>In ancient Rome, public bathrooms had a stick with a sea sponge attached to the end, soaking in a bucket of saltwater. Everyone shared the exact same sponge! In other parts of the world, people used leaves, moss, coconut shells, or corn cobs.<br><br>When newspapers became popular in the 1800s, many people just hung old newspapers on a nail in the bathroom to use for free.<br><br>In 1857, an American businessman named Joseph Gayetty invented the first packet of modern toilet paper. He was very proud because his paper was treated with aloe vera to be soft. He even printed his own name on every sheet! Today, toilet paper is a basic necessity that we cannot imagine living without.",dictionary:{expect:"bekleriz",common:"yaygın",sponge:"sünger",attached:"eklenmiş",soaking:"ıslanan",bucket:"kova",shared:"paylaştı",exact:"kesin/aynı",moss:"yosun",hung:"astı",nail:"çivi",packet:"paket",proud:"gururlu",treated:"işlem görmüş/muamele edilmiş",printed:"yazdırdı/bastı",sheet:"yaprak",basic:"temel",necessity:"ihtiyaç/gereklilik"}},{icon:"🪥",title:"22. Toothpaste",src:"22_toothpaste.mp3",text:"Every morning and every night, you put toothpaste on your toothbrush to keep your teeth clean and white. Modern toothpaste tastes like sweet mint, but ancient toothpaste was very different—and a bit scary!<br><br>Ancient Egyptians invented the earliest toothpaste five thousand years ago. They did not have soft tubes. Instead, they mixed crushed ox hooves, ashes, burnt eggshells, and rough volcanic rock into a powder. They rubbed this powder onto their teeth with their fingers to scrub away food particles.<br><br>Later, the Romans added crushed bones and shells to make their teeth shine. For a long time, these powders tasted terrible and could actually hurt your gums.<br><br>In the 1800s, soap and mint were added to make the paste taste much better. Finally, a dentist named Washington Sheffield put toothpaste into a flexible metal tube in 1892. This made brushing your teeth clean, easy, and fun for everyone.",dictionary:{toothbrush:"diş fırçası",mint:"nane",scary:"korkutucu",earliest:"en erken",tubes:"tüpler",mixed:"karıştırdılar",crushed:"ezilmiş",hooves:"toynaklar",ashes:"küller",burnt:"yanmış",rough:"kaba/pürüzlü",volcanic:"volkanik",powder:"toz",rubbed:"ovaladılar",scrub:"fırçalamak/sürtmek",particles:"parçacıklar",shine:"parlamak",terrible:"berbat",gums:"diş etleri",dentist:"diş hekimi",flexible:"esnek"}},{icon:"☂️",title:"23. Umbrella",src:"23_umbrella.mp3",text:'Do you have an umbrella to protect you from the rain? Umbrellas have a very long history, but for thousands of years, they were used for a completely different reason: the sun!<br><br>The word umbrella comes from a Latin word that means "shadow." Four thousand years ago, ancient kings and queens in Egypt and China used umbrellas as sunshades. Having a big umbrella showed everyone that you were a very important and wealthy person.<br><br>In Europe, people did not use umbrellas for the rain until the 1700s. In fact, if a man carried an umbrella in London, people would laugh at him! They thought umbrellas were only for women and that men should just walk in the rain.<br><br>Then, a brave man named Jonas Hanway carried an umbrella every single day for thirty years. People stopped laughing when they saw he stayed perfectly dry. Soon, everyone wanted one, and umbrellas became a popular tool for rainy days.',dictionary:{protect:"korumak",completely:"tamamen",shadow:"gölge",ancient:"antik",sunshades:"güneşlikler",important:"önemli",wealthy:"zengin",carried:"taşıdı",brave:"cesur",perfectly:"kusursuzca",dry:"kuru",popular:"popüler",tool:"araç"}},{icon:"🧹",title:"24. Vacuum Cleaner",src:"24_vacuum _cleaner.wav",text:'Have you ever helped clean your house? Today, we use a vacuum cleaner to suck up dust from the floor. But long ago, cleaning was very different.<br><br>In the early 1900s, an engineer named Hubert Cecil Booth saw a machine that blew air to push dust away. He thought, "That is a bad idea! We should suck the dust into a container instead." To test his idea, he put a handkerchief over his own mouth, laid down on the floor, and sucked in the air. The handkerchief caught all the dust!<br><br>His first real vacuum cleaner was absolutely giant. It was so big that it had to be carried on a wagon pulled by horses! Workers parked the horses outside a house and ran giant hoses through the windows to clean the rugs. It was very loud, and it looked like a giant toy.<br><br>Later, smaller machines were invented for homes. Today, we even have tiny robot vacuums that clean the floor by themselves while we sleep!',dictionary:{vacuum:"elektrikli süpürge",suck:"emmek",dust:"toz",blew:"üfledi",container:"kap",handkerchief:"mendil",caught:"yakaladı",giant:"dev",wagon:"vagon",hoses:"hortumlar",rugs:"halılar",invented:"icat edildi",tiny:"minik",robot:"robot"}},{icon:"🎮",title:"25. Video Games",src:"25_video _games.wav",text:"Do you like playing video games on your computer or console? Today, games have beautiful 3D graphics and complex stories, but the very first video game was incredibly simple.<br><br>In 1958, a nuclear scientist named William Higinbotham wanted to make his laboratory tours more exciting for visitors. He used an old computer screen meant for science charts and turned it into a game called Tennis for Two.<br><br>The game showed a simple green line for the net and a bright glowing dot for the ball. Players turned a metal knob and pressed a button to hit the ball back and forth. Everyone loved it!<br><br>Later, in 1972, a game called Pong became the first successful arcade game. It looked like a simple digital table tennis match. These early experiments showed the world that computers could be used for pure fun, starting a massive global industry.",dictionary:{console:"konsol",graphics:"grafikler",complex:"karmaşık",incredibly:"inanılmaz derecede",nuclear:"nükleer",scientist:"bilim insanı",laboratory:"laboratuvar",tours:"turlar",exciting:"heyecan verici",visitors:"ziyaretçiler",charts:"grafikler/tablolar",glowing:"parlayan",dot:"nokta",knob:"düğme/topuz",pressed:"bastı",successful:"başarılı",arcade:"atari salonu",digital:"dijital",experiments:"deneyler",pure:"saf",massive:"devasa",industry:"endüstri"}}]},zS={id:"food",title:"Food History",cover:"🍽️",color:"#d35400",description:"A complete collection of 26 listening lessons exploring the fascinating history of foods that used to be cheap but are now luxury items.",baseUrl:"https://raw.githubusercontent.com/dogierez/poor-food-now-luxury-26-spotify/main/",githubRepoUrl:"https://github.com/dogierez/poor-food-now-luxury-26-spotify",tracks:[{icon:"🦞",title:"1. Lobster",src:"1.m4a",text:"Lobster is a very expensive food today. But in the past, people did not like it. In the 1600s, there were too many lobsters in America. After big storms, huge piles washed onto the beaches. People called them ocean trash.<br><br>Farmers used to put them on their fields to help plants grow. Servants and prisoners used to eat them because they were very cheap. People thought it was a punishment to eat lobster! Everything changed in the 1800s. People built the railroad. Trains traveled from the ocean to cities far away.<br><br>Chefs on the trains cooked fresh lobsters for the rich passengers. These passengers tasted lobster for the first time. They thought it was delicious. Because it was new, everyone wanted it.<br><br>Soon, restaurants started to serve lobster on fancy white tables. They charged a lot of money for it. The sea insect became a rich person's dinner. Now, people will save their money to buy lobster for special days. They will not remember its history as prison food!",dictionary:{expensive:"pahalı",storms:"fırtınalar",piles:"yığınlar",trash:"çöp",servants:"hizmetçiler",prisoners:"mahkumlar",punishment:"ceza",railroad:"demiryolu",passengers:"yolcular",delicious:"lezzetli",charged:"ücretlendirdi",insect:"böcek"}},{icon:"🐂",title:"2. Oxtail",src:"2.m4a",text:"Oxtail is exactly what it sounds like: the real tail of a cow. It is mostly bone with a little bit of meat. For hundreds of years, nobody wanted to pay for it. From the 17th century to the 20th century, oxtail was a food for poor people.<br><br>Because it was so tough, it needed a very long time to cook. People used to boil it for three hours. They made thick, rich soups. It cost almost nothing, and it easily filled a big family pot. Families used to eat this because they did not have much money.<br><br>Then, something interesting happened. When you cook oxtail slowly, the fat melts. The liquid becomes very tasty. In the 2000s, famous chefs noticed this. They realized that this cheap meat tasted amazing. They put it on their fancy menus. Food writers talked about it.<br><br>Suddenly, everyone wanted to eat oxtail. But a cow only has one tail! Because many people want it now, the price is high. It will stay expensive forever.",dictionary:{tough:"sert",boil:"kaynatmak",thick:"koyu/kalın",slowly:"yavaşça",melts:"erir",liquid:"sıvı",tasty:"lezzetli",noticed:"fark etti",realized:"farkına vardı",forever:"sonsuza dek"}},{icon:"🐟",title:"3. Caviar",src:"3.m4a",text:"Caviar is the salted eggs of a sturgeon fish. Today, people think of it as a very rich person's food. But a long time ago in America, it was free! In the 19th century, rivers in North America were full of sturgeon fish. There were so many fish eggs that the price was very low.<br><br>American bars used to put bowls of salty caviar on their tables for free. The owners did this as a trick. The salty fish eggs made people thirsty. When people felt thirsty, they bought more drinks! However, people fished too much. They also polluted the water. Soon, the fish disappeared. The supply of caviar stopped.<br><br>Then, American sellers remembered something. Russian kings used to eat caviar as a royal meal. The sellers told people that caviar was a rare, royal food. They started to serve it with special spoons. Because it was rare, the price went up. Today, you will pay a lot of money for a tiny spoon of caviar.",dictionary:{salted:"tuzlanmış",sturgeon:"mersin balığı",bowls:"kaseler",trick:"hile",thirsty:"susamış",polluted:"kirletti",disappeared:"yok oldu",supply:"tedarik",royal:"kraliyet",rare:"nadir"}},{icon:"🥓",title:"4. Pork Belly",src:"4.m4a",text:"Pork belly is the fat meat from the bottom of a pig. If you add salt and smoke to it, it becomes bacon. For a very long time, poor workers used to eat pork belly. In the past, rich people only bought the lean meat. Working families bought the fatty parts because they were very cheap.<br><br>They used to hide the pork belly inside sausages or boil it for many hours. Nobody saw it as a special meal. Then, in the 1990s, things changed. A new group of chefs started a movement. They wanted to use every single part of the animal.<br><br>Chefs learned how to cook pork belly perfectly. They cooked it very slowly until the fat became soft. Then, they cooked it quickly at a high heat to make the skin crispy. The result was beautiful and delicious. They put it in the center of the plate. Now, restaurants will charge forty dollars for a piece of pork belly! It is a true luxury.",dictionary:{smoke:"tütsü/duman",lean:"yağsız",hide:"saklamak",movement:"hareket",perfectly:"kusursuzca",heat:"ısı",crispy:"çıtır",luxury:"lüks"}},{icon:"🦪",title:"5. Oysters",src:"5.m4a",text:"In the past, New York City had millions of oysters. Before the late 1800s, the ocean around the city was full of them. They were so common that people sold them on the streets in cheap buckets. Anyone with a few coins used to buy them. Poor families put them in pies because meat was too expensive.<br><br>People even kept the empty oyster shells. Builders used to crush the shells to make roads and build houses. But then, the city grew bigger and dirtier. The ocean filled with pollution. People also ate too many oysters, so they almost disappeared.<br><br>For many years, it was dangerous to eat a New York oyster because it made people sick. In the early 2000s, clean oysters became popular again. But this time, they were rare. Restaurants decided to treat oysters like fine wine. Now, you will pay several dollars for just one single oyster. People will take pictures of them at expensive parties. They forgot their history as cheap street food!",dictionary:{common:"yaygın",buckets:"kovalar",coins:"bozuk paralar",crush:"ezmek",pollution:"kirlilik",sick:"hasta",rare:"nadir",treat:"muamele etmek"}},{icon:"🍖",title:"6. Short Ribs",src:"6.m4a",text:"Short ribs come from the lower chest of a cow. This meat is very tough. It has a lot of fat, heavy bones, and strong tissue. You cannot just cook it quickly on a fire. If you try, it will be too hard to chew! In the 1800s, rich families did not want this tough meat. So, it was very cheap.<br><br>Poor families used to buy short ribs. They cooked the meat in water on a low fire for many hours. After a long time, the meat finally became soft. Poor mothers used to put this meat into dinners to feed their hungry children.<br><br>In the late 1990s, fancy restaurants discovered short ribs. Chefs realized that slowly cooked short ribs tasted amazing. The meat easily fell off the bone. The chefs served it with smooth potatoes and rich sauces. It looked like a very expensive meal. Today, you will pay a lot of money for short ribs in a restaurant. You pay for the chef's hard work!",dictionary:{chest:"göğüs",tough:"sert",tissue:"doku",chew:"çiğnemek",hungry:"aç",discovered:"keşfetti",realized:"fark etti",smooth:"pürüzsüz"}},{icon:"🐌",title:"7. Escargot",src:"7.m4a",text:"Escargot is a famous French dish. It means cooked snails. Today, you will find escargot on the menus of very expensive restaurants. But the real history of this food is very simple: snails were completely free! Hundreds of years ago in France, poor farmers used to catch snails with their own hands. They picked them from gardens and roads. No one else wanted them.<br><br>During bad times, people did not have enough food. They used to eat snails because they needed meat to survive. The snails cost nothing at all. To make the snails taste good, farmers added cheap garlic, herbs, and butter.<br><br>Later, big French restaurants took this simple farmer food and made it fancy. They created tiny forks and special plates just for eating them. These strange tools made the meal look very special. Because it looked special, restaurants charged a high price. Now, when people order escargot, they want to show that they are rich. They pay for food that farmers used to get for free!",dictionary:{snails:"salyangozlar",survive:"hayatta kalmak",garlic:"sarımsak",herbs:"otlar",fancy:"lüks",forks:"çatallar",tools:"araçlar",charged:"fiyat biçti"}},{icon:"🦴",title:"8. Bone Marrow",src:"8.m4a",text:"Bone marrow is the soft, fatty middle part of a large animal bone. One hundred years ago, you could walk into a meat shop and get bones for free. Butchers thought bones were just trash. After they cut off the meat, they threw the bones away. Poor families used to take these cheap bones home.<br><br>They boiled them in big pots of water. The marrow melted and made delicious soups. People used to do this because they did not want to waste any part of the animal. Nobody thought of bones as a real meal.<br><br>This completely changed in the year 1994. A British chef named Fergus Henderson opened a new restaurant in London. He decided to roast large cow bones in a hot oven. The heat made the marrow soft like warm butter. He served it with toast and a green salad. It looked wild and exciting on the plate. Very quickly, famous restaurants everywhere copied him. Today, you will pay twenty dollars for roasted bone marrow!",dictionary:{marrow:"ilik",trash:"çöp",butchers:"kasaplar",threw:"attı",boiled:"kaynattı",waste:"israf etmek",roast:"fırında kızartmak",oven:"fırın",copied:"kopyaladı"}},{icon:"🍣",title:"9. Sushi",src:"9.m4a",text:"When we think of sushi today, we often imagine an expensive dinner. In some famous restaurants, a chef chooses the fish for you. You sit quietly, follow special rules, and eat very rare fish. You will pay hundreds of dollars for this dinner. But the original story of sushi is completely different.<br><br>A long time ago, sushi was just a trick to keep fish fresh. People packed fish in wet rice and left it for months. They ate the fish and threw the rice away. By the 17th century in Tokyo, sushi became a cheap street food.<br><br>Men stood on the street and made sushi in seconds. They pushed a piece of raw fish onto a ball of sour rice. Busy workers used to buy it and eat it fast. They ate it fast because they had to go back to work. It was the oldest kind of fast food! Fancy chefs turned this fast street food into a beautiful, expensive art for rich people.",dictionary:{imagine:"hayal etmek",rules:"kurallar",original:"orijinal",trick:"hile",fresh:"taze",packed:"paketledi",raw:"çiğ",sour:"ekşi"}},{icon:"🦆",title:"10. Foie Gras",src:"10.m4a",text:"Foie gras is the fat liver of a duck or a goose. Today, it is one of the most expensive foods in the world. Many places even ban it because of how farmers feed the birds. But this fancy food did not start in the kitchens of rich kings. It started with ordinary people who wanted to use everything.<br><br>Thousands of years ago, ancient Egyptians used to feed their geese extra food. Later, in Europe, Jewish families raised geese for their rich fat. They used the goose fat to cook their meals because they did not use butter. The large, fatty liver was just an extra part of the bird.<br><br>Ordinary families used to cook and eat it to save money. In the 18th century, famous French chefs tasted this amazing liver. They decided to take this simple farmer food and serve it to rich people. They cooked it with sweet fruit jams. Now, people will pay a huge amount of money for a tiny piece of foie gras.",dictionary:{liver:"karaciğer",ban:"yasaklamak",ordinary:"sıradan",ancient:"antik",raised:"yetiştirdi",extra:"fazladan",jams:"reçeller",huge:"devasa",amount:"miktar"}},{icon:"🍗",title:"11. Chicken Wings",src:"11.m4a",text:"Chicken wings are a very popular and expensive food today. But a long time ago, people did not want to eat them at all. Butchers thought chicken wings were just trash. They cut the wings off the birds and threw them away. The wings had very little meat and too many bones. Nobody wanted to buy them.<br><br>Poor families did not have enough money to buy good cuts of meat. So, they used to go to the local butchers and collect the cheap chicken wings. They put the small wings into big pots of boiling water with vegetables. The bones gave a delicious chicken flavor to their cheap meals. They used to eat this warm soup to survive the cold winters.<br><br>Then, some clever cooks discovered something amazing. They realized that if you fry the wings in hot oil and add a spicy sauce, they taste wonderful! Suddenly, everybody loved the taste. Today, chicken wings are a luxury food. People will pay a lot of money to eat them.",dictionary:{trash:"çöp",boiling:"kaynayan",vegetables:"sebzeler",flavor:"tat/lezzet",survive:"hayatta kalmak",clever:"zeki",fry:"kızartmak",spicy:"baharatlı",luxury:"lüks"}},{icon:"🐸",title:"12. Frog Legs",src:"12.m4a",text:"Many years ago in France, King Louis the Sixteenth lived a very rich life. He ate the best meals in his huge palace. But outside the palace, life was very hard. There was no meat left for the common people. The poor peasants were very hungry.<br><br>Because they needed food, the peasants discovered something new. They used to go to the lakes and rivers to catch wet frogs. They cooked the frogs over simple fires to feed their families and survive. Soon, King Louis and his royal chefs heard a story about this new food.<br><br>The King was very curious. He ordered his men to collect frogs from the rivers and bring them to the palace. His chefs cooked the frogs with fancy sauces, rich butter, and green herbs. King Louis tasted the frogs and he liked the flavor very much! Because the King loved it, the dish became famous. Soon, all the rich aristocrats wanted to eat it too. The simple river frog became a luxury meal.",dictionary:{palace:"saray",peasants:"köylüler",survive:"hayatta kalmak",curious:"meraklı",collected:"topladı",flavor:"lezzet/tat",aristocrats:"aristokratlar"}},{icon:"🌭",title:"13. Blutwurst (Blood Sausage)",src:"13.m4a",text:"Blood sausage is a popular food in Germany, Ireland, and many other countries. Today, chefs serve it in expensive restaurants. But in the past, it was a food for very poor farmers. When farmers killed an animal for meat, they did not want to waste anything. Meat was very expensive, and they needed every part of the animal to survive the cold winter.<br><br>They used to collect the dark blood of the animal in a bowl. They mixed the blood with fat, cheap grains, and strong spices. Then, they cooked it over a fire. It looked very strange, but it gave them a lot of energy. For hundreds of years, rich people refused to eat it. They thought it was dirty food.<br><br>But today, people think differently. Famous chefs cook blood sausage with fresh apples and sweet onions. Now, people will pay a high price for this old farmer food.",dictionary:{waste:"israf etmek",survive:"hayatta kalmak",grains:"tahıllar",spices:"baharatlar",refused:"reddetti",differently:"farklı şekilde"}},{icon:"🥩",title:"14. Pastırma (Cured Beef)",src:"14.m4a",text:"Pastırma is a delicious, salty meat. Today, you will find it in fancy Turkish breakfasts and expensive sandwiches. But its story started a very long time ago with tough nomadic riders in Central Asia. These riders traveled long distances on their horses. They did not have refrigerators to keep their food fresh. They needed a way to save meat for long journeys.<br><br>The riders used to cut the beef into thick slices. They rubbed a lot of salt and strong garlic on the meat. Then, they put the salty meat inside special bags. They hung these bags on the sides of their horses. When they rode their horses, their heavy legs pressed against the bags.<br><br>The pressure and the salt slowly cooked the meat. It lasted for many months without going bad! Later, the Ottoman palace chefs loved this spicy meat. They turned it into a luxury food. Today, pastırma is a very expensive delicacy.",dictionary:{nomadic:"göçebe",riders:"biniciler",distances:"mesafeler",journeys:"yolculuklar",slices:"dilimler",rubbed:"ovaladı",pressure:"basınç",delicacy:"leziz yemek"}},{icon:"🥣",title:"15. Bouillabaisse (Fish Soup)",src:"15.m4a",text:"Bouillabaisse is a famous French fish soup. If you visit a restaurant in southern France today, you will pay a lot of money for one bowl. The chef will serve it with fresh bread and a fancy sauce. But a long time ago, it was the cheapest food in the city of Marseille.<br><br>Fishermen used to go out to the sea in small boats. They caught many beautiful fish to sell at the market. But sometimes, they caught ugly fish with too many bones. Nobody wanted to buy these bony fish. The fishermen did not want to throw them away. So, they used to take the ugly fish home.<br><br>They boiled them in a big pot with sea water, cheap tomatoes, and old onions. It was a simple soup for poor families. Then, rich tourists visited Marseille and tasted the soup. They loved it! Soon, chefs added expensive spices and rare seafood. The poor fisherman's soup became a rich person's dinner.",dictionary:{southern:"güney",fishermen:"balıkçılar",ugly:"çirkin",bony:"kılçıklı",boiled:"kaynattı",rare:"nadir",seafood:"deniz ürünleri"}},{icon:"🧀",title:"16. Fondue (Melted Cheese)",src:"16.m4a",text:"Fondue is a famous Swiss dish. A family sits around a warm pot of melted cheese and dips bread into it. Today, people eat fondue on expensive ski holidays in the snowy mountains. But it started as a meal for poor Swiss farmers. In the winter, the villages in the Alps got very cold.<br><br>The snow blocked the roads. The farmers could not buy fresh food. They only had hard, old cheese and dry, hard bread in their houses. The bread was so hard that they broke their teeth! To fix this problem, they used to melt the old cheese in a big pot over the fire.<br><br>They dipped the old bread into the hot cheese to make it soft. It was a very cheap meal to survive the winter. Later, in the 1930s, Swiss cheese makers wanted to sell more cheese. They told everyone that fondue was a fancy national dish. Now, it is a very expensive luxury meal!",dictionary:{melted:"erimiş",dips:"batırır",blocked:"kapattı",hard:"sert",survive:"hayatta kalmak",national:"ulusal",luxury:"lüks"}},{icon:"🍕",title:"17. Pizza",src:"17.m4a",text:"Pizza is the most famous food in the world today. But a long time ago, rich people hated it. In the 1800s, Naples was a very poor city in Italy. The street workers did not have much money or time. They needed food that was cheap and fast.<br><br>Bakers used to make flat, round bread and put cheap tomatoes on top. Sometimes they added a little bit of old cheese or garlic. The poor workers used to buy a slice and eat it on the street. Rich Italians thought it was dirty peasant food. They refused to touch it.<br><br>Everything changed in the year 1889. Queen Margherita of Italy visited Naples. She felt tired of fancy royal food. She wanted to taste the poor people's bread. A baker made her a special pizza with red tomatoes, white cheese, and green leaves. She loved it! Because the Queen ate it, everyone wanted it. Now, people will pay high prices for gourmet pizza.",dictionary:{hated:"nefret etti",bakers:"fırıncılar",flat:"düz",slice:"dilim",peasant:"köylü",refused:"reddetti",tired:"yorgun",gourmet:"gurme"}},{icon:"🌮",title:"18. Fajitas",src:"18.m4a",text:"When you order fajitas in a restaurant today, the waiter brings a hot pan of delicious meat. You will pay a good price for this famous Mexican-American meal. But the story of the fajita started with poor cowboys in Texas. These cowboys worked very hard on big cattle farms in the 1930s.<br><br>The farm owners kept the best and most expensive cuts of beef to sell. They gave the cheap, tough meat to the cowboys as part of their pay. This meat came from the bottom of the cow. It was very tough and hard to chew. The clever cowboys used to cut the meat into very thin strips.<br><br>They mixed the strips with lime juice and strong spices to make it soft. Then, they cooked it quickly over a hot fire and ate it inside flat bread. For many years, only poor workers knew about it. In the 1980s, fancy restaurants discovered it. Now, everyone loves the famous cowboy meal.",dictionary:{waiter:"garson",pan:"tava",cattle:"sığır",tough:"sert",chew:"çiğnemek",clever:"zeki",strips:"şeritler",lime:"misket limonu"}},{icon:"🌾",title:"19. Quinoa",src:"19.m4a",text:'Quinoa is a very healthy grain. Today, you will find it in expensive salads at fancy health food cafes. People call it a "superfood." But for thousands of years, it was just the basic food of poor farmers in the Andes Mountains of South America. The weather in the high mountains was very cold and dry.<br><br>Most plants died in the cold, but quinoa grew perfectly. The ancient Inca people used to eat it every single day to stay strong. When the Spanish army arrived in South America, they hated the quinoa. They thought it was a useless food for poor peasants. They forced the farmers to grow wheat instead.<br><br>For hundreds of years, the rest of the world ignored quinoa. Then, in the 2000s, scientists discovered that it was very good for the human body. Suddenly, healthy eaters everywhere wanted it. Because the demand grew so fast, this cheap peasant food became very expensive.',dictionary:{healthy:"sağlıklı",grain:"tahıl",ancient:"antik",useless:"işe yaramaz",forced:"zorladı",wheat:"buğday",ignored:"görmezden geldi",scientists:"bilim insanları",demand:"talep"}},{icon:"🍜",title:"20. Ramen Noodles",src:"20.m4a",text:"Ramen is a bowl of hot soup, noodles, and meat. Today, there are famous ramen restaurants all over the world. People will wait in a long line to buy a bowl. But in the beginning, ramen was a cheap food for poor students and workers in Japan.<br><br>After World War Two, Japan did not have a lot of food. People were very hungry. Small street carts used to sell big bowls of hot salty soup with wheat noodles. The noodles cost almost nothing. Poor workers used to eat the soup fast so they could return to their jobs quickly.<br><br>In 1958, a man invented cheap instant noodles in a plastic cup. It became the food of poor college students everywhere. But in the 2000s, chefs decided to change it. They cooked the meat for many hours and made rich, beautiful soups. They turned the cheap street food into an art. Now, you will pay twenty dollars for gourmet ramen!",dictionary:{carts:"arabalar",instant:"hazır",college:"üniversite",gourmet:"gurme"}},{icon:"🍋",title:"21. Ceviche",src:"21.m4a",text:"Ceviche is a popular seafood dish in South America. The chef mixes raw fish with sour lemon or lime juice. The sour juice slowly cooks the raw fish without any fire. Today, you will eat it in luxury restaurants by the ocean. But hundreds of years ago, it was a fast meal for poor fishermen in Peru.<br><br>The fishermen used to spend all day on their boats under the hot sun. They did not have stoves or fires on their small boats to cook their food. When they felt hungry, they took a fresh fish directly from the water. They cut the raw fish into small pieces.<br><br>They used to squeeze fresh sour fruit juice over the fish and eat it right there on the boat. It was a cheap and easy way to eat at sea. Later, rich people in the big cities discovered this trick. Chefs added expensive spices and served it on fancy plates.",dictionary:{raw:"çiğ",sour:"ekşi",stoves:"ocaklar",directly:"doğrudan",squeeze:"sıkmak",trick:"hile",rare:"nadir"}},{icon:"🥔",title:"22. Gnocchi",src:"22.m4a",text:"Gnocchi is a delicious Italian food. They look like small, soft pillows. Today, Italian restaurants serve gnocchi with rich meat sauces and expensive cheese. But they started as a trick to save money. Hundreds of years ago, poor Italian farmers did not have enough money to buy wheat flour.<br><br>Flour was very expensive, but the farmers had very big families to feed. They needed a cheap way to fill their stomachs. When explorers brought potatoes from America to Europe, the Italian farmers grew them in the dirt. Potatoes were very cheap and easy to grow.<br><br>The mothers used to boil the cheap potatoes and mash them. They mixed a lot of potato with just a tiny bit of expensive flour. They rolled them into small balls and boiled them. This cheap potato meal kept the poor farmers full of energy. Today, chefs make gnocchi by hand in fancy kitchens. People will pay a high price for these simple potato pillows!",dictionary:{pillows:"yastıklar",flour:"un",stomachs:"mideler",explorers:"kaşifler",mash:"ezmek",rolled:"yuvarladı"}},{icon:"🥩",title:"23. BBQ Ribs",src:"23.m4a",text:"Barbecue ribs are a famous American meal. The meat is sweet, smoky, and very soft. Today, you will find special barbecue restaurants everywhere. They charge a lot of money for a plate of ribs. But the history of barbecue ribs is a story of poor people.<br><br>In the southern United States, rich farm owners took all the best cuts of the pig. They left the tough ribs for the enslaved people and poor farmers. The ribs had very little meat and big, thick bones. If you cooked them quickly, they were too hard to eat.<br><br>To make the ribs soft, poor people used to dig a hole in the ground. They made a slow, smoky fire. They cooked the cheap ribs over the smoke for many hours. They used to brush the meat with sweet and spicy sauces to cover the bad taste. Now, rich people love this smoky flavor. This cheap meat is now a big business!",dictionary:{smoky:"tütsülü",enslaved:"köleleştirilmiş",thick:"kalın",dig:"kazmak",hole:"delik",brush:"fırçalamak/sürmek",flavor:"lezzet"}},{icon:"🌽",title:"24. Polenta",src:"24.m4a",text:'Polenta is a thick, yellow corn meal from Italy. Today, chefs serve it in fancy restaurants with expensive mushrooms and rich meat. But for a very long time, it was the daily food of poor Italian farmers. When farmers grew corn in their fields, they dried the yellow corn and crushed it into small pieces.<br><br>They did not have meat, fish, or cheese. They only had this yellow powder. The poor farmers used to mix the polenta with boiling water in a big iron pot. They stirred it over the fire for an hour until it became a thick yellow paste.<br><br>A poor family used to eat it every day for breakfast, lunch, and dinner. It was very boring, but it kept them alive. Rich Italians used to laugh at the farmers and called them "polenta eaters." But today, the rich people changed their minds. They added butter and fancy cheese. Now, it is a very expensive Italian dish.',dictionary:{crushed:"ezilmiş",powder:"toz",iron:"demir",stirred:"karıştırdı",paste:"macun",boring:"sıkıcı"}},{icon:"🐮",title:"25. Brisket",src:"25.m4a",text:"Brisket is a very large cut of beef from the chest of the cow. Because the cow uses its chest muscles a lot, the meat is very tough. In the past, butchers could not sell it to rich people. So, the tough brisket was very cheap. Poor Jewish immigrants in Eastern Europe used to buy this cheap meat for their families.<br><br>They needed to make the tough meat soft. The mothers used to cook the brisket in a pot with onions and water on a very low fire. They cooked it all day until it was soft enough to cut with a fork. Later, Jewish families moved to America and brought this recipe with them.<br><br>Also in Texas, poor farmers cooked brisket slowly over smoke to make it soft. Today, slowly cooked brisket is very famous. People will stand in long lines to buy it. Because everyone loves it, this tough and cheap meat is now very expensive.",dictionary:{chest:"göğüs",muscles:"kaslar",tough:"sert",immigrants:"göçmenler",recipe:"tarif",lines:"kuyruklar"}},{icon:"🌯",title:"26. Tantuni",src:"26.mp3",text:`Tantuni is a very famous food from Mersin, Turkey. But fifty years ago, it started as a cheap meal for poor market workers. After a long day of work, the Arab workers felt very hungry. They did not have much money. So, they used to go to the butchers and collect the cheapest leftover meat. People called this meat "cındırık."<br><br>The workers also collected old metal trays from the baklava makers. They hit the middle of the tray with a hammer to make a deep hole. They put the tray over a hot fire. They used cheap cotton oil to fry small pieces of boiled meat. Then, they put the hot meat inside cheap bread or leftover pastry.<br><br>They added onions, tomatoes, and parsley to make it taste good. In their Arabic dialect, "tantuni" meant a mix of everything. Soon, the rich shop owners smelled this amazing food in the evenings. They wanted to taste it too. Because everyone loved the taste, this cheap worker's meal became Mersin's famous national dish!`,dictionary:{leftover:"artan",trays:"tepsiler",hammer:"çekiç",hole:"delik",pastry:"hamur işi",parsley:"maydanoz",dialect:"lehçe",smelled:"kokusunu aldı",national:"ulusal"}}]},DS={id:"satires",title:"Satires",cover:"🎭",color:"#e67e22",description:"A complete collection of 44 satirical listening lessons, wit, and historical humor.",baseUrl:"https://raw.githubusercontent.com/dogierez/satires-spotify/main/",githubRepoUrl:"https://github.com/dogierez/satires-spotify",tracks:[{icon:"⚔️",title:"1. The Spartan Reply",src:"1.The Spartan Reply.m4a",text:'Philip II of Macedon was conquering Greek city-states one by one. Frustrated by the stubbornness of Sparta, he sent them a threatening message: "If I invade Laconia, I shall turn you out, destroy your farms, slay your people, and raze your city, never to rise again." The Spartans wrote back a single word: "If." Philip never invaded Sparta.',dictionary:{conquering:"fetheden",invade:"istila etmek",raze:"yerle bir etmek"}},{icon:"🏺",title:"2. Diogenes the Cynic",src:"2.Diogenes the Cynic.m4a",text:'Alexander the Great went out of his way to meet the famous philosopher Diogenes, who lived in a ceramic jar on the streets of Corinth. Alexander found him resting in the sunlight. Hoping to impress him, the conqueror stood over him and said, "I am Alexander the Great. Is there nothing in the world I can do for you?" Diogenes looked up and replied, "Yes. Stand a little out of my sun."',dictionary:{philosopher:"filozof",impress:"etkilemek"}},{icon:"⛪",title:"3. The Greek Priest",src:"3.The Greek Priest.m4a",text:`During the Nazi occupation of Greece, a high-ranking German officer is stationed in a rural Greek village. One afternoon, he needs to relieve himself and demands that the local village priest show him to the restroom. The priest nods and leads the officer out behind the church to a barren, rocky field with nothing but a simple hole in the ground. Shocked and utterly disgusted, the German officer zips his pants and scoffs, "You Greeks! You have absolutely zero organization, zero infrastructure, and no culture! Just look at how you live!" The Greek priest shrugs and calmly replies, "Well, if we were an organized country, we'd be taking a shit in Berlin right now."`,dictionary:{occupation:"işgal",infrastructure:"altyapı"}},{icon:"🎩",title:"4. The Earl and the Radical",src:"4.The Earl and the Radical.m4a",text:`John Wilkes was a radical English politician and journalist known for his devastating wit. During a particularly heated debate, the Earl of Sandwich furiously shouted at him, "Sir, I do not know whether you will die on the gallows or of the pox!" Wilkes smoothly replied, "That depends, my lord, on whether I embrace your lordship's principles or your mistress."`,dictionary:{radical:"köklü/radikal",gallows:"darağacı"}},{icon:"🕊️",title:"5. Mahatma Gandhi's Opinion",src:"5.Mahatma Gandhi's Opinion.m4a",text:'When Mahatma Gandhi traveled to London to meet with British authorities, he was asked by a reporter what he thought of the "civilized" nature of the British Empire. The reporter asked, "Mr. Gandhi, what do you think of Western civilization?" Gandhi smiled and replied, "I think it would be a very good idea."',dictionary:{civilized:"uygar",empire:"imparatorluk"}},{icon:"🐶",title:"6. The Puppies",src:"6.The Puppies.m4a",text:'A German officer in occupied Athens sees a young boy on the street corner selling a basket of puppies. "What kind of puppies are these?" the officer asks. The boy replies, "They are Nazi puppies." Pleased, the officer walks away. A week later, he returns with his commanding General to show off the loyal local boy. "Boy," the officer says proudly, "tell the General what kind of puppies these are." The boy says, "They are Greek resistance puppies." Furious, the officer yells, "Last week you told me they were Nazi puppies!" The boy shrugs. "Yes, but since then, their eyes have opened."',dictionary:{resistance:"direniş",commanding:"komuta eden"}},{icon:"🥾",title:"7. Abraham Lincoln's Boots",src:"7.Abraham Lincoln's Boots.m4a",text:`During his presidency, Abraham Lincoln was known for his humble, frontier habits. One day, a foreign diplomat walked into Lincoln’s office and was appalled to find the President of the United States polishing his own footwear. The diplomat scoffed, "Mr. President, in my country, gentlemen do not clean their own shoes." Lincoln didn't even look up. "Is that so? Then whose shoes do they clean?"`,dictionary:{diplomat:"diplomat",polishing:"parlatma"}},{icon:"🐢",title:"8. Zhuangzi’s Tortoise",src:"8.Zhuangzi’s Tortoise.m4a",text:'The great Taoist philosopher Zhuangzi was fishing by a river when two messengers from the King of Chu arrived, offering him the position of Prime Minister. Zhuangzi kept his eyes on his fishing rod and said, "I have heard that the King keeps a sacred, three-thousand-year-old tortoise shell in a silk box in his shrine. Tell me, would that tortoise rather be dead and honored in a shrine, or alive and happily dragging its tail in the mud?" The messengers replied, "Alive and dragging its tail in the mud, of course." Zhuangzi waved them away. "Go away. I prefer dragging my tail in the mud."',dictionary:{tortoise:"kaplumbağa",shrine:"tapınak"}},{icon:"🎩",title:"9. The Polite Introduction",src:"9.The Polite Introduction.m4a",text:'A German officer is strutting down the sidewalk in occupied Paris when a Frenchman accidentally bumps into him. The angry officer snaps to attention and shouts, "Swine!" The Frenchman calmly tips his hat, bows slightly, and replies, "A pleasure to meet you. I am Pierre."',dictionary:{strutting:"çalımla yürümek",swine:"domuz"}},{icon:"🪶",title:"10. Voltaire’s Last Words",src:"10.Voltaire’s Last Words.m4a",text:'The famous French Enlightenment writer Voltaire was known for his lifelong critique of the Catholic Church. As he lay on his deathbed, a priest visited him to administer the last rites and asked him to formally renounce Satan and all his works. Voltaire opened his eyes and whispered, "Now, now, my good man. This is no time to be making new enemies."',dictionary:{critique:"eleştiri",renounce:"vazgeçmek"}},{icon:"📻",title:"11. Radio Yerevan",src:"11.Radio Yerevan.m4a",text:`A listener calls into Radio Yerevan and asks: "Is it true that there is freedom of speech in the Soviet Union, just exactly like there is in the United States?" Radio Yerevan answers: "In principle, yes. In the USA, you can stand in front of the White House and yell 'Down with the American President!', and you will not be punished. In the USSR, you can stand in Red Square and yell 'Down with the American President!', and you will not be punished either."`,dictionary:{freedom:"özgürlük",punished:"cezalandırılmak"}},{icon:"🧒",title:"12. The Ambition",src:"12.The Ambition.m4a",text:'A Gestapo officer visits a school in occupied Warsaw to test the loyalty of the children. He points to a young boy and asks, "Who is your father?" The boy recites, "The glorious Third Reich!" "Excellent. And who is your mother?" The boy answers, "The honorable Nazi Party!" The officer smiles warmly. "Perfect. And what do you want to be when you grow up?" The boy answers, "An orphan."',dictionary:{loyalty:"sadakat",orphan:"yetim"}},{icon:"🎭",title:"13. George Bernard Shaw and Winston Churchill",src:"13.George Bernard Shaw and Winston Churchill.m4a",text:'The playwright George Bernard Shaw and Prime Minister Winston Churchill had a famous, long-running rivalry of wits. Shaw sent Churchill two tickets to the opening night of his new play with a note that read: "Bring a friend, if you have one." Churchill sent the tickets back with a reply: "I cannot make the first night. I will come to the second night, if there is one."',dictionary:{playwright:"oyun yazarı",rivalry:"rekabet"}},{icon:"🤫",title:"14. Calvin Coolidge’s Bet",src:"14.Calvin Coolidge’s Bet.m4a",text:'U.S. President Calvin Coolidge was famously nicknamed "Silent Cal" because he despised small talk and rarely spoke unless absolutely necessary. At a dinner party, a socialite sat next to him and playfully said, "Mr. President, in my country, gentlemen do not clean their own shoes." Coolidge looked at her and said, "You lose."',dictionary:{despised:"nefret etti",socialite:"sosyete"}},{icon:"🎨",title:"15. The Masterpiece",src:"15.The Masterpiece.m4a",text:`A Gestapo officer is searching Pablo Picasso’s apartment in Paris during the occupation and notices a photograph of Guernica on the table—Picasso's famous painting depicting the horrific bombing of a Basque town by the German Luftwaffe. The officer sneers and asks, "Did you do this?" Picasso looks him dead in the eye and replies, "No. You did."`,dictionary:{depicting:"tasvir eden",horrific:"korkunç"}},{icon:"🧳",title:"16. Oscar Wilde at Customs",src:"16.Oscar Wilde at Customs.m4a",text:'The brilliant Irish poet and playwright Oscar Wilde was embarking on a lecture tour in the United States. Arriving by ship in New York, he stepped up to the customs agent, who gruffly asked if he had nothing of value to declare to the state. Wilde sighed dramatically and announced, "I have nothing to declare but my genius."',dictionary:{embarking:"başlayan",genius:"dahi"}},{icon:"🎼",title:"17. The Maestro's Advice",src:"17.The Maestro's Advice.m4a",text:`A young, aspiring composer approached Wolfgang Amadeus Mozart and asked, "Herr Mozart, I am thinking of writing a symphony. How should I get started?" Mozart replied, "A symphony is a very complex musical form. Perhaps you should start with some simple lieder and work your way up." The young man argued, "But you were writing symphonies when you were only eight years old!" Mozart nodded. "Yes, but I didn't have to ask no one how to do it."`,dictionary:{aspiring:"hevesli",complex:"karmaşık"}},{icon:"⛓️",title:"18. The Missing Italians",src:"18.The Missing Italians.m4a",text:`During the failed Italian invasion of Greece, an arrogant Italian general is interrogating a captured Greek partisan. "You are only delaying the inevitable!" the General boasts. "Soon, our mighty army will be marching through the streets of Athens!" The Greek shakes his head. "Impossible." "Why?" demands the General. "Because we don't have enough prison camps to hold all of you."`,dictionary:{interrogating:"sorguya çeken",inevitable:"kaçınılmaz"}},{icon:"🏴‍☠️",title:"19. The Corsair's Motivation",src:"19.The Corsair's Motivation.m4a",text:'The famous French corsair Robert Surcouf was captured by the British navy. A British officer confronted him on the deck, sneering, "You French fight only for money and plunder, while we British fight for honor and glory!" Surcouf smiled and replied, "Sir, a man fights for what he lacks the most."',dictionary:{plunder:"yağma",lacks:"yoksun olmak"}},{icon:"☕",title:"20. The Diplomat's Truce",src:"20.The Diplomat's Truce.m4a",text:'During a bitter parliamentary debate, a female politician, Lady Astor, furiously turned to Winston Churchill and said, "Winston, if you were my husband, I would poison your tea!" Churchill looked at her and calmly replied, "Madam, if you were my wife, I would drink it."',dictionary:{parliamentary:"parlamento",poison:"zehir"}},{icon:"🚲",title:"21. The Dutch Bicycle",src:"21.The Dutch Bicycle.m4a",text:`A German soldier confiscated a Dutchman's bicycle on a bridge in Amsterdam, and ordered, "Hand it over! We need this for the war effort against Britain!" The Dutchman handed it over and sighed, "If you guys are truly the master race, you’d just invent a bicycle you can ride across the English Channel."`,dictionary:{confiscated:"el konulan",invent:"icat etmek"}},{icon:"🧬",title:"22. The Genetics Question",src:"22.The Genetics Question.m4a",text:'The famous dancer Isadora Duncan wrote to the brilliant playwright George Bernard Shaw with a proposal: "We should have a child together. With my beauty and your brains, it would be the perfect child." Shaw wrote back, declining the offer: "My dear Miss Duncan, what if the child were to inherit my beauty and your brains?"',dictionary:{proposal:"teklif",inherit:"miras almak"}},{icon:"☁️",title:"23. The Heavenly Climate",src:"23.The Heavenly Climate.m4a",text:'When asked on his deathbed whether he believed he was going to Heaven or Hell, the American author Mark Twain replied, "I refuse to answer that question. I have friends in both places. But I will say this: go to Heaven for the climate, and Hell for the company."',dictionary:{climate:"iklim",company:"eşlik/şirket"}},{icon:"🎯",title:"24. The Last Request",src:"24.The Last Request.m4a",text:'A partisan is captured and placed in front of a firing squad. The German commander steps forward and asks, "Do you have a final request?" The partisan replies, "Yes, I’d like to officially join the Nazi Party." The commander is baffled. "Why would you want to do that right before we shoot you?" The partisan smiles, "Because then there will be one less of you."',dictionary:{squad:"manga",baffled:"şaşkın"}},{icon:"📜",title:"25. The Fourteen Points",src:"25.The Fourteen Points.m4a",text:'After World War I, US President Woodrow Wilson arrived in Europe with his famous "Fourteen Points" for world peace. The pragmatic and deeply cynical French Prime Minister, Georges Clemenceau, rolled his eyes and muttered, "Fourteen points? The good Lord Himself only had ten."',dictionary:{pragmatic:"faydacı",cynical:"alaycı"}},{icon:"🏹",title:"26. Fighting in the Shade",src:"26.Fighting in the Shade.m4a",text:'Before the Battle of Thermopylae, a Persian messenger tried to intimidate the heavily outnumbered Spartan forces. "Surrender," the messenger boasted. "Our army is so massive that when we fire our bows, our arrows will blot out the sun!" The Spartan soldier Dienekes laughed and replied, "Good. Then we will fight in the shade."',dictionary:{intimidate:"gözdağı vermek",shade:"gölge"}},{icon:"🧭",title:"27. The Directions",src:"27.The Directions.m4a",text:'A lost German patrol in Norway stops a local farmer on a coastal road. The arrogant commander asks, "Tell us, old man, what is the fastest way to London from here?" The farmer looks at the sea, then looks back at the commander. "Walk straight into the ocean and keep going until your hats float."',dictionary:{patrol:"devriye",coastal:"kıyı"}},{icon:"✉️",title:"28. The Funeral Arrangement",src:"28.The Funeral Arrangement.m4a",text:'The famous lawyer Clarence Darrow was asked if he would be attending the funeral of a particularly ruthless and corrupt politician he had battled in court for years. Darrow replied, "No, I did not attend the funeral. But I sent a very nice letter stating that I highly approved of it."',dictionary:{ruthless:"acımasız",corrupt:"yozlaşmış"}},{icon:"⛵",title:"29. The Emperor and the Pirate",src:"29.The Emperor and the Pirate.m4a",text:'A pirate was captured and brought before Alexander the Great. Alexander demanded, "How dare you molest the seas and terrorize innocent ships?" The pirate stood tall and replied, "How dare you molest the whole world? Because I do it with a small boat, I am called a pirate. Because you do it with a massive navy, you are called an emperor."',dictionary:{molest:"taciz etmek",terrorize:"terörize etmek"}},{icon:"🐕",title:"30. The Canine Debate",src:"30.The Canine Debate.m4a",text:`A dog from occupied Poland sneaks across the border into occupied Czechoslovakia and meets a local dog. The Czech dog asks, "Why on earth did you come here? We have barely any meat, the bread is stale, and the bones are picked completely clean." The Polish dog replies, "It is exactly the same over there. But at least here, you're still allowed to bark."`,dictionary:{border:"sınır",stale:"bayat"}},{icon:"🎼",title:"31. The Score",src:"31.The Score.m4a",text:'The famous Italian composer Gioachino Rossini was known for his sharp tongue. One day, a friend found him reading a musical score by his rival, Richard Wagner. Rossini was holding the sheet music completely upside down. Confused, his friend pointed it out. Rossini nodded, "I know. I tried reading it right-side up, but it makes much more sense this way."',dictionary:{tongue:"dil",upside:"baş aşağı"}},{icon:"🍷",title:"32. The Question of Sobriety",src:"32.The Question of Sobriety.m4a",text:'Following a heated evening, the politician Bessie Braddock snapped at Winston Churchill, "Winston, you are drunk, and what’s more, you are disgustingly drunk." Churchill retorted, "Bessie, my dear, you are ugly, and what’s more, you are disgustingly ugly. But tomorrow I shall be sober, and you will still be disgustingly ugly."',dictionary:{sobriety:"ayık olma",disgustingly:"iğrenç bir şekilde"}},{icon:"💈",title:"33. The Barber",src:"33.The Barber.m4a",text:`A German officer walks into a Parisian barbershop for a shave. He sits in the chair, draws his Luger pistol, places it on the counter, and says, "If you cut me, I shoot you." The barber calmly lathers his face and gives him a flawless, perfectly close shave. Afterward, the officer puts his gun away and asks, "Weren't you afraid?" The barber shrugs. "No. If I had cut you, I would have just kept cutting."`,dictionary:{flawless:"kusursuz",shrugs:"omuz silkmek"}},{icon:"🚪",title:"34. The Doorway Dispute",src:"34.The Doorway Dispute.m4a",text:'The sharp-witted American writer Dorothy Parker was at a high-society party in New York. She arrived at an open doorway at the exact same moment as a snooty, rival socialite. The socialite stepped back, gesturing condescendingly for Parker to go first, and sneered, "Age before beauty." Parker smoothly walked through the door and replied, "Pearls before swine."',dictionary:{condescendingly:"küçümseyerek",swine:"domuz"}},{icon:"🍽️",title:"35. The Presidential Dinner",src:"35.The Presidential Dinner.m4a",text:'In 1962, President John F. Kennedy hosted a dinner at the White House honoring 49 Nobel Laureates. Looking out over the brilliant crowd of scientists, writers, and thinkers, Kennedy raised his glass and said, "I think this is the most extraordinary collection of talent and human knowledge that has ever been gathered at the White House—with the possible exception of when Thomas Jefferson dined alone."',dictionary:{extraordinary:"olağanüstü",laureates:"ödül sahipleri"}},{icon:"🔮",title:"36. The Fortune Teller",src:"36.The Fortune Teller.m4a",text:'Hitler visits a renowned clairvoyant in Berlin and asks, "On what day will I die?" The clairvoyant consults her crystal ball and says, "You will die on a Jewish holiday." Hitler demands, "Which one?" She replies, "Whichever day you die, it will become a Jewish holiday."',dictionary:{clairvoyant:"kahin",consults:"danışır"}},{icon:"💍",title:"37. Socrates on Marriage",src:"37.Socrates on Marriage.m4a",text:'A young student approached the great philosopher Socrates and asked whether or not he should get married. Socrates stroked his beard and answered, "By all means, marry. If you get a good wife, you will be happy. If you get a bad wife, you will become a philosopher."',dictionary:{philosopher:"filozof",stroked:"okşadı"}},{icon:"👑",title:"38. The Royal Review",src:"38.The Royal Review.m4a",text:'King George III of England was given a manuscript written by an overly ambitious and verbose politician. After slogging through the text, the King handed it back to an aide with a sigh. "There are many things in this book which are new, and many things which are true," the King said. "Unfortunately, the things which are true are not new, and the things which are new are not true."',dictionary:{verbose:"laf kalabalığı yapan",slogging:"zar zor ilerlemek"}},{icon:"🎭",title:"39. The Theater Director",src:"39.The Theater Director.m4a",text:`During the occupation of Denmark, a German censor demanded that a local theater director put on a play glorifying the Reich. "And make sure," the censor ordered, "that the villain is completely incompetent, universally hated, and ends up destroying his own country." The director nodded thoughtfully. "I understand completely. But won't the Gestapo object to us putting the Führer on stage?"`,dictionary:{incompetent:"yeteneksiz",villain:"kötü adam"}},{icon:"🏦",title:"40. The Bank Manager",src:"40.The Bank Manager.m4a",text:`The legendary American outlaw bank robber Willie Sutton was finally apprehended by the police. A reporter pushed through the crowd and shouted, "Willie! Why do you rob banks?" Sutton looked at him as if the reporter were completely clueless and calmly replied, "Because that's where the money is."`,dictionary:{outlaw:"kanun kaçağı",apprehended:"yakalandı"}},{icon:"⌚",title:"41. The Timepiece",src:"41.The Timepiece.m4a",text:'A German officer stops an old man in occupied Vienna and demands, "What time is it?" The old man looks down at his empty wrist where his gold watch used to be before it was confiscated, looks back up, and smiles. "I believe it is time for you to pack your bags.”',dictionary:{confiscated:"el konuldu",wrist:"bilek"}},{icon:"✉️",title:"42. The Postage Stamp",src:"42.The Postage Stamp.m4a",text:'Dictator Francisco Franco decides to commemorate his rule by issuing a brand-new, premium postage stamp featuring a grand portrait of his own face. A few weeks after the stamps are released, Franco begins hearing furious reports that the stamps are falling off the envelopes in the mail. Enraged, he summons his Postmaster General and demands an explanation. "What is the meaning of this?!" Franco yells. "Are you using cheap glue?! Is it a manufacturing error?" The Postmaster nervously clears his throat, looks at the floor, and replies, "No, Generalissimo. The quality of the stamp is perfect, and the glue is incredibly strong. The problem is that the people are spitting on the wrong side.”',dictionary:{commemorate:"anmak",enraged:"öfkeli"}},{icon:"🏥",title:"43. The Psychiatric Hospital",src:"43.The Psychiatric Hospital.m4a",text:'Benito Mussolini is touring a state-run psychiatric hospital to ensure the patients are being taught proper fascist loyalty. As he enters the main hall, all the patients immediately stand up, raise their right arms in the fascist salute, and shout, "Hail, Il Duce!" However, Mussolini notices one man standing in the corner with his arms crossed, completely silent. Enraged, Mussolini marches over and demands, "You there! Why are you not saluting me like the rest of them?" The man politely replies, "Because I am the head doctor, sir. I’m not crazy."',dictionary:{psychiatric:"psikiyatrik",salute:"selam"}},{icon:"🛩️",title:"44. Making Germany Happy",src:"44.Making Germany Happy.m4a",text:'Adolf Hitler, Hermann Göring, and Joseph Goebbels are flying in a private airplane over Germany. Hitler looks out the window and says, "If I threw a one-thousand-mark note out of this window right now, I would make one German very happy." Göring chuckles and says, "Well, my Führer, if I threw ten one-hundred-mark notes out the window, I could make ten Germans very happy." Goebbels adds, "If I threw one hundred ten-mark notes out, I could make a hundred Germans happy." The pilot slowly turns around from the cockpit and says, "If I threw all three of you out the window, I would make the entire country happy."',dictionary:{cockpit:"kokpit",entire:"tüm"}}]},AS={id:"historic-people",title:"Historic People",cover:"📜",color:"#c0392b",description:"A complete collection of 52 listening lessons exploring legendary historical figures and powerful leaders.",baseUrl:"https://raw.githubusercontent.com/dogierez/historic-people/main/",tracks:[{icon:"❄️",title:"1. Alexander Nevsky",src:"01_Alexander_Nevsky.mp3",text:`Alexander Nevsky was a famous Russian prince and military hero who lived in the 13th century. He was born in 1221. During his life, his homeland faced terrible dangers from every direction. The powerful Mongol Empire was attacking from the east, taking over many Russian cities. At the same time, strong European enemies were attacking from the west.<br><br>Alexander knew his army was not strong enough to fight the Mongols, so he made peace with them to protect his people. However, he fought bravely against the western invaders.<br><br>In 1240, a large Swedish army landed on the banks of the Neva River. Though he was only 19 years old, Alexander led a surprise attack and completely defeated the Swedes. Because of this great victory, people called him "Nevsky," which means "of the Neva."<br><br>Two years later, he faced an army of German knights who invaded during winter. Alexander cleverly lured the heavily armored knights onto the frozen surface of Lake Peipus. The ice broke under their heavy weight, and the Russians won the famous "Battle on the Ice." Today, he is celebrated as Russia's greatest defender.`,dictionary:{faced:"yüzleşti",attacking:"saldırıyordu",taking:"alıyordu",knew:"biliyordu",made:"yaptı/sağladı",protect:"korumak",fought:"savaştı",landed:"karaya çıktı",led:"yönetti",defeated:"mağlup etti",invaded:"işgal etti",lured:"tuzağa düşürdü",broke:"kırıldı",won:"kazandı",celebrated:"kutlanıyor/anılıyor"}},{icon:"🐍",title:"2. Alexander the Great",src:"02_Alexander_the_Great.mp3",text:"Alexander was born in 356 BC in Pella, the capital of Macedon. His mother, Olympia, was a strong and mysterious woman. She prayed to snakes and kept many of them in the palace. Alexander grew up with these snakes. Poisonous snakes bit him, so his body became strong against poison.<br><br>His father, King Philip II, was a very strict ruler. One night, he punished Alexander very badly. This difficult event helped make Alexander a fearless and strong man. Even as a young man, Alexander was special. He did not have a beard. He ordered all his soldiers to shave their faces, too. This rule for soldiers is still used today. He was a student of the famous teacher Aristotle. He learned about war and how to lead an army. He became a commander when he was still a teenager.<br><br>Alexander wanted to conquer the whole world. He took control of many huge lands like Persia and Egypt. He even traveled as far as India. His army grew bigger and stronger. However, great power brought danger. When he was at the River Indus, his own generals turned against him. They poisoned him because they were tired of fighting. They wanted to stop and return to their homes and families.",dictionary:{prayed:"dua etti",kept:"besledi/tuttu",grew:"büyüdü",bit:"ısırdı",punished:"cezalandırdı",helped:"yardım etti",ordered:"emretti",shave:"tıraş olmak",learned:"öğrendi",lead:"yönetmek",conquer:"fethetmek",took:"aldı",traveled:"seyahat etti",brought:"getirdi",turned:"döndüler (karşı)",poisoned:"zehirlediler",return:"geri dönmek"}},{icon:"🏹",title:"3. Attila the Hun",src:"03_Attila_the_Hun.mp3",text:'Attila the Hun was one of the most feared leaders in ancient history. He ruled the Hunnic Empire from 434 to 453 AD. The Huns were a group of fierce nomadic warriors who lived on horses and used deadly bows and arrows. Because of his destructive attacks, the Romans called him the "Scourge of God."<br><br>Attila united many different tribes and created an enormous army. He first attacked the Eastern Roman Empire, forcing them to pay huge amounts of gold to keep him away. Later, he turned his army toward the Western Roman Empire. He marched through Gaul, which is modern-day France, destroying cities along the way. In 451 AD, a combined army of Romans and Visigoths finally stopped him at the Battle of the Catalaunian Plains.<br><br>A year later, Attila invaded Italy and marched toward Rome. However, Pope Leo I met with him outside the city. Nobody knows exactly what they talked about, but Attila agreed to leave Italy without attacking Rome. Shortly after this, Attila died suddenly on the night of his wedding, and his great empire quickly fell apart.',dictionary:{feared:"korkulan",ruled:"hükmetti",lived:"yaşadı",used:"kullandı",united:"birleştirdi",created:"yarattı",attacked:"saldırdı",forcing:"zorlayarak",marched:"ilerledi/yürüdü",destroying:"yok ederek",stopped:"durdurdu",invaded:"işgal etti",talked:"konuştular",agreed:"kabul etti",leave:"ayrılmak",fell:"düştü/yıkıldı"}},{icon:"🐘",title:"4. Babur",src:"04_Babur.mp3",text:"Babur was a great conqueror who founded the powerful Mughal Empire in India. He was born in 1483 in Central Asia. He had famous ancestors; he was connected to both Genghis Khan and Timur. From a young age, Babur faced many difficulties. He lost his father when he was just 11 years old and had to fight to keep his small kingdom. He won and lost the famous city of Samarkand several times.<br><br>Realizing he could not build an empire in Central Asia, he moved his army south into modern-day Afghanistan and captured Kabul. From there, Babur looked toward the rich lands of India. In 1526, he fought the massive army of the Sultan of Delhi at the Battle of Panipat.<br><br>Although his army was much smaller, Babur used clever tactics and a new weapon: gunpowder cannons. The loud cannons frightened the enemy's war elephants, causing great confusion. Babur won a spectacular victory and became the ruler of northern India. He was not just a warrior, but also a poet who loved nature and built beautiful gardens. His success started an empire that lasted for centuries.",dictionary:{founded:"kurdu",faced:"yüzleşti",lost:"kaybetti",fight:"savaşmak",realizing:"fark ederek",build:"inşa etmek",moved:"taşıdı/hareket etti",captured:"ele geçirdi",looked:"baktı",fought:"savaştı",used:"kullandı",frightened:"korkuttu",causing:"sebep olarak",won:"kazandı",loved:"sevdi",built:"inşa etti",lasted:"sürdü"}},{icon:"⚔️",title:"5. Baltacı Mehmet Pasha",src:"05_Baltaci_Mehmet_Pasha.mp3",text:"Baltacı Mehmet Pasha was an Ottoman grand vizier in the early 18th century. He is best known for his role in the Prut War between the Ottoman Empire and Russia in 1711. At that time, Russia was growing stronger under Tsar Peter the Great.<br><br>The Ottomans, with the help of the Crimean Tatars, marched to stop them. Baltacı Mehmet Pasha led the Ottoman army to the Prut River, where they surrounded the Russian forces. The Russians were trapped, hungry, and weak. It seemed that the Ottomans were ready for a great victory.<br><br>Although the army had the chance to destroy the Russians, Baltacı Mehmet Pasha accepted peace. With the Treaty of Prut, Russia gave back the city of Azov and promised to stay away from Ottoman lands. Peter the Great and his army were allowed to leave safely. Some people praised Baltacı Mehmet Pasha for avoiding more bloodshed. Others blamed him for not using the chance to defeat Russia completely. After this, his career lost strength, but the Treaty of Prut remained an important event in Ottoman history.",dictionary:{growing:"büyüyordu",marched:"yürüdüler",stop:"durdurmak",led:"yönetti",surrounded:"kuşattılar",trapped:"kapana kısıldılar",destroy:"yok etmek",accepted:"kabul etti",promised:"söz verdi",allowed:"izin verildi",leave:"ayrılmak",praised:"övdüler",avoiding:"kaçınması nedeniyle",blamed:"suçladılar",defeat:"yenmek",remained:"kaldı"}},{icon:"🐎",title:"6. Baybars",src:"06_Baybars.mp3",text:"Baybars was born in Central Asia around 1223. When he was a young boy, enemies captured him and sold him as a slave. He traveled to Egypt to become a Mamluk. Mamluks were special soldier-slaves who went to strict military schools to learn fighting. Baybars trained very hard with horses and weapons. He was smart and strong, so he quickly became an important commander.<br><br>At this time, a dangerous army called the Mongols was attacking the Middle East. They destroyed many cities and never lost a big battle. In 1260, the Mongols tried to enter Egypt. Baybars met them at a place called Ain Jalut. He used a clever plan to win. He led a small attack and then pretended to run away in fear. The Mongols chased him into a valley without looking carefully. Suddenly, the rest of the Mamluk army appeared from their hiding places. The trap worked perfectly, and they defeated the Mongol army.<br><br>This victory was very important because it stopped the Mongols from taking the region. Soon after, Baybars became the Sultan of Egypt and Syria. He was a good ruler. He built bridges, canals, and roads to help people travel. He also made a fast mail system using horses. Today, history remembers Baybars as a great leader who protected his people.",dictionary:{captured:"esir aldılar",sold:"sattılar",traveled:"seyahat etti",learn:"öğrenmek",trained:"eğitim aldı",attacking:"saldırıyorlardı",destroyed:"yok ettiler",tried:"denediler",enter:"girmek",pretended:"gibi yaptı","run away":"kaçmak",chased:"kovaladılar",appeared:"belirdi/ortaya çıktı",worked:"işe yaradı",defeated:"mağlup ettiler",stopped:"durdurdu",built:"inşa etti",remembers:"hatırlar",protected:"korudu"}},{icon:"🔥",title:"7. Boudica",src:"07_Boudica.mp3",text:"Boudica was a famous warrior queen in Britain during the first century. At that time, the Roman Empire ruled parts of Britain. The Celtic tribes wanted their freedom. Roman rulers treated the Celtic people harshly.<br><br>After Boudica's husband, King Prasutagus, died, the Romans took his lands and property. They beat Boudica and attacked her daughters. These cruel actions made Boudica very angry. She decided to fight against Roman rule.<br><br>Boudica gathered warriors from different Celtic tribes. She became their leader. They attacked Roman towns and forts across eastern Britain. Their most important victories destroyed the cities of Camulodunum, Londinium, and Verulamium.<br><br>The Roman governor Suetonius led a large army to stop Boudica. At the final battle in 61 AD, the Roman army defeated Boudica's forces, although her army was much larger. The exact details of Boudica's death remain unknown. Some stories say she got ill and died. Other stories say she committed suicide to avoid capture.",dictionary:{ruled:"yönetiyordu",wanted:"istediler",treated:"davrandı/muamele etti",died:"öldü",took:"aldılar",beat:"dövdüler",attacked:"saldırdılar",decided:"karar verdi",fight:"savaşmak",gathered:"topladı",destroyed:"yok ettiler",stop:"durdurmak",defeated:"yendi",remain:"kalıyor",committed:"işledi (intihar)",avoid:"kaçınmak"}},{icon:"🏰",title:"8. Cezzar Ahmed Pasha",src:"08_Cezzar_Ahmed_Pasha.mp3",text:"Cezzar Ahmed Pasha was the Ottoman governor of Acre, a fortress city on the eastern Mediterranean coast. He became famous in 1799, when Napoleon Bonaparte, after conquering Egypt, marched into Syria and attacked Acre.<br><br>Napoleon was one of the most brilliant generals of his time. He believed Acre would open the road for him to enter Anatolia and perhaps challenge the Ottoman Empire itself. With modern cannons and a strong army, he began a long siege.<br><br>Although Napoleon’s army was powerful and had won many victories before, Acre did not fall. Cezzar Ahmed Pasha defended the city with courage and discipline. He was supported by British ships under Admiral Sidney Smith, who gave him weapons and naval help. For two months, Napoleon’s forces tried again and again, but the walls of Acre resisted.<br><br>At last, Napoleon abandoned the siege and returned to Egypt. This failure damaged his reputation and stopped his dreams in the East. Cezzar Ahmed Pasha became a hero of the Ottoman Empire, remembered as the man who stopped Napoleon at the gates of Acre.",dictionary:{conquering:"fethederek",marched:"ilerledi",attacked:"saldırdı",believed:"inandı",enter:"girmek",challenge:"meydan okumak",began:"başladı",defended:"savundu",supported:"desteklendi",gave:"verdi",tried:"denediler",resisted:"direndi",abandoned:"terk etti",returned:"geri döndü",damaged:"zarar verdi",stopped:"durdurdu"}},{icon:"👑",title:"9. Cleopatra",src:"09_Cleopatra.mp3",text:"Cleopatra VII was the last active ruler of the Ptolemaic Kingdom of Egypt. She was born in 69 BC. Although her family originally came from Greece, she was the first in her family to learn the Egyptian language. She was highly intelligent, studying mathematics, philosophy, and astronomy. When she became queen, Egypt was a very rich country, but the powerful Roman Republic wanted to control it.<br><br>Cleopatra used her brilliant mind and charm to protect her kingdom. She formed strong political and romantic alliances with two of Rome's most powerful leaders: Julius Caesar and Mark Antony. With Julius Caesar's help, she defeated her enemies in Egypt and kept her throne.<br><br>Later, she supported Mark Antony in a massive Roman civil war against Octavian. Unfortunately, their combined army and navy lost the famous Battle of Actium in 31 BC. When Octavian's forces arrived in Egypt, Cleopatra knew she would be taken to Rome as a prisoner. According to legend, she chose to end her own life using a poisonous snake. Today, people remember Cleopatra not just for her beauty, but as a brilliant queen who fought to keep her nation independent.",dictionary:{learn:"öğrenen",studying:"çalışan/okuyan",wanted:"istedi",control:"kontrol etmek",used:"kullandı",protect:"korumak",formed:"kurdu/oluşturdu",defeated:"mağlup etti",kept:"elinde tuttu",supported:"destekledi",lost:"kaybettiler",arrived:"vardılar",knew:"biliyordu",taken:"götürüleceğini",chose:"seçti",end:"sonlandırmak",remember:"hatırlıyorlar",fought:"savaştı"}},{icon:"🌊",title:"10. Cnut the Great",src:"10_Cnut_the_Great.mp3",text:"Cnut the Great was the most powerful Viking king in history. He was born around 990 AD in Denmark. Unlike other Vikings who only wanted to raid, Cnut wanted to build a great empire. His father, Sweyn Forkbeard, attacked England, and young Cnut fought by his side.<br><br>When his father died, Cnut had to fight hard to keep control. In 1016, he defeated the English army and became the King of England. He later became the King of Denmark and then conquered Norway. He united these three countries into a massive superpower called the North Sea Empire.<br><br>
