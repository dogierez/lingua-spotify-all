e my water dirty?" The lamb trembled and said, "Sir, I am drinking downstream from you. I cannot make your water dirty." The wolf was angry because the lamb was right. He tried another lie. "Last year, you said terrible things about my father!" The lamb cried, "Sir, I was not even born last year!" Finally, the wolf hissed, "I do not care about your logic. I am hungry, and you are dinner." He jumped on the lamb and ate him.<br><br><strong>Lesson:</strong> A wicked person will always find an excuse for their evil actions, even if your logic is perfect. Sometimes, truth cannot stop a predator.',dictionary:{dirty:"kirli",trembled:"titredi",angry:"kızgın",terrible:"korkunç",logic:"mantık",wicked:"kötü/zalim",excuse:"bahane",evil:"kötü",actions:"eylemler",perfect:"kusursuz",predator:"yırtıcı"}},{title:"The Wolf in Sheep’s Clothing",src:"The Wolf in Sheep’s Clothing..wav",text:'A hungry, clever wolf could not catch any sheep because the smart shepherd watched the flock closely. One day, the wolf found a sheep’s skin and put it over his own body. He walked into the group of sheep. The busy shepherd thought he was a real sheep and locked him securely in the pen for the night. The wolf planned to eat a fat sheep in the dark. But that night, the shepherd suddenly wanted fresh meat for his own dinner. He went into the dark pen, grabbed the first "sheep" he saw, and killed it. It was the disguised wolf.<br><br><strong>Lesson:</strong> Pretending to be someone else to do bad things will eventually destroy you.',dictionary:{clever:"zeki",shepherd:"çoban",closely:"yakından",securely:"güvenli bir şekilde",planned:"planladı",suddenly:"aniden",grabbed:"yakaladı",disguised:"kılık değiştirmiş",pretending:"numara yapmak",eventually:"sonunda",destroy:"yok etmek"}},{title:"The Woodcutter and the Trees",src:"The Woodcutter and the Trees..wav",text:'A poor woodcutter went deep into the quiet forest. He had an axe head, but he did not have a wooden handle for it. He politely asked the trees, "Please, give me just a small piece of strong wood to make a handle for my tool." The kind trees felt sorry for the man. They gave him a nice, strong piece of ash wood. The woodcutter quickly fixed his axe. Then, he immediately started swinging his sharp axe to cut down all the beautiful trees in the forest. The generous trees realized their terrible mistake far too late.<br><br><strong>Lesson:</strong> Be extremely careful who you help. You might be handing your enemy the exact weapon they need to destroy you.',dictionary:{politely:"kibarca",fixed:"tamir etti",immediately:"hemen",swinging:"sallamaya",sharp:"keskin",generous:"cömert",realized:"fark ettiler",terrible:"korkunç",mistake:"hata",extremely:"son derece",exact:"tam/kesin",weapon:"silah",destroy:"yok etmek"}}]},_l={cognates:$g,"historic-people":Jg,freedom:Pg,concepts:Xg,food:tp,history:ep,satires:ap,fables:ip},Il="cognates",ma={CUSTOM_PLAYLISTS:"audioverse_custom_playlists_v1",BOOKMARKS:"audioverse_bookmarks_v1",SAVED_WORDS:"audioverse_saved_words_v1",TRACK_NOTES:"audioverse_track_notes_v1",PLAYBACK_PREFS:"audioverse_playback_prefs_v1"},Fi=y=>{try{return JSON.stringify(y)}catch(x){console.warn("safeStringify fallback caught error:",x);try{const k=new WeakSet;return JSON.stringify(y,(c,B)=>{var E;if(typeof B=="object"&&B!==null){if(B instanceof Node||B instanceof Window||((E=B.constructor)==null?void 0:E.name)==="HTMLAudioElement"||k.has(B))return;k.add(B)}return B})}catch{return"[]"}}},sm=()=>{try{const y=localStorage.getItem(ma.CUSTOM_PLAYLISTS);if(!y)return[];const x=JSON.parse(y);return Array.isArray(x)?x:[]}catch(y){return console.error("Failed to load custom playlists",y),[]}},np=y=>{try{const x=(y||[]).map(k=>({id:String(k.id||""),title:String(k.title||""),cover:String(k.cover||"🎧"),color:String(k.color||"#10b981"),description:String(k.description||""),baseUrl:String(k.baseUrl||""),isCustom:!!k.isCustom,tracks:Array.isArray(k.tracks)?k.tracks.map(c=>({title:String(c.title||""),src:String(c.src||""),tex
