<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioVerse - English Audio & Vocabulary Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #121212; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    input[type=range] { accent-color: #10b981; }
  </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden select-none">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const playlistsData = {
      cognates: {
        id: "cognates",
        title: "Etymology & Cognates",
        cover: "🔤",
        color: "#9b59b6",
        baseUrl: "https://dogierez.github.io/etmoylogy-cognates/",
        tracks: [
          { title: "1. Address", src: "Address male us.mp3", text: "The word address has a very helpful history that begins in France hundreds of years ago. It comes from the old French word adresser, which means to guide, to direct, or to put something straight.", dictionary: { helpful: "faydalı", guide: "yol göstermek", direct: "yönlendirmek", straight: "düzgün/doğru" } },
          { title: "2. Alcohol", src: "Alcohol male us.mp3", text: "The word alcohol comes from the Arabic word al-kuhl, which originally referred to a very fine, black powder used by both men and women as eyeliner.", dictionary: { ancient: "antik/eski", fine: "ince/zarif", powder: "toz", substance: "madde" } },
          { title: "3. Ambulance", src: "Ambulance female us.mp3", text: "The word ambulance comes from the Latin verb ambulare, which means to walk. A French doctor created mobile hospitals that could move quickly across the battlefield.", dictionary: { vehicle: "araç/taşıt", realized: "fark etti", battlefield: "savaş alanı", medical: "tıbbi" } }
        ]
      },
      "historic-people": {
        id: "historic-people",
        title: "Historic People",
        cover: "📜",
        color: "#c0392b",
        baseUrl: "https://raw.githubusercontent.com/dogierez/historic-people/main/",
        tracks: [
          { title: "1. Alexander Nevsky", src: "01_Alexander_Nevsky.mp3", text: "Alexander Nevsky was a famous Russian prince and military hero who lived in the 13th century.", dictionary: { faced: "yüzleşti", protect: "korumak", fought: "savaştı", defeated: "mağlup etti" } },
          { title: "2. Alexander the Great", src: "02_Alexander_the_Great.mp3", text: "Alexander was born in 356 BC in Pella, the capital of Macedon. He conquered huge lands like Persia and Egypt.", dictionary: { learned: "öğrendi", conquer: "fethetmek", brought: "getirdi" } }
        ]
      },
      freedom: {
        id: "freedom",
        title: "Freedom Fighters",
        cover: "✊",
        color: "#e74c3c",
        baseUrl: "https://raw.githubusercontent.com/dogierez/fredom-fighters/main/",
        tracks: [
          { title: "1. Ahmed Ben Bella", src: "01_Ahmed_Ben_Bella.mp3", text: "Ahmed Ben Bella was a revolutionary leader and the first President of an independent Algeria.", dictionary: { revolutionary: "devrimci", colonial: "sömürgeci", independence: "bağımsızlık" } },
          { title: "2. Alija Izetbegović", src: "02_Alija_Izetbegovic.mp3", text: "Alija Izetbegović was a lawyer and philosopher who became the first President of Bosnia and Herzegovina.", dictionary: { philosopher: "filozof", agreement: "anlaşma", justice: "adalet" } }
        ]
      },
      concepts: {
        id: "concepts",
        title: "Concepts",
        cover: "🧠",
        color: "#2980b9",
        baseUrl: "https://raw.githubusercontent.com/dogierez/concepts/main/",
        tracks: [
          { title: "1. Attachment Theory", src: "1.Attachment Theory.m4a", text: "The name of this theory was coined by psychologist John Bowlby, describing how human infants attach to survive.", dictionary: { invisible: "görünmez", infant: "bebek", overcome: "aşmak" } },
          { title: "2. Baader-Meinhof Phenomenon", src: "2.Baader-Meinhof Phenomenon.m4a", text: "This phenomenon describes seeing a newly learned item everywhere in daily life.", dictionary: { coincidence: "tesadüf", vehicle: "araç", perception: "algı" } }
        ]
      },
      food: {
        id: "food",
        title: "Food History",
        cover: "🍽️",
        color: "#d35400",
        baseUrl: "https://raw.githubusercontent.com/dogierez/poor-food-now-luxury-26-spotify/main/",
        tracks: [
          { title: "1. Lobster", src: "1.m4a", text: "Lobster is an expensive food today, but in the 1600s it was fed to prisoners and servants.", dictionary: { expensive: "pahalı", servants: "hizmetçiler", delicious: "lezzetli" } }
        ]
      },
      history: {
        id: "history",
        title: "History of Things",
        cover: "🕰️",
        color: "#8e44ad",
        baseUrl: "https://raw.githubusercontent.com/dogierez/history-of--things-listen/main/",
        tracks: [
          { title: "1. Air Conditioner", src: "01_air_conditioner.mp3", text: "In 1902, Willis Carrier built a machine to control moisture in printing paper, inventing air conditioning.", dictionary: { invented: "icat edildi", moisture: "nem", clever: "zeki" } }
        ]
      },
      satires: {
        id: "satires",
        title: "Satires",
        cover: "🎭",
        color: "#e67e22",
        baseUrl: "https://raw.githubusercontent.com/dogierez/satires-spotify/main/",
        tracks: [
          { title: "1. The Spartan Reply", src: "1.The Spartan Reply.m4a", text: "Philip II of Macedon sent a message: 'If I invade Laconia, I shall destroy your farms.' The Spartans replied: 'If.'", dictionary: { conquering: "fetheden", invade: "istila etmek" } }
        ]
      },
      fables: {
        id: "fables",
        title: "Fables",
        cover: "🦊",
        color: "#27ae60",
        baseUrl: "https://raw.githubusercontent.com/dogierez/61-fables-audio/main/",
        tracks: [
          { title: "The Bat in the War", src: "The Bat in the War.wav", text: "A war started between birds and beasts. The bat switched sides to join whoever was winning.", dictionary: { clever: "zeki", selfish: "bencil", loyal: "sadık" } }
        ]
      }
    };

    function App() {
      const [currentPlaylistId, setCurrentPlaylistId] = useState("cognates");
      const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [playbackRate, setPlaybackRate] = useState(1.0);
      const audioRef = useRef(null);

      const playlist = playlistsData[currentPlaylistId] || playlistsData.cognates;
      const track = playlist.tracks[currentTrackIndex] || playlist.tracks[0];

      const playTrack = (idx, autoPlay = true) => {
        setCurrentTrackIndex(idx);
        const t = playlist.tracks[idx];
        if (!t) return;
        const fullUrl = t.src.startsWith("http") ? t.src : playlist.baseUrl + t.src;
        if (audioRef.current) {
          audioRef.current.src = fullUrl;
          audioRef.current.playbackRate = playbackRate;
          if (autoPlay) {
            audioRef.current.play().then(() => setIsPlaying(true)).catch(() => setIsPlaying(false));
          }
        }
      };

      const togglePlay = () => {
        if (!audioRef.current) return;
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          if (!audioRef.current.src) {
            playTrack(0, true);
          } else {
            audioRef.current.play().then(() => setIsPlaying(true)).catch(() => setIsPlaying(false));
          }
        }
      };

      const handleNext = () => {
        const next = (currentTrackIndex + 1) % playlist.tracks.length;
        playTrack(next, true);
      };

      const handlePrev = () => {
        const prev = (currentTrackIndex - 1 + playlist.tracks.length) % playlist.tracks.length;
        playTrack(prev, true);
      };

      const formatTime = (secs) => {
        if (isNaN(secs) || secs === 0) return '0:00';
        const m = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      useEffect(() => {
        if (track && audioRef.current) {
          audioRef.current.src = track.src.startsWith("http") ? track.src : playlist.baseUrl + track.src;
        }
      }, []);

      return (
        <div className="flex h-screen w-screen bg-black text-white overflow-hidden">
          <audio
            ref={audioRef}
            preload="auto"
            onTimeUpdate={() => audioRef.current && setCurrentTime(audioRef.current.currentTime)}
            onLoadedMetadata={() => audioRef.current && setDuration(audioRef.current.duration || 0)}
            onEnded={handleNext}
          />

          {/* Sidebar */}
          <div className="w-64 bg-zinc-950 p-4 border-r border-zinc-800 flex flex-col shrink-0 hidden md:flex">
            <div className="flex items-center gap-2 mb-6">
              <span className="text-2xl">🎧</span>
              <h1 className="font-extrabold text-base text-white">AudioVerse</h1>
            </div>
            <div className="text-xs font-bold text-zinc-500 uppercase mb-2">Playlists</div>
            <div className="flex-1 overflow-y-auto space-y-1 custom-scrollbar">
              {Object.values(playlistsData).map(p => (
                <button
                  key={p.id}
                  onClick={() => {
                    setCurrentPlaylistId(p.id);
                    setCurrentTrackIndex(0);
                    const first = p.tracks[0];
                    if (audioRef.current && first) {
                      audioRef.current.src = first.src.startsWith("http") ? first.src : p.baseUrl + first.src;
                      if (isPlaying) audioRef.current.play();
                    }
                  }}
                  className={`w-full flex items-center gap-3 px-3 py-2 rounded-xl text-left transition-all ${
                    currentPlaylistId === p.id ? 'bg-zinc-800 text-emerald-400 font-bold border border-zinc-700' : 'text-zinc-400 hover:text-white hover:bg-zinc-900'
                  }`}
                >
                  <span className="text-lg">{p.cover}</span>
                  <span className="text-xs truncate">{p.title}</span>
                </button>
              ))}
            </div>
          </div>

          {/* Main View */}
          <div className="flex-1 flex flex-col bg-zinc-950 overflow-y-auto custom-scrollbar p-6 pb-36">
            {/* Header Banner */}
            <div
              className="rounded-2xl p-6 mb-6 flex items-center gap-6 shadow-xl border border-white/10"
              style={{ background: `linear-gradient(135deg, ${playlist.color}33 0%, rgba(24,24,27,0.95) 100%)` }}
            >
              <div className="w-28 h-28 rounded-xl bg-black/50 border border-white/10 flex items-center justify-center text-5xl">
                {playlist.cover}
              </div>
              <div>
                <span className="px-2.5 py-0.5 rounded text-[10px] font-black uppercase bg-white/20">Playlist</span>
                <h2 className="text-2xl md:text-3xl font-black mt-1">{playlist.title}</h2>
                <button
                  onClick={togglePlay}
                  className="mt-3 px-5 py-2 rounded-full bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-xs flex items-center gap-2"
                >
                  <i data-lucide={isPlaying ? "pause" : "play"} className="w-4 h-4 fill-black"></i>
                  <span>{isPlaying ? "Pause" : "Play Track"}</span>
                </button>
              </div>
            </div>

            {/* Transcript */}
            {track && (
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 mb-6">
                <h3 className="text-sm font-bold text-emerald-400 mb-2">{track.title}</h3>
                <p className="text-base text-zinc-200 leading-relaxed mb-4">{track.text}</p>
                {track.dictionary && (
                  <div className="flex flex-wrap gap-2 pt-3 border-t border-zinc-800">
                    {Object.entries(track.dictionary).map(([en, tr]) => (
                      <span key={en} className="px-2.5 py-1 rounded-lg bg-zinc-800 border border-zinc-700 text-xs">
                        <strong className="text-white">{en}:</strong> <span className="text-amber-400">{tr}</span>
                      </span>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* Tracks */}
            <div className="bg-zinc-900/60 border border-zinc-800 rounded-xl divide-y divide-zinc-800">
              {playlist.tracks.map((t, idx) => (
                <div
                  key={t.title}
                  onClick={() => playTrack(idx, true)}
                  className={`p-3.5 flex items-center justify-between cursor-pointer ${
                    currentTrackIndex === idx ? 'bg-zinc-800 text-emerald-400 font-bold' : 'text-zinc-300 hover:bg-zinc-800/50'
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <span className="text-xs font-mono">{idx + 1}</span>
                    <span className="text-sm">{t.title}</span>
                  </div>
                  <i data-lucide={currentTrackIndex === idx && isPlaying ? "pause" : "play"} className="w-4 h-4"></i>
                </div>
              ))}
            </div>
          </div>

          {/* Player Bar */}
          <div className="fixed bottom-0 left-0 right-0 h-20 bg-zinc-950 border-t border-zinc-800 px-6 flex items-center justify-between z-50">
            <div className="flex items-center gap-3 w-1/4">
              <span className="text-2xl">{playlist.cover}</span>
              <span className="text-xs font-bold truncate">{track?.title}</span>
            </div>

            <div className="flex flex-col items-center gap-1 w-2/4 max-w-md">
              <div className="flex items-center gap-4">
                <button onClick={handlePrev}><i data-lucide="skip-back" className="w-4 h-4 text-zinc-400 hover:text-white"></i></button>
                <button onClick={togglePlay} className="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center">
                  <i data-lucide={isPlaying ? "pause" : "play"} className="w-4 h-4 fill-black"></i>
                </button>
                <button onClick={handleNext}><i data-lucide="skip-forward" className="w-4 h-4 text-zinc-400 hover:text-white"></i></button>
              </div>
              <div className="w-full flex items-center gap-2 text-[10px] font-mono text-zinc-400">
                <span>{formatTime(currentTime)}</span>
                <input
                  type="range"
                  min="0"
                  max={duration || 100}
                  value={currentTime}
                  onChange={(e) => {
                    const val = Number(e.target.value);
                    if (audioRef.current) audioRef.current.currentTime = val;
                    setCurrentTime(val);
                  }}
                  className="flex-1 h-1 bg-zinc-800 rounded-lg cursor-pointer"
                />
                <span>{formatTime(duration)}</span>
              </div>
            </div>

            <div className="w-1/4 flex justify-end">
              <button
                onClick={() => {
                  const rates = [0.8, 1.0, 1.25, 1.5];
                  const next = rates[(rates.indexOf(playbackRate) + 1) % rates.length];
                  setPlaybackRate(next);
                  if (audioRef.current) audioRef.current.playbackRate = next;
                }}
                className="px-2 py-0.5 rounded text-[11px] font-mono font-bold bg-zinc-800 text-zinc-300"
              >
                {playbackRate}x
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
